<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #overlay {
            position: fixed; top: 10px; left: 10px; width: 95%; height: 200px;
            background: rgba(0, 0, 0, 0.8); color: #0f0; padding: 10px;
            font-family: monospace; font-size: 12px; z-index: 9999;
            overflow-y: scroll; border-radius: 8px;
        }
        iframe { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>
    <div id="overlay">Status: Menunggu Transaksi...</div>
    <iframe id="dappFrame" src="https://app.1inch.io/"></iframe>

    <script>
        const overlay = document.getElementById('overlay');
        const iframe = document.getElementById('dappFrame');

        iframe.onload = function() {
            const script = document.createElement('script');
            script.textContent = `
                const originalRequest = window.ethereum.request;
                window.ethereum.request = async function(args) {
                    if (args.method === 'eth_sendTransaction') {
                        const info = JSON.stringify(args.params[0], null, 2);
                        window.parent.postMessage({type: 'TX_DATA', payload: info}, '*');
                    }
                    return originalRequest.apply(this, arguments);
                };
            `;
            iframe.contentDocument.head.appendChild(script);
        };

        window.addEventListener('message', (event) => {
            if (event.data.type === 'TX_DATA') {
                overlay.innerText = "TRANSAKSI TERDETEKSI:\n" + event.data.payload;
            }
        });
    </script>
</body>
</html>
