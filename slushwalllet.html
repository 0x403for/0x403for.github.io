<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Slush Bridge Debugger</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: monospace; padding: 20px; }
        .monitor { border: 1px solid #333; padding: 15px; background: #111; height: 300px; overflow-y: auto; font-size: 11px; }
        button { background: #222; color: #00ff00; border: 1px solid #00ff00; padding: 10px; cursor: pointer; margin: 5px; }
        .highlight { color: #ff00ff; font-weight: bold; }
    </style>
</head>
<body>

    <h3>Slush Account Management Probe</h3>
    <div class="monitor" id="logger">Waiting for bridge activity...</div>
    
    <button onclick="probeRPC()">Probe Custom RPC</button>
    <button onclick="listenEvents()">Listen Events</button>

<script>
    const logger = document.getElementById('logger');
    function log(msg, highlight = false) {
        const div = document.createElement('div');
        if(highlight) div.className = 'highlight';
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logger.prepend(div);
    }

  
    async function probeRPC() {
        if (!window.ethereum) return log("Error: No provider detected.");
        
        const methods = [
            'wallet_getSnaps',       
            'wallet_getAccounts',   
            'eth_requestAccounts',    
            'wallet_watchAsset'        
        ];

        for (const method of methods) {
            log(`Probing method: ${method}...`);
            try {
                const res = await window.ethereum.request({ method });
                log(`Success [${method}]: ${JSON.stringify(res)}`, true);
            } catch (e) {
                log(`Failed [${method}]: ${e.message}`);
            }
        }
    }

    function listenEvents() {
        if (!window.ethereum) return log("Error: No provider detected.");
        
        log("Listening for 'accountsChanged' & 'chainChanged'...");
        
        window.ethereum.on('accountsChanged', (accounts) => {
            log(`EVENT DETECTED: accountsChanged -> ${accounts}`, true);
            alert("Account visibility leaked via event!");
        });

        window.ethereum.on('chainChanged', (chainId) => {
            log(`EVENT DETECTED: chainChanged -> ${chainId}`, true);
        });
    }
</script>
</body>
</html>
