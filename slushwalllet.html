<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Account Visibility Test v2</title>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; padding: 20px; text-align: center; }
        .console { border: 1px solid #00ff00; padding: 15px; background: #050505; text-align: left; min-height: 100px; margin-bottom: 20px; }
        button { background: #00ff00; color: #000; border: none; padding: 15px; cursor: pointer; font-weight: bold; width: 100%; }
        .error { color: #ff0000; }
    </style>
</head>
<body>

<h3>Slush Account Management Probe</h3>
<div class="console" id="log">Waiting for bridge activity...</div>

<button onclick="probeAccount()">FORCE PROBE ACCOUNT</button>

<script>
    const logDiv = document.getElementById('log');
    function writeLog(msg, isError = false) {
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML += `<div class="${isError ? 'error' : ''}">[${time}] ${msg}</div>`;
    }

    async function probeAccount() {
        writeLog("Starting deep probe...");

        if (typeof window.ethereum !== 'undefined') {
            writeLog("Provider detected. Attempting eth_accounts...");
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) {
                    writeLog("SUCCESS: Account Leak Detected!");
                    writeLog("Address: " + accounts[0]);
                } else {
                    writeLog("Shield Active: No accounts exposed silently.");
                    writeLog("Attempting forced connection (eth_requestAccounts)...");
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                }
            } catch (err) {
                writeLog("Error: " + err.message, true);
            }
        } else {
            writeLog("Error: No provider detected. Are you in DApp Browser?", true);
            writeLog("Attempting Deep Link fallback...");
            window.location.href = "slush://request?method=eth_accounts";
        }
    }
</script>

</body>
</html>
