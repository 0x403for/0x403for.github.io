<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PoC | Derivation Path Manipulation</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: monospace; padding: 20px; text-align: center; }
        .audit-box { border: 1px solid #00ff00; padding: 20px; border-radius: 8px; background: #000; display: inline-block; width: 100%; max-width: 450px; }
        .log-area { text-align: left; background: #050505; border: 1px solid #222; padding: 10px; height: 150px; overflow-y: auto; font-size: 12px; margin-top: 15px; color: #888; }
        button { background: #00ff00; color: #000; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .warn { color: #ff0055; font-weight: bold; }
    </style>
</head>
<body>

<div class="audit-box">
    <h3>Derivation Path Probe</h3>
    <p style="font-size: 12px; color: #ccc;">Menguji validasi jalur BIP44 pada fungsi pemulihan dompet.</p>
    
    <div class="log-area" id="log">
        > Awaiting interaction...
    </div>

    <button onclick="injectPath()">INJECT CORRUPT PATH</button>
</div>

<script>
    function injectPath() {
        const log = document.getElementById('log');
        
  
        const corruptPath = "m/44'/60'/0'/0/invalid_index_999";
        
        log.innerHTML += `<br>> <span class="warn">Attempting to inject:</span> ${corruptPath}`;
        
       
        const uri = `slush://recovery?path=${encodeURIComponent(corruptPath)}`;
        
        log.innerHTML += `<br>> Payload sent to wallet bridge...`;

        window.location.href = uri;

        setTimeout(() => {
            log.innerHTML += `<br>> <span style="color:white;">Audit Note: Jika dompet mencoba memproses path ini tanpa pesan error "Invalid Path", maka validasi input gagal.</span>`;
        }, 1500);
    }
</script>

</body>
</html>
