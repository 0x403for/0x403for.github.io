<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{background:#fff;margin:0;font-family:Arial;padding:20px;text-align:center}
.top{padding-top:10px;font-weight:bold}
#qrs{display:flex;flex-direction:column;gap:20px;margin-top:20px;align-items:center}
.box{border:2px solid #000;padding:10px}
.box div{margin-top:8px;font-size:12px}
</style>
</head>
<body>
<div class="top">Click Here</div>
<div style="margin-top:15px">
<input id="payload" style="width:90%;padding:10px;border:2px solid #000" value="https://evil.com">
<button onclick="gen()" style="margin-top:10px;padding:8px 20px;background:#fff;border:2px solid #000;font-weight:bold">Generate QR</button>
</div>
<div id="qrs"></div>

<script>
function gen(){
  var val = document.getElementById('payload').value;
  var container = document.createElement('div');
  container.className='box';
  var qrDiv = document.createElement('div');
  container.appendChild(qrDiv);
  var label = document.createElement('div');
  label.innerText = val;
  container.appendChild(label);
  document.getElementById('qrs').prepend(container);
  new QRCode(qrDiv, {text: val, width: 200, height: 200});
}
gen();
</script>
</body>
</html>
