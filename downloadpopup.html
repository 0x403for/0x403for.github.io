<html>
<head>
<title>test</title>
</head>
<body>

<p>download test</p>
<button onclick="go()">click here</button>
<p id="h"></p>

<script>
function go(){
  document.getElementById('h').innerText = 'download 1...';
  download('file1.txt', 'ini file pertama dari klik');

  setTimeout(function(){
    download('file2.txt', 'ini file kedua, harusnya ke block karena gak ada klik kedua');
    document.getElementById('h').innerText = 'coba download 2... cek folder download lu';
  }, 500);

  setTimeout(function(){
    download('file3.txt', 'ini file ketiga telat 1000ms');
  }, 1000);
}

function download(name, isi){
  var blob = new Blob([isi], {type:'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
</script>

</body>
</html>
