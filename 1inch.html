<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>EIP-1193 Origin Auditor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .log { background: #333; color: #00ff00; padding: 15px; border-radius: 5px; height: 250px; overflow-y: scroll; font-family: monospace; }
        button { padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Audit EIP-1193</h2>
    <p>Menguji apakah Bridge melakukan verifikasi Origin:</p>
    <button onclick="auditBridge()">Jalankan Audit Origin</button>
    <div class="log" id="log">Siap...</div>

    <script>
        const logBox = document.getElementById('log');
        function log(m) { logBox.innerHTML += m + "<br>"; }

        async function auditBridge() {
            log("Memulai Audit EIP-1193...");
            
            if (!window.ethereum) {
                log("❌ EIP-1193 Provider (window.ethereum) tidak ditemukan.");
                return;
            }

            // Skenario: Mencoba request akun tanpa persetujuan
            // Jika bridge aman, ini harus menolak atau memicu pop-up otorisasi
            try {
                log("📡 Melakukan request eth_accounts...");
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                log("✅ Hasil eth_accounts: " + JSON.stringify(accounts));
            } catch (e) {
                log("🛡️ Ditolak (Sesuai protokol): " + e.message);
            }

            // Skenario: Uji Origin Hijacking (Mencoba request tidak valid)
            try {
                log("📡 Melakukan request method tidak dikenal...");
                await window.ethereum.request({ method: 'invalid_method_test' });
            } catch (e) {
                log("🛡️ Hasil metode tidak dikenal: " + e.message);
                if (e.code === 4200) {
                    log("ℹ️ Bridge mengikuti standar EIP-1193 dengan benar (Method not supported).");
                }
            }
        }
    </script>
</body>
</html>
