<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Share Leak PoC</title>
  <style>
    body { font-family: system-ui; padding: 40px; background: #0f0f0f; color: #eee; }
    button { padding: 16px 32px; font-size: 18px; background: #22c55e; border: none; border-radius: 12px; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h2>One-Click Share Leak Demo</h2>
  <p>Address: 0x5fC0C21721C660C00faEF208C9f926A6FD74F915</p>
  <p>Balance: 0 ETH</p>

  <button onclick="shareWallet()">Share Address + Balance</button>

  <script>
    async function shareWallet() {
      const address = "0x5fC0C21721C660C00faEF208C9f926A6FD74F915";
      const balance = "0 ETH";
      
      const text = `My wallet:\n${address}\nBalance: ${balance}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "My Wallet",
            text: text
          });
        } catch (err) {
          console.log("Share cancelled or failed", err);
        }
      } else {
        // Fallback untuk desktop
        await navigator.clipboard.writeText(text);
        alert("Data disalin ke clipboard (karena Web Share tidak support di browser ini):\n\n" + text);
      }
    }
  </script>
</body>
</html>
