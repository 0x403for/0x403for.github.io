<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>test decrypt</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;padding:12px;margin:0}
button{display:block;width:100%;padding:14px;margin:8px 0;background:#fff;color:#000;border:0;border-radius:8px;font-size:16px}
#log{font-size:12px;color:#999;white-space:pre-wrap}
small{color:#888}
</style>
</head>
<body>
<p><b>TEST - encryption key + decrypt - BELUM PERNAH DITEMUIN</b><br><small>test di wallet sendiri, jangan decrypt pesan asli orang</small></p>

<button onclick="testEnc()">1. test minta encryptionPublicKey</button>
<button onclick="testDec()">2. test minta decrypt pesan test</button>
<div id="log">log:</div>

<script>
var logEl = document.getElementById("log");
function l(t){ logEl.textContent += "\n" + t; }

function testEnc(){
  window.ethereum.request({method:"eth_requestAccounts"}).then(function(a){
    var account = a[0];
    l("minta encryptionPublicKey...");
    l("CEK DI POPUP 1INCH:");
    l("- apakah ada warning 'Kunci ini bisa dipakai buat ngirim pesan rahasia ke lu'?");

    return window.ethereum.request({
      method: "eth_getEncryptionPublicKey",
      params: [account]
    });
  }).then(function(key){
    l("dapat key: " + key.slice(0,30) + "...");
    l("kalau key-nya dikasih tanpa warning, itu finding pertama.");
  }).catch(e=>l("gagal / ditolak / tidak support: "+e.message));
}

function testDec(){
  window.ethereum.request({method:"eth_requestAccounts"}).then(function(a){
    var account = a[0];
    l("minta decrypt pesan test...");
    l("CEK DI POPUP 1INCH:");
    l("- apakah popup nampilin isi pesan yang mau di-decrypt?");
    l("- atau cuma bilang 'Decrypt Message' tanpa nampilin isinya?");

    // Ini pesan test dummy, bukan pesan asli
    // Kalau wallet mau decrypt tanpa nampilin isinya, itu bug
    var dummyEncrypted = "[STRIPPED 258 bytes]";

    return window.ethereum.request({
      method: "eth_decrypt",
      params: [dummyEncrypted, account]
    });
  }).then(function(plain){
    l("decrypted: " + plain);
  }).catch(e=>l("gagal / ditolak: "+e.message));
}
</script>
</body>
</html>
