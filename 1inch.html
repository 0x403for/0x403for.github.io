
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC: Insecure Persistence Audit</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { border: 1px solid #333; padding: 15px; margin-bottom: 10px; }
        #dataDisplay { font-weight: bold; color: #d9534f; }
    </style>
</head>
<body>
    <h2>Uji Nyata: Storage Persistence</h2>
    
    <div class="box">
        <p>1. Simpan data unik ke storage:</p>
        <button onclick="injectData()">Simpan Data Unik</button>
    </div>

    <div class="box">
        <p>2. Status Data saat ini:</p>
        <div id="dataDisplay">Memeriksa...</div>
        <button onclick="refreshData()">Refresh Status</button>
    </div>

    <script>
        const STORAGE_KEY = "audit_persistence_key";

        function injectData() {
            const uniqueId = "SessionID-" + Math.floor(Math.random() * 1000000);
            localStorage.setItem(STORAGE_KEY, uniqueId);
            alert("Data tersimpan: " + uniqueId + "\n\nSekarang tutup aplikasi sepenuhnya (Force Close) lalu buka kembali dApp ini!");
            refreshData();
        }

        function refreshData() {
            const data = localStorage.getItem(STORAGE_KEY);
            document.getElementById('dataDisplay').innerText = data ? "Data Ditemukan: " + data : "Storage Kosong (Aman)";
        }

        // Jalankan saat load
        window.onload = refreshData;
    </script>
</body>
</html>
