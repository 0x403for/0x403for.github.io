<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freighter V4 Stable</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.1.0/stellar-sdk.min.js"></script>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:12px;margin:0}
.btn{width:100%;height:48px;background:#fff;color:#000;border-radius:999px;font-weight:800;margin:6px 0;border:none}
.log{border:1px solid #0f0;padding:10px;min-height:350px;white-space:pre-wrap;font-size:11px;word-break:break-all}
</style>
</head>
<body>
<pre id="log" class="log">[V4] Stable no Buffer
</pre>
<button class="btn" onclick="step1()">0. CONNECT (wajib dulu)</button>
<button class="btn" onclick="step2()">1. BUILD XDR (aman)</button>
<button class="btn" onclick="step3()">2. SIGN</button>

<script>
var log=document.getElementById('log');
var xdr="";
function L(m){ log.textContent+="\n"+m; }

function getF(){ return window.freighterApi || window.freighter; }

async function step1(){
 L("--- CONNECT ---");
 // trik: harus buka aqua.network dulu di tab yang sama
 var f=getF();
 if(!f){
  L("freighterApi false -> solusi:");
  L("1. Di address bar Freighter ketik aqua.network");
  L("2. Connect wallet di sana");
  L("3. Tanpa close Freighter, ganti URL jadi 0x403for.github.io/1inch.html");
  L("4. Tap CONNECT lagi");
  return;
 }
 try{
  var pub=await f.getPublicKey();
  L("Connected: "+pub.slice(0,15)+"...");
 }catch(e){ L("Error: "+e.message); }
}

function step2(){
 L("--- BUILD BENIGN ---");
 try{
  var Sdk=window.StellarSdk;
  var src=Sdk.Keypair.random().publicKey();
  var dst=Sdk.Keypair.random().publicKey();
  var acc=new Sdk.Account(src, "1");
  var tx=new Sdk.TransactionBuilder(acc, {
    fee: Sdk.BASE_FEE,
    networkPassphrase: Sdk.Networks.TESTNET,
    memo: Sdk.Memo.text("Pay 10 XLM")
  })
 .addOperation(Sdk.Operation.payment({
    destination: dst,
    amount: "10",
    asset: Sdk.Asset.native()
  }))
 .addOperation(Sdk.Operation.manageData({
    name: "test",
    value: "test123" // string aja, jangan Buffer
  }))
 .setTimeout(30).build();
  xdr=tx.toXDR();
  L("OK XDR len "+xdr.length);
  L("Memo: Pay 10 XLM");
  L("Op1 payment, Op2 manageData");
 }catch(e){ L("Build fail: "+e.message); }
}

async function step3(){
 if(!xdr){ L("Build dulu"); return; }
 var f=getF();
 if(!f){ L("No freighter"); return; }
 try{
  var r=await f.signTransaction(xdr, {networkPassphrase: StellarSdk.Networks.TESTNET});
  L("Signed: "+r.signedTxXdr.slice(0,50));
 }catch(e){ L("Reject: "+e.message); }
}
L("href="+location.href);
L("freighter? "+!!window.freighter+" api? "+!!window.freighterApi);
</script>
</body>
</html>
