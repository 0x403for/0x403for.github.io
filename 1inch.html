<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V7 FINAL BYPASS PROOF</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:12px;margin:0}
.btn{width:100%;height:52px;background:#fff;color:#000;border-radius:999px;font-weight:800;margin:8px 0;border:none}
.log{border:1px solid #0f0;padding:10px;min-height:400px;white-space:pre-wrap;font-size:11px;word-break:break-all}
</style>
</head>
<body>
<pre id="log">[V7] BYPASS PROOF - No API needed
</pre>
<button class="btn" onclick="build()">1. BUILD XDR BENIGN</button>
<button class="btn" onclick="copy()">2. COPY XDR</button>
<button class="btn" onclick="openLab()">3. OPEN STELLAR LAB</button>
<button class="btn" onclick="scan()">SCAN WHY NO API</button>
<script>
var logEl=document.getElementById('log');
var XDR="";
function L(m){ logEl.textContent+="\n"+m; }

async function build(){
 L("--- BUILD OFFLINE ---");
 // inject SDK on demand
 if(!window.StellarSdk){
  await new Promise((res,rej)=>{
   var s=document.createElement('script');
   s.src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.1.0/stellar-sdk.min.js";
   s.onload=res; s.onerror=()=>rej("SDK fail");
   document.head.appendChild(s);
  });
 }
 try{
  var Sdk=window.StellarSdk;
  var src=Sdk.Keypair.random().publicKey();
  var dst=Sdk.Keypair.random().publicKey();
  var acc=new Sdk.Account(src,"1");
  var tx=new Sdk.TransactionBuilder(acc,{
   fee:Sdk.BASE_FEE, networkPassphrase:Sdk.Networks.TESTNET,
   memo:Sdk.Memo.text("Pay 10 XLM")
  })
 .addOperation(Sdk.Operation.payment({destination:dst,amount:"10",asset:Sdk.Asset.native()}))
 .addOperation(Sdk.Operation.manageData({name:"test",value:"abc123"}))
 .setTimeout(30).build();
  XDR=tx.toXDR();
  L("SUCCESS!");
  L("src="+src.slice(0,12));
  L("Op1 payment 10 XLM to "+dst.slice(0,8));
  L("Op2 manageData test=abc123");
  L("XDR="+XDR);
  L("---");
  L("BUG HIGH jika di Freighter Lab cuma show memo, tidak show Op2");
 }catch(e){ L("Err: "+e.message); }
}
function copy(){
 if(!XDR){ L("Build dulu"); return; }
 navigator.clipboard.writeText(XDR);
 L("XDR COPIED ke clipboard!");
}
function openLab(){
 L("Buka https://laboratory.stellar.org/#xdr-viewer?type=TransactionEnvelope&network=test");
 window.open("https://laboratory.stellar.org/#xdr-viewer?type=TransactionEnvelope&network=test","_blank");
}
function scan(){
 L("--- WHY NO API ---");
 L("href="+location.href);
 L("Freighter blokir github.io karena bukan whitelisted dApp");
 L("Solusi: Buka link ini di Freighter Desktop Extension, atau");
 L("Buka aqua.network -> Connect -> di address bar yang SAMA ketik 0x403for.github.io/v7.html?v=7 jangan new tab");
 for(var k in window){ if(k.toLowerCase().includes("freight")) L(k+"="+typeof window[k]); }
}
L("href="+location.href);
</script>
</body>
</html>
