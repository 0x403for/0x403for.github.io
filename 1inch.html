<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Audit: Sensitive Data Disclosure</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 15px; border-radius: 8px; border-left: 5px solid #d9534f; margin-bottom: 10px; }
        pre { background: #333; color: #fff; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; background: #d9534f; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Scan LocalStorage untuk Data Sensitif</h2>
    <p>Skrip ini akan mencari pola yang menyerupai alamat dompet, token, atau sesi API.</p>
    
    <button onclick="scanStorage()">Mulai Pindai Penyimpanan</button>
    <div id="results"></div>

    <script>
        function scanStorage() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "<h3>Hasil Pemindaian:</h3>";
            
            if (localStorage.length === 0) {
                resultsDiv.innerHTML += "<p>LocalStorage kosong.</p>";
                return;
            }

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                
                const card = document.createElement('div');
                card.className = 'card';
                
                // Analisis pola data (Regex sederhana untuk deteksi alamat ETH)
                const isEthAddress = /^0x[a-fA-F0-9]{40}$/.test(value);
                const isToken = value.length > 50; // Asumsi token API biasanya panjang

                card.innerHTML = `
                    <strong>Key:</strong> ${key}<br>
                    <strong>Value:</strong> <pre>${value}</pre>
                    <small style="color: ${isEthAddress || isToken ? 'red' : 'green'}">
                        Status: ${isEthAddress || isToken ? '⚠️ DATA SENSITIF TERDETEKSI' : '✅ Terlihat Aman'}
                    </small>
                `;
                resultsDiv.appendChild(card);
            }
        }
    </script>
</body>
</html>
