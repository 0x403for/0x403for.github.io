<html>
<head>
<title>test</title>
</head>
<body>

<p>Geolocation test - real API</p>
<button onclick="go()">click here</button>
<p id="h"></p>
<p id="h2"></p>

<script>
function go(){
  document.getElementById('h').innerText = 'requesting geo 1 - real API...';

  // GEO 1 - dari klik, harusnya muncul prompt Allow / Deny asli dari iOS
  if (!navigator.geolocation) {
    document.getElementById('h').innerText = 'GEO 1: geolocation NOT SUPPORTED';
  } else {
    navigator.geolocation.getCurrentPosition(
      function(pos){
        document.getElementById('h').innerText = 'GEO 1 success: lat=' + pos.coords.latitude + ' lon=' + pos.coords.longitude + ' acc=' + pos.coords.accuracy;
      },
      function(err){
        document.getElementById('h').innerText = 'GEO 1: ' + err.code + ' - ' + err.message;
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  // GEO 2 - tanpa klik kedua, via setTimeout 500ms
  setTimeout(function(){
    document.getElementById('h2').innerText = 'trying GEO 2 without second click...';
    document.title = 'BYPASS! trying GEO 2';

    if (!navigator.geolocation) {
      document.getElementById('h2').innerText = 'GEO 2: NOT SUPPORTED';
    } else {
      navigator.geolocation.getCurrentPosition(
        function(pos){
          document.getElementById('h2').innerText = 'BYPASS! GEO 2 success without second click: lat=' + pos.coords.latitude + ' lon=' + pos.coords.longitude;
        },
        function(err){
          document.getElementById('h2').innerText = 'GEO 2 blocked: ' + err.code + ' - ' + err.message;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  }, 500);
}
</script>

</body>
</html>
