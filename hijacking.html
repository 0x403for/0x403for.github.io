<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
        input { width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { padding: 15px; margin: 5px 0; width: 100%; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; }
        #info { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ccc; border-radius: 5px; word-break: break-all; }
    </style>
</head>
<body>
    <h3>Security Auditor (WETH Sepolia)</h3>
    <button id="connectBtn">1. Connect Wallet</button>
    
    <input type="text" id="token" value="0xf531B8F309Be94191af87605CfBf600D71C2cFe0" readonly>
    <input type="text" id="spender" placeholder="Masukkan Spender Address (Target)" value="0xC532a74256D3Db42D0Bf7a0400fEFDbad7694008">
    
    <button onclick="runCheck()">2. Cek Izin (Allowance)</button>
    <div id="info">Hasil akan muncul di sini...</div>

    <script>
        document.getElementById('connectBtn').onclick = async () => {
            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                document.getElementById('info').innerText = "Status: Terhubung!";
            } catch(e) { alert("Error Connect: " + e.message); }
        };

        async function runCheck() {
            try {
                if (typeof ethers === 'undefined') throw new Error("Ethers library gagal dimuat!");
                
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                const user = await signer.getAddress();
                const tokenAddr = document.getElementById('token').value;
                const spender = document.getElementById('spender').value;
                
                const abi = ["function allowance(address owner, address spender) view returns (uint256)"];
                const contract = new ethers.Contract(tokenAddr, abi, provider);
                
                const allowance = await contract.allowance(user, spender);
                document.getElementById('info').innerText = "Izin saat ini: " + allowance.toString() + " Wei";
            } catch (err) {
                document.getElementById('info').innerText = "ERROR: " + err.message;
            }
        }
    </script>
</body>
</html>
