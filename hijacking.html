<!DOCTYPE html>
<html>
<body>
    <h3>Audit Minimalis</h3>
    <button onclick="check()">Cek Allowance</button>
    <div id="out"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script>
        async function check() {
            const out = document.getElementById('out');
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const user = await provider.getSigner().getAddress();
                
                // Gunakan alamat yang saya berikan di bawah ini
                const token = "0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14"; 
                const spender = "0xC532a74256D3Db42D0Bf7a0400fEFDbad7694008";
                
                const abi = ["function allowance(address, address) view returns (uint256)"];
                const contract = new ethers.Contract(token, abi, provider);
                
                const val = await contract.allowance(user, spender);
                out.innerText = "Izin: " + val.toString();
            } catch(e) {
                out.innerText = "ERROR: " + e.message;
            }
        }
    </script>
</body>
</html>
