<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { width: 100%; margin: 5px 0; padding: 10px; box-sizing: border-box; }
        button { padding: 15px; margin: 5px 0; width: 100%; font-size: 16px; }
        #info { margin-top: 10px; padding: 10px; background: #eee; border: 1px solid #000; word-break: break-all; }
    </style>
</head>
<body>
    <h3>Security Lab v2</h3>
    <button id="connectBtn">1. Connect Wallet</button>
    <input type="text" id="token" value="0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14">
    <input type="text" id="spender" value="0xC532a74256D3Db42D0Bf7a0400fEFDbad7694008">
    <button onclick="runCheck()">2. Cek Izin (Allowance)</button>
    <div id="info">Menunggu...</div>

    <script>
        document.getElementById('connectBtn').onclick = async () => {
            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                document.getElementById('info').innerText = "Terhubung!";
            } catch(e) { alert(e.message); }
        };

        async function runCheck() {
            try {
                // Pastikan ethers sudah dimuat
                if (typeof ethers === 'undefined') throw new Error("Library ethers gagal dimuat!");
                
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                const user = await signer.getAddress();
                
                const tokenAddr = document.getElementById('token').value;
                const spender = document.getElementById('spender').value;
                
                const abi = ["function allowance(address owner, address spender) view returns (uint256)"];
                const contract = new ethers.Contract(tokenAddr, abi, provider);
                
                const allowance = await contract.allowance(user, spender);
                document.getElementById('info').innerText = "Izin saat ini: " + allowance.toString();
            } catch (err) {
                document.getElementById('info').innerText = "ERROR: " + err.message;
            }
        }
    </script>
</body>
</html>
