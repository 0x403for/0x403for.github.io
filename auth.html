<html>
<head>
<title>test</title>
</head>
<body>

<p>test clipboard</p>
<button onclick="cek()">click here</button>
<p id="h"></p>

<script>
async function cek(){
  try{
    var p = await navigator.permissions.query({name:'clipboard-read'});
    document.getElementById('h').innerText = 'status: ' + p.state;
    var t = await navigator.clipboard.readText();
    document.getElementById('h').innerText += '\nisi: ' + t;
  }catch(e){
    document.getElementById('h').innerText = 'ke block: ' + e;
  }
}
</script>

<br><hr><br>

<p>test drag</p>
<div id="d" style="border:1px solid black;padding:20px;">drop disini</div>

<script>
var d = document.getElementById('d');
d.addEventListener('dragover', function(e){
  e.preventDefault();
  console.log('hover');
});
d.addEventListener('drop', function(e){
  e.preventDefault();
  console.log('drop, file: ' + e.dataTransfer.files.length);
});
</script>

</body>
</html>
