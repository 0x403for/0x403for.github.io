<html>
<head>
<title>test</title>
</head>
<body>

<p>test popup</p>
<button onclick="go()">click here</button>
<p id="h"></p>

<script>
function go(){
  document.getElementById('h').innerText = 'buka popup 1...';

  var w1 = window.open('/page1.html', '_blank');
  if(!w1){
    document.getElementById('h').innerText = 'popup 1 ke block';
    return;
  }

  setTimeout(function(){
    var w2 = window.open('/page2.html', '_blank');
    if(w2){
      document.getElementById('h').innerText = 'popup 2 kebuka, bypass!';
    }else{
      document.getElementById('h').innerText = 'popup 2 ke block, aman';
    }
  }, 500);

  setTimeout(function(){
    var w3 = window.open('/page3.html', '_blank');
    if(w3){
      console.log('popup telat kebuka');
    }else{
      console.log('popup telat ke block');
    }
  }, 1000);
}
</script>

</body>
</html>
