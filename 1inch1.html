<!DOCTYPE html>
<html>
<body>
<button onclick="scan()">Scan Bluetooth</button>
<pre id="o"></pre>
<script>
async function scan(){
  let out = document.getElementById('o');
  if(!navigator.bluetooth){
    out.innerText = "Bluetooth tidak tersedia di WebView ini (aman)";
    return;
  }
  try{
    out.innerText = "Minta izin Bluetooth...";
    let device = await navigator.bluetooth.requestDevice({acceptAllDevices:true});
    out.innerText = "KENA! Device ketemu: " + device.name + " | ID: " + device.id;
  }catch(e){
    out.innerText = "Blocked (aman) / Error: " + e.message;
  }
}
</script>
</body>
</html>
