<!DOCTYPE html>
<html>
<body>
<button onclick="start()">Mulai Baca Sensor</button>
<pre id="o">Belum mulai...</pre>
<script>
function start(){
  let out = document.getElementById('o');
  if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
    // iOS 13+ butuh izin khusus
    DeviceMotionEvent.requestPermission().then((res)=>{
      out.innerText = "Izin Motion: " + res;
      if(res === "granted") mulai();
    }).catch(e => out.innerText = "Error izin: " + e.message);
  } else {
    out.innerText = "Langsung baca tanpa izin, cek di bawah...";
    mulai();
  }
  function mulai(){
    window.addEventListener('devicemotion', (e)=>{
      let a = e.accelerationIncludingGravity;
      document.getElementById('o').innerText = "Accel X: " + a.x?.toFixed(2) + "\nAccel Y: " + a.y?.toFixed(2) + "\nAccel Z: " + a.z?.toFixed(2) + "\n\nCoba goyangin iPhone lu, kalo angka ini berubah-ubah, berarti sensornya ke-baca sama web!";
    });
    window.addEventListener('deviceorientation', (e)=>{
      document.getElementById('o').innerText += "\n\nOrientation - Alpha: " + e.alpha?.toFixed(1) + " Beta: " + e.beta?.toFixed(1) + " Gamma: " + e.gamma?.toFixed(1);
    });
  }
}
</script>
</body>
</html>
