<!DOCTYPE html>
<html>
<body>
<h3>Test Keyboard</h3>
<input type="text" id="t1" placeholder="Ketik ZZZ disini" autocomplete="off" autocorrect="on"><br><br>
<textarea id="t2" placeholder="Atau ketik disini" rows="3"></textarea><br><br>
<pre id="o">1. Buka Notes, ketik ZZZSECRET123 sekali<br>2. Balik kesini, ketik ZZZ di kolom atas<br>3. Liat apakah keyboard nyaranin ZZZSECRET123</pre>
<script>
document.getElementById('t1').addEventListener('input', (e)=>{
  document.getElementById('o').innerText = "Yang lu ketik: " + e.target.value;
});
</script>
</body>
</html>
