<!DOCTYPE html>
<html>
<body>
<button onclick="notif()">Test Notif</button>
<script>
async function notif(){
  let p = await Notification.requestPermission();
  if(p === "granted"){
    new Notification("1inch Wallet", {body: "Test notifikasi dari situs - apakah ini keliatan kayak dari 1inch?"});
  } else {
    alert("Blocked (aman): " + p);
  }
}
</script>
</body>
</html>
