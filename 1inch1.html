<!DOCTYPE html>
<html>
<body>
<button onclick="push()">Minta Izin Push</button>
<script>
async function push(){
  let p = await Notification.requestPermission();
  alert("Izin push: " + p);
  if(p === "granted"){
    new Notification("1inch Wallet", {body: "Swap kamu berhasil! Klik untuk lihat"});
  }
}
</script>
</body>
</html>
