<!DOCTYPE html>
<html>
<body>
<button onclick="tes()">Test Passkey 1inch</button>
<pre id="o"></pre>
<script>
async function tes(){
  let out = document.getElementById('o');
  try{
    // Ini coba minta Passkey dengan rpId punya 1inch, dari origin github.io
    let cred = await navigator.credentials.get({
      publicKey: {
        challenge: new Uint8Array([1,2,3,4]),
        rpId: "1inch.io",
        allowCredentials: [],
        userVerification: "preferred"
      }
    });
    out.innerText = "KENA! Passkey keambil: " + JSON.stringify(cred);
  }catch(e){
    out.innerText = "Blocked (aman) / Error: " + e.message + "\n\nKalo errornya 'rpId tidak cocok' / 'NotAllowed', berarti 1inch udah bener nge-block cross-origin Passkey.";
  }
}
</script>
</body>
</html>
