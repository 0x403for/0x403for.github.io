<!DOCTYPE html>
<html>
<body>
<button onclick="scan()">Scan Wallet Terinstall</button>
<pre id="o">Belum di-scan...</pre>
<script>
async function cekScheme(scheme){
  return new Promise((resolve)=>{
    let start = performance.now();
    let done = false;
    function finish(found){
      if(done) return;
      done = true;
      window.removeEventListener('blur', onBlur);
      resolve({scheme, found, time: (performance.now()-start).toFixed(1)});
    }
    function onBlur(){
      // Kalo browser ke-blur, berarti ada app yang kebuka = wallet-nya ke-install
      finish(true);
    }
    window.addEventListener('blur', onBlur);
    let iframe = document.createElement('iframe');
    iframe.style.display = "none";
    iframe.src = scheme;
    document.body.appendChild(iframe);
    setTimeout(()=>{
      document.body.removeChild(iframe);
      finish(false);
    }, 800);
  });
}
async function scan(){
  let out = document.getElementById('o');
  out.innerText = "Scanning... jangan pindah app dulu";
  let wallets = [
    "metamask://",
    "trust://",
    "1inch://",
    "phantom://",
    "rainbow://",
    "coinbase://"
  ];
  let r = "";
  for(let w of wallets){
    let res = await cekScheme(w);
    r += res.scheme + " -> " + (res.found ? "KE-INSTALL (blur)" : "GAK KE-INSTALL / di-block") + " | " + res.time + "ms\n";
    out.innerText = r;
    await new Promise(x=>setTimeout(x, 300));
  }
  r += "\nKalo ada yang KE-INSTALL, berarti situs ini bisa nebak wallet apa aja yang ada di iPhone lu.";
  out.innerText = r;
}
</script>
</body>
</html>
