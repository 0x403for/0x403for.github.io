<!DOCTYPE html>
<html>
<body>
<button onclick="cek()">Cek Baterai + Jaringan</button>
<pre id="o">Belum di-cek...</pre>
<script>
async function cek(){
  let r = "";
  // 1. BATTERY
  try{
    let b = await navigator.getBattery();
    r += "BATTERY:\n";
    r += "Level: " + (b.level * 100) + "%\n";
    r += "Charging: " + b.charging + "\n";
    r += "Charging Time: " + b.chargingTime + " detik\n";
    r += "Discharging Time: " + b.dischargingTime + " detik\n\n";
  }catch(e){ r += "Battery Blocked (aman): " + e.message + "\n\n"; }

  // 2. NETWORK
  try{
    let c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if(c){
      r += "NETWORK:\n";
      r += "Effective Type: " + c.effectiveType + "\n";
      r += "Downlink: " + c.downlink + " Mbps\n";
      r += "RTT: " + c.rtt + " ms\n";
      r += "Save Data: " + c.saveData + "\n\n";
    } else {
      r += "Network Info tidak tersedia (aman)\n\n";
    }
  }catch(e){ r += "Network Blocked: " + e.message + "\n\n"; }

  // 3. HARDWARE
  r += "HARDWARE:\n";
  r += "CPU Cores: " + navigator.hardwareConcurrency + "\n";
  r += "Memory: " + (navigator.deviceMemory || "tidak tersedia") + " GB\n";
  r += "Platform: " + navigator.platform + "\n";
  r += "Timezone: " + Intl.DateTimeFormat().resolvedOptions().timeZone + "\n";

  document.getElementById('o').innerText = r;
}
</script>
</body>
</html>
