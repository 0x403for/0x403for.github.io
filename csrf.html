<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web3 dApp Provider Security Test</title>
    <style>
        body { font-family: monospace; font-size: 12px; padding: 15px; background: #0f172a; color: #f8fafc; }
        .log-box { background: #1e293b; border: 1px solid #334155; padding: 10px; margin-top: 10px; max-height: 250px; overflow-y: auto; border-radius: 4px; }
        .log { margin: 4px 0; word-break: break-all; }
        .critical { color: #f87171; font-weight: bold; }
        .success { color: #4ade80; }
        .info { color: #38bdf8; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; margin: 5px 0; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <h3 style="margin-top:0; color:#fff;">Web3 dApp Bridge & Provider Security Test</h3>
    <p style="color: #94a3b8; font-size: 11px;">Skrip pengujian untuk memverifikasi isolasi objek jembatan dan validasi penandatanganan dApp browser.</p>
    <hr style="border-color: #334155;">

    <button onclick="runWeb3SecurityTest()">Jalankan Uji Keamanan Provider</button>

    <div class="log-box" id="logConsole">
        <div class="log info">[System] Menunggu eksekusi di dApp browser...</div>
    </div>

<script>
    function log(msg, type = "info") {
        const box = document.getElementById("logConsole");
        const div = document.createElement("div");
        div.className = "log " + type;
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        box.prepend(div);
        console.log(msg);
    }

    async function runWeb3SecurityTest() {
        log("--- Memulai Validasi Objek Provider Web3 ---", "info");

        // Deteksi objek jembatan (bridge) yang tersedia
        const provider = window.ethereum || window.OneInchIOSWallet || window.OneInchSolanaWallet;
        
        if (!provider) {
            log("[-] Tidak ada objek jembatan dompet yang terekspos pada konteks ini.", "critical");
            return;
        }

        log("[+] Objek jembatan/provider berhasil diidentifikasi.", "success");

        // Uji coba pembacaan akun (Enforcement of User Consent)
        try {
            log("[*] Memeriksa apakah akun dapat diakses secara senyap (silent enumeration)...", "info");
            let accounts = [];
            
            if (typeof provider.request === 'function') {
                accounts = await provider.request({ method: 'eth_accounts' });
            }

            if (accounts && accounts.length > 0) {
                log(`🚨 Peringatan: Alamat akun terekspos tanpa intervensi popup: ${accounts[0]}`, "critical");
            } else {
                log("[+] Akses akun terlindungi (memerlukan persetujuan manual pengguna).", "success");
            }
        } catch (err) {
            log(`[-] Permintaan dibatasi oleh mekanisme keamanan sistem: ${err.message}`, "success");
        }

        // Uji coba eksekusi metode sign tanpa parameter valid
        try {
            log("[*] Menguji penanganan parameter sign/request arbitrer...", "info");
            if (typeof provider.request === 'function') {
                await provider.request({
                    method: 'personal_sign',
                    params: ["Test Payload Injection", "0x0000000000000000000000000000000000000000"]
                });
                log("🚨 Kerentanan: Permintaan tanda tangan diproses tanpa validasi ketat.", "critical");
            }
        } catch (e) {
            log(`[-] Validasi parameter dan penolakan error bekerja dengan baik: ${e.message}`, "success");
        }
    }
</script>
</body>
</html>
