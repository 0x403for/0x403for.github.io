<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REAL Fenced Frame Test</title>
</head>
<body>
<h3>REAL Fenced Frame Test - Bukan Dummy</h3>

<fencedframe id="ff" src="https://0x403for.github.io/simple.html" style="width:100%;height:200px;border:2px solid red"></fencedframe>

<pre id="log" style="background:#000;color:#0f0;padding:10px;white-space:pre-wrap"></pre>

<script>
const log = (m) => document.getElementById('log').textContent += m + "\n";
const ff = document.getElementById('ff');

ff.addEventListener('load', () => {
  log("Fenced frame loaded: " + ff.src);
  
  // REAL TEST 1: contentWindow
  try {
    const cw = ff.contentWindow;
    log("contentWindow = " + cw);
    if (cw) {
      log("LEAK? contentWindow accessible!");
    }
  } catch(e) {
    log("SAFE: contentWindow blocked: " + e.message);
  }
  
  // REAL TEST 2: location.href
  try {
    const href = ff.contentWindow.location.href;
    log("BYPASS! location.href = " + href);
  } catch(e) {
    log("SAFE: location blocked: " + e.message);
  }
  
  // REAL TEST 3: document
  try {
    const doc = ff.contentWindow.document;
    log("BYPASS! document = " + doc);
  } catch(e) {
    log("SAFE: document blocked: " + e.message);
  }
});

// Fallback kalau <fencedframe> belum support, pakai iframe
if (!customElements.get('fencedframe') && document.createElement('fencedframe').toString() === "[object HTMLUnknownElement]") {
  log("Browser tidak support <fencedframe> element - coba iframe[fencedframe]");
  const container = document.body;
  const iframe = document.createElement('iframe');
  iframe.setAttribute('fencedframe', '');
  iframe.src = "https://0x403for.github.io/simple.html";
  iframe.style.width = "100%";
  iframe.style.height = "200px";
  iframe.style.border = "2px solid blue";
  iframe.onload = () => {
    log("\nIframe[fencedframe] loaded");
    try {
      log("contentWindow = " + iframe.contentWindow);
      log("location = " + iframe.contentWindow.location.href);
    } catch(e) {
      log("Blocked: " + e.message);
    }
  };
  container.appendChild(iframe);
}
</script>
</body>
</html>
