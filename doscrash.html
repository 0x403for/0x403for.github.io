     <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVM Wallet Standard Test Interface</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background-color: #0c0f14;
            color: #e6edf3;
            text-align: center;
        }
        button {
            background-color: #1f6feb;
            color: #ffffff;
            border: 1px solid rgba(240,246,252,0.1);
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            width: 100%;
            max-width: 320px;
            transition: background-color 0.2s;
        }
        button:disabled {
            background-color: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }
        #stopBtn {
            background-color: #da3633;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background-color: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
            text-align: left;
            word-wrap: break-word;
            font-family: monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #3fb950; }
        .error { color: #f85149; font-weight: bold; }
    </style>
</head>
<body>

    <h2>EVM Wallet Test Interface</h2>
    <p>Halaman evaluasi penanganan pengecualian data (Error Handling) pada dApp Browser EVM.</p>

    <button id="connectBtn">1. Hubungkan 1inch Wallet</button>
    <br>
    <button id="spamTxBtn" disabled>2. Mulai Stress-Test (Loop)</button>
    <br>
    <button id="stopBtn" disabled>Stop Pengujian</button>

    <h3>Log Aktivitas Eksekusi:</h3>
    <div id="status">Menunggu inisialisasi lingkungan Web3...</div>

    <script>
        let walletAddress = null;
        let spamInterval = null;
        let txCount = 0;

        const statusDiv = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const spamTxBtn = document.getElementById('spamTxBtn');
        const stopBtn = document.getElementById('stopBtn');

        function log(message, type = '') {
            const time = new Date().toLocaleTimeString();
            const className = type ? `class="${type}"` : '';
            statusDiv.innerHTML = `[${time}] <span ${className}>${message}</span><br>` + statusDiv.innerHTML;
        }

        // 1. Verifikasi Keberadaan Provider Terinjeksi
        window.addEventListener('DOMContentLoaded', () => {
            log("Memeriksa keberadaan window.ethereum...");
            if (typeof window.ethereum !== 'undefined') {
                log("EVM Web3 Provider terdeteksi.", "success");
            } else {
                log("Provider tidak ditemukan. Pastikan halaman dibuka melalui dApp Browser dompet EVM.", "error");
            }
        });

        // 2. Prosedur Autentikasi / Koneksi Akun
        connectBtn.addEventListener('click', async () => {
            log("Mengirimkan permintaan eth_requestAccounts...");
            
            if (typeof window.ethereum === 'undefined') {
                log("Kesalahan: window.ethereum tidak terdefinisi.", "error");
                return;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                if (accounts && accounts.length > 0) {
                    walletAddress = accounts[0];
                    log(`Koneksi berhasil terjalin. Alamat: ${walletAddress}`, "success");
                    spamTxBtn.disabled = false;
                } else {
                    log("Dompet mengembalikan array akun kosong.", "error");
                }
            } catch (err) {
                log(`Permintaan koneksi ditolak: ${err.message}`, "error");
            }
        });

        // 3. Prosedur Pengujian Penanganan Struktur Data (Stress-Test Loop)
        spamTxBtn.addEventListener('click', () => {
            log("Memulai pengiriman urutan data malformasi ke RPC...", "error");
            spamTxBtn.disabled = true;
            stopBtn.disabled = false;

            // Interval diatur ke 1000ms (1 detik) untuk mengevaluasi ketahanan manajemen state antarmuka
            spamInterval = setInterval(async () => {
                txCount++;
                log(`Mengirimkan Payload Variasi Struktur #${txCount}...`);

                try {
                    /*
                      Penyusunan objek parameter yang sengaja dirusak (Malformed Argument).
                      Menghapus parameter wajib atau memberikan tipe data primitif yang tidak valid
                      sering kali memicu kegagalan inferensi tipe pada parsing native kode internal dompet.
                    */
                    const malformedParams = {
                        from: walletAddress,
                        to: null,              // Pengisian nilai penunjuk kosong (Null Pointer Target)
                        value: undefined,      // Parameter esensial tidak terdefinisi
                        gas: "0x5208",         // Batasan gas standar
                        data: []               // Mengirim tipe Array kosong untuk parameter string data ekspektasi
                    };

                    // Eksekusi pemanggilan metode standar industri
                    await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [malformedParams]
                    });

                    log(`Respon #${txCount}: Diterima oleh dompet.`);
                } catch (err) {
                    /* Jika mekanisme pengaman (try-catch) pada dompet bekerja dengan baik,
                       kesalahan arsitektur parameter akan ditangkap di sini tanpa merusak stabilitas aplikasi.
                    */
                    log(`Respon #${txCount} ditolak aman: ${err.message}`);
                }
            }, 1000); 
        });

        // 4. Terminasi Pengujian
        stopBtn.addEventListener('click', () => {
            if (spamInterval) {
                clearInterval(spamInterval);
                log("Urutan stress-test dihentikan oleh pengguna.");
                spamTxBtn.disabled = false;
                stopBtn.disabled = true;
            }
        });
    </script>
</body>
</html>
