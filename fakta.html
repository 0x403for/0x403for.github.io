<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Web3 Session Security Audit</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f4f9; }
        .box { border: 1px solid #ddd; padding: 20px; border-radius: 12px; background: white; }
        .log { background: #333; color: #0f0; padding: 10px; font-family: monospace; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Security Audit: Session Expiration & Hijacking</h1>
    <div id="status">Status: Tidak Terhubung</div>
    
    <div class="box">
        <button id="btnConnect">1. Hubungkan Wallet (Initiate Session)</button>
        <button id="btnTx">2. Kirim Transaksi (Execute & Audit)</button>
    </div>

    <h3>Audit Logs:</h3>
    <pre id="auditLog" class="log">Menunggu aktivitas...</pre>

    <script>
        const AUDIT_DURATION = 30000; // 30 detik
        const auditLog = document.getElementById('auditLog');

        function updateLog(msg) {
            auditLog.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        }

        const getSession = () => JSON.parse(localStorage.getItem('web3_session'));

        document.getElementById('btnConnect').onclick = async () => {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const sessionData = { start: Date.now(), account: accounts[0] };
                localStorage.setItem('web3_session', JSON.stringify(sessionData));
                updateLog("Sesi dimulai untuk: " + accounts[0]);
                document.getElementById('status').innerText = "Terhubung: " + accounts[0];
            } catch (e) { updateLog("Error: " + e.message); }
        };

        document.getElementById('btnTx').onclick = async () => {
            const session = getSession();
            
            // 1. Pengecekan Eksistensi Sesi
            if (!session) {
                alert("Sesi tidak ditemukan! Silakan hubungkan kembali.");
                return;
            }

            const elapsed = Date.now() - session.start;
            updateLog(`Audit: Waktu berlalu ${elapsed}ms`);

            // 2. LOGIKA PEMBLOKIRAN TOTAL (FIXED)
            if (elapsed > AUDIT_DURATION) {
                updateLog("⚠️ ALERT: Sesi kadaluarsa! Memblokir eksekusi...");
                
                // Menghapus data sesi
                localStorage.removeItem('web3_session');
                document.getElementById('status').innerText = "Status: Sesi Kadaluarsa (Terputus)";
                
                // Memberikan peringatan tegas
                alert("Session Expired: Sesi tidak valid. Akses ke provider diblokir.");
                
                // RETURN DI SINI AKAN MENGHENTIKAN FUNGSI SEPENUHNYA
                return; 
            }

            // 3. Eksekusi Hanya Jika Lolos Audit
            try {
                updateLog("Sesi valid. Mengirim request ke provider...");
                const tx = {
                    from: session.account,
                    to: "0x000000000000000000000000000000000000dEaD",
                    value: "0x0",
                    gas: "0x5208"
                };
                
                const hash = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [tx]
                });
                updateLog("Transaksi berhasil! Hash: " + hash);
            } catch (e) {
                updateLog("Transaction Rejected: " + e.message);
            }
        };
    </script>
</body>
</html>
