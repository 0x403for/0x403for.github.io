<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Origin Test</title>
    <style>
        body { font-family: system-ui; background: #0a0a12; color: #ddd; padding: 15px; }
        pre { background: #111; padding: 12px; border-radius: 6px; }
        button { width: 100%; padding: 14px; margin: 10px 0; background: #1e2a44; color: #60a5fa; border: none; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Cross-Origin Test</h1>
    <button onclick="testCrossOrigin()">Test Cross-Origin Access</button>
    <pre id="log">Hasil akan muncul di sini...</pre>

    <script>
        function log(msg) {
            document.getElementById('log').textContent += msg + "\n\n";
        }

        async function testCrossOrigin() {
            let report = `Origin Saat Ini: ${location.origin}\n\n`;

            // Test parent access
            try {
                if (window.parent !== window) {
                    report += "✅ Inside iframe\n";
                    report += "Parent origin attempt: " + (window.parent.location.origin || "Blocked") + "\n";
                } else {
                    report += "Not inside iframe\n";
                }
            } catch (e) {
                report += "❌ window.parent blocked (Good)\n";
            }

            // postMessage ke top
            try {
                window.top.postMessage({type: "test", from: location.origin}, "*");
                report += "✅ postMessage ke top dikirim\n";
            } catch (e) {
                report += "❌ postMessage gagal\n";
            }

            // Coba baca localStorage via trick (biasanya gagal)
            try {
                report += "localStorage.length: " + localStorage.length + "\n";
            } catch (e) {}

            document.getElementById('log').textContent = report;
            console.log("Cross-Origin Test Report:", report);
        }

        window.onload = testCrossOrigin;
    </script>
</body>
</html>
