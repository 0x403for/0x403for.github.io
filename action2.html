<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Tool</title>
    <style>
        body { font-family: system-ui; background: #0a0a12; color: #ddd; padding: 16px; line-height: 1.5; }
        button { width: 100%; padding: 14px; margin: 10px 0; background: #1f2937; color: #67e8f9; border: 1px solid #475569; border-radius: 8px; }
        pre { background: #111827; padding: 14px; border-radius: 6px; overflow: auto; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Diagnostic Tool</h1>
    <button onclick="runAllTests()">Jalankan Semua Test</button>
    <pre id="result">Hasil akan muncul di sini...</pre>

    <script>
        const log = (msg) => {
            document.getElementById('result').textContent += msg + "\n";
        };

        async function runAllTests() {
            let report = `Origin: ${location.origin}\nTime: ${new Date().toISOString()}\n\n`;

            // BroadcastChannel
            try {
                const bc = new BroadcastChannel('test_channel');
                bc.postMessage({test: "from_dapp"});
                report += "✅ BroadcastChannel aktif\n";
            } catch(e) { report += "❌ BroadcastChannel error\n"; }

            // localStorage & sessionStorage
            report += `\nlocalStorage items: ${localStorage.length}\n`;
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                report += `• ${k}\n`;
            }

            // iframe / parent
            try {
                report += window.parent === window ? "Not in iframe\n" : "Inside iframe\n";
            } catch(e) {
                report += "Cross-origin blocked\n";
            }

            document.getElementById('result').textContent = report;
            console.log("=== Diagnostic Complete ===", report);
        }

        window.onload = runAllTests;
    </script>
</body>
</html>
