<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Storage Auditor v2.0</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        .box { border: 1px solid #0f0; padding: 15px; margin-top: 10px; }
        .token { color: #f0f; }
    </style>
</head>
<body>
    <h3>Ultimate Security Auditor</h3>
    <button onclick="runUltimateAudit()">Jalankan Full Audit Lintas Origin</button>
    <div id="result" class="box">Status: Menunggu eksekusi...</div>

    <script>
        async function runUltimateAudit() {
            const res = document.getElementById('result');
            res.innerHTML = "Memindai seluruh penyimpanan...<br>";

            
            res.innerHTML += "<br>[LocalStorage]:<br>";
            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                res.innerHTML += `${k} = <span class="token">${localStorage.getItem(k)}</span><br>`;
            }

            
            res.innerHTML += "<br>[SessionStorage]:<br>";
            for (let i = 0; i < sessionStorage.length; i++) {
                let k = sessionStorage.key(i);
                res.innerHTML += `${k} = ${sessionStorage.getItem(k)}<br>`;
            }

            
            res.innerHTML += "<br>[IndexedDB Probing]:<br>";
            try {
                
                const dbs = await indexedDB.databases();
                if (dbs.length === 0) res.innerHTML += "Tidak ada DB ditemukan.<br>";
                dbs.forEach(db => {
                    res.innerHTML += `Database Terdeteksi: <b>${db.name}</b><br>`;
                });
            } catch (err) {
                res.innerHTML += "Akses ditolak oleh kebijakan peramban: " + err.message + "<br>";
            }
        }
    </script>
</body>
</html>
