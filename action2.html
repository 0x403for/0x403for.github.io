<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Advanced Storage Security Auditor</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; background: #0d0d0d; color: #00ff41; }
        .audit-box { border: 1px solid #00ff41; padding: 15px; margin-top: 20px; background: #000; overflow-wrap: break-word; font-size: 14px; }
        button { padding: 12px 20px; cursor: pointer; background: #004400; color: #00ff41; border: 1px solid #00ff41; font-weight: bold; }
        button:hover { background: #00ff41; color: #000; }
        h3 { border-bottom: 1px solid #00ff41; padding-bottom: 10px; }
    </style>
</head>
<body>

    <h3>Advanced Storage Security Auditor</h3>
    <p>Target Origin: <span id="origin"></span></p>
    
    <button onclick="runFullAudit()">Jalankan Audit Keamanan Mendalam</button>
    <div id="auditResult" class="audit-box">Hasil audit akan muncul di sini...</div>

    <script>
        document.getElementById('origin').innerText = window.location.origin;

        async function runFullAudit() {
            let report = "<strong>Audit Report:</strong><br>";
            
            // 1. LocalStorage
            report += "<br><strong>[LocalStorage]</strong><br>";
            if (localStorage.length === 0) report += "Kosong.<br>";
            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                report += `Key: <b>${k}</b> | Val: ${localStorage.getItem(k)}<br>`;
            }

            // 2. SessionStorage
            report += "<br><strong>[SessionStorage]</strong><br>";
            if (sessionStorage.length === 0) report += "Kosong.<br>";
            for (let i = 0; i < sessionStorage.length; i++) {
                let k = sessionStorage.key(i);
                report += `Key: <b>${k}</b> | Val: ${sessionStorage.getItem(k)}<br>`;
            }

            // 3. IndexedDB (Krusial untuk dApp modern)
            report += "<br><strong>[IndexedDB Databases]</strong><br>";
            try {
                const dbs = await indexedDB.databases();
                if (dbs.length === 0) report += "Tidak ditemukan.<br>";
                dbs.forEach(db => {
                    report += `Found DB: <b>${db.name}</b> (v${db.version})<br>`;
                });
            } catch (e) {
                report += "Akses IndexedDB dibatasi.<br>";
            }

            document.getElementById('auditResult').innerHTML = report;
        }
    </script>
</body>
</html>
