<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Advanced Security Exploitation Tool</title>
</head>
<body>
    <h3>System Integrity Auditor</h3>
    <button onclick="runExploit()">Jalankan Eksploitasi Data</button>
    <pre id="output"></pre>

    <script>
        async function runExploit() {
            const output = document.getElementById('output');
            output.innerText = "Scanning for sensitive keys...\n";

            // 1. Mencoba LocalStorage
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    let k = localStorage.key(i);
                    output.innerText += `[LocalStorage] Found: ${k} = ${localStorage.getItem(k)}\n`;
                }
            } catch(e) { output.innerText += "[LocalStorage] Access Restricted.\n"; }

            // 2. Mencoba IndexedDB (Pusat data dApp modern)
            try {
                const dbs = await indexedDB.databases();
                for (let dbInfo of dbs) {
                    output.innerText += `[IndexedDB] Found Database: ${dbInfo.name}\n`;
                    // Jika Anda ingin mengambil data dari DB ini, Anda perlu membuka koneksi
                    // Ini adalah tahap dimana data asli dApp "dicuri"
                }
            } catch(e) { output.innerText += "[IndexedDB] Access Restricted.\n"; }
        }
    </script>
</body>
</html>
