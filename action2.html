<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Check</title>
    <style>
        body { font-family: system-ui; background:#0a0a12; color:#ddd; padding:15px; }
        button { width:100%; padding:14px; margin:10px 0; background:#1f2937; color:#67e8f9; border:none; border-radius:8px; }
        pre { background:#111827; padding:12px; border-radius:6px; }
    </style>
</head>
<body>
    <h1>Session Check</h1>
    <button onclick="check()">Cek Storage</button>
    <pre id="log">Tekan tombol...</pre>

    <script>
        function check() {
            let text = `Origin: ${location.origin}\n\n`;
            text += `localStorage items (${localStorage.length}):\n`;
            
            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                text += `- ${k}\n`;
            }
            
            document.getElementById('log').textContent = text;
        }
        window.onload = check;
    </script>
</body>
</html>
