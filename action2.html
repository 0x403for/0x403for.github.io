<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch All Bug Tester</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; color: #000; padding: 20px; line-height: 1.6; }
        h1 { text-align: center; }
        button { 
            display: block; width: 100%; max-width: 450px; margin: 10px auto; 
            padding: 14px; background: #000; color: #fff; border: 2px solid #000; cursor: pointer;
        }
        button:hover { background: #333; }
        pre { 
            background: #f4f4f4; padding: 20px; border: 2px solid #000; 
            font-family: monospace; white-space: pre-wrap; max-height: 750px; overflow-y: auto;
        }
        .vuln { color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <h1>1INCH ALL BUG TESTER</h1>
    <p style="text-align:center;">Wallet: <strong><span id="walletAddr">Belum terhubung</span></strong></p>

    <button onclick="fullBugTest()">🚨 FULL ALL BUG TEST</button>
    <button onclick="clearLog()">CLEAR LOG</button>

    <pre id="log">1inch All Bug Tester siap...\nKlik FULL ALL BUG TEST</pre>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        let walletAddr = null;
        const logEl = document.getElementById('log');

        function log(msg, isVuln = false) {
            const time = new Date().toLocaleTimeString();
            const prefix = isVuln ? "🚨 VULN: " : "";
            logEl.innerHTML += `[${time}] ${prefix}${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function connectWallet() {
            if (!window.ethereum) return log("Wallet tidak terdeteksi", true);
            try {
                const acc = await window.ethereum.request({ method: 'eth_requestAccounts' });
                walletAddr = acc[0];
                document.getElementById('walletAddr').textContent = walletAddr;
                log(`Wallet terhubung: ${walletAddr}`);
                return walletAddr;
            } catch (e) { return null; }
        }

        async function fullBugTest() {
            log("=== FULL ALL BUG TEST FOR 1INCH ===");
            await connectWallet();

            // High Risk
            await testInfiniteApproval();
            testBlindSigning();
            testPermitSignature();
            testSessionHijacking();
            testMaliciousDApp();

            // Medium Risk
            testApprovalRace();
            testSignatureReplay();
            testSlippageManipulation();
            testFrontRunning();

            // Others
            testWalletConnect();
            testUnknownApproval();

            log("=== FULL TEST SELESAI ===");
            log("\nSaran: Gunakan revoke.cash secara rutin");
        }

        async function testInfiniteApproval() {
            log("\n[1] Infinite Approval Test");
            const routers = ["0x1111111254EEB25477B68fb851d3A6D1aA9c3F6C", "0x111111125421ca6dc452d289314280a0f0b5b0e6"];
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const tokens = ["0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", "0xdAC17F958D2ee523a2206206994597C13D831ec7"];

            for (let router of routers) {
                for (let tokenAddr of tokens) {
                    try {
                        const contract = new ethers.Contract(tokenAddr, ["function allowance(address,address) view returns (uint256)"], provider);
                        const allowance = await contract.allowance(walletAddr, router);
                        if (allowance > 1e24) log(`Infinite Approval ke 1inch Router`, true);
                    } catch(e) {}
                }
            }
        }

        function testBlindSigning() {
            log("\n[2] Blind Signing / Phishing Test");
            log("Coba swap di 1inch.io dan perhatikan pesan signature");
        }

        function testPermitSignature() {
            log("\n[3] Permit Signature Abuse (EIP-2612)");
            log("Lakukan swap dan amati apakah muncul 'Permit' signature");
        }

        function testSessionHijacking() {
            log("\n[4] Session Hijacking Test");
            log("Refresh 1inch.io berkali-kali. Cek apakah masih connect");
        }

        function testMaliciousDApp() {
            log("\n[5] Malicious / Fake 1inch Test");
            log("Pastikan selalu buka https://app.1inch.io");
        }

        function testApprovalRace() {
            log("\n[6] Approval Race Condition");
            log("Jangan approve lalu langsung swap besar");
        }

        function testSignatureReplay() {
            log("\n[7] Signature Replay Attack");
            log("Signature seharusnya unik setiap kali");
        }

        function testSlippageManipulation() {
            log("\n[8] Slippage Manipulation");
            log("Jangan pakai slippage terlalu tinggi (>1-2%)");
        }

        function testFrontRunning() {
            log("\n[9] Front-running Risk");
            log("Gunakan private RPC atau MEV protection jika tersedia");
        }

        function testWalletConnect() {
            log("\n[10] WalletConnect Vulnerability");
            log("Cek session di wallet → disconnect yang tidak perlu");
        }

        function testUnknownApproval() {
            log("\n[11] Token Approval to Unknown Contract");
            log("Cek approval hanya ke contract resmi 1inch");
        }

        function clearLog() {
            logEl.innerHTML = '';
        }

        window.onload = () => log("All Bug Tester siap untuk 1inch");
    </script>
</body>
</html>
