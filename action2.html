<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Deep Storage Inspector</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0a0a0a; color: #00ff00; }
        .log-panel { background: #000; border: 1px solid #333; padding: 15px; height: 400px; overflow: scroll; }
        .token { color: #ff00ff; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Deep Storage Inspector</h3>
    <button onclick="inspect()">Jalankan Inspeksi Mendalam</button>
    <div id="log" class="log-panel"></div>

    <script>
        const logDiv = document.getElementById('log');
        function write(msg) { logDiv.innerHTML += msg + "<br>"; }

        function inspect() {
            logDiv.innerHTML = "--- Memulai Inspeksi ---\n";
            
            // Mencari kata kunci yang sering digunakan untuk menyimpan JWT/Token
            const keywords = ['token', 'auth', 'jwt', 'session', 'access', 'secret', 'key'];

            write("<br><strong>[LocalStorage]</strong>");
            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                let v = localStorage.getItem(k);
                let isSensitive = keywords.some(word => k.toLowerCase().includes(word));
                write(`${k} : <span class="${isSensitive ? 'token' : ''}">${v}</span>`);
            }

            write("<br><strong>[SessionStorage]</strong>");
            for (let i = 0; i < sessionStorage.length; i++) {
                let k = sessionStorage.key(i);
                let v = sessionStorage.getItem(k);
                write(`${k} : ${v}`);
            }
        }
    </script>
</body>
</html>
