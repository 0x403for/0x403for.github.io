<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cross-Origin Storage Auditor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #000; color: #0f0; }
        .log { border: 1px solid #0f0; padding: 10px; margin-top: 10px; font-size: 12px; }
        button { padding: 15px; width: 100%; background: #0f0; color: #000; font-weight: bold; border: none; }
    </style>
</head>
<body>
    <h3>Audit Lintas Origin (Skenario Nyata)</h3>
    <button onclick="runAggressiveAudit()">Deteksi Storage Lintas Origin</button>
    <div id="result" class="log">Menunggu eksekusi...</div>

    <script>
        async function runAggressiveAudit() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "Memindai...<br>";

            // 1. Coba baca LocalStorage (Domain sendiri)
            resultDiv.innerHTML += "<br><strong>[LocalStorage Saya]</strong><br>";
            for (let i = 0; i < localStorage.length; i++) {
                let k = localStorage.key(i);
                resultDiv.innerHTML += `K: ${k} | V: ${localStorage.getItem(k).substring(0, 20)}...<br>`;
            }

            // 2. Eksperimen: Mencoba mengakses database global (Jika ada celah WebView)
            // Ini adalah cara untuk melihat apakah kita bisa mengakses database 
            // yang dibuat oleh domain lain di folder yang sama
            resultDiv.innerHTML += "<br><strong>[Mencoba IndexedDB Global]</strong><br>";
            try {
                const databases = await indexedDB.databases();
                if (databases.length === 0) {
                    resultDiv.innerHTML += "Tidak ada DB ditemukan di origin ini.<br>";
                } else {
                    databases.forEach(db => {
                        resultDiv.innerHTML += `Ditemukan DB: <b>${db.name}</b> (Versi: ${db.version})<br>`;
                    });
                }
            } catch(e) {
                resultDiv.innerHTML += "Akses ditolak: " + e.message + "<br>";
            }

            resultDiv.innerHTML += "<br>--- Audit Selesai ---";
        }
    </script>
</body>
</html>
