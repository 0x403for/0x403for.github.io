<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Storage Check</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #0c0c14; 
            color: #ddd; 
            padding: 15px; 
            margin: 0;
            line-height: 1.5;
        }
        h1 { font-size: 1.35rem; color: #ccc; }
        button { 
            display: block; 
            width: 100%; 
            padding: 13px; 
            margin: 12px 0; 
            background: #1e1e2b; 
            color: #4ade80; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            font-size: 1rem;
        }
        pre { 
            background: #16161f; 
            padding: 12px; 
            border-radius: 6px; 
            overflow-x: auto; 
            font-size: 0.92rem;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .note { color: #888; font-size: 0.9rem; margin: 8px 0; }
    </style>
</head>
<body>
    <h1>Storage Check</h1>
    <p class="note">Memeriksa penyimpanan halaman ini di 1inch dApp Browser</p>

    <button onclick="runScan()">Jalankan Pemeriksaan Storage</button>
    <button onclick="clearAll()">Hapus Semua Data & Periksa Ulang</button>

    <h2>localStorage & sessionStorage</h2>
    <pre id="mainOutput">Tekan tombol di atas untuk memulai scan...</pre>

    <h2>IndexedDB</h2>
    <pre id="idbOutput">Memindai IndexedDB...</pre>

    <script>
        async function runScan() {
            // localStorage + sessionStorage
            let output = "=== localStorage ===\n";
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                let value = localStorage.getItem(key);
                if (value && value.length > 200) value = value.substring(0, 200) + "...";
                output += `${key} : ${value}\n`;
            }

            output += "\n=== sessionStorage ===\n";
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                let value = sessionStorage.getItem(key);
                if (value && value.length > 200) value = value.substring(0, 200) + "...";
                output += `${key} : ${value}\n`;
            }

            document.getElementById('mainOutput').textContent = output || "Tidak ada data.";

            // IndexedDB
            let idbText = "";
            try {
                if (window.indexedDB && window.indexedDB.databases) {
                    const databases = await window.indexedDB.databases();
                    idbText = databases.length > 0 
                        ? JSON.stringify(databases, null, 2) 
                        : "Tidak ada database IndexedDB yang terdeteksi.";
                } else {
                    idbText = "Browser tidak mendukung indexedDB.databases() atau tidak ada database.";
                }
            } catch (err) {
                idbText = "Error saat memindai IndexedDB:\n" + err.message;
            }
            document.getElementById('idbOutput').textContent = idbText;
        }

        function clearAll() {
            if (confirm("Hapus semua data storage?")) {
                localStorage.clear();
                sessionStorage.clear();
                runScan();
            }
        }

        // Auto scan saat halaman dibuka
        window.addEventListener('load', () => {
            setTimeout(runScan, 700);
        });
    </script>
</body>
</html>
