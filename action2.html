<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Storage Check</title>
    <style>
        body { font-family: system-ui, sans-serif; background:#0c0c14; color:#ddd; padding:15px; }
        button { width:100%; padding:14px; margin:10px 0; background:#1e1e2b; color:#4ade80; border:1px solid #334155; border-radius:8px; }
        pre { background:#16161f; padding:12px; border-radius:6px; overflow:auto; font-size:0.9rem; }
    </style>
</head>
<body>
    <h1>Storage & Context Check</h1>
    <button onclick="fullScan()">Full Scan</button>

    <h2>Hasil:</h2>
    <pre id="result">Menunggu...</pre>

    <script>
        async function fullScan() {
            let report = "=== Origin ===\n" + window.location.origin + "\n\n";

            // Storage biasa
            report += "=== localStorage ===\n";
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                report += `${k}: ${localStorage.getItem(k).substring(0,120)}...\n`;
            }

            // Coba akses parent / top (jika di-iframe)
            try {
                if (window.parent !== window) {
                    report += "\n=== Parent Window Access Possible ===\n";
                }
            } catch(e) {
                report += "\nParent access blocked (Good)\n";
            }

            // PostMessage test (hanya log)
            report += "\n=== PostMessage Test ===\nCek console untuk postMessage attempt.";

            document.getElementById('result').textContent = report;
            console.log("=== Full Scan Complete ===", window.location);
        }

        window.onload = fullScan;
    </script>
</body>
</html>
