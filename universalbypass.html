<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Popup 1 - Cross Origin App Store</title></head>
<body style="font-family:sans-serif;text-align:center;padding:40px;background:#ffffff">
<h1>POPUP 1 - CROSS-ORIGIN</h1>
<p>Origin: universal-linkbypass.netlify.app</p>
<p>No second click here.</p>
<p>Auto-opening App Store in 500ms...</p>
<p id="o"></p>
<script>
setTimeout(function(){
  document.getElementById('o').innerText = 'Trying App Store...';
  // Link App Store WhatsApp - ganti ke app apa aja kalau mau
  // Ini link https biasa, tapi iOS akan nawarin buka di App Store
  window.open('https://apps.apple.com/id/app/whatsapp-messenger/id310633997', '_blank');
}, 500);
</script>
</body>
</html>
