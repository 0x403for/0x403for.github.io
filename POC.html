<button onclick="testApplePay()">TEST APPLE PAY - SAFARI ONLY</button>
<pre id="log1"></pre>
<script>
function testApplePay(){
  let log = m=>document.getElementById('log1').textContent+=m+"\n";
  if(window.ApplePaySession){
    log("ApplePaySession ada = Safari");
    log("canMakePayments: "+ApplePaySession.canMakePayments());
    try{
      let session = new ApplePaySession(3, {countryCode:'US', currencyCode:'USD', total:{label:'Test', amount:'1'}});
      log("Session dibuat, bisa cek user punya card atau tidak tanpa permission");
      log(">>> Kalau canMakePayments true tanpa user gesture = PRIVACY LEAK Safari Only");
    }catch(e){ log("Error: "+e.message); }
  } else {
    log("Bukan Safari - ApplePaySession tidak ada");
  }
}
</script>
