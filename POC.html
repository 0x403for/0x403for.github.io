<input type="file" id="file" webkitdirectory multiple>
<pre id="log3"></pre>
<script>
document.getElementById('file').onchange=e=>{
  let files=e.target.files;
  for(let f of files){
    document.getElementById('log3').textContent+=f.webkitRelativePath+"\n";
  }
  // Di Safari, webkitRelativePath kadang kasih full path /Users/...
  // Kalau kasih full path bukan cuma relative = PRIVACY LEAK
};
</script>
<p>Pilih 1 folder, kalau log muncul /Users/nama kamu/... = LEAK</p>
