<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safari Test Fixed</title>
<style>
body{font-family:-apple-system;padding:15px;background:#f5f5f7}
button{background:#007aff;color:white;border:none;padding:15px 25px;font-size:18px;border-radius:12px;width:100%;margin:10px 0}
pre{background:#000;color:#0f0;padding:12px;border-radius:8px;overflow:auto;font-size:13px;min-height:200px}
.ok{color:#0f0} .leak{color:#ff3b30;font-weight:bold;background:yellow}
</style>
</head>
<body>

<h2>Safari Bug Test - 1 File Fix</h2>
<p>Klik tombol di bawah, wajib klik 1x biar Safari kasih gesture</p>

<button id="btnRun">RUN TEST - TAP DISINI</button>
<button id="btnClear" style="background:#888">Clear Log</button>

<pre id="log">Menunggu klik...
</pre>

<div id="area"></div>

<script>
// Fix biar pasti jalan di Safari lama
var logEl = document.getElementById('log');
function log(msg){
  var time = new Date().toLocaleTimeString();
  logEl.textContent += "["+time+"] " + msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

document.getElementById('btnClear').onclick = function(){
  logEl.textContent = "Log cleared...\n";
};

document.getElementById('btnRun').onclick = async function(){
  logEl.textContent = "";
  log("=== START TEST ===");
  log("User gesture diterima, mulai test...\n");

  // TEST 1 - Paling gampang, pasti jalan
  log("[1] Test enumerateDevices...");
  try{
    if(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices){
      var devices = await navigator.mediaDevices.enumerateDevices();
      log(" Dapat " + devices.length + " devices");
      for(var i=0;i<devices.length;i++){
        var d = devices[i];
        var label = d.label || "(kosong)";
        log("  - " + d.kind + " | label: " + label);
        if(d.label && d.label.length > 2){
          log("  >>> LEAK! Label kebaca tanpa permission: " + d.label + " = BUG!");
        }
      }
      if(devices.length > 0 && devices[0].label === ""){
        log("  [SAFE] Label kosong, butuh permission dulu");
      }
    } else {
      log("  enumerateDevices tidak support di browser ini");
    }
  } catch(e){
    log("  ERROR: " + e.name + " - " + e.message);
  }

  await new Promise(r=>setTimeout(r,500));

  // TEST 2 - DeviceMotion
  log("\n[2] Test Motion (goyang HP 3 detik)...");
  var motionFound = false;
  function onMotion(e){
    if(!motionFound){
      var x = e.accelerationIncludingGravity ? e.accelerationIncludingGravity.x : 0;
      log("  >>> LEAK! Motion kebaca: x=" + x + " = BUG!");
      motionFound = true;
    }
  }
  window.addEventListener('devicemotion', onMotion);
  log("  Silahkan goyangkan HP sekarang...");
  await new Promise(r=>setTimeout(r,3500));
  window.removeEventListener('devicemotion', onMotion);
  if(!motionFound) log("  [SAFE] Tidak ada motion");

  // TEST 3 - Cookie
  log("\n[3] Test Cookie & Storage Access...");
  try{
    document.cookie = "safari_test=12345; Max-Age=3600; Path=/";
    log("  document.cookie: " + document.cookie);
    var hasAccess = await document.hasStorageAccess();
    log("  hasStorageAccess: " + hasAccess);
  }catch(e){
    log("  ERROR storage: " + e.message);
  }

  // TEST 4 - History via link
  log("\n[4] Test History :visited...");
  var urls = ["https://www.google.com", "https://www.apple.com", "https://example.invalid-never-visited-xyz"];
  for(var j=0;j<urls.length;j++){
    var a = document.createElement('a');
    a.href = urls[j];
    a.style.display = 'block';
    a.textContent = urls[j];
    document.getElementById('area').appendChild(a);
    var col = window.getComputedStyle(a).color;
    log("  " + urls[j] + " -> " + col);
    document.getElementById('area').removeChild(a);
  }

  // TEST 5 - Blob
  log("\n[5] Test Blob URL...");
  try{
    var blob = new Blob(["<h1>blob ok</h1>"], {type:"text/html"});
    var url = URL.createObjectURL(blob);
    log("  Blob URL dibuat: " + url.substring(0,40) + "...");
    var ifr = document.createElement('iframe');
    ifr.src = url;
    ifr.style.width = "100%";
    ifr.style.height = "50px";
    ifr.style.border = "1px solid #ccc";
    document.getElementById('area').appendChild(ifr);
    log("  Iframe blob ditambahkan");
  }catch(e){
    log("  Blob ERROR: " + e.message);
  }

  log("\n=== SELESAI ===");
  log("Kalau ada tulisan LEAK = potensi bug Safari!");
};

log("File loaded. Silahkan klik RUN TEST");
</script>

</body>
</html>
