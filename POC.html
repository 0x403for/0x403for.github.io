<button onclick="testPrivate()">TEST PRIVATE LEAK</button>
<pre id="log"></pre>
<script>
function testPrivate(){
  let req = indexedDB.open("private-test");
  req.onsuccess = ()=>{
    localStorage.setItem("private-test","data");
    document.getElementById('log').textContent = 
      "IDB + localStorage set di Private Mode\n"+
      "Tutup Safari Private, buka lagi Safari normal\n"+
      "Kalau data masih ada = PRIVATE BROWSING LEAK BUG";
  };
}
</script>
