<!DOCTYPE html>
<html>
<body>
<h2>Drag Leak Test</h2>
<div id="drop" style="width:100%;height:150px;border:3px dashed red;text-align:center;line-height:150px">Drag file kesini, lalu TAP tombol</div>
<button onclick="testDrag()">TEST DRAG</button>
<pre id="log"></pre>
<script>
let lastFile = null;
let log = m=>document.getElementById('log').textContent+=m+"\n";

document.getElementById('drop').ondragover = e=>e.preventDefault();
document.getElementById('drop').ondrop = e=>{
  e.preventDefault();
  lastFile = e.dataTransfer.files[0];
  log("File dropped: "+lastFile.name);
};

function testDrag(){
  // Di Safari lama, dataTransfer bisa dibaca tanpa drop beneran
  try{
    if(lastFile){
      let reader = new FileReader();
      reader.onload = ()=>log("LEAK! File content: "+reader.result.slice(0,100));
      reader.readAsText(lastFile);
    } else {
      // Coba pakai DataTransfer palsu
      let dt = new DataTransfer();
      log("DataTransfer created, items: "+dt.items.length);
      log("Kalau bisa add file tanpa user gesture = BUG");
    }
  }catch(e){ log("SAFE: "+e.message); }
}
</script>
</body>
</html>
