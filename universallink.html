<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Link Bypass</title></head>
<body style="font-family:sans-serif;text-align:center;padding:40px">
<h1>Universal Link Bypass</h1>
<p>1 click = should open 1 popup only.</p>
<p>Should NOT open Phone automatically from cross-origin popup.</p>
<button onclick="start()" style="font-size:24px;padding:20px 40px">Click Here</button>
<p id="o"></p>
<script>
function start(){
  document.getElementById('o').innerText = 'CLICKED - opening cross-origin Popup 1...';
  window.open('https://universal-bypas.netlify.app/', '_blank');
}
</script>
</body>
</html>
