<!DOCTYPE html>
<html>
<body style="background: #000; color: #fff; font-family: monospace; padding: 20px;">
    <h3>🧪 APPROVAL LOGIC FUZZER</h3>
    <button onclick="testApproval('max')" style="width:100%; padding:10px; margin-bottom:5px;">TEST MAX UINT256</button>
    <button onclick="testApproval('weird')" style="width:100%; padding:10px;">TEST LARGE ODD NUMBER</button>

    <div id="log" style="font-size: 10px; color: #888; margin-top: 20px;"></div>

    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <script>
    async function testApproval(type) {
        if (!window.ethereum) return alert("Provider not found");
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const signer = provider.getSigner();
        const token = "0xdAC17F958D2ee523a2206206994597C13D831ec7"; // USDT
        const abi = ["function approve(address s, uint256 v) public returns (bool)"];
        const contract = new ethers.Contract(token, abi, signer);

        let amount;
        if (type === 'max') {
            amount = ethers.constants.MaxUint256;
        } else {
            // Angka sangat besar tapi bukan Max (untuk mengelabui deteksi "Unlimited")
            amount = ethers.BigNumber.from("999999999999999999999999999999");
        }

        try {
            document.getElementById('log').innerText = "Opening confirmation...";
            await contract.approve("0x000000000000000000000000000000000000dead", amount);
        } catch (e) {
            document.getElementById('log').innerText = "Status: " + e.message;
        }
    }
    </script>
</body>
</html>
