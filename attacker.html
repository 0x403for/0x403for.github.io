<!DOCTYPE html>
<html>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">

    <h3>🔍 BRIDGE DIAGNOSTIC MODE</h3>
    <button onclick="scanBridge()" style="padding: 15px; background: #333; color: #0f0; border: 1px solid #0f0; width: 100%;">
        SCAN FOR ACTIVE BRIDGE
    </button>

    <div id="results" style="margin-top: 20px; text-align: left; font-size: 12px; white-space: pre-wrap;">
        Waiting for scan...
    </div>

    <script>
    function scanBridge() {
        const results = document.getElementById('results');
        results.innerHTML = "Scanning standard bridges...\n";
        
        // Daftar kemungkinan nama bridge 1inch
        const targets = [
            'OneInchiOSWallet', 
            'OneInchSolanaWallet', 
            'OneInchAndroidWallet', 
            'ethereum', 
            'oneinch'
        ];

        targets.forEach(t => {
            if (window[t]) {
                results.innerHTML += `✅ FOUND: window.${t}\n`;
                // List semua fungsi yang ada di dalam bridge itu
                const methods = Object.getOwnPropertyNames(window[t]);
                results.innerHTML += `   Methods: [${methods.join(', ')}]\n\n`;
            } else {
                results.innerHTML += `❌ NOT FOUND: window.${t}\n`;
            }
        });

        // Jika semua gagal, scan seluruh objek window yang punya kata 'Inch'
        results.innerHTML += "\nScanning all window objects for 'Inch' keywords...\n";
        for (let prop in window) {
            if (prop.toLowerCase().includes('inch')) {
                results.innerHTML += `⭐ POTENTIAL: window.${prop}\n`;
            }
        }
    }
    </script>
</body>
</html>
