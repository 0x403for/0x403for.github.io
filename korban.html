
<!DOCTYPE html>
<html>
<body>
    <h3>DApp Target (Korban)</h3>
    <div id="status">Status: Menunggu pesan dari penyerang...</div>

    <script>
        const dataRahasia = { saldo: "100 ETH", wallet: "0x123...abc" };

        window.addEventListener("message", (event) => {
            // BUG: Tidak ada pengecekan if (event.origin !== ...)
            if (event.data.action === "curi") {
                document.getElementById("status").innerText = "Pesan diterima dari: " + event.origin;
                
                // Mengirim balik data sensitif ke penyerang
                event.source.postMessage({
                    type: "DATA_RAHASIA",
                    data: dataRahasia
                }, event.origin);
            }
        });
    </script>
</body>
</html>
