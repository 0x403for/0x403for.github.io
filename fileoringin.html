
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
.button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
</style>
</head>
<body>
<script>
function a(){
    // Mencoba membuka aplikasi kalkulator menggunakan URI scheme
    // 'calc:' adalah standar umum untuk Windows
    // 'calculator:' terkadang digunakan di beberapa OS/platform
    try {
        window.location.href = 'calc:';
    } catch (e) {
        console.error("Gagal membuka aplikasi kalkulator:", e);
    }
}
</script>
<center><input type="button" class="button" value="Click Here" onclick="a()"></center>
</body>
</html>
