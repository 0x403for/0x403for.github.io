<!DOCTYPE html>
<html>
<head>
    <title>URL Fixup Tester</title>
</head>
<body>
    <h2>URL Fixup Security Tester</h2>
    <input type="text" id="payload" placeholder="Masukkan payload URL di sini" style="width: 300px;">
    <button onclick="runTest('navigate')">Test Navigation</button>
    <button onclick="runTest('link')">Test Link Click</button>

    <div id="result" style="margin-top: 20px; font-family: monospace;"></div>

    <script>
        function runTest(type) {
            const payload = document.getElementById('payload').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "Mencoba: " + payload;

            if (type === 'navigate') {
                // Ini memicu logika navigasi browser yang sama dengan address bar
                window.location.href = payload;
            } else if (type === 'link') {
                // Memicu perilaku klik link standar
                const a = document.createElement('a');
                a.href = payload;
                a.innerText = "Klik untuk navigasi";
                a.style.display = "block";
                resultDiv.appendChild(a);
            }
        }
    </script>
</body>
</html>
