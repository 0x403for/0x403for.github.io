<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba Transaksi Piggybacking</title>
</head>
<body>
    <h1>Uji Coba: Transaction Piggyback</h1>
    <button id="btn-run" style="padding: 20px; font-size: 18px;">Kirim Transaksi & Piggyback</button>
    <p id="status">Status: Standby</p>

    <script>
        const btn = document.getElementById('btn-run');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            status.innerText = "Mengirim Transaksi Sah...";
            
            // 1. Kirim transaksi sah
            try {
                const tx1 = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        to: '0x000000000000000000000000000000000000dEaD', // Alamat uji
                        value: '0x0', 
                    }],
                });
                status.innerText = "Transaksi 1 dikirim: " + tx1;

                // 2. Skenario Piggyback (Injeksi segera setelah transaksi 1 dipicu)
                // Di dApp browser, ini meniru perilaku ekstensi yang "menyambar" 
                // antrean sesaat setelah dApp meminta izin.
                setTimeout(async () => {
                    status.innerText = "Melakukan Piggyback...";
                    await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            to: '0x000000000000000000000000000000000000dEaD',
                            value: '0x0',
                        }],
                    });
                    status.innerText = "Transaksi 2 (Piggyback) terkirim.";
                }, 500);

            } catch (err) {
                status.innerText = "Error/Dibatalkan: " + err.message;
            }
        });
    </script>
</body>
</html>
