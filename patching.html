<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Piggyback V3</title>
</head>
<body>
    <h1>Lab Keamanan: Bypass Antrean</h1>
    <p>Karena batasan keamanan 1inch, transaksi harus dipicu secara manual satu per satu.</p>
    
    <button id="step1" style="padding: 20px;">Langkah 1: Transaksi Utama</button>
    <button id="step2" style="padding: 20px; display: none;">Langkah 2: Transaksi Piggyback</button>
    <div id="status" style="margin-top: 20px;"></div>

    <script>
        const btn1 = document.getElementById('step1');
        const btn2 = document.getElementById('step2');
        const status = document.getElementById('status');

        btn1.addEventListener('click', async () => {
            try {
                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{ to: '0x000000000000000000000000000000000000dEaD', value: '0x0' }]
                });
                status.innerText = "Langkah 1 Selesai. Sekarang klik Langkah 2.";
                btn2.style.display = "block"; // Munculkan tombol kedua
            } catch (e) {
                status.innerText = "Blokir Terdeteksi: " + e.message;
            }
        });

        btn2.addEventListener('click', async () => {
            try {
                await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{ to: '0x000000000000000000000000000000000000dEaD', value: '0x0' }]
                });
                status.innerText = "Langkah 2 Berhasil.";
            } catch (e) {
                status.innerText = "Blokir Terdeteksi: " + e.message;
            }
        });
    </script>
</body>
</html>
