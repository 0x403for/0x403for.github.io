<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Advanced Context Audit</title>
    <style>
        body { font-family: monospace; padding: 10px; background: #0e0e0e; color: #00ff00; }
        .log { border-bottom: 1px solid #333; padding: 5px; }
    </style>
</head>
<body>
    <h3>Audit Kebocoran Data Lintas Konteks</h3>
    <div id="logs"></div>

    <script>
        const logger = (msg) => {
            const div = document.createElement('div');
            div.className = 'log';
            div.innerText = `> ${msg}`;
            document.getElementById('logs').appendChild(div);
        };

        async function runDeepAudit() {
            // 1. Audit IndexedDB (Sering kali bocor antar domain di WebView yang buruk)
            try {
                const databases = await indexedDB.databases();
                logger("Ditemukan database indexedDB: " + databases.map(d => d.name).join(', '));
            } catch(e) { logger("Gagal akses IndexedDB"); }

            // 2. Audit Sensor (Akselerometer/Giroskop - Sering digunakan untuk fingerprinting perangkat)
            window.addEventListener('devicemotion', (event) => {
                logger("Sensor gerak terdeteksi (Bisa digunakan untuk pelacakan fisik)");
            }, { once: true });

            // 3. Audit Window Opener (Melihat apakah kita bisa menjangkau halaman lain)
            if (window.opener) {
                logger("WARNING: window.opener terdeteksi. Kita bisa memanipulasi halaman induk!");
            } else {
                logger("window.opener terisolasi.");
            }
        }

        runDeepAudit();
    </script>
</body>
</html>
