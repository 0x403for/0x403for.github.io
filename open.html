<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Audit: Unauthorized Signature Trigger</title>
</head>
<body>
    <h3>Audit Keamanan Penandatanganan</h3>
    <button onclick="testSignature()">Tes Memicu Signature (EIP-712)</button>
    <p id="status"></p>

    <script>
        async function testSignature() {
            const status = document.getElementById('status');
            
            // Data dummy EIP-712 sesuai standar
            const msgParams = JSON.stringify({
                domain: { chainId: 1, name: 'Security Audit', version: '1' },
                message: { contents: 'Audit Penandatanganan Tanpa Izin' },
                primaryType: 'Mail',
                types: {
                    EIP712Domain: [{ name: 'name', type: 'string' }, { name: 'version', type: 'string' }, { name: 'chainId', type: 'uint256' }],
                    Mail: [{ name: 'contents', type: 'string' }]
                }
            });

            try {
                // Mencoba memicu dialog penandatanganan dari konteks saat ini
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                const signature = await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [accounts[0], msgParams],
                });
                status.innerText = "CRITICAL: Dialog tanda tangan berhasil dipicu!";
                status.style.color = "red";
            } catch (err) {
                status.innerText = "Akses ditolak: " + err.message;
            }
        }
    </script>
</body>
</html>
