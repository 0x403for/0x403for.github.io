<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Audit Keamanan Web3: Provider Validation</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f8f9fa; }
        .log-box { background: #212529; color: #00ff00; padding: 15px; border-radius: 5px; height: 300px; overflow-y: auto; font-family: monospace; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Audit Integritas Provider</h2>
    <p>Uji apakah <code>window.ethereum</code> dapat diakses oleh konteks terisolasi:</p>
    <button class="btn" onclick="runAudit()">Jalankan Audit Provider</button>
    <div class="log-box" id="logs"></div>

    <script>
        const log = (msg) => document.getElementById('logs').innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;

        function runAudit() {
            log("Memulai audit provider...");
            
            // Skenario Nyata: Menguji apakah akses provider bersifat global atau terbatas pada origin
            if (window.ethereum) {
                log("Objek ethereum ditemukan.");
                
                // Mencoba melakukan request tanpa interaksi pengguna langsung
                window.ethereum.request({ method: 'eth_accounts' })
                    .then(accounts => {
                        log("BERHASIL MENGAKSES AKUN: " + accounts[0]);
                        log("WARNING: Akses akun didapat tanpa gating origin yang ketat.");
                    })
                    .catch(err => {
                        log("Akses ditolak (Keamanan berfungsi): " + err.message);
                    });
            } else {
                log("Provider ethereum tidak terdeteksi.");
            }
        }
    </script>
</body>
</html>
