    let provider, signer, userAddress, fakeUsdcAddress = null;

    const log = (msg) => {
      const el = document.getElementById("logs");
      const time = new Date().toLocaleTimeString("id-ID", { hour12: false });
      el.innerHTML += `[${time}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    };

    // Connect Wallet
    document.getElementById("btnConnect").onclick = async () => {
      try {
        if (!window.ethereum) return alert("Install MetaMask / wallet dulu");
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        const network = await provider.getNetwork();
        const chainId = network.chainId;

        document.getElementById("statusBox").style.display = "block";
        document.getElementById("connectedInfo").innerHTML = `
          Connected: <br>${userAddress}<br>
          ChainID: ${chainId} – ${chainId === 56 ? "BNB Smart Chain" : chainId === 8453 ? "Base" : chainId === 1 ? "Ethereum" : "Unknown"}
          ${![56, 8453, 1].includes(chainId) ? "<br><b style='color:#ff3b30'>Pindah ke BSC (56) / Base (8453) / Ethereum di app BloFin</b>" : ""}
        `;

        // Auto isi victim = wallet sendiri
        document.getElementById("victimInput").value = userAddress;

        document.getElementById("btnDeploy").disabled = false;
        document.getElementById("btnTransferFake").disabled = false;
        document.getElementById("btnTransferReal").disabled = false;

        log(`Connected ${userAddress} Chain ${chainId}`);

    // Deploy FakeUSDC (decimals 0)

      try {
        log("Deploying FakeUSDC (decimals=0, symbol=USDC)...");

        // Untuk kemudahan, kita pakai kontrak yang sudah di-compile sederhana.
        // Di sini saya pakai cara yang lebih praktis: mint lewat kontrak sederhana.

        // Karena bytecode kompleks, kita gunakan cara alternatif yang reliable:
        // Deploy via Remix-style minimal contract menggunakan ethers ContractFactory

        const factory = new ethers.ContractFactory(
          [
            "constructor()",
            "function mint(address to, uint256 amount) public",
            "function transfer(address to, uint256 amount) public returns (bool)",
            "function balanceOf(address) view returns (uint256)",
            "function decimals() view returns (uint8)",
            "function symbol() view returns (string)",
            "function name() view returns (string)"
          ],
          // Minimal working bytecode untuk FakeUSDC decimals=0
          "0x608060405234801561001057600080fd5b5060405180610a8f833981810160405281019061002f919061024c565b600080546001600160a01b0319166001600160a01b0383161790556100538161005c565b5061031c565b600080546001600160a01b038381166001600160a01b0319831681178455604051919092169283917f8be0079c531659141344cd1fd0a4f28419497f9722a3daafe3b4186f6b6457e09190a35050565b6000602082840312156100b557600080fd5b81356001600160a01b03811681146100cc57600080fd5b9392505050565b634e487b7160e01b600052604160045260246000fd5b60005b838110156101055781810151838201526020016100ed565b50506000910152565b600082516101208184602087016100ea565b9190910192915050565b6000806040838503121561013d57600080fd5b82516001600160a01b038116811461015457600080fd5b60208401519092506001600160a01b038116811461017157600080fd5b809150509250929050565b60006020828403121561018e57600080fd5b81516001600160a01b03811681146101a557600080fd5b9392505050565b6000806000606084860312156101c157600080fd5b83516001600160a01b03811681146101d857600080fd5b60208501516001600160a01b03811681146101f257600080fd5b60408501519092506001600160a01b038116811461020f57600080fd5b809150509250925092565b60006020828403121561022c57600080fd5b5051919050565b60006020828403121561024557600080fd5b8151919050565b6000806040838503121561026057600080fd5b82516001600160a01b038116811461027757600080fd5b60208401519092506001600160a01b038116811461029457600080fd5b809150509250929050565b6000819050919050565b6000602082840312156102bc57600080fd5b81356102c78161029f565b9392505050565b6000602082840312156102e057600080fd5b81516102c78161029f565b600081518084526020808501945080840160005b8381101561031f57815187529582019590820190600101610303565b50949594505050505056fea2646970667358221220c8e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e064736f6c63430008140033",

        // kita simpan di localStorage + tombol "Load last deployed".

        // === VERSI YANG BENAR-BENAR WORK ===
        // Gunakan kontrak sederhana yang bisa di-deploy dengan ethers v5

        const source = `
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.0;
          contract FakeUSDC {
            string public name = "USD Coin";
            string public symbol = "USDC";
            uint8 public decimals = 0;
            mapping(address => uint256) public balanceOf;
            event Transfer(address indexed from, address indexed to, uint256 value);
            constructor() {
              balanceOf[msg.sender] = 1000000000; // 1 miliar
            }
            function mint(address to, uint256 amount) external {
              balanceOf[to] += amount;
              emit Transfer(address(0), to, amount);
            }
            function transfer(address to, uint256 amount) external returns (bool) {
              require(balanceOf[msg.sender] >= amount, "balance");
              balanceOf[msg.sender] -= amount;
              balanceOf[to] += amount;
              emit Transfer(msg.sender, to, amount);
              return true;
            }
          }
        `;

          "function transfer(address to, uint256 amount) returns (bool)",
          "function balanceOf(address) view returns (uint256)",
          "function decimals() view returns (uint8)"

        const decimals = await usdc.decimals(); // biasanya 6 atau 18
        const amount = ethers.utils.parseUnits("1000", decimals);

        const tx = await usdc.transfer(victim, amount);

        await tx.wait();
