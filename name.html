<html>
<body style="background:#000;color:#0f0;font-family:monospace;padding:15px">
<button onclick="fuzz()" style="padding:20px;width:100%">FUZZ WALLET_BRIDGE_IN</button>
<pre id="log" style="white-space:pre-wrap;word-break:break-all"></pre>
<script>
function log(m){ document.getElementById('log').innerText += m+"\n"; }

function fuzz(){
  document.getElementById('log').innerText = "";
  let targets = ["__WALLET_BRIDGE_IN__", "__WALLET_EMIT__", "__WALLET_ERROR_COUNT__", "__WALLET_BRIDGE__", "WALLET_BRIDGE_IN"];

  targets.forEach(name=>{
    let obj = window[name];
    if(!obj){ log(`[NOT FOUND] window.${name}`); return; }

    log(`\n========== [FOUND] window.${name} ==========`);
    log(`typeof: ${typeof obj}`);
    log(`String: ${String(obj).substring(0,200)}`);

    try{
      let own = Object.getOwnPropertyNames(obj);
      log(`getOwnPropertyNames: [${own.join(", ")}]`);
    }catch(e){ log(`getOwnPropertyNames error: ${e}`); }

    try{
      let proto = Object.getOwnPropertyNames(Object.getPrototypeOf(obj));
      log(`getPrototypeOf: [${proto.join(", ")}]`);
    }catch(e){ log(`getPrototypeOf error: ${e}`); }

    try{
      let keys = [];
      for(let k in obj) keys.push(k);
      log(`for...in: [${keys.join(", ")}]`);
    }catch(e){ log(`for...in error: ${e}`); }

    // Cek apakah callable
    if(typeof obj === 'function'){
      log(`-> Ini FUNCTION, bisa dipanggil!`);
      try{
        // jangan panggil dengan data sensitif, cuma test kosong
        let r = obj.toString().substring(0,500);
        log(`func toString: ${r}`);
      }catch(e){}
    }

    // Cek property yang bahaya
    let dangerous = ["clipboard","keychain","privateKey","mnemonic","seed","keystore","file","open","export","secret","password","biometric"];
    dangerous.forEach(d=>{
      if(JSON.stringify(Object.getOwnPropertyNames(obj)).toLowerCase().includes(d)){
        log(`!!! POTENTIAL CRITICAL KEYWORD: ${d}!!!`);
      }
    });
  });

  // Cek global juga
  log("\n========== GLOBAL SCAN ==========");
  let all = Object.keys(window).filter(k=>k.includes("WALLET")||k.includes("BRIDGE")||k.includes("BLOFIN")||k.includes("CLIP"));
  log(`window keys containing WALLET/BRIDGE/BLOFIN/CLIP: [${all.join(", ")}]`);
}
</script>
</body>
</html>
