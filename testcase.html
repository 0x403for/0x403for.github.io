<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengujian Multi-Tab & Objek WebKit Kamera</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 25px;
            background-color: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        button {
            background-color: #34c759; /* Hijau menandakan kontrol aktif */
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            transition: background-color 0.2s;
        }
        .btn-stop {
            background-color: #ff3b30; /* Merah untuk mematikan */
        }
        .log-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #000000;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status-active { color: #30d158; }
        .status-inactive { color: #ff453a; }
        .status-info { color: #0a84ff; }
    </style>
</head>
<body>

<div class="container">
    <h3>Uji Sesi Kamera Multi-Tab</h3>
    <p style="font-size: 13px; color: #8e8e93;">Gunakan kode ini untuk menguji persistensi status izin antar-tab pada domain yang sama.</p>
    
    <button id="btnMulai">Aktifkan Kamera Depan</button>
    <button id="btnMatikan" class="btn-stop">Matikan Kamera Sekarang</button>
    
    <div id="logKonsol" class="log-box">
        <div class="status-info">[Sistem] Menunggu instruksi...</div>
    </div>
</div>

<script>
    const logKonsol = document.getElementById('logKonsol');
    let localStream = null;

    function cetakLog(teks, tipe) {
        const waktu = new Date().toLocaleTimeString();
        const elemen = document.createElement('div');
        elemen.className = tipe;
        elemen.textContent = `[${waktu}] ${teks}`;
        logKonsol.appendChild(elemen);
        logKonsol.scrollTop = logKonsol.scrollHeight;
    }

    // Fungsi untuk mengaktifkan kamera depan (Target: Objek WebKit)
    document.getElementById('btnMulai').addEventListener('click', async () => {
        cetakLog("Meminta akses objek WebKit media...", "status-info");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            cetakLog("Error: API Media tidak didukung di lingkungan ini.", "status-inactive");
            return;
        }

        // Konfigurasi constraints objek kamera untuk mengunci WebKit pada kamera depan
        const constraints = {
            audio: false, // Fokus hanya pada video/kamera
            video: {
                facingMode: "user", // Memaksa WebKit memilih kamera depan (Kamera Selfie)
                width: { ideal: 640 },
                height: { ideal: 480 }
            }
        };

        try {
            // Memicu aliran media
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            
            cetakLog("Sukses: Kamera Depan aktif.", "status-active");
            cetakLog(`Stream ID: ${localStream.id}`, "status-active");
            
            // Catatan: track.stop() TIDAK dipanggil di sini agar kamera tetap menyala 
            // untuk memantau indikator visual di bilah alamat browser.

        } catch (err) {
            cetakLog(`Gagal: ${err.name} - ${err.message}`, "status-inactive");
        }
    });

    // Fungsi untuk mematikan kamera secara manual pada tab saat ini
    document.getElementById('btnMatikan').addEventListener('click', () => {
        if (localStream) {
            localStream.getTracks().forEach(track => {
                track.stop();
                cetakLog(`Trek dihentikan: ${track.label}`, "status-info");
            });
            localStream = null;
            cetakLog("Kamera pada tab ini berhasil dimatikan.", "status-inactive");
        } else {
            cetakLog("Tidak ada kamera yang aktif di tab ini.", "status-info");
        }
    });
</script>

</body>
</html>
