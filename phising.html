<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp Pin Verification</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        input { font-size: 20px; letter-spacing: 10px; width: 150px; text-align: center; }
    </style>
</head>
<body>
    <h3>Input PIN (6-Digit)</h3>
    <input type="password" id="pin" maxlength="6" inputmode="numeric" pattern="[0-9]*">
    <button onclick="checkPin()">Verifikasi</button>
    <p id="result"></p>

    <script>
        // Dalam skenario nyata, jangan simpan PIN/Hash di JS. 
        // Gunakan Web Crypto API atau Keychain di perangkat.
        const STORED_HASH = "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92"; // Hash SHA-256 dari '123456'

        async function checkPin() {
            const pin = document.getElementById('pin').value;
            const encoder = new TextEncoder();
            const data = encoder.encode(pin);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashHex === STORED_HASH) {
                document.getElementById('result').innerText = "✅ PIN Benar! Akses diberikan.";
            } else {
                document.getElementById('result').innerText = "❌ PIN Salah!";
            }
        }
    </script>
</body>
</html>
