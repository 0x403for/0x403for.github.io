<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC: Automated Brute Force Attack</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #log { border: 1px solid #ccc; padding: 10px; margin-top: 10px; height: 200px; overflow-y: scroll; background: #f9f9f9; }
    </style>
</head>
<body>
    <h3>Laporan Bug: Keamanan PIN Lemah</h3>
    <p>Target PIN: <b>060403</b></p>
    <button id="btnAction" onclick="runAttack()">Mulai Uji Brute Force</button>
    <div id="log">Siap untuk pengujian...</div>

    <script>
        let encryptedData, salt, iv;
        const TARGET_PIN = "060403";

        // Setup: Menyiapkan data enkripsi dengan PIN Anda
        async function setup() {
            const enc = new TextEncoder();
            const secret = "0xPRIVATE_KEY_SECRET";
            salt = crypto.getRandomValues(new Uint8Array(8));
            iv = crypto.getRandomValues(new Uint8Array(12));
            
            const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(TARGET_PIN), "PBKDF2", false, ["deriveKey"]);
            const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: 1000, hash: "SHA-256"}, keyMaterial, {name: "AES-GCM", length: 256}, false, ["encrypt"]);
            
            encryptedData = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, enc.encode(secret));
            document.getElementById('log').innerText = "Data terenkripsi siap. Silakan klik tombol untuk memulai serangan.";
        }

        async function deriveKey(pin, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
            return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: 1000, hash: "SHA-256"}, keyMaterial, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
        }

        // Eksploitasi: Menebak PIN secara otomatis
        async function runAttack() {
            const log = document.getElementById('log');
            log.innerText = "Memulai serangan Brute Force...";

            for (let i = 0; i <= 999999; i++) {
                const pin = i.toString().padStart(6, '0');
                try {
                    const key = await deriveKey(pin, salt);
                    const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, encryptedData);
                    
                    log.innerHTML = `✅ <b>SUKSES! PIN ditemukan: ${pin}</b><br>Data didekripsi: ${new TextDecoder().decode(decrypted)}`;
                    return; 
                } catch(e) {
                    if (i % 500 === 0) log.innerText = `Sedang mencoba kombinasi PIN ke-${pin}...`;
                }
            }
        }

        setup();
    </script>
</body>
</html>
