<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blob Navigation Test - 0x403for</title>
</head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:15px">
<h2>STEP 2 - Test di 0x403for (Window Open)</h2>
<pre id=log></pre>
<button onclick="checkLeak()" style="padding:14px;width:100%;background:#0f0;color:#000;font-weight:bold;cursor:pointer">1. Check localStorage leak</button>
<button onclick="tryOpenBlob()" style="padding:14px;width:100%;background:#0f0;color:#000;font-weight:bold;margin-top:6px;cursor:pointer">2. TRY OPEN blob: via window.open()</button>

<script>
function log(t){
  let logEl = document.getElementById('log');
  logEl.textContent += '[' + new Date().toLocaleTimeString() + '] ' + t + '\n';
}

function checkLeak(){
  let b = localStorage.getItem('aqua_blob_url');
  if(!b) {
    log('[-] localStorage: aqua_blob_url tidak ditemukan.');
  } else {
    log('[+] Leak ditemukan: ' + b);
  }
}

function tryOpenBlob(){
  let blobUrl = localStorage.getItem('aqua_blob_url');
  if(!blobUrl){
    log('[-] Abort: Jalankan langkah 1 terlebih dahulu.');
    return;
  }
  
  log('[*] Membuka blob URL di jendela/tab baru: ' + blobUrl);
  try {
    let win = window.open(blobUrl, '_blank');
    if(!win) {
      log('[-] Pop-up diblokir oleh browser.');
    } else {
      log('[+] Jendela berhasil dibuka. Periksa apakah konten target (termasuk isi blob) berhasil dirender.');
    }
  } catch(e) {
    log('[-] ERROR: ' + e.message);
  }
}
</script>
</body>
</html>
