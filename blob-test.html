<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Link / Universal Link Test - Freighter</title>
</head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:15px">
<h2>Mobile DApp Browser Deep Link Test</h2>
<pre id=log></pre>

<button onclick="testCustomScheme()" style="padding:14px;width:100%;background:#0f0;color:#000;font-weight:bold;cursor:pointer">1. Test Custom Scheme Navigation</button>
<button onclick="testUniversalLink()" style="padding:14px;width:100%;background:#0f0;color:#000;font-weight:bold;margin-top:10px;cursor:pointer">2. Test Universal Link / Open DApp</button>

<script>
function log(t){
  let logEl = document.getElementById('log');
  let timeStr = new Date().toLocaleTimeString();
  logEl.textContent += '[' + timeStr + '] ' + t + '\n';
}

function testCustomScheme(){
  // Simulasi skema kustom aplikasi seluler untuk membuka dApp browser dengan parameter URL
  let customSchemeUrl = 'freighter://browser?url=https://0x403for.github.io/blob-test.html';
  log('[*] Memicu custom scheme: ' + customSchemeUrl);
  
  try {
    window.location.href = customSchemeUrl;
    setTimeout(() => {
      log('[?] Jika aplikasi tidak merespons, pastikan skema terdaftar pada perangkat.');
    }, 2000);
  } catch(e) {
    log('[-] Error: ' + e.message);
  }
}

function testUniversalLink(){
  // Simulasi Universal Link resmi untuk mengarahkan alur ke dalam aplikasi seluler
  let universalLinkUrl = 'https://wallet.freighter.app/browser?url=https://0x403for.github.io/blob-test.html';
  log('[*] Memicu Universal Link: ' + universalLinkUrl);
  
  try {
    window.location.href = universalLinkUrl;
  } catch(e) {
    log('[-] Error: ' + e.message);
  }
}
</script>
</body>
</html>
