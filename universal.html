<!DOCTYPE html>
<html>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h3>🧪 Testing Safe Payload</h3>
    <button onclick="sendSafe()">Kirim Perintah Halus</button>
    <div id="logs"></div>

    <script>
        function sendSafe() {
            const Bridge = window.OneInchiOSWallet;
            if (Bridge) {
                try {
                    // Kita kirim format JSON paling standar yang biasanya tidak bikin crash
                    const safePayload = JSON.stringify({
                        id: Date.now().toString(),
                        method: "eth_accounts", 
                        params: []
                    });
                    
                    Bridge.executeCallback("1", safePayload);
                    document.getElementById('logs').innerHTML = "> Perintah terkirim, cek apakah aplikasi tetap hidup...";
                } catch(e) {
                    alert("Error: " + e.message);
                }
            }
        }
    </script>
</body>
</html>
