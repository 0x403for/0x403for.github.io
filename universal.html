<!DOCTYPE html>
<html>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h3>📡 Memancing Data Dompet...</h3>
    <p>Setelah menekan tombol di bawah, silakan masuk ke menu dompet 1inch dan <b>ganti akun</b> atau <b>ganti network</b>.</p>
    
    <button onclick="startMonitor()" style="padding:10px; background:#0f0; border:none; font-weight:bold;">AKTIFKAN MONITOR</button>
    <div id="logs" style="margin-top:20px; border-top:1px solid #333;"></div>

    <script>
        function log(msg) {
            document.getElementById('logs').innerHTML += `> ${msg}<br>`;
        }

        function startMonitor() {
            log("Monitor diaktifkan...");
            
            // Kita coba mendaftarkan fungsi callback kita ke objek window
            // Berharap dompet akan memanggilnya saat terjadi perubahan akun
            window.ethereum = {
                on: function(event, callback) {
                    log("Mendeteksi pendaftaran event: " + event);
                    if (event === 'accountsChanged') {
                        // Jika dompet mengirim data, kita tangkap di sini
                        alert("DATA BOCOR! Cek logs.");
                        log("DATA: " + JSON.stringify(arguments));
                    }
                }
            };
            
            log("Menunggu interaksi user di dompet...");
        }
    </script>
</body>
</html>
