<!DOCTYPE html>
<html>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h3>Deep Inspect: OneInch Bridge</h3>
    <div id="logs"></div>

    <script>
        const log = (m, color="#0f0") => {
            document.getElementById('logs').innerHTML += `> <span style="color:${color}">${m}</span><br>`;
        };

        const targetName = "OneInchSolanaWallet"; // Coba satu per satu
        const bridge = window[targetName];

        if (bridge) {
            log(`Menganalisis Class: ${targetName}`, "yellow");

            // 1. Ambil semua fungsi Static (yang nempel langsung di Class)
            const staticProps = Object.getOwnPropertyNames(bridge);
            log("Static Methods ditemukan: " + staticProps.join(", "));

            // 2. Ambil fungsi dari Prototype (fungsi yang biasanya digunakan untuk interaksi)
            if (bridge.prototype) {
                const protoProps = Object.getOwnPropertyNames(bridge.prototype);
                log("Prototype Methods ditemukan: " + protoProps.join(", "), "cyan");
            }

            // 3. Tes apakah ada instance yang sudah jalan (Sangat Penting!)
            // Kadang 1inch menyuntikkan instance global, bukan cuma class
            log("Mencari instance aktif...");
            for (let key in window) {
                if (window[key] instanceof bridge) {
                    log(`DITEMUKAN INSTANCE AKTIF: window.${key}`, "red");
                }
            }
        } else {
            log("Bridge tidak ditemukan!", "red");
        }
    </script>
</body>
</html>
