<html>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Freighter Clipboard Check - BENIGN</title>
</head>
<body style="background:#000;color:#fff;font-family:monospace;padding:14px">
<p>Freighter iOS dApp Browser - Clipboard Check<br>(BENIGN, NO HIJACK)<br>Test di: 0x403for.github.io</p>
<hr>
<button id=w style="padding:12px;width:100%">Test Write (need click) → write TEST-0x403for</button>
<button id=r style="padding:12px;width:100%;margin-top:10px">Test Read (should prompt) → read clipboard</button>
<pre id=log style="background:#111;border:1px solid #333;padding:10px;white-space:pre-wrap;margin-top:12px">log:
</pre>
<script>
var logEl=document.getElementById('log');
function l(m){logEl.innerText+="\n"+m}
l("UserAgent: "+navigator.userAgent);
document.getElementById('w').onclick=async function(){
  l("\n[WRITE] clicked");
  try{
    await navigator.clipboard.writeText("TEST-0x403for");
    l("[WRITE] SUCCESS");
  }catch(e){ l("[WRITE] BLOCKED: "+e.message) }
};
document.getElementById('r').onclick=async function(){
  l("\n[READ] clicked");
  try{
    var t=await navigator.clipboard.readText();
    l("[READ] GOT: "+t);
  }catch(e){ l("[READ] BLOCKED/PROMPT: "+e.message) }
};
</script>
</body>
</html>
