<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Stabilitas Permintaan Izin</title>
</head>
<body>
    <h1>Uji Coba *Race Condition*</h1>
    <button id="test-btn" style="padding: 20px;">
        Tekan 3x dengan Cepat
    </button>

    <script>
        document.getElementById('test-btn').addEventListener('click', () => {
            // Memicu 3 permintaan kamera sekaligus dalam waktu bersamaan
            for(let i = 0; i < 3; i++) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => console.log("Permintaan " + i + " berhasil"))
                    .catch(err => console.error("Permintaan " + i + " gagal:", err));
            }
        });
    </script>
</body>
</html>
