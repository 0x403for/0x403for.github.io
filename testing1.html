<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1inch Hijack Test v7 - Deep Enumeration</title>
    <script>
        function log(msg, color = "black") {
            console.log("[1inch-v7] " + msg);
            const div = document.createElement('div');
            div.style.color = color;
            div.style.margin = "4px 0";
            div.style.fontFamily = "monospace";
            div.style.fontSize = "12px";
            div.style.wordBreak = "break-all";
            div.style.fontWeight = (color === "red" || color === "#d00") ? "bold" : "normal";
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.body.prepend(div);
        }

        // Fungsi untuk membongkar isi objek secara mendalam (mencari fungsi tersembunyi)
        function inspectObject(name, obj, depth = 0) {
            if (depth > 2 || !obj) return;
            try {
                for (let key in obj) {
                    try {
                        const val = obj[key];
                        const type = typeof val;
                        if (type === 'function') {
                            log(`[FUN] ${name}.${key}(...)`, "purple");
                            // Hook otomatis fungsi yang ditemukan
                            const orig = val;
                            obj[key] = function(...args) {
                                log(`🚨 CALLED ${name}.${key} -> Args: ${JSON.stringify(args)}`, "#d00");
                                return orig.apply(this, args);
                            };
                        } else if (type === 'object' && val !== null && depth < 1) {
                            // Jangan scan objek global bawaan yang terlalu besar/berbahaya
                            if (key !== 'window' && key !== 'document' && key !== 'parent') {
                                inspectObject(`${name}.${key}`, val, depth + 1);
                            }
                        }
                    } catch (e) {}
                }
            } catch (e) {}
        }

        function deepScan() {
            log("[+] Starting Deep Property Enumeration...", "blue");
            
            // Scan window properties yang mencurigakan
            for (let key in window) {
                try {
                    if (
                        key.toLowerCase().includes('webkit') || 
                        key.toLowerCase().includes('bridge') || 
                        key.toLowerCase().includes('native') || 
                        key.toLowerCase().includes('inch') || 
                        key.toLowerCase().includes('ethereum') ||
                        key.toLowerCase().includes('solana') ||
                        key.toLowerCase().includes('wallet')
                    ) {
                        log(`[!] Found target object: window.${key}`, "blue");
                        inspectObject(`window.${key}`, window[key], 0);
                    }
                } catch (e) {}
            }
        }

        // Intercept fungsi fetch & XMLHttpRequest (siapa tahu komunikasi dApp via API/RPC internal)
        function hookNetwork() {
            const origFetch = window.fetch;
            window.fetch = async function(...args) {
                const url = args[0];
                log(`[FETCH] ${url}`, "green");
                try {
                    const response = await origFetch.apply(this, args);
                    const clone = response.clone();
                    clone.text().then(text => {
                        if (text.includes("swap") || text.includes("transaction") || text.includes("eth_send")) {
                            log(`🚨 FETCH RESPONSE match: ${text.substring(0, 100)}...`, "#d00");
                        }
                    }).catch(()=>{});
                    return response;
                } catch (e) {
                    throw e;
                }
            };
        }

        window.onload = function() {
            log("1inch Full Coverage Test v7 Loaded");
            setTimeout(deepScan, 1000);
            hookNetwork();
        };
    </script>
</head>
<body style="padding:15px; font-family:Arial; background-color: #f9f9f9;">
    <h3 style="color: #111; margin-top:0;">1inch Hijack Test v7</h3>
    <p style="color: #555; font-size: 13px;">Deep scanning native objects & hooks...</p>
    <hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">
</body>
</html>
