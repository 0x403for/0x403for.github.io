<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch Wallet WebView Test PoC</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #fff; }
        button { padding: 12px 20px; margin: 10px 0; width: 100%; font-size: 16px; background: #007bff; border: none; border-radius: 8px; color: white; }
        button:hover { background: #0056b3; }
        pre { background: #16213e; padding: 15px; border-radius: 8px; overflow-x: auto; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🧪 1inch Wallet dApp Browser Test</h1>
    <p><strong>Untuk Security Research Only</strong> — Gunakan wallet testnet / kosong!</p>

    <button onclick="connectWallet()">1. Connect Wallet (eth_requestAccounts)</button>
    <button onclick="getAccount()">2. Get Current Account</button>
    <button onclick="sendTestTx()">3. Send Test Transaction (0.0001 ETH ke test address)</button>
    <button onclick="signMessage()">4. Sign Message</button>
    <button onclick="testBridge()">5. Test WebView Bridge / PostMessage</button>
    <button onclick="requestPermissions()">6. Request Permissions (jika ada)</button>

    <h2>Status & Log</h2>
    <pre id="log"></pre>

    <script>
        const logEl = document.getElementById('log');

        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<span style="color:${isError ? 'red' : 'lime'}">[${time}] ${msg}</span><br>`;
            console.log(msg);
        }

        async function connectWallet() {
            try {
                log("Meminta koneksi wallet...");
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                log("✅ Connected: " + accounts[0]);
            } catch (e) {
                log("❌ Error: " + e.message, true);
            }
        }

        async function getAccount() {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                log("Current account: " + (accounts[0] || "Tidak ada"));
            } catch (e) {
                log("Error: " + e.message, true);
            }
        }

        async function sendTestTx() {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (!accounts[0]) return log("Wallet belum connect", true);

                const tx = {
                    from: accounts[0],
                    to: "0x0000000000000000000000000000000000000000", // Ganti dengan test address milikmu
                    value: "0x16345785d8a0000", // ~0.0001 ETH
                    gas: "0x5208"
                };

                log("Mengirim test transaction...");
                const txHash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [tx] });
                log("✅ Transaction sent: " + txHash);
            } catch (e) {
                log("❌ " + e.message, true);
            }
        }

        async function signMessage() {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (!accounts[0]) return log("Wallet belum connect", true);

                const msg = "Test signature from 1inch WebView PoC - " + Date.now();
                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [msg, accounts[0]]
                });
                log("✅ Signature: " + signature);
            } catch (e) {
                log("❌ " + e.message, true);
            }
        }

        function testBridge() {
            log("Mengirim test message ke bridge...");
            window.postMessage({ type: "TEST_BRIDGE", data: "Hello from malicious dApp test" }, "*");
            
            // Test React Native WebView bridge (umum di RN wallets)
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ type: "TEST", payload: "Bridge injection test" }));
                log("✅ ReactNativeWebView bridge terdeteksi");
            } else {
                log("ReactNativeWebView tidak ditemukan");
            }
        }

        function requestPermissions() {
            log("Mencoba request permission...");
            // Contoh umum untuk camera/location (bisa test inheritance)
            if (navigator.mediaDevices) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(() => log("✅ Camera permission granted"))
                    .catch(e => log("Camera: " + e.message));
            }
        }

        // Listen events
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (acc) => log("Accounts changed: " + acc));
            window.ethereum.on('chainChanged', (chain) => log("Chain changed: " + chain));
            log("✅ window.ethereum terdeteksi");
        } else {
            log("window.ethereum tidak ditemukan", true);
        }

        console.log("%c1inch WebView Test PoC loaded", "color: cyan; font-size: 16px");
    </script>
</body>
</html>
