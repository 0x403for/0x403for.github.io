<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch Wallet Final Security Test</title>
    <style>
        body { font-family: Arial; background:#0a0a0f; color:#0f0; padding:20px; }
        button { padding:16px; margin:10px 0; width:100%; background:#0066ff; color:white; border:none; border-radius:8px; font-size:16px; }
        pre { background:#111; padding:15px; border-radius:8px; max-height:500px; overflow:auto; }
    </style>
</head>
<body>
    <h1>Final Security Test - 1inch dApp Browser</h1>

    <button onclick="runAllTests()">🚀 Jalankan Semua Test</button><br>
    <button onclick="testBridge()">Bridge & PostMessage Test</button>
    <button onclick="testTxTampering()">Transaction Tampering Test</button>
    <button onclick="testTypedSign()">Typed Data Sign Test</button>
    <button onclick="testPermissions()">Permission Leak Test</button>

    <h2>Log</h2>
    <pre id="log"></pre>

    <script>
        const logEl = document.getElementById('log');

        function log(msg, error=false) {
            const t = new Date().toLocaleTimeString();
            logEl.innerHTML += `<span style="color:${error?'#ff6666':'#66ff99'}">[${t}] ${msg}</span><br>`;
            console.log(msg);
        }

        async function runAllTests() {
            log("=== Starting Full Test Suite ===");
            if (window.ethereum) log("✅ Ethereum provider detected");
            await testBridge();
            await testTxTampering();
        }

        async function testBridge() {
            log("Testing Bridge...");
            window.postMessage({type: "1INCH_TEST", payload: "Bridge injection test"}, "*");
            
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage("RN Bridge Test");
                log("✅ ReactNativeWebView bridge ditemukan!");
            } else {
                log("ReactNativeWebView tidak terdeteksi (bagus)");
            }
        }

        async function testTxTampering() {
            try {
                const accounts = await ethereum.request({method: 'eth_accounts'});
                log("Account: " + accounts[0].slice(0,10) + "...");

                const tx = {
                    from: accounts[0],
                    to: "0x000000000000000000000000000000000000dead",
                    value: "0x0", 
                    data: "0x" // bisa dicoba calldata berbahaya di sini
                };

                log("Mengirim TX dengan parameter suspicious...");
                const hash = await ethereum.request({method: 'eth_sendTransaction', params: [tx]});
                log("Hash: " + hash);
            } catch (e) {
                log("TX ditolak: " + e.message, true);
            }
        }

        async function testTypedSign() {
            try {
                const accounts = await ethereum.request({method: 'eth_accounts'});
                const domain = { name: "Test", version: "1", chainId: "0x1" };
                const types = { Test: [{name: "data", type: "string"}] };
                const value = { data: "Malicious typed data test" };

                const sig = await ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [accounts[0], JSON.stringify({domain, types, primaryType: "Test", value})]
                });
                log("✅ Typed sign berhasil");
            } catch(e) {
                log("Typed sign: " + e.message, true);
            }
        }

        async function testPermissions() {
            log("Mencoba akses camera & location...");
            try {
                await navigator.mediaDevices.getUserMedia({video: true});
                log("Camera permission lolos!");
            } catch(e) { log("Camera: " + e.message); }
        }
    </script>
</body>
</html>
