<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp Browser Isolation & Storage Audit PoC</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0f19; color: #f1f5f9; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; font-weight: 600; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        pre { background: #050b14; padding: 15px; border-radius: 6px; overflow-x: auto; color: #34d399; font-family: monospace; font-size: 13px; border: 1px solid #1e293b; max-height: 250px; }
    </style>
</head>
<body>

<div class="container">
    <h2>dApp Browser Storage Isolation Test</h2>
    <p style="font-size: 13px; color: #94a3b8;">Alat uji ini memeriksa apakah penyimpanan lokal terisolasi dengan benar berdasarkan domain (Origin Policy) di dalam dApp browser.</p>
    
    <div class="form-group">
        <label>Nilai Token / Data Sensitif Simulasi:</label>
        <input type="text" id="testDataInput" value="SENSITIF_SESSION_TOKEN_XYZ_123">
    </div>

    <button onclick="injectTestData()">1. Tulis Data ke Storage dApp Ini</button>
    <button onclick="checkTestData()">2. Periksa Keberadaan Data (Audit)</button>
    <button onclick="clearTestData()" class="btn-danger">3. Bersihkan Data Uji</button>

    <h3>Log Hasil Audit Isolasi:</h3>
    <pre id="logOutput">Menunggu tindakan pengujian...</pre>
</div>

<script>
    const logOutput = document.getElementById("logOutput");
    const STORAGE_KEY = "dapp_isolation_test_marker";

    function log(message) {
        logOutput.innerText += "\n> " + message;
        logOutput.scrollTop = logOutput.scrollHeight;
    }

    function injectTestData() {
        const val = document.getElementById("testDataInput").value;
        try {
            localStorage.setItem(STORAGE_KEY, val);
            sessionStorage.setItem(STORAGE_KEY, "session_" + val);
            log(`[BERHASIL] Data uji berhasil disuntikkan ke Local & Session Storage domain ini (${window.location.origin}).`);
            log(`Origin saat ini: ${window.location.origin}`);
        } catch (e) {
            log("[GAGAL] Tidak dapat menulis ke storage: " + e.message);
        }
    }

    function checkTestData() {
        logOutput.innerText = "Memeriksa status penyimpanan...";
        const localVal = localStorage.getItem(STORAGE_KEY);
        const sessionVal = sessionStorage.getItem(STORAGE_KEY);

        log(`Origin yang diperiksa: ${window.location.origin}`);
        
        if (localVal) {
            log(`[INFO] Ditemukan data di localStorage: "${localVal}"`);
        } else {
            log(`[AMAN / BERSIH] Tidak ada data uji tersisa di localStorage domain ini.`);
        }

        if (sessionVal) {
            log(`[INFO] Ditemukan data di sessionStorage: "${sessionVal}"`);
        } else {
            log(`[AMAN / BERSIH] Tidak ada data uji tersisa di sessionStorage domain ini.`);
        }
    }

    function clearTestData() {
        localStorage.removeItem(STORAGE_KEY);
        sessionStorage.removeItem(STORAGE_KEY);
        log("[INFO] Data uji pada storage domain ini telah dihapus.");
    }
</script>

</body>
</html>
