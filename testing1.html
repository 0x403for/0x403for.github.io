<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History & Storage Auditor</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
        .audit-box { border: 1px solid #333; padding: 20px; margin-top: 20px; background: #000; word-break: break-all; max-height: 400px; overflow-y: auto; }
        button { padding: 10px 15px; cursor: pointer; background: #333; color: #00ff00; border: 1px solid #00ff00; font-family: monospace; margin-right: 5px; margin-top: 10px; }
        button:hover { background: #00ff00; color: #000; }
        input[type="text"] { padding: 8px; width: 100%; margin-top: 10px; background: #111; border: 1px solid #333; color: #00ff00; font-family: monospace; box-sizing: border-box; }
        .section-title { color: #ffff00; margin-top: 15px; }
        .tx-highlight { border-left: 3px solid #ff5555; padding-left: 10px; margin: 10px 0; background: #110000; }
    </style>
</head>
<body>

    <h3>Transaction History & Storage Auditor</h3>
    <p>Alat bantu untuk mendeteksi rekaman riwayat transaksi, data penyimpanan, dan kuki pada origin saat ini.</p>
    
    <input type="text" id="filterInput" placeholder="Cari berdasarkan kata kunci (tx, hash, history, dll)..." onkeyup="filterResults()">
    <br>
    <button onclick="runAudit()">Jalankan Audit Riwayat & Storage</button>
    <button onclick="exportData()">Ekspor Bukti (JSON)</button>
    <button onclick="clearStorage()" style="color: #ff5555; border-color: #ff5555;">Bersihkan Storage</button>

    <div id="auditResult" class="audit-box">Hasil audit akan muncul di sini...</div>

    <script>
        let latestData = { origin: window.location.origin, potentialTransactions: [], localStorage: {}, sessionStorage: {}, cookies: {} };

        function runAudit() {
            latestData.potentialTransactions = [];
            latestData.localStorage = {};
            latestData.sessionStorage = {};
            latestData.cookies = {};
            
            let report = `<strong>[+] Audit Report - Origin: ${window.location.origin}</strong><br>`;
            
            // 1. Periksa LocalStorage & Deteksi Riwayat Transaksi
            report += `<div class='section-title'>--- LocalStorage & Potential Transaction Data ---</div>`;
            if (localStorage.length === 0) {
                report += "<span>LocalStorage Kosong.</span><br>";
            } else {
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    let val = localStorage.getItem(key);
                    latestData.localStorage[key] = val;
                    
                    let isTxRelated = checkIfTransactionData(key, val);
                    let entryClass = isTxRelated ? "item-entry tx-highlight" : "item-entry";
                    let badge = isTxRelated ? " <span style='color: #ff5555;'>[POTENSI DATA TRANSAKSI]</span>" : "";
                    
                    if (isTxRelated) {
                        latestData.potentialTransactions.push({ source: 'localStorage', key: key, value: val });
                    }

                    report += `<div class="${entryClass}" data-key="${escapeHtml(key)}"><b>Key:</b> ${escapeHtml(key)}${badge}<br><b>Value:</b> <code>${escapeHtml(val)}</code><br><hr style="border-color: #222;"></div>`;
                }
            }

            // 2. Periksa SessionStorage
            report += `<div class='section-title---'>--- SessionStorage ---</div>`;
            if (sessionStorage.length === 0) {
                report += "<span>SessionStorage Kosong.</span><br>";
            } else {
                for (let i = 0; i < sessionStorage.length; i++) {
                    let key = sessionStorage.key(i);
                    let val = sessionStorage.getItem(key);
                    latestData.sessionStorage[key] = val;

                    let isTxRelated = checkIfTransactionData(key, val);
                    let entryClass = isTxRelated ? "item-entry tx-highlight" : "item-entry";
                    let badge = isTxRelated ? " <span style='color: #ff5555;'>[POTENSI DATA TRANSAKSI]</span>" : "";

                    if (isTxRelated) {
                        latestData.potentialTransactions.push({ source: 'sessionStorage', key: key, value: val });
                    }

                    report += `<div class="${entryClass}" data-key="${escapeHtml(key)}"><b>Key:</b> ${escapeHtml(key)}${badge}<br><b>Value:</b> <code>${escapeHtml(val)}</code><br><hr style="border-color: #222;"></div>`;
                }
            }

            // 3. Periksa Cookies
            report += `<div class='section-title'>--- Cookies ---</div>`;
            let cookieArr = document.cookie ? document.cookie.split(';') : [];
            if (cookieArr.length === 0 || document.cookie === "") {
                report += "<span>Cookies Kosong.</span><br>";
            } else {
                cookieArr.forEach(cookie => {
                    let parts = cookie.trim().split('=');
                    let name = parts[0];
                    let val = parts.slice(1).join('=');
                    latestData.cookies[name] = val;
                    report += `<div class="item-entry" data-key="${escapeHtml(name)}"><b>Cookie:</b> ${escapeHtml(name)} <br><b>Value:</b> <code>${escapeHtml(val)}</code><br><hr style="border-color: #222;"></div>`;
                });
            }

            document.getElementById('auditResult').innerHTML = report;
        }

        // Fungsi pembantu untuk mendeteksi apakah isi storage mencakup riwayat/hash transaksi
        function checkIfTransactionData(key, val) {
            let keywords = ['tx', 'transaction', 'history', 'hash', 'transfer', 'nonce', 'block'];
            let lowerKey = key.toLowerCase();
            let lowerVal = String(val).toLowerCase();

            // Cek apakah key atau value mengandung indikasi riwayat transaksi/hash
            for (let kw of keywords) {
                if (lowerKey.includes(kw) || lowerVal.includes('0x') && lowerVal.length > 30) {
                    return true;
                }
            }
            return false;
        }

        function filterResults() {
            let filter = document.getElementById('filterInput').value.toLowerCase();
            let entries = document.getElementsByClassName('item-entry');
            for (let i = 0; i < entries.length; i++) {
                let keyAttr = entries[i].getAttribute('data-key').toLowerCase();
                if (keyAttr.includes(filter)) {
                    entries[i].style.display = "";
                } else {
                    entries[i].style.display = "none";
                }
            }
        }

        function exportData() {
            runAudit();
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(latestData, null, 4));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "transaction_storage_evidence.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function clearStorage() {
            if (confirm("Hapus semua data storage di origin ini?")) {
                localStorage.clear();
                sessionStorage.clear();
                runAudit();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
