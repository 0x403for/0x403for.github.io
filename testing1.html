<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch WalletConnect Test</title>
    <script src="https://unpkg.com/@walletconnect/modal@2.6.2/dist/index.min.js"></script>
    <style>
        body { font-family: Arial; background:#111; color:#0f0; padding:20px; text-align:center; }
        button { padding:18px; margin:15px 0; width:90%; background:#0066ff; color:white; border:none; border-radius:10px; font-size:17px; }
        pre { text-align:left; background:#1a1a2e; padding:15px; border-radius:8px; margin-top:20px; }
    </style>
</head>
<body>
    <h1>WalletConnect Test - 1inch</h1>
    <button onclick="connectWC()">🔗 Connect via WalletConnect</button>
    <button onclick="signMessage()">✍️ Sign Message</button>
    <button onclick="sendTestTx()">💸 Send Test TX</button>

    <pre id="log"></pre>

    <script>
        let web3Modal, provider;

        async function connectWC() {
            try {
                web3Modal = new window.Web3Modal.default({
                    projectId: "d59f98058a72a02f7ea2c489bc97f899",
                    chains: [1],
                    themeMode: "dark"
                });

                provider = await web3Modal.connect();
                log("✅ WalletConnect Connected!");
                console.log(provider);
            } catch (e) {
                log("Error Connect: " + e.message);
            }
        }

        async function signMessage() {
            if (!provider) return log("Connect dulu!");
            try {
                const signer = provider.getSigner ? provider.getSigner() : provider;
                const sig = await signer.signMessage("Test sign WalletConnect - " + Date.now());
                log("✅ Signature OK!");
            } catch (e) {
                log("Sign Error: " + e.message);
            }
        }

        async function sendTestTx() {
            if (!provider) return log("Connect dulu!");
            try {
                const signer = provider.getSigner ? provider.getSigner() : provider;
                const tx = await signer.sendTransaction({
                    to: "0x0000000000000000000000000000000000000000",
                    value: "0x16345785d8a0000"
                });
                log("✅ TX Sent!");
            } catch (e) {
                log("TX Error: " + e.message);
            }
        }

        function log(msg) {
            document.getElementById('log').innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        }
    </script>
</body>
</html>
