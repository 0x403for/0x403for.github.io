<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1inch Tester v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #111;
      color: #eee;
      padding: 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    h1 { font-size: 18px; margin-bottom: 6px; }
    .status {
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      border: 1px solid #334155;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      margin: 4px 4px 8px 0;
      font-weight: 600;
      width: 100%;
      max-width: 320px;
    }
    button:active { opacity: 0.75; }
    button.red { background: #dc2626; }
    button.green { background: #16a34a; }
    pre, #log {
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 280px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .warn { color: #fbbf24; }
    .section { margin: 18px 0 8px; color: #7dd3fc; font-weight: 600; }
  </style>
</head>
<body>

  <h1>1inch iOS Tester v2</h1>
  <div class="status" id="status">
    Status: Menunggu JavaScript...
  </div>

  <button onclick="forceLog()" class="green">1. Force Log / Cek JS</button>
  <button onclick="detect()">2. Scan Provider</button>
  <button onclick="getAccounts()">3. eth_accounts</button>
  <button onclick="requestAccounts()">4. eth_requestAccounts</button>
  <button onclick="getChainId()">5. eth_chainId</button>
  <button onclick="personalSign()">6. personal_sign</button>
  <button onclick="clearLog()" class="red">Clear Log</button>

  <div class="section">Hasil / Log:</div>
  <div id="log">Belum ada log...</div>

  <script>
    // ========== LOGGING AMAN ==========
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    function log(msg, type = 'info') {
      try {
        const time = new Date().toLocaleTimeString();
        let color = '#94a3b8';
        if (type === 'ok') color = '#4ade80';
        if (type === 'err') color = '#f87171';
        if (type === 'warn') color = '#fbbf24';

        const div = document.createElement('div');
        div.style.color = color;
        div.style.marginBottom = '4px';
        div.style.borderBottom = '1px solid #222';
        div.style.paddingBottom = '3px';
        div.textContent = `[${time}] ${msg}`;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
      } catch (e) {
        // kalau bahkan log gagal, pakai alert
        alert('Log error: ' + e.message);
      }
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = 'Status: ' + text;
      statusEl.style.borderColor = isError ? '#dc2626' : '#334155';
    }

    function clearLog() {
      logEl.innerHTML = '';
      log('Log dibersihkan', 'warn');
    }

    // ========== FUNGSI UTAMA ==========
    function forceLog() {
      log('=== FORCE LOG BERHASIL ===', 'ok');
      log('User Agent: ' + navigator.userAgent);
      log('Location: ' + location.href);
      log('window.ethereum exists? → ' + !!window.ethereum);
      log('typeof window.ethereum → ' + typeof window.ethereum);

      if (window.ethereum) {
        log('isMetaMask: ' + window.ethereum.isMetaMask);
        log('isOneInchIOSWallet: ' + window.ethereum.isOneInchIOSWallet);
      }

      setStatus('JavaScript berjalan normal');
    }

    function detect() {
      try {
        log('Mulai scan provider...', 'warn');
        const eth = window.ethereum;

        if (!eth) {
          log('❌ window.ethereum TIDAK ADA', 'err');
          setStatus('Tidak ada provider', true);
          return;
        }

        const info = {
          isMetaMask: eth.isMetaMask,
          isOneInchIOSWallet: eth.isOneInchIOSWallet,
          isOneInchAndroidWallet: eth.isOneInchAndroidWallet,
          is1inch: eth.is1inch,
          chainId: eth.chainId,
          selectedAddress: eth.selectedAddress,
          hasRequest: typeof eth.request === 'function',
          hasOn: typeof eth.on === 'function',
          keys: Object.keys(eth).slice(0, 20) // ambil 20 key dulu
        };

        log(JSON.stringify(info, null, 2), 'ok');
        setStatus('Provider ditemukan');
      } catch (e) {
        log('Error di detect(): ' + e.message, 'err');
        setStatus('Error: ' + e.message, true);
      }
    }

    async function getAccounts() {
      try {
        log('Memanggil eth_accounts...', 'warn');
        if (!window.ethereum) throw new Error('ethereum tidak ada');
        const res = await window.ethereum.request({ method: 'eth_accounts' });
        log('eth_accounts → ' + JSON.stringify(res), 'ok');
      } catch (e) {
        log('eth_accounts ERROR: ' + e.message, 'err');
      }
    }

    async function requestAccounts() {
      try {
        log('Memanggil eth_requestAccounts...', 'warn');
        if (!window.ethereum) throw new Error('ethereum tidak ada');
        const res = await window.ethereum.request({ method: 'eth_requestAccounts' });
        log('eth_requestAccounts → ' + JSON.stringify(res), 'ok');
      } catch (e) {
        log('eth_requestAccounts ERROR: ' + e.message, 'err');
      }
    }

    async function getChainId() {
      try {
        log('Memanggil eth_chainId...', 'warn');
        if (!window.ethereum) throw new Error('ethereum tidak ada');
        const res = await window.ethereum.request({ method: 'eth_chainId' });
        log('eth_chainId → ' + res + ' (decimal: ' + parseInt(res, 16) + ')', 'ok');
      } catch (e) {
        log('eth_chainId ERROR: ' + e.message, 'err');
      }
    }

    async function personalSign() {
      try {
        log('Memanggil personal_sign...', 'warn');
        if (!window.ethereum) throw new Error('ethereum tidak ada');

        const accounts = await window.ethereum.request({ method: 'eth_accounts' });
        if (!accounts || !accounts[0]) throw new Error('Tidak ada akun terhubung');

        const msg = 'Test dari 1inch tester ' + Date.now();
        const hex = '0x' + Array.from(new TextEncoder().encode(msg))
          .map(b => b.toString(16).padStart(2, '0')).join('');

        const sig = await window.ethereum.request({
          method: 'personal_sign',
          params: [hex, accounts[0]]
        });

        log('personal_sign BERHASIL', 'ok');
        log('Signature: ' + sig, 'ok');
      } catch (e) {
        log('personal_sign ERROR: ' + e.message, 'err');
      }
    }

    // ========== AUTO START ==========
    try {
      setStatus('JavaScript loaded');
      log('Halaman berhasil dimuat', 'ok');
      log('Waktu: ' + new Date().toLocaleString());
      log('Jika kamu melihat ini, berarti JS berjalan.', 'ok');

      // Coba deteksi otomatis setelah 500ms
      setTimeout(() => {
        forceLog();
      }, 500);
    } catch (e) {
      setStatus('Gagal load JS: ' + e.message, true);
      alert('Critical error: ' + e.message);
    }
  </script>
</body>
</html>
