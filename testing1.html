<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch dApp Swap Vulnerability Scanner (PoC)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; }
        button { background: #0284c7; color: white; border: none; padding: 10px 15px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0369a1; }
        pre { background: #090d16; padding: 10px; border-radius: 5px; overflow-x: auto; color: #34d399; }
        .warning { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>1inch dApp Security Auditing Tool</h2>
    <p>Alat ini mendeteksi potensi kerentanan <span class="warning">Unlimited Token Allowance</span> dan malfungsi parameter payload pada dApp browser wallet.</p>
    
    <button onclick="checkWalletConnection()">1. Hubungkan Wallet</button>
    <button onclick="testSwapAllowanceRisk()">2. Audit Celah Approval Swap</button>

    <h3>Log Aktivitas & Indikator Celah:</h3>
    <pre id="logOutput">Menunggu tindakan...</pre>
</div>

<!-- Memuat pustaka Ethers.js untuk interaksi Web3 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script>
    const logOutput = document.getElementById("logOutput");

    function log(message) {
        logOutput.innerText += "\n> " + message;
    }

    async function checkWalletConnection() {
        if (typeof window.ethereum === "undefined") {
            log("Kesalahan: Browser Wallet (MetaMask/1inch Wallet) tidak terdeteksi!");
            return;
        }
        try {
            const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            log("Wallet terhubung: " + accounts[0]);
        } catch (error) {
            log("Koneksi ditolak oleh pengguna: " + error.message);
        }
    }

    async function testSwapAllowanceRisk() {
        if (typeof window.ethereum === "undefined") {
            log("Kesalahan: Harap hubungkan wallet terlebih dahulu.");
            return;
        }

        log("Memulai analisis parameter router 1inch...");
        
        // Contoh alamat Router Aggregator 1inch yang sah di Ethereum Mainnet
        const ONEINCH_ROUTER = "-"; 
        
        // Simulasi pemeriksaan payload data swap yang mencurigakan (rentan terhadap parameter tampering)
        const sampleSwapPayload = {
            fromTokenAddress: "0x1111111111111111111111111111111111111111", // Contoh token dummy
            toTokenAddress: "0x0000000000000000000000000000000000000000",
            amount: "1000000000000000000",
            // Kerentanan umum: Allowance diset tak terbatas (Max Uint256) alih-alih pasak nominal swap
            requestedAllowance: "115792089237316195423570985008687907853269984665640564039457584007913129639935" 
        };

        if (BigInt(sampleSwapPayload.requestedAllowance) === BigInt("115792089237316195423570985008687907853269984665640564039457584007913129639935")) {
            log("[PERINGATAN KRITIS] Terdeteksi permintaan Unlimited Allowance! Risiko celah token drainer aktif jika dApp tidak membatasi kuota router.");
        } else {
            log("[AMAN] Allowance dibatasi sesuai nominal transaksi.");
        }
    }
</script>

</body>
</html>
