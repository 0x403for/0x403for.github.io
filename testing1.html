
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1inch Hijack Test v8 - OneInchIOSWallet Hook</title>
    <script>
        function log(msg, color = "black") {
            console.log("[1inch-v8] " + msg);
            const div = document.createElement('div');
            div.style.color = color;
            div.style.margin = "4px 0";
            div.style.fontFamily = "monospace";
            div.style.fontSize = "12px";
            div.style.wordBreak = "break-all";
            div.style.fontWeight = (color === "red" || color === "#d00") ? "bold" : "normal";
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.body.prepend(div);
        }

        function hookWalletBridge(walletObjName) {
            const walletObj = window[walletObjName];
            if (!walletObj) return;

            log(`[+] Found & hooking target: window.${walletObjName}`, "blue");

            // Loop semua properti/metode di dalam objek bridge tersebut
            for (let key in walletObj) {
                try {
                    const val = walletObj[key];
                    if (typeof val === 'function') {
                        log(`[FUN] ${walletObjName}.${key}(...)`, "purple");
                        const originalMethod = val;
                        walletObj[key] = function(...args) {
                            log(`🚨 INTERCEPTED ${walletObjName}.${key} -> Args: ${JSON.stringify(args)}`, "#d00");
                            return originalMethod.apply(this, args);
                        };
                    }
                } catch (e) {}
            }

            // Jika objek itu sendiri adalah fungsi atau punya mekanisme postMessage/send
            if (typeof walletObj === 'function') {
                log(`[!] window.${walletObjName} is a function itself!`, "red");
            }
        }

        function runHooks() {
            log("[+] Initializing OneInch Bridge Hooking...", "blue");
            hookWalletBridge('OneInchIOSWallet');
            hookWalletBridge('OneInchSolanaWallet');

            // Jaga-jaga jika objeknya dimuat secara asynchronous
            setTimeout(() => {
                hookWalletBridge('OneInchIOSWallet');
                hookWalletBridge('OneInchSolanaWallet');
            }, 1500);
        }

        window.onload = function() {
            log("1inch Full Coverage Test v8 Loaded");
            setTimeout(runHooks, 500);
        };
    </script>
</head>
<body style="padding:15px; font-family:Arial; background-color: #f9f9f9;">
    <h3 style="color: #111; margin-top:0;">1inch Hijack Test v8</h3>
    <p style="color: #555; font-size: 13px;">Targeting window.OneInchIOSWallet...</p>
    <hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">
</body>
</html>
