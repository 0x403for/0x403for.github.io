<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch DApp Browser - Real Transaction & Storage Auditor</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: monospace;
            padding: 20px;
        }
        h2 {
            color: #39d353;
        }
        p {
            color: #8b949e;
        }
        .input-box {
            width: 100%;
            max-width: 600px;
            height: 80px;
            background-color: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: #fff;
            padding: 10px 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-right: 5px;
            margin-bottom: 10px;
            text-align: center;
        }
        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .report-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #c9d1d9;
        }
    </style>
</head>
<body>

    <h2>1inch DApp Browser - Real Transaction & Storage Auditor</h2>
    <p>Alat pengujian nyata untuk mendeteksi interaksi dompet, parameter transaksi aktif, dan rekam jejak LocalStorage pada DApp browser.</p>

    <textarea id="targetInput" class="input-box" placeholder="Tempel URL Etherscan atau Hash transaksi nyata di sini..."></textarea>
    
    <div>
        <button class="btn" onclick="hubungkanDompet()">1. Hubungkan / Deteksi Provider Web3</button>
        <button class="btn" onclick="jalankanAuditNyata()">2. Jalankan Audit Riwayat & Storage Nyata</button>
        <button class="btn btn-secondary" onclick="eksporJSON()">Ekspor Bukti (JSON)</button>
    </div>

    <div id="reportOutput" class="report-box">
[+] Siap melakukan audit nyata. Klik tombol di atas untuk memulai...
    </div>

    <script>
        let providerInfo = "Belum terhubung ke provider web3.";

        async function hubungkanDompet() {
            const output = document.getElementById('reportOutput');
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                    providerInfo = `[+] Provider Web3 Terdeteksi!\n- Akun Aktif: ${accounts[0]}\n- Chain ID: ${chainId}`;
                    output.innerText = providerInfo;
                } catch (error) {
                    output.innerText = `[-] Gagal terhubung ke dompet: ${error.message}`;
                }
            } else {
                providerInfo = "[-] Tidak ada objek window.ethereum yang terdeteksi di lingkungan DApp browser ini.";
                output.innerText = providerInfo;
            }
        }

        function jalankanAuditNyata() {
            const inputVal = document.getElementById('targetInput').value.trim();
            const origin = window.location.origin;
            
            let storageData = "";
            
            // Membaca LocalStorage asli secara aktual tanpa data tiruan/dummy
            if (localStorage.length === 0) {
                storageData = "LocalStorage pada origin ini kosong.\n";
            } else {
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    let val = localStorage.getItem(key);
                    storageData += `Key: ${key}\nValue: ${val}\n\n`;
                }
            }

            let report = `${providerInfo}\n\n`;
            report += `[+] Real Audit Report - Origin: ${origin}\n`;
            if(inputVal) {
                report += `[+] Input Hash / URL Target: ${inputVal}\n\n`;
            }
            report += `--- LocalStorage Aktif ---\n${storageData}`;
            report += `--- SessionStorage Aktif ---\n`;
            report += sessionStorage.length === 0 ? "SessionStorage Kosong.\n\n" : "Ada data di SessionStorage.\n\n";
            report += `--- Cookies Aktif ---\n`;
            report += document.cookie ? document.cookie : "Cookies Kosong.";

            document.getElementById('reportOutput').innerText = report;
        }

        function eksporJSON() {
            const data = {
                origin: window.location.origin,
                localStorage: { ...localStorage },
                sessionStorage: { ...sessionStorage },
                cookie: document.cookie,
                timestamp: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'real-audit-report.json';
            a.click();
        }
    </script>
</body>
</html>
