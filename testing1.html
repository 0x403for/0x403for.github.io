<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(180deg, #5B21B6 0%, #4C1D95 100%);
            color: white;
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
        }
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .balance-section {
            text-align: center;
            padding: 30px 20px;
        }
        .balance {
            font-size: 52px;
            font-weight: 700;
            margin: 10px 0;
        }
        .content {
            background: #111;
            flex: 1;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            min-height: 60vh;
        }
        button {
            padding: 14px;
            border-radius: 9999px;
            font-weight: 600;
            width: 100%;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>☰</div>
        <div id="walletName">1 Wallet</div>
        <div>⚙️</div>
    </div>

    <div class="balance-section">
        <div id="walletLabel">Terhubung</div>
        <div class="balance" id="usdBalance">$0.00</div>
        <div id="ethBalance">0.0000 ETH</div>
    </div>

    <div class="content">
        <button onclick="switchToMainnet()">Ganti ke Ethereum Mainnet</button>
        <button onclick="refreshData()">Refresh Saldo</button>
        <button onclick="disconnect()">Putuskan Koneksi</button>
    </div>

    <script>
        let web3, account;

        async function connectWallet() {
            if (!window.ethereum) return alert("Buka di DApp Browser");

            web3 = new Web3(window.ethereum);
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            account = accounts[0];

            document.getElementById('walletName').textContent = "Connected Wallet";
            refreshData();
        }

        async function refreshData() {
            if (!account) {
                await connectWallet();
                return;
            }

            // Ambil saldo ETH
            const balanceWei = await web3.eth.getBalance(account);
            const eth = parseFloat(web3.utils.fromWei(balanceWei, 'ether'));
            
            document.getElementById('ethBalance').textContent = eth.toFixed(6) + " ETH";

            // Estimasi USD (harga ETH approx)
            const usd = (eth * 1880).toFixed(2);   // approx price
            document.getElementById('usdBalance').textContent = "$" + usd;
        }

        async function switchToMainnet() {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: '0x1' }]
                });
                setTimeout(refreshData, 2000);
            } catch (e) {
                alert("Gagal switch network. Coba manual di wallet.");
            }
        }

        function disconnect() {
            location.reload();
        }

        // Mulai otomatis
        window.onload = () => {
            if (window.ethereum) connectWallet();
        };
    </script>
</body>
</html>
