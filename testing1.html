<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch Swap Aggregator - Connect Wallet</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin:0; padding:0; background:#0a0a0a; color:#fff; text-align:center; 
        }
        .container { max-width: 480px; margin: 40px auto; padding: 20px; }
        button { 
            width: 100%; padding: 18px; font-size: 18px; 
            background: linear-gradient(90deg, #00ff9d, #00cc7a); 
            color: #000; border: none; border-radius: 12px; 
            font-weight: bold; margin: 15px 0; cursor: pointer; 
        }
        .status { margin: 20px 0; padding: 15px; background: #1a1a1a; border-radius: 8px; }
        .audit-box { 
            margin: 30px 10px; padding: 15px; background: #000; 
            border: 1px solid #333; text-align: left; font-family: monospace; 
            font-size: 14px; color: #00ff00; overflow: auto; max-height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 1inch Swap</h1>
        <p>Best rates • Multi-chain</p>
        
        <div class="status" id="status">Menunggu koneksi wallet...</div>
        
        <button onclick="connectWallet()">Connect Wallet</button>
        <button onclick="modifyProfile()">Update Profile (Test Sensitive Data)</button>
        <button onclick="runAudit()">🔍 Jalankan Audit Storage</button>
        
        <p style="margin-top:20px; font-size:14px; opacity:0.7;">
            Test ini mencoba memodifikasi data profil & storage di 1inch Wallet Browser
        </p>

        <div id="auditResult" class="audit-box">Hasil audit akan muncul di sini setelah klik tombol Audit...</div>
    </div>

    <script>
        const status = document.getElementById('status');
        const auditResult = document.getElementById('auditResult');

        function logToConsole(msg) {
            console.log('[1inch Malicious Test]', msg);
        }

        function connectWallet() {
            status.innerHTML = '✅ Wallet Connected!<br><small>Mengakses storage context...</small>';
            logToConsole('Simulasi connect wallet berhasil');
            
            try {
                localStorage.setItem('user_email', 'victim_modified@evil.com');
                localStorage.setItem('user_phone', '+6281234567890');
                localStorage.setItem('user_name', 'Hacked User');
                localStorage.setItem('notification_settings', JSON.stringify({ email: true, push: true, marketing: true }));
                localStorage.setItem('profile_updated', new Date().toISOString());
                localStorage.setItem('wallet_preference', 'malicious_default');
                localStorage.setItem('wallet_address', '0xInjectedByAttacker123456789');
                
                status.innerHTML += '<br><strong style="color:#ff0">Storage berhasil dimodifikasi!</strong>';
            } catch(e) {
                status.innerHTML += '<br><strong style="color:red">Gagal: ' + e.message + '</strong>';
            }
        }

        function modifyProfile() {
            status.innerHTML = 'Mengubah detail profil pengguna...';
            try {
                const sensitiveData = {
                    fullName: "Attacker Controlled",
                    email: "attacker@evil.example",
                    phone: "+62-812-0000-0000",
                    lastModified: Date.now(),
                    preferences: { theme: "dark", language: "id", notifications: "enabled" }
                };
                
                localStorage.setItem('user_profile', JSON.stringify(sensitiveData));
                localStorage.setItem('session_token', 'tampered_' + Math.random().toString(36));
                localStorage.setItem('audit_persistence_key', 'SessionID-' + Date.now());
                
                status.innerHTML = '✅ Detail sensitif pengguna telah diubah!<br>Cek dengan tombol Audit.';
            } catch(e) {
                status.innerHTML = 'Error: ' + e.message;
            }
        }

        function runAudit() {
            let report = "<strong>Audit Report:</strong><br><br>--- LocalStorage ---<br>";
            
            if (localStorage.length === 0) {
                report += "Kosong.<br>";
            } else {
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    let val = localStorage.getItem(key);
                    report += `Key: ${key} | Value: ${val}<br>`;
                }
            }

            report += "<br>--- SessionStorage ---<br>";
            if (sessionStorage.length === 0) {
                report += "Kosong.<br>";
            } else {
                for (let i = 0; i < sessionStorage.length; i++) {
                    let key = sessionStorage.key(i);
                    let val = sessionStorage.getItem(key);
                    report += `Key: ${key} | Value: ${val}<br>`;
                }
            }

            auditResult.innerHTML = report;
            status.innerHTML = '✅ Audit selesai. Scroll ke bawah untuk melihat hasil lengkap.';
        }

        // Auto log
        window.onload = function() {
            setTimeout(() => {
                console.log('%c[1inch Test] Halaman malicious dimuat', 'color: red; font-size: 16px');
            }, 800);
        };
    </script>
</body>
</html>
