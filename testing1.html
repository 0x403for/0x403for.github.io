<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Link Test</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style> body { padding:20px; text-align:center; background:#000; color:#0f0; } </style>
</head>
<body>
    <h1>1inch Deep Link Test</h1>

    <div id="qrcode"></div>

    <p><strong>Link:</strong></p>
    <a href="1inch://test" id="deeplink">1inch://test</a><br><br>
    <a href="1inch://connect">1inch://connect</a><br>
    <a href="1inch://sign">1inch://sign</a>

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "1inch://bypass-test",
            width: 256,
            height: 256,
            colorDark : "#ffffff",
            colorLight : "#000000"
        });
    </script>
</body>
</html>
