<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1inch API & RPC Traffic Generator PoC</title>
    <script>
        function log(msg, color = "black") {
            const div = document.createElement('div');
            div.style.color = color;
            div.style.margin = "3px 0";
            div.style.fontFamily = "monospace";
            div.style.fontSize = "11px";
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.body.prepend(div);
        }

        // 1. Memicu permintaan RPC melalui provider untuk menghasilkan traffic jaringan backend
        async function triggerRpcTraffic() {
            if (window.ethereum) {
                try {
                    log("[*] Mengirim request eth_blockNumber ke RPC node...", "blue");
                    const blockNumber = await window.ethereum.request({ method: 'eth_blockNumber' });
                    log(`[+] Berhasil mendapat block: ${blockNumber}`, "green");

                    log("[*] Meminta akun aktif (memicu query backend/provider)...", "blue");
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    log(`[+] Akun: ${accounts[0] || 'Tidak ada'}`, "green");
                } catch (err) {
                    log(`[-] Error RPC: ${err.message}`, "red");
                }
            } else {
                log("[-] window.ethereum tidak ditemukan.", "red");
            }
        }

        // 2. Memicu fetch request langsung ke API 1inch (jika ada endpoint publik yang diakses dApp)
        async function triggerApiTraffic() {
            log("[*] Mengirim test fetch ke endpoint API...", "blue");
            try {
                // Contoh memanggil endpoint publik 1inch (atau bisa diarahkan ke burp listener jika dikonfigurasi)
                const response = await fetch('https://api.1inch.dev/swap/v5.2/1/supported-chains', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                const data = await response.json();
                log(`[+] API Response diterima (Status: ${response.status})`, "green");
            } catch (e) {
                log(`[-] Fetch API gagal/diblokir CORS: ${e.message}`, "orange");
            }
        }

        window.onload = function() {
            log("=== Traffic Generator PoC Loaded ===");
        };
    </script>
</head>
<body style="padding:15px; font-family:Arial; background-color: #f4f6f8;">
    <h3 style="color: #333; margin-top:0;">1inch API & RPC Traffic Generator</h3>
    <p style="color: #666; font-size: 13px;">Gunakan halaman ini untuk memicu lalu lintas jaringan, lalu tangkap dan manipulasi parameternya menggunakan Burp Suite.</p>
    <hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">

    <button onclick="triggerRpcTraffic()" style="padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px;">
        1. Trigger RPC Requests
    </button>

    <button onclick="triggerApiTraffic()" style="padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">
        2. Trigger API Fetch Requests
    </button>

    <div id="console" style="margin-top: 15px; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 4px; max-height: 250px; overflow-y: auto;">
        <strong>Log Aktivitas:</strong>
    </div>
</body>
</html>
