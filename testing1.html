<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1inch Hijack Test v10 - Proxy & Getter Trap</title>
    <script>
        function log(msg, color = "black") {
            console.log("[1inch-v10] " + msg);
            const div = document.createElement('div');
            div.style.color = color;
            div.style.margin = "4px 0";
            div.style.fontFamily = "monospace";
            div.style.fontSize = "12px";
            div.style.wordBreak = "break-all";
            div.style.fontWeight = (color === "red" || color === "#d00") ? "bold" : "normal";
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.body.prepend(div);
        }

        // Menggunakan Proxy untuk menjebak semua interaksi pada objek native bridge
        function trapWithProxy(objName) {
            if (window[objName]) {
                log(`[+] Applying Proxy trap to window.${objName}`, "blue");
                
                const targetObj = window[objName];
                
                window[objName] = new Proxy(targetObj, {
                    get(target, prop, receiver) {
                        log(`[GET] Accessed property/method: ${objName}.${prop}`, "purple");
                        const val = Reflect.get(target, prop, receiver);
                        if (typeof val === 'function') {
                            return function(...args) {
                                log(`🚨 PROXY CALLED ${objName}.${prop} -> Args: ${JSON.stringify(args)}`, "#d00");
                                return val.apply(this, args);
                            };
                        }
                        return val;
                    },
                    apply(target, thisArg, argumentsList) {
                        log(`🚨 PROXY FUNCTION EXECUTION ${objName}(...) -> Args: ${JSON.stringify(argumentsList)}`, "#d00");
                        return target.apply(thisArg, argumentsList);
                    }
                });
                
                log(`[+] Successfully proxied window.${objName}`, "green");
            }
        }

        // Intercept Object.defineProperty untuk menangkap jika objek dibuat belakangan
        const origDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && (prop === 'OneInchIOSWallet' || prop === 'OneInchSolanaWallet')) {
                log(`[!] App is defining protected property: window.${prop}`, "red");
            }
            return origDefineProperty.apply(this, arguments);
        };

        window.onload = function() {
            log("1inch Full Coverage Test v10 Loaded");
            setTimeout(() => {
                trapWithProxy('OneInchIOSWallet');
                trapWithProxy('OneInchSolanaWallet');
            }, 300);
        };
    </script>
</head>
<body style="padding:15px; font-family:Arial; background-color: #f9f9f9;">
    <h3 style="color: #111; margin-top:0;">1inch Hijack Test v10</h3>
    <p style="color: #555; font-size: 13px;">Proxy & Getter Trap for Native Bridge...</p>
    <hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">
</body>
</html>
