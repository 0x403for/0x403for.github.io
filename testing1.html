<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch Wallet Advanced Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #0f0f1e; color: #0f0; }
        button { padding: 15px; margin: 8px 0; width: 100%; background: #00cc66; border: none; border-radius: 8px; font-size: 15px; }
        pre { background: #1a1a2e; padding: 15px; border-radius: 8px; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🔬 1inch Wallet Advanced PoC</h1>
    <p>Gunakan wallet testnet!</p>

    <button onclick="testAll()">🚀 Jalankan Semua Test</button>
    <button onclick="testTxParams()">1. Test Parameter Tampering Simulation</button>
    <button onclick="testMaliciousSign()">2. Malicious Sign Request</button>
    <button onclick="testIframeBridge()">3. Iframe + Bridge Test</button>
    <button onclick="testDeepLinkSimulation()">4. Deep Link Simulation</button>
    <button onclick="testPermissionLeak()">5. Permission Inheritance Test</button>

    <h2>Log</h2>
    <pre id="log"></pre>

    <script>
        const logEl = document.getElementById('log');

        function log(msg, error = false) {
            const ts = new Date().toLocaleTimeString();
            logEl.innerHTML += `<span style="color:${error?'#ff6666':'#66ff99'}">[${ts}] ${msg}</span><br>`;
            console.log(msg);
        }

        async function testAll() {
            await connect();
            await getChain();
            testTxParams();
        }

        async function connect() {
            try {
                const acc = await ethereum.request({method: 'eth_requestAccounts'});
                log(`✅ Connected: ${acc[0]}`);
            } catch(e) { log(e.message, true); }
        }

        async function getChain() {
            try {
                const chain = await ethereum.request({method: 'eth_chainId'});
                log(`Chain ID: ${chain}`);
            } catch(e) { log(e.message, true); }
        }

        async function testTxParams() {
            try {
                const accounts = await ethereum.request({method: 'eth_accounts'});
                const tx = {
                    from: accounts[0],
                    to: "0xDDf9d60E588aCe13307aC1828d7DE211B4Ef949A", // ganti dengan address kamu
                    value: "0x16345785d8a0000", // 0.0001 ETH
                    data: "0x" // bisa dicoba inject calldata berbahaya
                };
                log("Mengirim TX dengan parameter test...");
                const hash = await ethereum.request({method: 'eth_sendTransaction', params: [tx]});
                log("TX Hash: " + hash);
            } catch(e) {
                log("TX ditolak / error: " + e.message, true);
            }
        }

        async function testMaliciousSign() {
            try {
                const msg = `\x19Ethereum Signed Message:\n${"Test malicious signature".length}Test malicious signature - ${Date.now()}`;
                const sig = await ethereum.request({
                    method: 'personal_sign',
                    params: [msg, (await ethereum.request({method:'eth_accounts'}))[0]]
                });
                log("Signature berhasil: " + sig.substring(0, 20) + "...");
            } catch(e) { log(e.message, true); }
        }

        function testIframeBridge() {
            log("Membuat iframe test...");
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            iframe.contentWindow.postMessage({type: "TEST_IFRAME_BRIDGE", data: "Iframe injection test"}, "*");
            log("Iframe bridge test dikirim");
        }

        function testDeepLinkSimulation() {
            log("Simulasi deep link...");
            // Coba buka scheme wallet (mungkin tidak jalan di dalam WebView)
            window.location.href = "1inch://test"; 
            setTimeout(() => {
                window.location.href = "https://1inch.io"; // fallback
            }, 500);
        }

        async function testPermissionLeak() {
            log("Test permission (camera/microphone)...");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                log("✅ Permission granted tanpa prompt ulang (mungkin inheritance!)");
                stream.getTracks().forEach(t => t.stop());
            } catch(e) {
                log("Permission ditolak: " + e.message);
            }
        }

        // Auto detect provider
        if (window.ethereum) {
            log("✅ window.ethereum terdeteksi");
            ethereum.on('accountsChanged', a => log("Accounts changed: " + a));
        }
    </script>
</body>
</html>
