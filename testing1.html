<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch dApp Browser Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #111; color: #eee; }
        button { display: block; width: 100%; margin: 10px 0; padding: 12px; font-size: 16px; }
        .result { background: #222; padding: 10px; margin-top: 10px; border-radius: 6px; word-break: break-all; }
        h2 { color: #00e676; }
    </style>
</head>
<body>
    <h2>1inch Wallet - dApp Browser Test</h2>
    <p>Gunakan hanya di wallet milik sendiri. Jangan pakai untuk merugikan orang lain.</p>

    <button onclick="testAlert()">1. Basic XSS / JS Execution Test</button>
    <button onclick="testEthereum()">2. Check window.ethereum / provider</button>
    <button onclick="testPostMessage()">3. postMessage Test</button>
    <button onclick="testLocalStorage()">4. LocalStorage / Session Test</button>
    <button onclick="testDeepLink()">5. Try Custom Scheme / Deep Link</button>
    <button onclick="testFileAccess()">6. Attempt file:// access</button>

    <div id="output" class="result">Hasil akan muncul di sini...</div>

    <script>
        function log(msg) {
            document.getElementById('output').innerHTML += msg + '<br>';
            console.log(msg);
        }

        function testAlert() {
            try {
                alert('XSS / JS Execution berhasil!');
                log('[+] alert() berhasil dieksekusi');
            } catch (e) {
                log('[-] alert gagal: ' + e.message);
            }
        }

        function testEthereum() {
            log('--- Checking provider ---');
            if (typeof window.ethereum !== 'undefined') {
                log('[+] window.ethereum ditemukan');
                log('isMetaMask: ' + window.ethereum.isMetaMask);
                log('is1inch: ' + (window.ethereum.is1inch || 'tidak diketahui'));
                try {
                    window.ethereum.request({ method: 'eth_accounts' })
                        .then(accounts => log('Accounts: ' + JSON.stringify(accounts)))
                        .catch(err => log('eth_accounts error: ' + err.message));
                } catch (e) {
                    log('Error request: ' + e.message);
                }
            } else {
                log('[-] window.ethereum tidak ditemukan');
            }

            // Cek provider lain yang umum
            const providers = ['ethereum', 'web3', 'solana', 'phantom'];
            providers.forEach(p => {
                if (window[p]) log(`[+] window.${p} ada`);
            });
        }

        function testPostMessage() {
            log('--- postMessage test ---');
            try {
                window.postMessage({ type: 'test', data: 'hello from dapp' }, '*');
                log('[+] postMessage ke * dikirim');

                // Dengarkan balasan
                window.addEventListener('message', function(e) {
                    log('Received message from: ' + e.origin);
                    log('Data: ' + JSON.stringify(e.data));
                });
            } catch (e) {
                log('postMessage error: ' + e.message);
            }
        }

        function testLocalStorage() {
            log('--- Storage test ---');
            try {
                localStorage.setItem('test_key', 'test_value_' + Date.now());
                log('[+] localStorage.setItem berhasil');
                log('Isi: ' + localStorage.getItem('test_key'));
            } catch (e) {
                log('localStorage error: ' + e.message);
            }

            try {
                sessionStorage.setItem('session_test', 'ok');
                log('[+] sessionStorage berhasil');
            } catch (e) {
                log('sessionStorage error: ' + e.message);
            }
        }

        function testDeepLink() {
            log('--- Trying deep links ---');
            // Hanya mencoba, tidak otomatis berbahaya
            const schemes = [
                '1inch://',
                'oneinch://',
                'wc:',
                'ethereum:',
                'intent://'
            ];
            schemes.forEach(s => {
                log('Mencoba: ' + s);
                // Tidak langsung redirect supaya tidak agresif
            });
            log('Coba manual buka deep link dari luar aplikasi juga');
        }

        function testFileAccess() {
            log('--- File access test ---');
            try {
                // Ini biasanya diblokir di WebView yang aman
                fetch('file:///etc/passwd')
                    .then(r => r.text())
                    .then(t => log('[!] file access berhasil: ' + t.substring(0, 100)))
                    .catch(e => log('[-] file:// diblokir (bagus): ' + e.message));
            } catch (e) {
                log('file access error: ' + e.message);
            }
        }

        // Auto log saat page load
        window.onload = function() {
            log('Page loaded');
            log('User Agent: ' + navigator.userAgent);
            log('Location: ' + location.href);
        };
    </script>
</body>
</html>
