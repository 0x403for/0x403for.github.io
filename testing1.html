<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1inch Hijack Test v5 - Full Coverage</title>
    <script>
        function log(msg, color = "black") {
            console.log("[1inch] " + msg);
            const div = document.createElement('div');
            div.style.color = color;
            div.style.margin = "6px 0";
            div.style.fontWeight = (color === "red" || color === "#d00") ? "bold" : "normal";
            div.textContent = msg;
            document.body.appendChild(div);
        }

        function hookAll() {
            if (!window.ethereum) {
                log("No ethereum object", "red");
                return;
            }

            log("[+] Hooking all ethereum methods...", "blue");

            const methods = ['request', 'send', 'sendAsync', 'enable'];
            methods.forEach(methodName => {
                if (typeof window.ethereum[methodName] === 'function') {
                    const original = window.ethereum[methodName];
                    window.ethereum[methodName] = function(...args) {
                        const firstArg = args[0];
                        const method = typeof firstArg === 'string' ? firstArg : (firstArg && firstArg.method);
                        
                        if (method) {
                            log(`INTERCEPTED ${methodName} → ${method}`, "#d00");
                            
                            if (method.includes("sendTransaction") || method.includes("signTransaction")) {
                                log("🚨 CRITICAL: Transaction Signing Flow Detected!", "red");
                            }
                        }
                        return original.apply(this, args);
                    };
                    log(`[+] Hooked ${methodName}`, "green");
                }
            });

            log("[+] All hooks installed. Coba Swap lagi sekarang!", "blue");
        }

        window.onload = function() {
            log("1inch Full Coverage Test v5 Loaded");
            setTimeout(hookAll, 800);
        };
    </script>
</head>
<body style="padding:20px; font-family:Arial;">
    <h1>1inch Hijack Test v5</h1>
    <p>Hook semua method + deteksi signing</p>
</body>
</html>
