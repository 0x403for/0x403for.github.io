<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Provider Integrity & Hijacking Auditor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0f19; color: #f1f5f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        pre { background: #050b14; padding: 15px; border-radius: 6px; overflow-x: auto; color: #34d399; font-family: monospace; font-size: 13px; border: 1px solid #1e293b; max-height: 300px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Web3 Provider Injection Integrity Audit</h2>
    <p style="font-size: 13px; color: #94a3b8;">Alat ini memeriksa apakah objek penyedia dompet (window.ethereum) dilindungi dari modifikasi ilegal (property redefinition / hijacking).</p>
    
    <button onclick="auditProviderIntegrity()">Jalankan Audit Integritas Provider</button>

    <h3>Log Hasil Audit Integritas:</h3>
    <pre id="logOutput">Menunggu eksekusi...</pre>
</div>

<script>
    const logOutput = document.getElementById("logOutput");

    function log(message) {
        logOutput.innerText += "\n> " + message;
        logOutput.scrollTop = logOutput.scrollHeight;
    }

    function auditProviderIntegrity() {
        logOutput.innerText = "Memulai audit integritas objek global...";

        if (typeof window.ethereum === "undefined") {
            log("[INFO] Objek window.ethereum tidak terdeteksi. Pastikan halaman ini dibuka di dalam dApp browser wallet.");
            return;
        }

        log("[OK] Objek window.ethereum ditemukan.");

        // 1. Cek apakah properti ethereum dapat dimodifikasi/ditimpa (writable / configurable check)
        const descriptor = Object.getOwnPropertyDescriptor(window, 'ethereum');
        if (descriptor) {
            log(`Deskriptor properti ethereum - writable: ${descriptor.writable}, configurable: ${descriptor.configurable}`);
            if (descriptor.writable || descriptor.configurable) {
                log("[PERINGATAN POTENSIAL] Properti window.ethereum bersifat writable/configurable. Script pihak ketiga yang dimuat di halaman berisiko menimpa (hijack) fungsi wallet.");
            } else {
                log("[AMAN] Properti window.ethereum terkunci dengan baik (immutable/non-writable).");
            }
        }

        // 2. Cek keberadaan fungsi esensial standar EIP-1193
        if (typeof window.ethereum.request === "function") {
            log("[OK] Metode standar EIP-1193 'request' tersedia.");
        } else {
            log("[PERINGATAN] Objek ethereum tidak memiliki fungsi 'request' standar.");
        }

        // 3. Uji ketahanan terhadap upaya manipulasi properti secara langsung
        try {
            const originalEthereum = window.ethereum;
            // Coba timpa secara paksa untuk melihat apakah browser/extension melindunginya
            window.ethereum = { fake: true };
            
            if (window.ethereum.fake === true) {
                log("[KERENTANAN / CATATAN] Objek window.ethereum dapat ditimpa secara langsung di tingkat global scope halaman ini.");
                // Kembalikan ke semula
                window.ethereum = originalEthereum;
            } else {
                log("[AMAN] Objek window.ethereum dilindungi dari penimpaan langsung.");
            }
        } catch (e) {
            log("[AMAN] Penimpaan objek diblokir secara otomatis oleh proteksi lingkungan dApp browser: " + e.message);
        }
    }
</script>

</body>
</html>
