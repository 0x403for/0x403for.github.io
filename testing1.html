<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1inch Advanced Test</title>
  <style>
    body { font-family: system-ui; background: #0d0d0d; color: #e0e0e0; padding: 16px; }
    button { width: 100%; padding: 14px; margin: 8px 0; font-size: 15px; border-radius: 8px; border: none; background: #1a1a1a; color: white; }
    .box { background: #1a1a1a; padding: 12px; margin-top: 12px; border-radius: 8px; font-size: 13px; word-break: break-all; }
    h3 { color: #00e676; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h2>1inch dApp Browser - Advanced Test</h2>
  <p style="font-size:13px;opacity:0.7">Hanya untuk testing di wallet sendiri</p>

  <button onclick="checkProvider()">1. Deep Provider Info</button>
  <button onclick="listMethods()">2. List ethereum Methods</button>
  <button onclick="testSign()">3. Test personal_sign (hati-hati)</button>
  <button onclick="testPermissions()">4. Request Permissions</button>
  <button onclick="scanWindow()">5. Scan window Objects</button>
  <button onclick="testPostMessageOrigin()">6. postMessage Origin Test</button>

  <div id="out" class="box">Hasil muncul di sini...</div>

  <script>
    const out = document.getElementById('out');
    function log(msg) {
      out.innerHTML += msg + '<br><br>';
      console.log(msg);
    }
    function clearLog() { out.innerHTML = ''; }

    async function checkProvider() {
      clearLog();
      log('<h3>Provider Info</h3>');
      if (!window.ethereum) return log('Tidak ada ethereum');

      const e = window.ethereum;
      log('isMetaMask: ' + e.isMetaMask);
      log('is1inch: ' + e.is1inch);
      log('chainId: ' + e.chainId);
      log('selectedAddress: ' + e.selectedAddress);
      log('networkVersion: ' + e.networkVersion);

      try {
        const chainId = await e.request({ method: 'eth_chainId' });
        log('eth_chainId: ' + chainId);
      } catch(err) { log('eth_chainId error: ' + err.message); }

      try {
        const accounts = await e.request({ method: 'eth_accounts' });
        log('eth_accounts: ' + JSON.stringify(accounts));
      } catch(err) { log('eth_accounts error: ' + err.message); }
    }

    function listMethods() {
      clearLog();
      log('<h3>ethereum Methods / Properties</h3>');
      if (!window.ethereum) return log('Tidak ada ethereum');

      const keys = Object.keys(window.ethereum);
      log('Keys: ' + keys.join(', '));

      // Cek method umum
      const methods = ['request', 'send', 'sendAsync', 'enable', 'on', 'removeListener'];
      methods.forEach(m => {
        log(m + ': ' + (typeof window.ethereum[m]));
      });
    }

    async function testSign() {
      clearLog();
      log('<h3>personal_sign Test</h3>');
      log('Ini akan memunculkan konfirmasi di wallet. Jangan approve kalau tidak yakin.');

      if (!window.ethereum) return log('Tidak ada ethereum');

      try {
        const accounts = await window.ethereum.request({ method: 'eth_accounts' });
        if (!accounts.length) return log('Tidak ada account');

        const msg = 'Test message from dApp browser - ' + Date.now();
        const from = accounts[0];

        const signature = await window.ethereum.request({
          method: 'personal_sign',
          params: [msg, from]
        });
        log('Signature berhasil: ' + signature);
      } catch (err) {
        log('Error / Ditolak: ' + err.message);
      }
    }

    async function testPermissions() {
      clearLog();
      log('<h3>Request Permissions</h3>');
      try {
        const perms = await window.ethereum.request({
          method: 'wallet_requestPermissions',
          params: [{ eth_accounts: {} }]
        });
        log('Permissions: ' + JSON.stringify(perms));
      } catch (err) {
        log('Error: ' + err.message);
      }
    }

    function scanWindow() {
      clearLog();
      log('<h3>Scanning window for interesting objects</h3>');

      const interesting = [];
      for (let key in window) {
        try {
          if (key.toLowerCase().includes('inch') ||
              key.toLowerCase().includes('wallet') ||
              key.toLowerCase().includes('bridge') ||
              key.toLowerCase().includes('native') ||
              key.toLowerCase().includes('webkit') ||
              key.toLowerCase().includes('react') ||
              key === 'ethereum' || key === 'solana' || key === 'web3') {
            interesting.push(key + ' (' + typeof window[key] + ')');
          }
        } catch(e) {}
      }
      log(interesting.join('<br>') || 'Tidak banyak object menarik');
    }

    function testPostMessageOrigin() {
      clearLog();
      log('<h3>postMessage Origin Test</h3>');

      window.addEventListener('message', (e) => {
        log('Received from origin: <b>' + e.origin + '</b>');
        log('Data: ' + JSON.stringify(e.data));
      });

      // Kirim ke origin sendiri
      window.postMessage({test: 'same-origin'}, location.origin);
      log('Sent to same origin');

      // Kirim ke *
      window.postMessage({test: 'wildcard'}, '*');
      log('Sent to *');
    }
  </script>
</body>
</html>
