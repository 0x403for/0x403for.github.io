<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1inch Hijack Test v9 - Function Bridge Intercept</title>
    <script>
        function log(msg, color = "black") {
            console.log("[1inch-v9] " + msg);
            const div = document.createElement('div');
            div.style.color = color;
            div.style.margin = "4px 0";
            div.style.fontFamily = "monospace";
            div.style.fontSize = "12px";
            div.style.wordBreak = "break-all";
            div.style.fontWeight = (color === "red" || color === "#d00") ? "bold" : "normal";
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.body.prepend(div);
        }

        function hookFunctionBridge(walletObjName) {
            const target = window[walletObjName];
            if (typeof target === 'function') {
                log(`[!] Hooking function window.${walletObjName}(...)`, "blue");
                
                const originalFunc = target;
                window[walletObjName] = function(...args) {
                    log(`🚨 CALLED window.${walletObjName} -> Args: ${JSON.stringify(args)}`, "#d00");
                    
                    // Cek jika argumen mengandung string transaksi/swap/sign
                    try {
                        const str = JSON.stringify(args);
                        if (str.includes('sign') || str.includes('transaction') || str.includes('swap') || str.includes('eth_')) {
                            log(`🔥 MATCH TRANSACTION/SIGN PAYLOAD!`, "red");
                        }
                    } catch(e) {}

                    return originalFunc.apply(this, args);
                };
                
                log(`[+] Successfully hooked window.${walletObjName}`, "green");
            }
        }

        function runHooks() {
            log("[+] Initializing Function-Level Hooking...", "blue");
            hookFunctionBridge('OneInchIOSWallet');
            hookFunctionBridge('OneInchSolanaWallet');

            // Interval untuk memastikan jika objek di-overwrite atau dibuat belakangan oleh native
            setInterval(() => {
                if (typeof window.OneInchIOSWallet === 'function' && !window.OneInchIOSWallet.isHooked) {
                    // Tandai agar tidak hook berulang-ulang
                    const orig = window.OneInchIOSWallet;
                    window.OneInchIOSWallet = function(...args) {
                        log(`🚨 CALLED OneInchIOSWallet -> ${JSON.stringify(args)}`, "#d00");
                        return orig.apply(this, args);
                    };
                    window.OneInchIOSWallet.isHooked = true;
                    log(`[+] Re-hooked OneInchIOSWallet dynamically`, "green");
                }
            }, 500);
        }

        window.onload = function() {
            log("1inch Full Coverage Test v9 Loaded");
            setTimeout(runHooks, 200);
        };
    </script>
</head>
<body style="padding:15px; font-family:Arial; background-color: #f9f9f9;">
    <h3 style="color: #111; margin-top:0;">1inch Hijack Test v9</h3>
    <p style="color: #555; font-size: 13px;">Function-level hooking for OneInch native bridge...</p>
    <hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">
</body>
</html>
