<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch DApp - Transaction History Reader</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            padding: 16px;
            margin: 0;
        }
        h2 {
            color: #58a6ff;
            font-size: 18px;
            margin-bottom: 8px;
        }
        p {
            color: #8b949e;
            font-size: 13px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .input-box {
            width: 100%;
            height: 60px;
            background-color: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        .btn {
            width: 100%;
            background-color: #238636;
            color: #fff;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .output-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #7ee787;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <h2>DApp Wallet History Inspector</h2>
    <p>Membaca konteks transaksi dan akun aktif langsung melalui provider dompet di dalam DApp browser.</p>

    <div class="card">
        <label style="font-size: 12px; color: #8b949e;">Target Hash Transaksi:</label>
        <textarea id="txHashInput" class="input-box" placeholder="Tempel Hash Transaksi (Contoh: 0xe171...)">0xe1718412fcbc5f83797bb769042332d00182122110307072a667af0b1c18b44c</textarea>
        
        <button class="btn" onclick="hubungkanDanAmbilData()">Hubungkan Dompet & Ambil Detail</button>
    </div>

    <div class="card">
        <label style="font-size: 12px; color: #8b949e;">Hasil Ekstraksi Konteks Dompet:</label>
        <div id="resultOutput" class="output-box">[+] Menunggu interaksi dompet...</div>
    </div>

    <script>
        async function hubungkanDanAmbilData() {
            const output = document.getElementById('resultOutput');
            const txHash = document.getElementById('txHashInput').value.trim();

            if (typeof window.ethereum === 'undefined') {
                output.innerText = "[-] Error: Objek window.ethereum tidak ditemukan. Pastikan halaman ini dibuka di dalam DApp Browser dompet.";
                return;
            }

            try {
                output.innerText = "[*] Meminta izin koneksi akun dompet...";
                
                // Meminta akses akun aktif dari dApp browser
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const activeAccount = accounts[0];
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });

                output.innerText = `[+] Dompet Terhubung!\n- Akun Aktif: ${activeAccount}\n- Chain ID: ${chainId}\n\n[*] Mengambil data transaksi dari node...`;

                if (!txHash) {
                    output.innerText += "\n[-] Hash transaksi kosong.";
                    return;
                }

                // Mengambil detail tanda terima transaksi (Transaction Receipt) via provider web3
                const receipt = await window.ethereum.request({
                    method: 'eth_getTransactionReceipt',
                    params: [txHash]
                });

                const txDetails = await window.ethereum.request({
                    method: 'eth_getTransactionByHash',
                    params: [txHash]
                });

                if (receipt && txDetails) {
                    output.innerText += `\n\n[+] Detail Transaksi Berhasil Dimuat:\n` +
                        `- Status: ${receipt.status === '0x1' ? 'Sukses (Dieksekusi)' : 'Gagal'}\n` +
                        `- Blok: ${parseInt(receipt.blockNumber, 16)}\n` +
                        `- Pengirim (From): ${txDetails.from}\n` +
                        `- Penerima (To): ${txDetails.to}\n` +
                        `- Nilai (Value): ${parseInt(txDetails.value, 16) / 1e18} ETH\n` +
                        `- Hash: ${txHash}`;
                } else {
                    output.innerText += `\n[-] Transaksi tidak ditemukan di jaringan saat ini atau hash tidak valid.`;
                }

            } catch (error) {
                output.innerText = `[-] Terjadi kesalahan: ${error.message}`;
            }
        }
    </script>
</body>
</html>
