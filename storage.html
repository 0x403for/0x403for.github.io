<!DOCTYPE html>
<html>
<head>
    <title>Storage Audit Tool</title>
    <style>
        body { background: #0c0c0c; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; font-size: 14px; }
        button { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 10px 20px; cursor: pointer; font-family: monospace; font-weight: bold; }
        button:hover { background: #00ff41; color: #000; }
        .log-entry { margin: 5px 0; border-left: 2px solid #333; padding-left: 10px; }
        .data-found { color: #fff; border: 1px solid #ff9900; padding: 10px; margin: 10px 0; background: #222; word-break: break-all; }
        h3 { border-bottom: 1px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>

    <h3>[+] Storage Exfiltration Audit</h3>
    <button onclick="startScan()">[ START SCAN ]</button>
    <div id="log-container" style="margin-top: 20px;"></div>

    <script>
        function log(msg) {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            container.appendChild(entry);
        }

        function startScan() {
            document.getElementById('log-container').innerHTML = '';
            log("Initializing storage scan...");
            
            const sensitiveKeys = ['vault', 'wallet_data', 'encrypted_pk', 'seed', 'enc_pk', 'user_vault', 'web3_session'];
            let found = false;

            
            sensitiveKeys.forEach(key => {
                const data = localStorage.getItem(key);
                if (data) {
                    found = true;
                    log(`<span style="color:#ff9900">HIT: Key '${key}' detected.</span>`);
                    const div = document.createElement('div');
                    div.className = 'data-found';
                    div.innerHTML = `<b>KEY:</b> ${key}<br><b>VALUE:</b> <pre>${data}</pre>`;
                    document.getElementById('log-container').appendChild(div);
                }
            });

            
            if (!found) {
                log("No high-priority keys detected. Performing full storage dump...");
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    const v = localStorage.getItem(k);
                    log(`K: ${k} | V: ${v.substring(0, 30)}...`);
                }
            }
            
            log("Audit process completed.");
        }
    </script>
</body>
</html>
