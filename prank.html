<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Respring</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 60% 30%, #3a2a7a 0%, #1a1040 40%, #0d0820 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
    .blob-1 { width: 350px; height: 350px; background: rgba(80,50,200,0.3); top: -80px; right: -80px; }
    .blob-2 { width: 300px; height: 300px; background: rgba(100,60,180,0.2); bottom: -60px; left: -60px; }

    .container { position: relative; z-index: 1; text-align: center; }

    .respring-btn {
      padding: 12px 32px;
      background: #2563eb;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(37,99,235,0.45);
      transition: background 0.15s, transform 0.1s;
    }
    .respring-btn:hover { background: #1d4ed8; }
    .respring-btn:active { transform: scale(0.96); }

    .overlay { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; }
    .overlay.active { display: flex; }

    .alert-box {
      background: rgba(255,255,255,0.13);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 20px 24px 16px;
      width: 290px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      animation: popIn 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }

    .alert-message { color: rgba(255,255,255,0.92); font-size: 15px; line-height: 1.45; margin-bottom: 16px; }
    .alert-footer { text-align: right; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; }

    .close-btn {
      background: none; border: none;
      color: #3b82f6; font-size: 17px; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <button class="respring-btn" onclick="startRespring()">Respring!</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="alert-box">
      <p class="alert-message">
        device will respring in <strong id="countdown">5</strong> seconds!!
      </p>
      <div class="alert-footer">
        <button class="close-btn" onclick="closeAlert()">Close</button>
      </div>
    </div>
  </div>

  <script>
    let timer = null;
    let seconds = 5;

    function startRespring() {
      seconds = 5;
      document.getElementById('countdown').textContent = seconds;
      document.getElementById('overlay').classList.add('active');

      clearInterval(timer);
      timer = setInterval(() => {
        seconds--;
        document.getElementById('countdown').textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          closeAlert();
          document.body.style.transition = 'opacity 0.6s';
          document.body.style.opacity = '0';
          setTimeout(() => {
            document.body.style.opacity = '1';
            document.body.style.transition = '';
          }, 700);
        }
      }, 1000);
    }

    function closeAlert() {
      clearInterval(timer);
      document.getElementById('overlay').classList.remove('active');
    }
  </script>
</body>
</html>
