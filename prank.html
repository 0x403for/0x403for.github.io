    <script>
        const logBox = document.getElementById('log');

        function appendLog(text) {
            logBox.innerText += text + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Fungsi helper untuk menunggu window.ethereum di-inject oleh browser mobile secara asinkron
        function getEthereumProvider() {
            return new Promise((resolve) => {
                if (window.ethereum) {
                    return resolve(window.ethereum);
                }
                
                let checks = 0;
                const interval = setInterval(() => {
                    checks++;
                    if (window.ethereum) {
                        clearInterval(interval);
                        return resolve(window.ethereum);
                    }
                    if (checks > 20) { // Coba selama 2 detik max
                        clearInterval(interval);
                        return resolve(null);
                    }
                }, 100);
            });
        }

        // Cek ketersediaan saat halaman dimuat

            const eth = await getEthereumProvider();
            const statusEl = document.getElementById('providerStatus');

                appendLog("[-] window.ethereum timed out. Pastikan dibuka di dalam dApp browser aktif.");

        });

        // Listener postMessage rentan tanpa validasi origin
        window.addEventListener('message', async (event) => {
            appendLog(`[+] Intercepted postMessage from origin: ${event.origin}`);
            appendLog(`[+] Payload: ${JSON.stringify(event.data)}`);

            const data = event.data;
            if (data && data.action === "EXECUTE_WEB3_CALL") {
                appendLog("[!] Processing unvalidated request from cross-origin...");

                const eth = await getEthereumProvider();
                if (!eth) {
                    appendLog("[-] Error: window.ethereum is missing at execution time.");
                    event.source.postMessage({ status: "ERROR", message: "Provider missing" }, event.origin);
                    return;

                try {
                    appendLog(`[*] Requesting method [${data.method}] to BloFin provider...`);
                    const res = await eth.request({
                        method: data.method,
                        params: data.params || []
                    });

                    appendLog(`[SUCCESS] Response from wallet: ${JSON.stringify(res)}`);
                    event.source.postMessage({
                        status: "SUCCESS",
                        result: res
                    }, event.origin);

                } catch (err) {
                    appendLog(`[-] Wallet rejected or error: ${err.message}`);
                    event.source.postMessage({
                        status: "ERROR",
                        message: err.message
                    }, event.origin);
                }
            }
        });
