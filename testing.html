<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Link Phishing Tester - 1inch iOS</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        h1 { color: #c62828; text-align: center; }
        button { background: #c62828; color: white; padding: 16px; margin: 12px 0; width: 100%; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; }
        .log { margin-top: 25px; padding: 20px; background: #fff; border: 2px solid #ffcdd2; border-radius: 16px; max-height: 500px; overflow-y: auto; }
        .warning { color: #c62828; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Deep Link Phishing Tester</h1>
        <p><strong>Uji coba link eksternal yang langsung memicu aksi di wallet</strong></p>

        <button id="connect">1. Hubungkan Wallet</button>
        <button id="testDeepLink">2. Test Deep Link Phishing</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        const logDiv = document.getElementById('log');

        function log(text) {
            const div = document.createElement('div');
            div.style.margin = '10px 0';
            div.style.padding = '12px';
            div.style.borderRadius = '8px';
            div.innerHTML = text;
            logDiv.prepend(div);
        }

        if (window.ethereum) {
            log('✅ Wallet terdeteksi');

            const orig = window.ethereum.request;
            window.ethereum.request = async function (args) {
                log(`INTERCEPTED: ${args.method}`);

                if (args.method === 'eth_sendTransaction' || args.method.includes('sign')) {
                    log('🚨 DEEP LINK / AUTO ACTION terdeteksi! Potensi phishing.', 'warning');
                }

                return orig.apply(this, arguments);
            };
        } else {
            log('❌ Buka di 1inch Wallet Browser');
        }

        document.getElementById('connect').onclick = () => window.ethereum.request({method: 'eth_requestAccounts'}).catch(()=>{});

        document.getElementById('testDeepLink').onclick = () => {
            log('Simulasi Deep Link Phishing dijalankan...', 'warning');
            // Simulasi auto action
            window.ethereum.request({method: 'personal_sign', params: ['0x44656570204c696e6b205068697368696e672054657374', window.ethereum.selectedAddress]}).catch(()=>{});
        };
    </script>
</body>
</html>
