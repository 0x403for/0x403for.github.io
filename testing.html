<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipboard Test</title>
  <style>
    body { font-family: system-ui; padding: 16px; background: #0f0f0f; color: #e0e0e0; }
    button { margin: 6px 4px; padding: 10px 14px; border-radius: 8px; border: none; background: #3b82f6; color: white; }
    pre { background: #1a1a1a; padding: 12px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Clipboard Access Test</h2>
  <p>1. Copy teks apa saja di luar (misalnya seed phrase palsu / alamat wallet)</p>
  <p>2. Kembali ke sini dan tekan tombol di bawah</p>
  <button onclick="readClipboard()">Baca Clipboard</button>
  <button onclick="writeClipboard()">Tulis ke Clipboard</button>
  <pre id="log">Siap...</pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += msg + '\n'; }

    async function readClipboard() {
      logEl.textContent = '';
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          log('[SUCCESS] Berhasil baca clipboard:');
          log(text || '(kosong)');
        } else {
          log('navigator.clipboard.readText tidak tersedia');
        }
      } catch(e) {
        log('[BLOCKED / ERROR] ' + e.name + ': ' + e.message);
      }
    }

    async function writeClipboard() {
      try {
        await navigator.clipboard.writeText('PoC from Coin98 dApp browser - ' + Date.now());
        log('[SUCCESS] Berhasil menulis ke clipboard');
      } catch(e) {
        log('[ERROR write] ' + e.message);
      }
    }
  </script>
</body>
</html>
