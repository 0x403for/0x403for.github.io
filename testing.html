<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Coin98 Bridge Detector</title>
  <style>body{font-family:sans-serif;padding:20px;} pre{background:#111;color:#0f0;padding:10px;overflow:auto;}</style>
</head>
<body>
  <h2>JS Bridge / Provider Detector</h2>
  <button onclick="scan()">Scan Available Objects</button>
  <pre id="out">Klik Scan...</pre>

  <script>
    function scan() {
      const results = [];
      const candidates = [
        'coin98', 'ethereum', 'web3', 'solana', 'phantom',
        'ReactNativeWebView', 'webkit', 'Android', 'JSBridge',
        'native', 'bridge', 'Wallet', 'coin98Wallet'
      ];

      // Cek global objects
      candidates.forEach(name => {
        try {
          if (window[name]) {
            results.push(`[FOUND] window.${name} = ${typeof window[name]}`);
            if (typeof window[name] === 'object') {
              results.push(`  keys: ${Object.keys(window[name]).slice(0,20).join(', ')}`);
            }
          }
        } catch(e) {}
      });

      // Cek messageHandlers (iOS)
      try {
        if (window.webkit && window.webkit.messageHandlers) {
          results.push('[FOUND] window.webkit.messageHandlers');
          results.push('  handlers: ' + Object.keys(window.webkit.messageHandlers).join(', '));
        }
      } catch(e) {}

      // Cek ReactNativeWebView
      try {
        if (window.ReactNativeWebView) {
          results.push('[FOUND] window.ReactNativeWebView');
          results.push('  postMessage exists: ' + (typeof window.ReactNativeWebView.postMessage === 'function'));
        }
      } catch(e) {}

      // Coba postMessage generik (tidak mengirim data sensitif)
      try {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify({type:'ping', from:'poc'}));
          results.push('[TEST] Sent test postMessage (cek native log / response)');
        }
      } catch(e) {
        results.push('[ERROR] postMessage failed: ' + e.message);
      }

      document.getElementById('out').textContent = results.join('\n') || 'Tidak ada interface mencurigakan yang terdeteksi.';
    }
  </script>
</body>
</html>
