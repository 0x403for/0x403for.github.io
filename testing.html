<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch dApp - Auto Clipboard Reader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        h2 {
            font-size: 16px;
            margin-top: 0;
            color: #58a6ff;
            text-align: center;
        }
        button {
            width: 100%;
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        button:active {
            background-color: #2ea043;
        }
        .result-box {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            word-break: break-all;
            min-height: 40px;
            color: #8b949e;
        }
        .highlight {
            color: #3fb950;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>1inch dApp Clipboard Sync</h2>
        <p style="font-size: 13px; text-align: center; color: #8b949e;">Salin teks/alamat dari wallet, lalu ketuk tombol di bawah:</p>
        
        <!-- Tombol pemicu izin baca clipboard khusus iOS -->
        <button onclick="readFromClipboard()">Tempel dari Clipboard</button>
        
        <div style="font-size: 12px; margin-bottom: 5px; font-weight: bold;">Hasil Terdeteksi:</div>
        <div id="output" class="result-box">Belum ada data yang dimuat...</div>
    </div>

    <script>
        async function readFromClipboard() {
            const outputDiv = document.getElementById('output');
            
            try {
                // Memeriksa apakah browser mendukung Clipboard API
                if (!navigator.clipboard || !navigator.clipboard.readText) {
                    outputDiv.innerHTML = "<span style='color: #f85149;'>Browser dApp ini tidak mendukung pembacaan clipboard otomatis.</span>";
                    return;
                }

                // Membaca teks yang ada di clipboard perangkat iOS
                const text = await navigator.clipboard.readText();
                
                if (text.trim() === "") {
                    outputDiv.innerHTML = "<span style='color: #f85149;'>Clipboard kosong.</span>";
                    return;
                }

                // Menampilkan hasil dan mendeteksi apakah formatnya alamat dompet EVM (0x...)
                if (text.startsWith('0x') && text.length === 42) {
                    outputDiv.innerHTML = `<div>Status: <span class="highlight">Alamat Dompet Valid</span></div><div style="margin-top:5px; color:#c9d1d9;">${text}</div>`;
                } else {
                    outputDiv.innerHTML = `<div>Status: <span class="highlight">Teks Umum</span></div><div style="margin-top:5px; color:#c9d1d9;">${text}</div>`;
                }

            } catch (err) {
                // Penanganan jika izin akses ditolak oleh sistem iOS
                outputDiv.innerHTML = `<span style='color: #f85149;'>Akses clipboard ditolak. Izinkan dApp membaca clipboard pada pop-up perangkat Anda.</span>`;
                console.error("Gagal membaca clipboard:", err);
            }
        }
    </script>

</body>
</html>
