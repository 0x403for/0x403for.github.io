<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔗 Deep Link Intent & Routing Tester</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            max-width: 600px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); 
            border: 1px solid var(--border-color);
        }

        h2 { 
            color: #60a5fa; 
            text-align: center; 
            margin-top: 0;
            font-size: 22px;
        }

        p.desc {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .section-box {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .section-box h4 {
            margin: 0 0 10px 0;
            color: #e2e8f0;
            font-size: 15px;
        }

        button { 
            background: var(--primary); 
            color: white; 
            padding: 14px; 
            width: 100%; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.98); }

        .wallet-status {
            font-size: 13px;
            color: #38bdf8;
            word-break: break-all;
            margin-bottom: 15px;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .log-container {
            margin-top: 20px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .log-header span {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        #clear-log {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 6px;
            width: auto;
            margin: 0;
        }

        .log { 
            padding: 12px; 
            background: #0b0f19; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            max-height: 350px; 
            overflow-y: auto; 
            font-family: monospace;
            font-size: 13px;
        }

        .log-item {
            margin: 6px 0; 
            padding: 8px 10px; 
            border-radius: 6px; 
            border-left: 3px solid #64748b;
            background: #1e293b;
            word-break: break-all;
        }

        .warning { color: #fca5a5; border-left-color: #ef4444; background: rgba(239, 68, 68, 0.15) !important; }
        .safe { color: #86efac; border-left-color: #22c55e; background: rgba(34, 197, 94, 0.15) !important; }
        .info { color: #7dd3fc; border-left-color: #0ea5e9; background: rgba(14, 165, 233, 0.1) !important; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔗 Deep Link & Intent Tester</h2>
        <p class="desc">Pengujian validasi parameter routing & penanganan intent eksternal</p>

        <div id="walletInfo" class="wallet-status">Status Wallet: Memeriksa Koneksi...</div>

        <!-- Skenario 1: Koneksi Standar -->
        <div class="section-box">
            <h4>1. Inisialisasi Sesi</h4>
            <button id="connect">Hubungkan Wallet</button>
        </div>

        <!-- Skenario 2: Uji Penanganan Intent / Parameter Routing -->
        <div class="section-box">
            <h4>2. Test Simulasi Intent Masuk</h4>
            <p style="font-size:12px; color:var(--text-muted); margin:0 0 10px 0;">Menguji bagaimana metode sign/request dipicu melalui skrip navigasi eksternal.</p>
            <button id="testDeepLink">Uji Request Intent Eksternal</button>
        </div>

        <div class="log-container">
            <div class="log-header">
                <span>Log Aktivitas Intent</span>
                <button id="clear-log">Bersihkan</button>
            </div>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        const logDiv = document.getElementById('log');
        const walletInfo = document.getElementById('walletInfo');

        function log(text, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-item ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${text}`;
            logDiv.prepend(div);
        }

        if (window.ethereum) {
            log('✅ Provider Ethereum aktif pada lingkungan dApp.', 'safe');

            const orig = window.ethereum.request;
            window.ethereum.request = async function (args) {
                log(`Intent Method Intercepted: <strong>${args.method}</strong>`, 'info');

                // Memantau metode yang berkaitan dengan aksi penandatanganan atau transaksi
                if (args.method === 'eth_sendTransaction' || args.method.includes('sign')) {
                    log(`<span class="warning">⚠️ Perhatian: Metode ${args.method} dipicu oleh skrip eksternal/intent. Pastikan validasi konfirmasi pengguna berjalan dengan semestinya.</span>`, 'warning');
                }

                return orig.apply(this, arguments);
            };

            // Memuat akun awal
            window.ethereum.request({ method: 'eth_requestAccounts' })
                .then(accounts => {
                    walletInfo.innerText = `Connected: ${accounts[0].substring(0, 6)}...${accounts[0].substring(38)}`;
                    log(`Sesi wallet terinisialisasi: ${accounts[0]}`, 'safe');
                })
                .catch(err => {
                    walletInfo.innerText = `Koneksi Wallet Ditolak`;
                    log(`Akses akun dibatalkan: ${err.message}`, 'warning');
                });

        } else {
            walletInfo.innerText = `Provider Tidak Ditemukan`;
            log('❌ Lingkungan dApp browser tidak terdeteksi. Silakan buka melalui dApp browser resmi.', 'warning');
        }

        document.getElementById('connect').onclick = () => {
            window.ethereum?.request({ method: 'eth_requestAccounts' })
                .catch(err => log(`Gagal terhubung: ${err.message}`, 'warning'));
        };

        document.getElementById('testDeepLink').onclick = () => {
            log('Memulai simulasi penanganan intent parameter...', 'info');
            
            // Menguji parameter pesan uji coba standar
            const testPayload = '0x44656570204c696e6b20526f7574696e672054657374';
            const userAccount = window.ethereum?.selectedAddress || null;

            window.ethereum?.request({ 
                method: 'personal_sign', 
                params: [testPayload, userAccount] 
            }).catch(err => {
                log(`Simulasi intent selesai/dibatalkan: ${err.message}`, 'info');
            });
        };

        document.getElementById('clear-log').onclick = () => {
            logDiv.innerHTML = '';
        };
    </script>
</body>
</html>
