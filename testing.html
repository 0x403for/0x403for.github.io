<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>File Access Test</title></head>
<body>
  <h2>file:// Access Test</h2>
  <button onclick="tryFile()">Try load file://</button>
  <pre id="out"></pre>
  <script>
    function tryFile() {
      const urls = [
        'file:///etc/hosts',
        'file:///sdcard/',
        'file:///android_asset/',
        'file:///data/data/'
      ];
      const results = [];
      urls.forEach(u => {
        const img = new Image();
        img.onload = () => results.push(`[LOADED] ${u}`);
        img.onerror = () => results.push(`[blocked] ${u}`);
        img.src = u;
      });
      setTimeout(() => {
        document.getElementById('out').textContent = results.join('\n') || 'Tidak ada yang load (bagus).';
      }, 2000);
    }
  </script>
</body>
</html>
