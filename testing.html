<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Security Test</title>
    <style>
        body { font-family: monospace; padding: 20px; line-height: 1.4; font-size: 14px; }
        .log { background: #000; color: #0f0; padding: 10px; border-radius: 5px; margin-top: 20px; word-break: break-all; }
        button { width: 100%; padding: 15px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Security Sandbox</h2>
    <button onclick="runTest()">Uji Clipboard (Click Me)</button>
    
    <div class="log" id="logBox">Status: Menunggu aksi...</div>

    <script>
        function log(msg) {
            document.getElementById('logBox').innerText = msg;
            console.log(msg);
        }

        async function runTest() {
            const ATTACKER_ADDR = "0xATTACKER_TEST_ADDRESS";
            
            log("Mencoba akses clipboard...");
            
            try {
                // Mencoba menulis ke clipboard setelah klik (interaksi user)
                await navigator.clipboard.writeText(ATTACKER_ADDR);
                log("SUKSES: Clipboard tertulis!");
            } catch (err) {
                log("DIBLOKIR/ERROR: " + err.message);
            }
        }
    </script>
</body>
</html>
