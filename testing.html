<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Impersonation Detector - 1inch iOS</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); }
        h1 { color: #c62828; text-align: center; }
        button { background: #c62828; color: white; padding: 18px; margin: 12px 0; width: 100%; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; }
        .log { margin-top: 25px; padding: 20px; background: #fff; border: 3px solid #ffcdd2; border-radius: 16px; max-height: 650px; overflow-y: auto; }
        .warning { color: #c62828; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 ROUTER IMPERSONATION DETECTOR</h1>
        <p><strong>Bug Paling Berbahaya di 1inch Wallet iOS</strong></p>

        <button id="connect">1. Hubungkan Wallet</button>
        <button id="testRouter">2. Test Router Impersonation</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        const logDiv = document.getElementById('log');

        function log(text) {
            const div = document.createElement('div');
            div.style.margin = '10px 0';
            div.style.padding = '12px';
            div.style.borderRadius = '8px';
            div.innerHTML = text;
            logDiv.prepend(div);
        }

        if (window.ethereum) {
            const orig = window.ethereum.request;
            window.ethereum.request = async function (args) {
                log(`INTERCEPTED: ${args.method}`);

                const tx = args.params?.[0] || {};

                if (tx.to) {
                    const to = tx.to.toLowerCase();
                    // Router resmi 1inch
                    const realRouters = [
                        "0x1111111254eeb25477b68fb85ed929f73a960582",
                        "0x111111125421ca6dc452d289314280a0f8842a65"
                    ];

                    // Cek apakah mirip tapi bukan yang asli
                    if (to.includes("11111112") && !realRouters.some(r => r === to)) {
                        log(`<span class="warning">🚨 ROUTER IMPERSONATION TERDETEKSI!<br>Alamat: ${to}<br>Penyerang membuat router palsu!</span>`, 'warning');
                    }
                }

                return orig.apply(this, arguments);
            };

            log('✅ Router Impersonation Detector aktif!', 'green');
        } else {
            log('❌ Buka di 1inch Wallet iOS Browser', 'red');
        }

        document.getElementById('connect').onclick = () => window.ethereum.request({method: 'eth_requestAccounts'}).catch(()=>{});
        document.getElementById('testRouter').onclick = () => {
            const fakeRouter = "0x1111111254eeb25477b68fb85ed929f73a96058f"; // mirip tapi palsu
            window.ethereum.request({method: 'eth_sendTransaction', params: [{to: fakeRouter}]}).catch(()=>{});
        };
    </script>
</body>
</html>
