<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Tanda Tangan dApp</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body>
    <h1>Pengujian Keamanan Tanda Tangan</h1>
    <button id="connectBtn">1. Hubungkan Dompet</button>
    <hr>
    <h3>Uji Tanda Tangan (Simulasi)</h3>
    <button id="signPlainBtn" disabled>2a. Personal Sign (Raw Text)</button>
    <button id="signTypedBtn" disabled>2b. EIP-712 Sign (Structured Data)</button>

    <script>
        let provider, signer;

        document.getElementById('connectBtn').onclick = async () => {
            if (window.ethereum) {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                document.getElementById('signPlainBtn').disabled = false;
                document.getElementById('signTypedBtn').disabled = false;
                alert("Dompet terhubung!");
            }
        };

        // 2a. Skenario Blind Signing (Raw Text)
        document.getElementById('signPlainBtn').onclick = async () => {
            const message = "Apakah Anda setuju memberikan akses penuh ke aset Anda?";
            const signature = await signer.signMessage(message);
            console.log("Personal Signature:", signature);
            alert("Tanda tangan (Personal) selesai. Cek konsol!");
        };

        // 2b. Skenario EIP-712 (Structured Data - Lebih Aman)
        document.getElementById('signTypedBtn').onclick = async () => {
            const domain = { name: 'Test Dapp', version: '1', chainId: 1, verifyingContract: '0x0000000000000000000000000000000000000000' };
            const types = { Mail: [{ name: 'from', type: 'address' }, { name: 'message', type: 'string' }] };
            const value = { from: await signer.getAddress(), message: 'Halo, ini pesan terstruktur!' };
            
            // Menggunakan fungsi provider untuk signTypedData
            const signature = await provider.send('eth_signTypedData_v4', [await signer.getAddress(), JSON.stringify({ domain, types, primaryType: 'Mail', message: value })]);
            console.log("EIP-712 Signature:", signature);
            alert("Tanda tangan (Typed Data) selesai. Cek konsol!");
        };
    </script>
</body>
</html>
