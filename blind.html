<!DOCTYPE html>
<html>
<body>
    <h1>Uji Coba Tanda Tangan</h1>
    <button id="connectBtn">Hubungkan Dompet</button>
    <button id="signBtn" disabled>Tanda Tangani Pesan</button>
    <p id="status">Status: Belum terhubung</p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script>
        let provider, signer;

        document.getElementById('connectBtn').onclick = async () => {
            // Deteksi provider (MetaMask atau dompet EVM lainnya)
            const ethProvider = window.ethereum || window.web3?.currentProvider;
            
            if (ethProvider) {
                provider = new ethers.providers.Web3Provider(ethProvider);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                document.getElementById('status').innerText = "Status: Terhubung (EVM)";
                document.getElementById('signBtn').disabled = false;
            } else {
                alert("Tidak ada provider Ethereum terdeteksi. Apakah dompet Anda berbasis EVM?");
            }
        };

        document.getElementById('signBtn').onclick = async () => {
            try {
                const message = "Ini adalah pesan uji coba keamanan.";
                const signature = await signer.signMessage(message);
                console.log("Tanda tangan:", signature);
                alert("Berhasil! Tanda tangan telah dibuat.");
            } catch (err) {
                console.error(err);
                alert("Gagal menandatangani: " + err.message);
            }
        };
    </script>
</body>
</html>
