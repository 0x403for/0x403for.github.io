<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Data Persistence</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Uji Data Persistence (WebView)</h1>
    
    <div id="status-box" style="border: 1px solid #ccc; padding: 10px; margin-bottom: 20px;">
        <p>Data Tersimpan: <strong id="data-display">Tidak ada</strong></p>
    </div>

    <input type="text" id="userInput" placeholder="Masukkan teks rahasia...">
    <button onclick="saveData()">Simpan Data</button>
    <button onclick="clearData()" style="color: red;">Hapus Data Manual</button>

    <script>
        function updateDisplay() {
            const saved = localStorage.getItem('test_secret');
            document.getElementById('data-display').innerText = saved ? saved : "Tidak ada data";
        }

        function saveData() {
            const val = document.getElementById('userInput').value;
            localStorage.setItem('test_secret', val);
            alert("Data tersimpan di LocalStorage!");
            updateDisplay();
        }

        function clearData() {
            localStorage.removeItem('test_secret');
            updateDisplay();
        }

        // Tampilkan data saat halaman dimuat
        updateDisplay();
    </script>
</body>
</html>
