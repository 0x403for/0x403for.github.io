<!DOCTYPE html>
<html>
<head>
    <title>Uji Coba WalletConnect</title>
    <!-- Memuat SDK WalletConnect -->
    <script type="module">
        import { WalletConnectModal } from 'https://unpkg.com/@walletconnect/modal@latest';
        import { EthereumProvider } from 'https://unpkg.com/@walletconnect/ethereum-provider@latest';

        const projectId = 'YOUR_PROJECT_ID'; // Anda harus daftar di cloud.walletconnect.com untuk mendapatkan ID ini

        const modal = new WalletConnectModal({ projectId });

        document.getElementById('connectBtn').onclick = async () => {
            const provider = await EthereumProvider.init({
                projectId,
                chains: [1], // Mainnet
            });

            await provider.enable();
            alert("Terhubung dengan: " + provider.accounts[0]);
            document.getElementById('signBtn').disabled = false;
        };
    </script>
</head>
<body>
    <h1>Uji Coba dengan WalletConnect</h1>
    <button id="connectBtn">Hubungkan dengan WalletConnect</button>
    <button id="signBtn" disabled>Tanda Tangani Pesan</button>
</body>
</html>
