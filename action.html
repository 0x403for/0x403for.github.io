<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Address Validator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 2px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        #error-msg { color: red; font-size: 0.85em; display: none; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h3>Pengiriman Dana</h3>
    <input type="text" id="addressInput" placeholder="Masukkan alamat tujuan (0x...)">
    <div id="error-msg">⚠️ Alamat tidak valid! Pastikan format benar.</div>
    <button id="sendBtn">Kirim Transaksi</button>
</div>

<script>
    // Fungsi validasi alamat (Regex standar Ethereum/EVM)
    function isValidAddress(address) {
        return /^0x[a-fA-F0-9]{40}$/.test(address);
    }

    const input = document.getElementById('addressInput');
    const errorMsg = document.getElementById('error-msg');
    const sendBtn = document.getElementById('sendBtn');

    sendBtn.onclick = async () => {
        const address = input.value;

        if (!isValidAddress(address)) {
            errorMsg.style.display = 'block';
            input.style.borderColor = 'red';
            return;
        }

        // Jika valid, hapus error dan lanjut
        errorMsg.style.display = 'none';
        input.style.borderColor = '#ddd';
        
        alert("Alamat valid! Membuka dompet...");
        // Di sini Anda bisa memanggil window.ethereum.request(...)
    };
</script>

</body>
</html>
