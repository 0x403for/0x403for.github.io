<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Anti-Reentrancy UI Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .log { margin-top: 20px; color: #555; }
    </style>
</head>
<body>

    <h3>Uji Pertahanan Klik Ganda</h3>
    <button id="withdrawBtn">Tarik Dana (Withdraw)</button>
    <div id="log" class="log">Siap melakukan aksi...</div>

    <script>
        const btn = document.getElementById('withdrawBtn');
        const log = document.getElementById('log');

        btn.onclick = async () => {
            // 1. KUNCI tombol agar tidak bisa ditekan lagi
            btn.disabled = true;
            btn.innerText = "Memproses...";
            log.innerText = "Aksi dimulai, menunggu konfirmasi blockchain...";

            try {
                // Simulasi interaksi blockchain (asynchronous)
                await new Promise(resolve => setTimeout(resolve, 3000));
                log.innerText = "Transaksi sukses!";
            } catch (err) {
                log.innerText = "Transaksi gagal.";
            } finally {
                // 2. BUKA kembali tombol setelah proses selesai
                btn.disabled = false;
                btn.innerText = "Tarik Dana (Withdraw)";
            }
        };
    </script>
</body>
</html>
