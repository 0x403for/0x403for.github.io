<!DOCTYPE html>
<html lang="id">
<head>
    <title>dApp Rentan (Vulnerable)</title>
</head>
<body>
    <h3>Sistem Login dApp</h3>
    <button onclick="login()">Simulasi Login Web3</button>

    <script>
        function login() {
            // SKENARIO NYATA: dApp menyimpan token JWT dan alamat dompet plaintext
            // Ini adalah praktek buruk yang sering dieksploitasi
            const mockToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.some_secret_signature";
            const mockAddress = "0x23907fd2b12f2faa5c1bdb12465d896b4bba3ffe";

            localStorage.setItem('web3_session', JSON.stringify({ 
                account: mockAddress, 
                timestamp: Date.now() 
            }));
            
            // Penyimpanan kunci akses yang seharusnya di memori, malah di localStorage
            localStorage.setItem('secret_key', mockToken);
            
            alert("Login berhasil! Data sensitif tersimpan di LocalStorage.");
        }
    </script>
</body>
</html>
