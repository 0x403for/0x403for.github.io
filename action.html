<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Network Switching Auditor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8fafc; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .alert { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; margin: 10px 0; display: none; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2563eb; color: white; cursor: pointer; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="box">
    <h3>Network Security Test</h3>
    <div id="network-alert" class="alert">⚠️ Salah Jaringan! Harap pindah ke BSC (Chain ID: 56)</div>
    <div id="status">Memeriksa jaringan...</div>
    <button id="actionBtn" disabled>Lakukan Transaksi</button>
</div>

<script>
    // Konfigurasi jaringan yang diizinkan (Contoh: BSC Mainnet adalah 56)
    const REQUIRED_CHAIN_ID = '0x38'; // 56 dalam format Hex

    async function checkNetwork() {
        const networkAlert = document.getElementById('network-alert');
        const actionBtn = document.getElementById('actionBtn');
        const statusEl = document.getElementById('status');

        try {
            const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
            
            if (currentChainId !== REQUIRED_CHAIN_ID) {
                networkAlert.style.display = 'block';
                actionBtn.disabled = true;
                statusEl.innerText = "Jaringan saat ini: " + currentChainId;
            } else {
                networkAlert.style.display = 'none';
                actionBtn.disabled = false;
                statusEl.innerText = "Jaringan: BSC Mainnet (Terhubung)";
            }
        } catch (err) {
            console.error(err);
        }
    }

    // Listener untuk deteksi pindah jaringan secara real-time
    if (window.ethereum) {
        window.ethereum.on('chainChanged', (chainId) => {
            checkNetwork();
        });

        // Jalankan pengecekan pertama kali
        checkNetwork();
    }
</script>

</body>
</html>
