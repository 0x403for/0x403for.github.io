<script>
    const statusEl = document.getElementById('status');

    async function initWeb3() {
        // Beri jeda 500ms untuk memastikan dompet selesai melakukan injeksi ke window
        await new Promise(resolve => setTimeout(resolve, 500));

        if (typeof window.ethereum !== 'undefined') {
            // Kita coba deteksi dengan beberapa kemungkinan properti yang digunakan 1inch
            const is1Inch = window.ethereum.is1InchWallet || 
                            window.ethereum.isOneInch || 
                            (window.ethereum.providers && window.ethereum.providers.find(p => p.is1InchWallet || p.isOneInch));

            if (is1Inch) {
                statusEl.innerText = "1inch Wallet terdeteksi. Menghubungkan...";
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    statusEl.innerText = "Berhasil terhubung: " + accounts[0];
                } catch (error) {
                    statusEl.innerText = "Koneksi dibatalkan.";
                }
            } else {
                // Jika bukan 1inch, tampilkan apa yang sebenarnya terdeteksi untuk debugging
                statusEl.innerText = "Terdeteksi dompet lain (Bukan 1inch).";
                console.log("Ethereum provider:", window.ethereum);
            }
        } else {
            statusEl.innerText = "Browser Web3 tidak ditemukan.";
        }
    }

    window.addEventListener('load', initWeb3);
</script>
