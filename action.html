<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure DApp | Network & Account Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8fafc; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        #status { margin: 15px 0; color: #334155; font-weight: bold; }
        .log { font-size: 0.85em; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Sync Test</h3>
        <div id="status">Menunggu koneksi...</div>
        <button id="connectBtn">Hubungkan Wallet</button>
        <div class="log" id="log"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');

        function updateLog(msg) {
            logEl.innerHTML += `<div>> ${msg}</div>`;
        }

        async function initListeners() {
            if (!window.ethereum) return;

            // 1. Deteksi Perubahan Akun
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length > 0) {
                    updateLog("Akun berubah! Melakukan sinkronisasi...");
                    window.location.reload(); // Refresh untuk memastikan state dApp sinkron
                } else {
                    updateLog("Dompet terputus.");
                    statusEl.innerText = "Wallet terputus.";
                }
            });

            // 2. Deteksi Perubahan Jaringan (Chain)
            window.ethereum.on('chainChanged', (chainId) => {
                updateLog("Jaringan berubah ke: " + chainId + ". Refreshing...");
                window.location.reload(); // Wajib refresh saat network pindah
            });
        }

        document.getElementById('connectBtn').onclick = async () => {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                statusEl.innerText = "Terhubung: " + accounts[0].substring(0,6) + "...";
                updateLog("Koneksi sukses.");
                initListeners(); // Pasang monitor setelah sukses terhubung
            } catch (err) {
                updateLog("Error: " + err.message);
            }
        };
    </script>
</body>
</html>
