<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Stress: Race Condition</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .test-box { border: 1px solid #ccc; padding: 20px; margin: 10px; border-radius: 10px; }
        button { padding: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="test-box">
        <h3>1. Versi BUGGY (Tanpa Proteksi)</h3>
        <button id="btnBuggy" style="background: #fca5a5;">Kirim Transaksi (Akan Spam!)</button>
        <p>Klik berkali-kali secepat mungkin.</p>
    </div>

    <div class="test-box">
        <h3>2. Versi FIXED (Dengan Anti-Spam)</h3>
        <button id="btnFixed" style="background: #86efac;">Kirim Transaksi (Aman)</button>
        <p>Tombol terkunci saat ditekan.</p>
    </div>

    <script>
        // Simulasi fungsi blockchain yang lambat (3 detik)
        const simulateBlockchain = () => new Promise(resolve => setTimeout(resolve, 3000));

        // VERSI BUGGY: Tidak ada `disabled`, memicu race condition
        document.getElementById('btnBuggy').onclick = async () => {
            console.log("Buggy: Transaksi dikirim ke dompet...");
            await simulateBlockchain();
            console.log("Buggy: Transaksi selesai.");
        };

        // VERSI FIXED: Menggunakan `disabled` untuk mencegah spam
        const btnFixed = document.getElementById('btnFixed');
        btnFixed.onclick = async () => {
            btnFixed.disabled = true; // KUNCI!
            btnFixed.innerText = "Memproses...";
            
            console.log("Fixed: Transaksi dikirim ke dompet...");
            await simulateBlockchain();
            
            btnFixed.disabled = false; // BUKA!
            btnFixed.innerText = "Kirim Transaksi (Aman)";
            console.log("Fixed: Transaksi selesai.");
        };
    </script>
</body>
</html>
