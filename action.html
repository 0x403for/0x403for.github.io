<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pro Security Auditor V2</title>
    <style>
        body { font-family: 'Courier New', monospace; padding: 20px; background: #0f172a; color: #38bdf8; }
        .audit-box { border: 1px solid #334155; padding: 20px; margin-top: 20px; background: #1e293b; border-radius: 8px; min-height: 200px; }
        .danger { color: #f87171; font-weight: bold; }
        button { padding: 10px 15px; cursor: pointer; background: #0ea5e9; color: white; border: none; border-radius: 4px; margin-bottom: 10px; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
    </style>
</head>
<body>

    <h3>🛡️ Real-Time Storage Auditor</h3>
    <p>Memantau kebocoran data di browser storage secara otomatis.</p>
    
    <button onclick="runAudit()">Audit Sekarang</button>
    <button onclick="clearStorage()" style="background: #64748b;">Bersihkan Storage</button>
    
    <div id="auditResult" class="audit-box">
        </div>

    <script>
        const sensitiveKeywords = ['secret', 'token', 'key', 'private', 'password', 'session', 'account'];

        function runAudit() {
            const container = document.getElementById('auditResult');
            container.innerHTML = "<strong>[AUDIT LOG...]</strong><br><br>";
            
            const storages = [{s: localStorage, n: "LocalStorage"}, {s: sessionStorage, n: "SessionStorage"}];
            
            storages.forEach(item => {
                container.innerHTML += `<u>--- ${item.n} ---</u><br>`;
                if (item.s.length === 0) container.innerHTML += "Kosong.<br><br>";
                
                for (let i = 0; i < item.s.length; i++) {
                    let key = item.s.key(i);
                    let val = item.s.getItem(key);
                    let isSensitive = sensitiveKeywords.some(word => key.toLowerCase().includes(word));
                    
                    container.innerHTML += `<div class="log-entry">
                        ${isSensitive ? '<span class="danger">⚠ ALERT:</span> ' : ''} 
                        <b>${key}</b>: ${val}
                    </div>`;
                }
            });
        }

        // Auto-refresh: Pantau perubahan storage secara berkala
        setInterval(runAudit, 3000); 

        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            runAudit();
        }
    </script>
</body>
</html>
