<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UXSS PoC Simulation</title>
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }

        .window {
            width: 80%;
            max-width: 800px;
            height: 500px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        
        .toolbar {
            background: #e1e1e1;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #ccc;
        }

        .address-bar {
            background: white;
            flex-grow: 1;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 14px;
            color: #555;
        }

        
        #content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .btn-open {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-open:hover { background-color: #0063d1; }

        
        .poc-view {
            display: none;
            width: 100%;
        }

        .warning {
            color: #ff3b30;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .gallery-mock {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        .photo-box {
            background: #eee;
            aspect-ratio: 1/1;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="toolbar">
        <div style="display:flex; gap:5px">
            <div style="width:12px; height:12px; border-radius:50%; background:#ff5f57"></div>
            <div style="width:12px; height:12px; border-radius:50%; background:#ffbd2e"></div>
            <div style="width:12px; height:12px; border-radius:50%; background:#28c940"></div>
        </div>
        <div class="address-bar" id="url-text">http://192.168.1.27/poc</div>
    </div>

    <div id="content">
        <div id="start-view">
            <h1 style="font-weight: 400;">Click Open to See The Puppies!</h1>
            <p style="color: #666;">This may take a few seconds.</p>
            <button class="btn-open" onclick="runExploit()">Open</button>
        </div>

        <div id="exploit-view" class="poc-view">
            <h1 style="margin-top: 0;">UXSS PoC</h1>
            <p class="warning">This Website is Stealing your iCloud Photos</p>
            <hr style="width: 100%; border: 0; border-top: 1px solid #eee;">
            
            <p id="loading-text">Memuat data dari iCloud...</p>
            
            <div class="gallery-mock" id="gallery" style="display:none;">
                <div class="photo-box">Photo 1</div>
                <div class="photo-box">Photo 2</div>
                <div class="photo-box">Photo 3</div>
            </div>
        </div>
    </div>
</div>

<script>
    function runExploit() {
    
        alert("Situs ini meminta akses ke folder 'iCloud Drive'.\n\nKlik OK untuk mengizinkan.");

       
        document.getElementById('start-view').style.display = 'none';
        document.getElementById('exploit-view').style.display = 'block';
        document.getElementById('url-text').innerText = 'https://www.icloud.com/photos (Exploited)';

        
        setTimeout(() => {
            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('gallery').style.display = 'grid';
        }, 1500);
    }
</script>

</body>
</html>
