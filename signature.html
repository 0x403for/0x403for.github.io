<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Audit: Unauthorized Signature Trigger</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        #status { font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <h3>Web3 Provider Security Audit</h3>
    <p>Testing signature request compatibility.</p>
    <button id="signButton">Trigger Signature Request (EIP-712)</button>
    <p id="status">Status: Waiting for connection...</p>

    <script>
        const signButton = document.getElementById('signButton');
        const status = document.getElementById('status');

        async function testSignature() {
            // 1. Cek apakah provider (seperti 1inch Wallet) tersedia
            if (typeof window.ethereum === 'undefined') {
                status.innerText = "Error: No Web3 wallet provider detected.";
                return;
            }

            status.innerText = "Status: Connecting...";

            try {
                // 2. Minta akses akun (diperlukan untuk modern DApp)
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const userAddress = accounts[0];

                const msgParams = JSON.stringify({
                    domain: { chainId: 1, name: 'Security Audit', version: '1' },
                    message: { contents: 'Unauthorized Signature Audit' },
                    primaryType: 'Mail',
                    types: {
                        EIP712Domain: [{ name: 'name', type: 'string' }, { name: 'version', type: 'string' }, { name: 'chainId', type: 'uint256' }],
                        Mail: [{ name: 'contents', type: 'string' }]
                    }
                });

                // 3. Eksekusi signTypedData_v4
                const signature = await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [userAddress, msgParams],
                });

                status.innerText = "SUCCESS: Signature triggered and signed.";
                status.style.color = "green";
                console.log("Signature:", signature);

            } catch (err) {
                console.error(err);
                status.innerText = "Access denied: " + (err.message || "User rejected request");
                status.style.color = "red";
            }
        }

        signButton.addEventListener('click', testSignature);
    </script>
</body>
</html>
