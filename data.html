<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Interaksi Proxy Kontrak</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>
    <h1>Uji Transparansi Proxy</h1>
    <p>Masukkan Alamat Proxy Kontrak:</p>
    <input type="text" id="proxyAddr" placeholder="0x..." style="width: 100%;">
    
    <button id="checkBtn">Simulasi Panggilan Fungsi</button>
    <p id="info"></p>

    <script>
        document.getElementById('checkBtn').addEventListener('click', async () => {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const proxyAddress = document.getElementById('proxyAddr').value;

            try {
                // Simulasi memanggil fungsi 'upgradeTo' atau fungsi logika di Proxy
                const tx = await signer.sendTransaction({
                    to: proxyAddress,
                    data: "0x3659cfe6" // Contoh selector fungsi
                });
                document.getElementById('info').innerText = "Transaksi terkirim: " + tx.hash;
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
