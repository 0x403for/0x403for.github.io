<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Transparansi Data Kontrak</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>
    <h1>Uji Transparansi Transaksi</h1>
    <p>Pengujian: Apakah dompet bisa membaca data fungsi ini?</p>
    <button id="testDataBtn">Kirim Data Kompleks</button>
    <pre id="log">-</pre>

    <script>
        document.getElementById('testDataBtn').addEventListener('click', async () => {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            // Skenario: Mengirim data fungsi 'transfer' ERC-20
            // Apakah dompet menampilkan "Transfer 1 Token" atau hanya "Data Hex"?
            const iface = new ethers.Interface(["function transfer(address to, uint256 amount)"]);
            const encodedData = iface.encodeFunctionData("transfer", [
                "0x000000000000000000000000000000000000dEaD", 
                ethers.parseUnits("1", 18)
            ]);

            try {
                await signer.sendTransaction({
                    to: "0x000000000000000000000000000000000000dEaD",
                    data: encodedData
                });
            } catch (err) {
                document.getElementById('log').innerText = "Ditolak: " + err.message;
            }
        });
    </script>
</body>
</html>
