<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Sandbox WebView</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { border: 2px dashed #dc3545; padding: 20px; background: white; }
        iframe { width: 100%; height: 150px; border: 1px solid #ccc; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Audit Sandbox WebView</h1>
    <p>Status: <span id="status">Menguji...</span></p>

    <div class="card">
        <h3>Iframe Pihak Ketiga:</h3>
        <iframe id="testIframe" src="about:blank"></iframe>
    </div>

    <script>
        // Kita mencoba mengecek apakah iframe bisa mengakses window.ethereum dari halaman induk
        const iframe = document.getElementById('testIframe');
        
        // Memuat konten sederhana ke dalam iframe
        iframe.srcdoc = `
            <html>
                <body>
                    <p>Iframe mencoba akses window.ethereum...</p>
                    <script>
                        try {
                            if (window.parent.ethereum) {
                                document.body.innerHTML += "<h3 style='color:red'>CELAH DITEMUKAN: Iframe bisa mengakses ethereum!</h3>";
                            } else {
                                document.body.innerHTML += "<h3 style='color:green'>Sandbox Aman: Akses terisolasi.</h3>";
                            }
                        } catch(e) {
                            document.body.innerHTML += "<h3>Sandbox Aman (Terjadi error akses)</h3>";
                        }
                    <\/script>
                </body>
            </html>
        `;
    </script>
</body>
</html>
