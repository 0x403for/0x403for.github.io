<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Manipulasi Data Kontrak</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 100px; }
        button { padding: 15px; margin-top: 10px; background: #007bff; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Pengujian Arbitrary Call</h1>
    <p>Target Kontrak (Address):</p>
    <input type="text" id="targetAddr" placeholder="0x..." style="width: 100%;">
    
    <p>Data Transaksi (Hex Payload):</p>
    <textarea id="payload" placeholder="0xa9059cbb..."></textarea>
    
    <button id="sendBtn">Kirim Transaksi</button>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            
            const target = document.getElementById('targetAddr').value;
            const data = document.getElementById('payload').value;

            try {
                const tx = await signer.sendTransaction({
                    to: target,
                    data: data // Payload inilah yang akan dieksekusi oleh kontrak
                });
                alert("Transaksi berhasil dikirim. Hash: " + tx.hash);
            } catch (err) {
                console.error("Kesalahan:", err);
            }
        });
    </script>
</body>
</html>
