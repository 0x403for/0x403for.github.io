<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>1inch test </title>
<style>
  body { font-family: monospace; font-size: 12px; padding: 12px; background: #111; color: #eee; }
  .log { margin: 3px 0; word-break: break-all; }
  .red { color: #ff5555; font-weight: bold; }
  .purple { color: #c084fc; }
  .blue { color: #60a5fa; }
  .green { color: #4ade80; }
</style>
</head>
<body>
<h3 style="margin:0 0 8px 0; color:#fff">1inch Hijack Test v13</h3>
<div style="color:#aaa; font-size:11px; margin-bottom:12px">Deep Callback & Property Hijacking POC...</div>
<hr style="border-color:#333; margin:8px 0">

<script>
  // simple logger
  function log(msg, cls = "") {
    const d = document.createElement("div");
    d.className = "log " + cls;
    d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    document.body.prepend(d);
    console.log(msg);
  }

  // deep trap pake Proxy
  function applyDeepTrap(name) {
    if (!window[name]) return;

    log(`[!] Found window.${name}. Applying deep trap...`, "purple");

    const original = window[name];

    try {
      window[name] = new Proxy(original, {
        get(target, prop, receiver) {
          const val = Reflect.get(target, prop, receiver);

          // trap function
          if (typeof val === "function") {
            return function (...args) {
              log(`🚨 CALLED ${name}.${String(prop)}(...) -> Args: ${JSON.stringify(args)}`, "red");
              return val.apply(this === receiver ? target : this, args);
            };
          }

          // trap nested object juga (biar lebih dalam)
          if (val && typeof val === "object") {
            try {
              return new Proxy(val, {
                get(t, p, r) {
                  const v = Reflect.get(t, p, r);
                  if (typeof v === "function") {
                    return function (...a) {
                      log(`🚨 CALLED ${name}.${String(prop)}.${String(p)}(...) -> Args: ${JSON.stringify(a)}`, "red");
                      return v.apply(this, a);
                    };
                  }
                  return v;
                }
              });
            } catch (e) {}
          }

          return val;
        },

        set(target, prop, value) {
          log(`[SET] ${name}.${String(prop)} = ${value}`, "blue");
          return Reflect.set(target, prop, value);
        }
      });

      log(`[+] Initializing Deep Callback Interceptor v13...`, "blue");
    } catch (err) {
      log(`[x] gagal trap ${name}: ${err.message}`, "red");
    }
  }

  // coba intercept defineProperty juga (kadang wallet inject belakangan)
  const _defineProperty = Object.defineProperty;
  Object.defineProperty = function (obj, prop, desc) {
    if (obj === window && (prop === "OneInchIOSWallet" || prop === "OneInchSolanaWallet")) {
      log(`[!] window.${prop} lagi di-define...`, "red");
    }
    return _defineProperty.apply(this, arguments);
  };

  // jalanin setelah page load
  window.addEventListener("load", () => {
    log("1inch Full Coverage Test v13 Loaded");
    
    // kasih jeda dikit biar object wallet sempet inject
    setTimeout(() => {
      applyDeepTrap("OneInchSolanaWallet");
      applyDeepTrap("OneInchIOSWallet");
      
      // coba lagi beberapa kali soalnya kadang object muncul belakangan
      let tries = 0;
      const interval = setInterval(() => {
        tries++;
        applyDeepTrap("OneInchSolanaWallet");
        applyDeepTrap("OneInchIOSWallet");
        if (tries > 8) clearInterval(interval);
      }, 600);
    }, 250);
  });
</script>

<div style="margin-top:20px; color:#666; font-size:11px; line-height:1.5">
  <b>Instruksi Pengujian :</b><br>
  1. Buka halaman ini di dApp browser 1inch.<br>
  2. Lakukan proses Swap atau panggil fungsi transaksi/signing.<br>
  3. Perhatikan apakah ada log merah baru yang mencetak fungsi turunan (seperti *exec*callback* dll).
</div>
</body>
