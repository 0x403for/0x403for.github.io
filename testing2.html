<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1inch dApp Advanced Security Test PoC</title>
    <style>
        body { font-family: monospace; font-size: 11px; padding: 10px; background: #0f172a; color: #f8fafc; }
        .log-box { background: #1e293b; border: 1px: solid #334155; padding: 8px; margin-top: 8px; max-height: 250px; overflow-y: auto; border-radius: 4px; }
        .log { margin: 3px 0; word-break: break-all; }
        .critical { color: #f87171; font-weight: bold; }
        .high { color: #fb923c; }
        .info { color: #38bdf8; }
        .success { color: #4ade80; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 12px; margin: 4px 2px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <h3 style="margin:0 0 5px 0; color:#fff">1inch dApp Advanced Security Tester</h3>
    <div style="color:#94a3b8; font-size:10px; margin-bottom:10px">Modul Pengujian Terpadu: TX Hijacking, API Interception, Chain Validation & Local Storage</div>
    <hr style="border-color:#334155; margin:6px 0">

    <div>
        <button onclick="runLocalStorageAudit()">1. Cek LocalStorage</button>
        <button onclick="runProviderAudit()">2. Audit Bridge Object</button>
        <button onclick="testTransactionSimulation()">3. Simulasi TX Hook</button>
    </div>

    <div class="log-box" id="consoleLog">
        <div class="log info">[System] PoC siap dijalankan di lingkungan dApp browser.</div>
    </div>

<script>
    function log(msg, type = "info") {
        const box = document.getElementById("consoleLog");
        const div = document.createElement("div");
        div.className = "log " + type;
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        box.prepend(div);
        console.log(msg);
    }

    // Modul 1: Pemeriksaan Penyimpanan Lokal (Sensitive Data / LocalStorage)
    function runLocalStorageAudit() {
        log("--- Memulai Audit LocalStorage & SessionStorage ---", "info");
        try {
            const lsCount = localStorage.length;
            log(`Total item di localStorage: ${lsCount}`, "info");
            for (let i = 0; i < lsCount; i++) {
                const key = localStorage.key(i);
                const val = localStorage.getItem(key);
                // Menandai jika ada kunci yang mencurigakan atau menyimpan data sensitif mentah
                const isSensitive = /key|token|auth|seed|mnemonic|account/i.test(key);
                const cls = isSensitive ? "critical" : "success";
                log(`[LS] Key: "${key}" => Value: ${val ? val.substring(0, 40) + '...' : 'kosong'}`, cls);
            }
        } catch (e) {
            log(`Gagal membaca localStorage: ${e.message}`, "critical");
        }
    }

    // Modul 2: Audit Objek Provider & Bridge Bawaan
    function runProviderAudit() {
        log("--- Memulai Audit Objek Provider & Jembatan Native ---", "info");
        const targets = ['ethereum', 'OneInchIOSWallet', 'OneInchSolanaWallet', 'coin98'];
        
        targets.forEach(targetName => {
            if (window[targetName]) {
                log(`[+] Ditemukan objek global: window.${targetName}`, "success");
                try {
                    const props = Object.getOwnPropertyNames(window[targetName]);
                    log(`    Properti/Metode: ${props.slice(0, 12).join(', ')}`, "info");
                } catch (err) {
                    log(`    Gagal membaca properti ${targetName}`, "high");
                }
            } else {
                log(`[-] Tidak ditemukan: window.${targetName}`, "info");
            }
        });
    }

    // Modul 3: Simulasi Hooking / Intersepsi Parameter Transaksi (TX Hijacking / API Interception)
    function testTransactionSimulation() {
        log("--- Menguji Kait Parameter Transaksi (TX Hook) ---", "info");
        if (window.ethereum && typeof window.ethereum.request === 'function') {
            log("[*] window.ethereum terdeteksi aktif. Mencoba memantau metode request...", "info");
            
            // Menyadap fungsi request untuk melihat apakah parameter transaksi bisa dibaca/dimodifikasi
            const originalRequest = window.ethereum.request;
            window.ethereum.request = async function(args) {
                log(`🚨 TERDETEKSI PEMANGGILAN METHOD: ${args.method}`, "critical");
                if (args.params) {
                    log(`    Parameter: ${JSON.stringify(args.params).substring(0, 120)}...`, "high");
                }
                return originalRequest.apply(this, arguments);
            };
            log("[+] Berhasil memasang hook pada window.ethereum.request", "success");
        } else {
            log("[-] window.ethereum.request tidak tersedia atau dibatasi.", "high");
        }
    }

    window.onload = function() {
        log("Inisialisasi skrip pengujian berhasil dimuat.");
    };
</script>
</body>
</html>
