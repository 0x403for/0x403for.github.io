<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cross-Chain Signature Replay</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #ffffff; color: #000000; }
        .container { background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #000000; max-width: 400px; margin: auto; }
        h2 { font-size: 18px; margin-top: 0; text-align: center; }
        button { background: #000000; color: #ffffff; padding: 12px; width: 100%; border: none; border-radius: 4px; margin: 10px 0; font-weight: bold; cursor: pointer; }
        .log { background: #f0f0f0; color: #000000; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 12px; margin-top: 10px; border: 1px solid #ccc; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cross-Chain Signature Replay</h2>
        <button id="exploitSign">Attempt Malicious Sign</button>
        <div class="log" id="logs">Status: Ready to test...</div>
    </div>

    <script>
        function log(msg) { document.getElementById('logs').innerHTML += `<br>> ${msg}`; }

        document.getElementById('exploitSign').onclick = async () => {
            const malAddress = '0x1111111254eeb25477b68fb85ed929f73a960582';
            const message = "0x5369676e207468697320746f20617070726f7665207472616e73666572"; 
            
            log("Attempting personal_sign with mismatched Chain ID...");
            
            try {
                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [message, malAddress] 
                });
                log("SIGNATURE CAPTURED: " + signature.substring(0,20) + "...");
                log("CRITICAL: Browser allowed signature without chain validation!");
            } catch (e) {
                log("Blocked: " + e.message);
            }
        };
    </script>
</body>
</html>
