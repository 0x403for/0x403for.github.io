<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1inch iOS Detector - Chain & Signature</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        h1 { color: #d32f2f; text-align: center; }
        button { 
            background: #d32f2f; color: white; padding: 16px; margin: 12px 0; 
            width: 100%; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; 
        }
        .log-container { margin-top: 25px; padding: 20px; background: #fff; border: 2px solid #ffcdd2; border-radius: 12px; max-height: 700px; overflow-y: auto; }
        .warning { color: #c62828; font-weight: bold; }
        .success { color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Chain & Signature Detector</h1>
        <p><strong>Untuk 1inch Wallet iOS</strong><br>Fokus: Chain ID Manipulation & Signature Reuse</p>

        <button id="connectWallet">1. Hubungkan 1inch Wallet</button>
        <button id="testChain">2. Test Chain ID Manipulation</button>
        <button id="testSignature">3. Test Signature Reuse</button>

        <div class="log-container">
            <h3>🔴 Log Deteksi</h3>
            <div id="logs"></div>
        </div>
    </div>

    <script>
        const logsDiv = document.getElementById('logs');

        function appendLog(message, type = 'info') {
            const item = document.createElement('div');
            item.className = `log-item ${type}`;
            item.innerHTML = message;
            logsDiv.prepend(item);
        }

        let lastSignature = null;

        if (window.ethereum) {
            const originalRequest = window.ethereum.request;

            window.ethereum.request = async function (args) {
                appendLog(`<strong>🔍 INTERCEPTED: ${args.method}</strong>`, 'info');

                // Chain ID Manipulation
                if (args.method === 'eth_sendTransaction' && args.params[0].chainId) {
                    appendLog(`<span class="warning">🚨 CHAIN ID MANIPULATION terdeteksi!<br>Transaksi dikirim ke chain yang mungkin salah.</span>`, 'warning');
                }

                // Signature Reuse Detection
                if (args.method === 'personal_sign' || args.method === 'eth_sign' || args.method.includes('signTypedData')) {
                    const sigData = JSON.stringify(args.params);
                    if (lastSignature === sigData) {
                        appendLog(`<span class="warning">🚨 SIGNATURE REUSE terdeteksi!<br>Signature yang sama dipakai berulang kali. Sangat berbahaya!</span>`, 'warning');
                    }
                    lastSignature = sigData;
                }

                try {
                    const result = await originalRequest.apply(this, arguments);
                    appendLog(`✅ Berhasil`, 'success');
                    return result;
                } catch (error) {
                    appendLog(`❌ Ditolak: ${error.message}`, 'warning');
                    throw error;
                }
            };

            appendLog('✅ Detector Chain & Signature aktif untuk 1inch iOS!', 'success');
        } else {
            appendLog('❌ Buka halaman ini di dalam 1inch Wallet Browser.', 'warning');
        }

        // Button Actions
        document.getElementById('connectWallet').addEventListener('click', async () => {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                appendLog(`✅ Terhubung: ${accounts[0].slice(0,12)}...`, 'success');
            } catch (e) { appendLog('Gagal connect', 'warning'); }
        });

        document.getElementById('testChain').addEventListener('click', async () => {
            const tx = {
                to: "0x1111111254eeb25477b68fb85ed929f73a960582",
                chainId: "0x89", // Polygon (contoh manipulation)
                data: "0x"
            };
            await window.ethereum.request({ method: 'eth_sendTransaction', params: [tx] }).catch(() => {});
        });

        document.getElementById('testSignature').addEventListener('click', async () => {
            const message = "0x546869732069732061207465737420666f72207369676e61747572652072657573652061747461636b";
            try {
                await window.ethereum.request({ 
                    method: 'personal_sign', 
                    params: [message, window.ethereum.selectedAddress] 
                });
            } catch (e) {}
        });
    </script>
</body>
</html>
