<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC: Cross-Chain Signature Replay</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #ffffff; color: #000000; }
        .container { background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #000000; max-width: 400px; margin: auto; }
        h2 { font-size: 18px; margin-top: 0; text-align: center; }
        button { background: #000000; color: #ffffff; padding: 12px; width: 100%; border: none; border-radius: 4px; margin: 10px 0; font-weight: bold; cursor: pointer; }
        .log { background: #f0f0f0; color: #000000; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 12px; margin-top: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cross-Chain Replay Test</h2>
        <button id="signBtn">Generate Cross-Chain Signature</button>
        <div class="log" id="logs">Status: Ready...</div>
    </div>

    <script>
        function log(msg) { document.getElementById('logs').innerHTML += `<br>${msg}`; }

        document.getElementById('signBtn').onclick = async () => {
            const domain = {
                name: "1inch Exchange",
                version: "1",
                chainId: 137, // Target Chain ID (Polygon)
                verifyingContract: "0x1111111254eeb25477b68fb85ed929f73a960582"
            };

            const message = {
                action: "ApproveTransfer",
                amount: 1000
            };

            const data = JSON.stringify({
                types: {
                    EIP712Domain: [{ name: "name", type: "string" }, { name: "version", type: "string" }, { name: "chainId", type: "uint256" }, { name: "verifyingContract", type: "address" }],
                    Action: [{ name: "action", type: "string" }, { name: "amount", type: "uint256" }]
                },
                primaryType: "Action",
                domain,
                message
            });

            log("Requesting signature for ChainID 137 (Polygon)...");
            
            try {
                const signature = await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [window.ethereum.selectedAddress, data]
                });
                
                log("Signature Received: " + signature.substring(0, 20) + "...");
                log("<b>Check:</b> Can this signature be replayed on Mainnet (ChainID 1)?");
                log("If the backend verifies this signature without checking the domain.chainId, this is a CRITICAL vulnerability.");
            } catch (e) {
                log("Error: " + e.message);
            }
        };
    </script>
</body>
</html>
