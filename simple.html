<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Simple - Target Fenced Frame</title></head>
<body>
<h1>Target Page</h1>
<p id="secret">SECRET-TOKEN-12345-FENCED-FRAME</p>
<p>URL: <span id="url"></span></p>
<script>
document.getElementById('url').textContent = location.href;
// Coba leak ke parent (seharusnya di-block di fenced frame)
try {
  parent.postMessage({secret: document.getElementById('secret').textContent}, '*');
} catch(e) {}
</script>
</body>
</html>
