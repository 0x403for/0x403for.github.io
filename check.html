<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEST 5: RANDOM DOM 200x - PALING GANAS</title>
<style>body{font-family:-apple-system;padding:12px;background:#000;color:#ff0} button{width:100%;padding:16px;background:#ff0;color:#000;border:none;border-radius:12px;font-weight:900;font-size:15px} pre{background:#111;color:#0f0;padding:10px;border-radius:8px;font-size:9px;min-height:200px;white-space:pre-wrap;word-break:break-all;border:1px solid #ff0}</style>
</head>
<body>
<h3 style="color:#ff0">TEST 5: RANDOM DOM 200x - PALING GANAS DoS!</h3>
<p style="font-size:10px;color:#888">Bisa crash WebContent! Kalau crash "A problem repeatedly occurred" = DoS $1k!</p>
<button onclick="fuzzRandom()">FUZZ RANDOM DOM 200x - CRASH TEST!</button>
<pre id="c5">Belum test - WARNING: Bisa bikin Safari crash dan reload!</pre>
<div id="arena"></div>
<script>
let crash=0;
function log(m){
 let el=document.getElementById('c5');
 el.innerText+=m+"\n";
 el.scrollTop=el.scrollHeight;
}
async function fuzzRandom(){
 let el=document.getElementById('c5');
 el.innerText="Starting RANDOM DOM 200x - GANAS!\nHP bisa lag!\n";
 let arena=document.getElementById('arena');
 let tags=['model','search','canvas','div','dialog','details','video','audio','select','input','popover','img'];
 
 for(let i=0;i<200;i++){
  try{
   let parent=document.createElement('div');
   parent.style.display='contents';
   
   // Random 1-3 children
   let childCount=1+Math.floor(Math.random()*3);
   for(let j=0;j<childCount;j++){
    let tag=tags[Math.floor(Math.random()*tags.length)];
    let child=document.createElement(tag);
    
    // Setup by tag
    if(tag==='canvas'){
     let ctx=child.getContext('2d');
     ctx.fillStyle=`hsl(${i*2},100%,50%)`;
     ctx.fillRect(0,0,20,20);
     try{ let bmp=child.transferToImageBitmap?.(); if(bmp) bmp.close(); }catch(e){}
    }
    if(tag==='model' || tag==='search' || tag==='dialog'){
     child.setAttribute('popover','');
     child.innerHTML='<span>test</span>';
     try{ child.showPopover?.(); }catch(e){}
     child.addEventListener('beforetoggle', ()=>{
      try{ parent.remove(); }catch(e){}
     });
    }
    if(tag==='video'){ child.src='data:video/mp4;base64,'; }
    if(tag==='img'){ child.src='data:image/gif;base64,[STRIPPED]'; }
    
    child.style.filter=`blur(${Math.random()*5}px)`;
    child.style.transform='translateZ(0)';
    parent.appendChild(child);
    
    // UAF pattern: remove + use
    if(Math.random()>0.5){
     parent.remove();
     try{ child.innerHTML='uaf?'+i; child.style.filter='none'; }catch(e){}
    }
   }
   
   arena.appendChild(parent);
   if(i%2===0) parent.remove();
   
   if(i%20===0){
    log(`Iter ${i}/200 - arena childs: ${arena.childNodes.length}`);
    await new Promise(r=>setTimeout(r,1));
    if(i%40===0) arena.innerHTML='';
   }
   
  }catch(e){
   crash++;
   log(`Iter ${i} exception: ${e.message} crash=${crash}`);
   if(crash>10){ log('STOP: too many errors!'); break; }
  }
 }
 arena.innerHTML='';
 log(`DONE 200x! crashCount=${crash}`);
 log('If no crash popup "A problem occurred" = SAFE! iOS 26.4.1 aman!');
 log('If crash = screenshot! Report DoS ke Apple!');
}
</script>
</body>
</html>
