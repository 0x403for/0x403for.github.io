<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAF Generic Fuzzer SAFE - 5 Areas</title>
<style>body{font-family:-apple-system;padding:12px;background:#000;color:#0f0} button{width:100%;padding:12px;background:#0f0;color:#000;border:none;border-radius:8px;font-weight:700;margin:5px 0} pre{background:#111;color:#0f0;padding:8px;border-radius:6px;font-size:9px;min-height:60px;white-space:pre-wrap;word-break:break-all}</style>
</head>
<body>
<h4>UAF Generic Fuzzer - 5 Areas SAFE DoS Test</h4>

<button onclick="fuzzCanvasGPU()">1. FUZZ CANVAS+WEBGPU (Area baru 26.4)</button>
<pre id="c1">Belum</pre>

<button onclick="fuzzWebAudio()">2. FUZZ WEBAUDIO (AudioNode UAF)</button>
<pre id="c2">Belum</pre>

<button onclick="fuzzIDB()">3. FUZZ INDEXEDDB (Transaction UAF)</button>
<pre id="c3">Belum</pre>

<button onclick="fuzzCSSFilter()">4. FUZZ CSS FILTER (RenderLayer UAF)</button>
<pre id="c4">Belum</pre>

<button onclick="fuzzRandomDOM()" style="background:#ff0">5. FUZZ RANDOM DOM 200x (Paling ganas - bisa crash!)</button>
<pre id="c5">Belum - ini paling berat!</pre>

<script>
function log(id, m){ document.getElementById(id).innerText+=m+"\n"; }

async function fuzzCanvasGPU(){
 let el=document.getElementById('c1'); el.innerText="Testing Canvas+WebGPU...\n";
 try{
  if(!navigator.gpu){ el.innerText+="WebGPU not supported di 26.4.1\n"; return; }
  let canvas=document.createElement('canvas');
  let ctx=canvas.getContext('webgpu');
  let adapter=await navigator.gpu.requestAdapter();
  let device=await adapter.requestDevice();
  let context=canvas.getContext('webgpu');
  context.configure({device, format: navigator.gpu.getPreferredCanvasFormat()});
  for(let i=0;i<10;i++){
   try{
    let texture=context.getCurrentTexture();
    canvas.remove(); // remove while GPU uses it = UAF pattern
    log('c1', `Iter ${i}: texture ${!!texture}, canvas removed`);
    canvas=document.createElement('canvas');
    context=canvas.getContext('webgpu');
    context.configure({device, format: navigator.gpu.getPreferredCanvasFormat()});
   }catch(e){ log('c1', `Iter ${i} SAFE blocked: ${e.message}`); }
  }
  log('c1', 'Done - SAFE if no crash');
 }catch(e){ log('c1', 'Error: '+e.message); }
}

function fuzzWebAudio(){
 let el=document.getElementById('c2'); el.innerText="Testing WebAudio...\n";
 try{
  let ac=new (window.AudioContext||window.webkitAudioContext)();
  let gain=ac.createGain();
  let osc=ac.createOscillator();
  osc.connect(gain); gain.connect(ac.destination);
  osc.start();
  for(let i=0;i<20;i++){
   try{
    gain.disconnect();
    ac.close?.(); // close while processing
    log('c2', `Iter ${i}: disconnect + close`);
    ac=new (window.AudioContext||window.webkitAudioContext)();
    gain=ac.createGain();
    osc=ac.createOscillator();
    osc.connect(gain); gain.connect(ac.destination); osc.start();
   }catch(e){ log('c2', `Iter ${i} SAFE: ${e.message}`); }
  }
  log('c2', 'Done');
 }catch(e){ log('c2', 'Error: '+e.message); }
}

function fuzzIDB(){
 let el=document.getElementById('c3'); el.innerText="Testing IndexedDB...\n";
 try{
  let req=indexedDB.open('uaf-test-'+Date.now(), 1);
  req.onupgradeneeded=(e)=>{
   let db=e.target.result;
   db.createObjectStore('s');
   let tx=e.target.transaction;
   tx.oncomplete=()=>{
    try{ db.deleteObjectStore('s'); log('c3', 'oncomplete: delete store while tx complete = UAF pattern'); }catch(err){ log('c3', 'SAFE blocked: '+err.message); }
   };
  };
  req.onsuccess=()=>{ log('c3', 'IDB open success - SAFE'); req.result.close(); indexedDB.deleteDatabase('uaf-test-'+Date.now()); };
  req.onerror=()=>{ log('c3', 'IDB error - SAFE'); };
 }catch(e){ log('c3', 'Error: '+e.message); }
}

function fuzzCSSFilter(){
 let el=document.getElementById('c4'); el.innerText="Testing CSS Filter...\n";
 let div=document.createElement('div');
 div.style.width='100px'; div.style.height='100px'; div.style.background='red';
 div.style.filter='blur(50px) contrast(200%) hue-rotate(90deg)';
 document.body.appendChild(div);
 for(let i=0;i<30;i++){
  try{
   div.style.filter=`blur(${i}px)`;
   if(i%5===0){ div.remove(); log('c4', `Iter ${i}: remove during filter paint`); div=document.createElement('div'); div.style.width='100px'; div.style.height='100px'; div.style.background='red'; div.style.filter='blur(50px)'; document.body.appendChild(div); }
  }catch(e){ log('c4', `Iter ${i} SAFE: ${e.message}`); }
 }
 div.remove();
 log('c4', 'Done - SAFE');
}

function fuzzRandomDOM(){
 let el=document.getElementById('c5'); el.innerText="Starting RANDOM DOM 200x... Bisa crash!\n";
 let tags=['model','search','canvas','div','span','video','audio','details','dialog','popover','select','input'];
 (async ()=>{
  for(let i=0;i<200;i++){
   try{
    let parent=document.createElement('div');
    let child=document.createElement(tags[Math.floor(Math.random()*tags.length)]);
    if(child.tagName==='CANVAS'){ child.getContext('2d').fillRect(0,0,10,10); }
    if(child.tagName==='MODEL' || child.tagName==='SEARCH'){ child.setAttribute('popover',''); try{child.showPopover?.();}catch(e){} }
    parent.appendChild(child);
    document.body.appendChild(parent);
    // Random remove in callback
    child.addEventListener('beforetoggle', ()=>{ try{parent.remove();}catch(e){} });
    // Immediate use after remove
    parent.remove();
    try{ child.innerHTML='uaf?'; }catch(e){}
    if(i%20===0){ log('c5', `Iter ${i}/200`); await new Promise(r=>setTimeout(r,5)); }
   }catch(e){ log('c5', `Iter ${i} err: ${e.message}`); }
  }
  log('c5', 'DONE 200x! If not crash = SAFE patched!');
 })();
}
</script>
</body>
</html>
