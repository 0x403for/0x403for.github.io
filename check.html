<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>:has() + :visited Leak - Terbaru 26.4.1</title>
<style>
body{font-family:- apple-system;padding:15px;background:#f5f5f7}
.card{background:#fff;padding:12px;border-radius:12px;margin:10px 0}
a:visited{color:purple}
.test:has(a:visited){background:#ff3b30 !important;color:#fff !important}
.test:has(a:visited)::after{content:" - LEAK! User pernah visit!";color:#fff;font-weight:bold}
pre{background:#1c1c1e;color:#00ff41;padding:10px;border-radius:8px;font-size:11px;min-height:50px;white-space:pre-wrap}
</style>
</head>
<body>
<h3>:has() + :visited Leak - Terbaru 26.4.1</h3>

<div class="card test" style="padding:10px;border:1px solid #ccc">
<a href="https://0x403for.github.io">0x403for.github.io (kamu pasti pernah buka!)</a>
</div>

<div class="card test" style="padding:10px;border:1px solid #ccc">
<a href="https://apple.com">apple.com</a>
</div>

<div class="card">
<button onclick="checkLeak()" style="width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:10px">CEK LEAK - :has() + :visited</button>
<pre id="log">Belum test - klik tombol di atas
Kalau background jadi merah = user pernah visit = LEAK!</pre>
</div>

<script>
function checkLeak(){
 let el=document.getElementById('log');
 el.innerText="Checking :has() + :visited...\n";
 let divs=document.querySelectorAll('.test');
 divs.forEach((d,i)=>{
  let bg=window.getComputedStyle(d).backgroundColor;
  el.innerText+=`Div ${i} background: ${bg}\n`;
  if(bg.includes('255, 0, 0') || bg==='red' || bg.includes('59, 0, 48') || bg.includes('rgb(255, 59, 48)')){
   el.innerText+=`🚨 LEAK! Div ${i} merah = user pernah visit link di dalamnya! Privacy leak!\n`;
  }
 });
 let a=document.querySelector('a[href="https://0x403for.github.io"]');
 let color=window.getComputedStyle(a).color;
 el.innerText+=`\nLink 0x403for color: ${color} - kalau purple = pernah visit!\n`;
 el.innerText+="\nKalau merah muncul = 0-DAY :has() + :visited LEAK VALID!";
}
</script>
</body>
</html>
