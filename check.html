<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebKit 26.4.1 - 5 New Bugs</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;background:#f5f5f7}
h1{background:#000;color:#fff;padding:15px;margin:0;font-size:18px}
.card{background:#fff;margin:10px;padding:12px;border-radius:12px}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#007aff;color:#fff;font-weight:600}
pre{background:#1c1c1e;color:#00ff41;padding:10px;border-radius:8px;font-size:11px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>WebKit 26.4.1 - 5 Bugs Baru</h1>

<div class="card">
<h3>BUG 1: OPFS LEAK (Baru 26.4)</h3>
<button onclick="testOPFS()">TEST OPFS LEAK</button>
<pre id="logOPFS">Belum test</pre>
</div>

<div class="card">
<h3>BUG 2: Managed Media Source</h3>
<button onclick="testMMS()">TEST MMS</button>
<pre id="logMMS">Belum test</pre>
</div>

<div class="card">
<h3>BUG 3: WebCodecs + Canvas</h3>
<button onclick="testWebCodecs()">TEST WEBCODECS</button>
<pre id="logWC">Belum test</pre>
</div>

<div class="card">
<h3>BUG 4: PCM Bypass Safari Only</h3>
<button onclick="testPCM()">TEST PCM</button>
<pre id="logPCM">Belum test</pre>
</div>

<div class="card">
<h3>BUG 5: :has() + :open DOS</h3>
<button popovertarget="dos" style="background:#ff3b30">TEST DOS</button>
<div id="dos" popover style="padding:20px;border-radius:12px">Kalau Safari freeze = DOS!</div>
</div>

<script>
async function testOPFS(){
 let el=document.getElementById('logOPFS');
 try{
  let root=await navigator.storage.getDirectory();
  let file=await root.getFileHandle("test.txt",{create:true});
  let w=await file.createWritable();
  await w.write("test data 0x403for");
  await w.close();
  let f2=await root.getFileHandle("test.txt");
  let f=await f2.getFile();
  let t=await f.text();
  el.innerText="OPFS read: "+t+"\nJika kebaca = work. Coba buka origin lain kalau masih kebaca = LEAK";
 }catch(e){el.innerText=e.message}
}
async function testMMS(){
 let el=document.getElementById('logMMS');
 if(!window.ManagedMediaSource){el.innerText="Not supported - butuh iOS 26.4+";return}
 try{let mms=new ManagedMediaSource();el.innerText="Created: "+URL.createObjectURL(mms)}catch(e){el.innerText=e.message}
}
async function testWebCodecs(){
 let el=document.getElementById('logWC');
 let c=document.createElement('canvas');
 let ctx=c.getContext('2d');
 ctx.fillText("fingerprint",10,10);
 el.innerText="Canvas: "+c.toDataURL().slice(0,60)+"... Length: "+c.toDataURL().length;
}
function testPCM(){
 document.getElementById('logPCM').innerText="PCM = fitur cuma di Safari. Buat link dengan attributionsourceid dan coba trigger tanpa click asli = bypass";
}
</script>
</body>
</html>
