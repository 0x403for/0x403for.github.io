<!DOCTYPE html>
<html>
<body>
    <h2>Security Verification: Triggering Transaction UI</h2>
    <script>
        const bridge = window.ethereum;

        async function triggerValidTx() {
            try {
                // Gunakan parameter yang sangat standar
                // Jangan gunakan data '0x...' yang kompleks untuk menghindari error kontrak
                const txParams = {
                    from: '0x23907Fd2B12F2fAA5c1BDB12465d896B4bBa3fFE',
                    to: '0x23907Fd2B12F2fAA5c1BDB12465d896B4bBa3fFE', 
                    value: '0x00', // Nilai nol
                    // Hapus parameter 'data' agar dompet tidak mencoba memanggil fungsi kontrak yang salah
                };

                const result = await bridge.request({
                    method: 'eth_sendTransaction',
                    params: [txParams]
                });
                console.log("Transaksi Diterima:", result);
            } catch (e) {
                console.log("Triggered - UI muncul, namun transaksi dihentikan:", e);
            }
        }

        window.onload = triggerValidTx;
    </script>
</body>
</html>
