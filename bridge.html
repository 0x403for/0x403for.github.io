<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Audit: Identity Theft Proof</title>
    <style>
        body { font-family: monospace; background: #000; color: #fff; padding: 20px; }
        .success { color: #0f0; }
        .data { color: #ff0; }
    </style>
</head>
<body>
    <h2>Critical Security Audit: Identity Leakage</h2>
    <div id="status">Scanning...</div>

    <script>
        async function runAbsoluteProof() {
            const status = document.getElementById('status');
            const bridge = window.ethereum;

            if (!bridge) {
                status.innerHTML = "[-] Bridge not found.";
                return;
            }

            try {
                // Memicu pengambilan akun tanpa interaksi
                // Jika ini berhasil, dompet memberikan alamat dompet ke web jahat
                const accounts = await bridge.request({ method: 'eth_requestAccounts' });
                
                status.innerHTML = `<span class="success">[!] IDENTITY LEAKED!</span><br>
                                    <span class="data">Wallet Address: ${accounts[0]}</span>`;
                
                console.log("Stolen Address:", accounts[0]);
            } catch (err) {
                status.innerHTML = `[!] Bridge responded: ${err.message}`;
            }
        }
        window.onload = runAbsoluteProof;
    </script>
</body>
</html>
