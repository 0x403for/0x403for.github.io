<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Security PoC: Bridge Exposure</title>
</head>
<body>
    <script>
        // Mengakses bridge yang terdeteksi
        const bridge = window.ethereum;

        async function triggerRealTx() {
            // Alamat dompet nyata Anda
            const MY_WALLET_ADDRESS = "0x23907Fd2B12F2fAA5c1BDB12465d896B4bBa3fFE"; 
            
            const txParams = {
                from: MY_WALLET_ADDRESS,
                to: MY_WALLET_ADDRESS, // Mengirim ke diri sendiri
                value: '0x00',         // Nilai 0 (Aman dari kehilangan dana)
                data: '0x'
            };

            console.log("Mencoba memicu transaksi dari: " + MY_WALLET_ADDRESS);

            try {
                // Memanggil fungsi transaksi
                await bridge.request({
                    method: 'eth_sendTransaction',
                    params: [txParams]
                });
            } catch (e) {
                console.error("Transkasi ditolak atau dibatalkan:", e);
            }
        }

        // Memicu secara otomatis saat halaman dimuat
        window.onload = triggerRealTx;
    </script>
    <p>PoC Sedang Berjalan... Periksa log konsol jika ada error.</p>
</body>
</html>
