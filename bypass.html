<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freighter iOS - Final Handler Test [BW]</title>
<style>
body{background:#fff;color:#000;font-family:monospace;padding:14px;font-size:11px}
h2{font-size:12px;border-bottom:2px solid #000;padding-bottom:6px}
pre{background:#f5f5f5;border:1px solid #000;padding:10px;white-space:pre-wrap;word-break:break-all;min-height:400px}
button{background:#000;color:#fff;border:2px solid #000;padding:12px;width:100%;font-weight:bold;margin-top:6px}
</style>
</head>
<body>
<h2>Freighter iOS - Final Handler Brute Force [BW]</h2>
<pre id=log>Ready. Origin: </pre>
<button onclick="scan()">SCAN</button>
<button onclick="brute()">BRUTE FORCE hidden handlers</button>
<button onclick="dumpStellar()">DUMP window.stellar value</button>
<script>
let logEl=document.getElementById('log');
logEl.textContent+=location.origin+'\nUA:'+navigator.userAgent.substring(0,120)+'\n';
function log(t){logEl.textContent+='\n'+t;}
function scan(){
 log('\n--- SCAN ---');
 log('window.stellar:'+!!window.stellar+' val:'+JSON.stringify(window.stellar).substring(0,500));
 if(window.stellar){log('provider = '+window.stellar.provider+' typeof:'+typeof window.stellar.provider);}
}
function brute(){
 log('\n--- BRUTE FORCE ---');
 let names=['freighter','Freighter','stellar','Stellar','FreighterStellar','sign','signTransaction'];
 let mh=window.webkit&&window.webkit.messageHandlers;
 if(!mh){log('messageHandlers not found');return;}
 names.forEach(n=>{
  try{let h=mh[n]; log(n+': exists='+(!!h)+' postMessage='+(h&&!!h.postMessage));}
  catch(e){log(n+': error '+e);}
 });
}
function dumpStellar(){
 log('\n--- DUMP ---');
 try{
  let s=window.stellar;
  log('JSON: '+JSON.stringify(s));
  log('provider raw: '+String(s.provider));
  if(String(s.provider).length===9) log('length 9 = "freighter" confirmed');
 }catch(e){log('err:'+e);}
}
scan();
</script>
</body>
</html>
