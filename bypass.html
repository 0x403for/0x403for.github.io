<!DOCTYPE html>
<html>
<body>
<h3>Test Iframe Origin - Freighter</h3>
<p>Parent: 0x403for.github.io</p>
<p>Child: aqua.network (iframe)</p>

<iframe id="aqua" src="https://aqua.network" width="100%" height="600"></iframe>

<script>
  const iframe = document.getElementById('aqua');
  
  // Tunggu iframe load
  iframe.onload = () => {
    console.log("Iframe loaded, kirim test postMessage...");
    
    // Kirim pesan PALSU dari 0x403for.github.io ke aqua.network
    // Ini pesan aman, cuma string "PING", bukan transaksi
    iframe.contentWindow.postMessage("PING_FROM_0x403for", "*");
    
    // Coba juga format yang mirip Freighter (tapi tetap aman, bukan sign)
    iframe.contentWindow.postMessage({type: "TEST_ORIGIN_CHECK"}, "*");
  };

  // Dengerin balasan dari aqua.network kalau ada
  window.addEventListener("message", (event) => {
    console.log("Dapet balasan! Origin:", event.origin, "Data:", event.data);
    
    // Kalau event.origin nya aqua.network tapi dia bales pesan dari kita
    // Berarti dia NGGAK cek origin dengan benar = POTENSI BUG
    if (event.origin.includes("aqua.network")) {
      alert("BUG POTENTIAL: aqua.network bales pesan dari " + event.origin + " padahal kita dari 0x403for.github.io - dia gak cek origin!");
    }
  });
</script>
</body>
</html>
