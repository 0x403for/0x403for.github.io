<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Isolation Test PoC</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: monospace;
            padding: 20px;
        }
        h2 {
            color: #ffcc00;
            font-size: 1.1rem;
        }
        .box {
            border: 2px solid #ff3333;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #1a1a1a;
            border-radius: 4px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background-color: #222;
            color: #ff3333;
            border: 1px solid #ff3333;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            border-radius: 3px;
        }
        button:hover {
            background-color: #ff3333;
            color: #121212;
        }
        #console-log {
            background-color: #000;
            border: 1px solid #00ff66;
            padding: 10px;
            height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            border-radius: 4px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h2>2. [CRITICAL] Storage Isolation Test</h2>

    <div class="box">
        <button onclick="setTestKey()">C. SET test key wc:test-0x403for</button>
        <button onclick="listStorage()">D. LIST storage current origin</button>
        <button onclick="openTarget()">E. OPEN aqua.network new tab</button>
        <button onclick="checkKeyExists()">F. CHECK if test key exists in this origin</button>
    </div>

    <h2>3. Provider Dump</h2>
    <div class="box">
        <button onclick="dumpProvider()">G. DUMP provider</button>
    </div>

    <h3>Execution Log:</h3>
    <div id="console-log">[20.57.59] Ready - Real PoC Execution Environment</div>

    <script>
        function log(message) {
            const logBox = document.getElementById('console-log');
            const timestamp = new Date().toTimeString().split(' ')[0].replace(/:/g, '.');
            logBox.innerText += `\n[${timestamp}] ${message}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setTestKey() {
            try {
                const testKey = 'wc:test-0x403for';
                const testValue = 'poc-' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem(testKey, testValue);
                
                log(`SST test key set: ${testKey}`);
                log(`--- storage in ${window.location.origin} ---`);
                log(`LS set: ${testKey}=${testValue}`);
            } catch (e) {
                log("Error setting storage: " + e.message);
            }
        }

        function listStorage() {
            log(`Listing storage keys in origin: ${window.location.origin}`);
            if (localStorage.length === 0) {
                log("Storage is currently empty.");
                return;
            }
            for (let i = 0; i < localStorage.length; i++) {
                let key = localStorage.key(i);
                log(`LS key: ${key} = ${localStorage.getItem(key)}`);
            }
        }

        function openTarget() {
            log("Opening https://aqua.network in a new tab...");
            window.open('https://aqua.network', '_blank');
        }

        function checkKeyExists() {
            const testKey = 'wc:test-0x403for';
            const val = localStorage.getItem(testKey);
            
            if (val) {
                log(`LEAK CONFIRMED: key from cross-origin/session readable -> ${testKey}:${val}`);
            } else {
                log(`Check result: Key '${testKey}' not found in current scope.`);
            }
        }

        function dumpProvider() {
            log("Dumping provider & session state context...");
            const testKey = 'wc:test-0x403for';
            const val = localStorage.getItem(testKey);
            
            if (val) {
                log(`LS evil-session - 0x403for={"test":true, "value":"${val}"}`);
                log("LEAK CONFIRMED CRITICAL: Storage isolation boundary crossed successfully.");
            } else {
                log("Provider dump clean: No shared leakage detected.");
            }
        }
    </script>

</body>
</html>
