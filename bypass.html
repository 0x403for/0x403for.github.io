<!DOCTYPE html>
<html><body>
<pre id=log></pre>
<script>
function log(t){document.getElementById('log').innerText+=t+'\n'}

async function test(){
  log('Origin: '+location.origin);
  // tunggu 3 detik inject
  for(let i=0;i<10;i++){
    let api = window.freighterApi || window.freighter || window.stellar || window.Freighter;
    if(api){ log('FOUND: '+Object.keys(api).join(',')); break; }
    log('waiting inject... '+i); await new Promise(r=>setTimeout(r,300));
  }

  let api = window.freighterApi || window.freighter || window.stellar;
  if(!api){ 
    log('NOT FOUND after 3s - Freighter whitelist bug!'); 
    log('Try buka via https://play.freighter.app/?url='+location.href);
    return;
  }

  // SAFE TEST - REAL vs FAKE AQUA same symbol
  let real = {code:"AQUA", issuer:"GBNZILSTVQZ4R7IKQDGHYGY2HT5Q2QYMCHZECHUCBZ5QSE7F3N5TA2AQUA", domain:"aqua.network"};
  let fake = {code:"AQUA", issuer:"GDXNFAKE0x403forTEST1234567890", domain:"0x403for.github.io", image:"https://aqua.network/favicon.png"};

  log('Calling addToken REAL: '+JSON.stringify(real));
  try{ let r=await api.addToken(real); log('REAL result: '+JSON.stringify(r)); }catch(e){ log('REAL err: '+e.message); }

  log('Calling addToken FAKE same logo: '+JSON.stringify(fake));
  try{ let r=await api.addToken(fake); log('FAKE result: '+JSON.stringify(r)); 
    log('BUG if no warning issuer diff'); 
  }catch(e){ log('FAKE err (secure): '+e.message); }
}

window.addEventListener('freighterApiReady', test);
window.onload = ()=>setTimeout(test,1000);
</script>
</body></html>
