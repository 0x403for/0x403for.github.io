<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freighter iOS messageHandlers Scan</title>
<style>body{background:#fff;color:#000;font-family:monospace;padding:14px;font-size:11px}
pre{background:#f5f5f5;border:1px solid #000;padding:10px;white-space:pre-wrap;word-break:break-all;min-height:200px}
button{background:#000;color:#fff;border:2px solid #000;padding:12px;width:100%;font-weight:bold;margin-top:6px}</style></head>
<body>
<h2>Freighter iOS - WKWebView messageHandlers Scanner</h2>
<pre id=log>Ready. Origin: </pre>
<button onclick="scan()">SCAN messageHandlers + stellar bridge</button>
<script>
document.getElementById('log').textContent+=location.origin+'\nUA:'+navigator.userAgent.substring(0,120)+'\n';
function log(t){document.getElementById('log').textContent+='\n'+t;}
function scan(){
  log('window.freighter:'+!!window.freighter);
  log('window.stellar:'+!!window.stellar);
  if(window.stellar) try{log('stellar keys:'+Object.keys(window.stellar).join(', '))}catch(e){}
  let handlers=window.webkit&&window.webkit.messageHandlers;
  if(!handlers){log('messageHandlers TIDAK ADA');return;}
  let keys=Object.keys(handlers);
  log('messageHandlers:'+keys.length+' -> '+keys.join(', '));
  keys.forEach(k=>{let h=handlers[k]; log(' - '+k+': postMessage:'+(!!h.postMessage))});
}
scan();
</script></body></html>
