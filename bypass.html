<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Test Iframe Origin - Freighter</title>
<style>
body{font-family:monospace;padding:15px;background:#0a0a0a;color:#eee}
#log{background:#111;border:1px solid #333;padding:10px;height:200px;overflow-y:scroll;margin-top:10px;font-size:12px}
.ok{color:#4ade80}.warn{color:#f87171;font-weight:bold}
iframe{border:2px solid #333;border-radius:12px}
</style>
</head>
<body>
<h3>Test Iframe Origin - Freighter</h3>
<div>Parent: 0x403for.github.io</div>
<div>Child: aqua.network</div>
<div id="log"></div>
<iframe id="aqua" src="https://aqua.network" width="100%" height="400"></iframe>
<script>
const logEl=document.getElementById('log');
function log(m,c=''){const d=document.createElement('div');d.textContent=`[${new Date().toLocaleTimeString()}] ${m}`;d.className=c;logEl.appendChild(d)}
const iframe=document.getElementById('aqua');
iframe.onload=()=>{
  log('Iframe loaded. Mengirim TEST payload...','ok');
  iframe.contentWindow.postMessage("PING_FROM_0x403for","*");
  log('Sent: PING_FROM_0x403for with targetOrigin=*');
  iframe.contentWindow.postMessage({type:"TEST_ORIGIN_CHECK",source:"0x403for.github.io",action:"ping"},"*");
  log('Sent: {type: TEST_ORIGIN_CHECK}','');
};
window.addEventListener("message",(event)=>{
  log(`Received! origin=${event.origin} data=${JSON.stringify(event.data).slice(0,200)}`,'');
  if(event.origin.includes("aqua.network")){
    if(event.data && (event.data.signed || event.data.approved || event.data.txHash)){
      log(`BUG REAL! execute payload dari 0x403for!`,'warn');
      alert("BUG REAL: aqua.network execute payload attacker!");
    } else {
      log(`SECURE: aqua.network tidak execute PING kita. Pesan normal onLoad.`,'ok');
    }
  }
});
log('Waiting for iframe...','');
</script>
</body>
</html>
