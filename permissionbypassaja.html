<!DOCTYPE html>
<html>
<body>
    <h3>Simulasi Injeksi Template Literal</h3>
    <p>Lihat console browser (F12) untuk melihat hasil eksekusinya.</p>

    <script>
        // Simulasi variabel yang dikontrol user
        // Input ini mencoba menutup backtick dan menambah perintah alert
        const userControlledInput = '` ; alert("Injeksi Berhasil!"); //';

        // Simulasi fungsi injeksi yang rentan
        function simulateInjection(injectedJavaScriptObject) {
            const js = "(function(){\n" +
                "    window.myObj = window.myObj || {};\n" +
                "    window.myObj.injectedObjectJson = function () { return `" + injectedJavaScriptObject + "`; };\n" +
                "})();";
            
            console.log("Kode yang dihasilkan:", js);
            eval(js); // Menjalankan kode (Simulasi evaluateJavascript)
        }

        simulateInjection(userControlledInput);
    </script>
</body>
</html>
