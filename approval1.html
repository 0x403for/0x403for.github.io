<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audit Keamanan: Validasi Kontrak</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .card { border: 1px solid #dee2e6; padding: 25px; border-radius: 10px; background: white; max-width: 400px; text-align: center; }
        .status { margin-top: 15px; font-weight: bold; color: #333; }
        button { padding: 12px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Uji Validasi Kontrak</h3>
        <p>Audit ini akan mengirimkan data *Permit* dengan <code>nonce</code> tidak valid untuk menguji respons error aplikasi.</p>
        <button id="verifyBtn">Mulai Uji Transaksi</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Memproses...";
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const chainId = parseInt(await window.ethereum.request({ method: 'eth_chainId' }), 16);

                const permitData = {
                    domain: { name: "USD Coin", version: "2", chainId: chainId, verifyingContract: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" },
                    message: {
                        owner: accounts[0],
                        spender: "0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D", 
                        value: "1000000",
                        nonce: 999, // Memicu kegagalan karena Nonce tidak valid
                        deadline: Math.floor(Date.now() / 1000) + 3600
                    },
                    primaryType: "Permit",
                    types: {
                        EIP712Domain: [{ name: "name", type: "string" }, { name: "version", type: "string" }, { name: "chainId", type: "uint256" }, { name: "verifyingContract", type: "address" }],
                        Permit: [{ name: "owner", type: "address" }, { name: "spender", type: "address" }, { name: "value", type: "uint256" }, { name: "nonce", type: "uint256" }, { name: "deadline", type: "uint256" }]
                    }
                };

                await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [accounts[0], JSON.stringify(permitData)],
                });
                statusDiv.innerText = "Audit Selesai.";
            } catch (err) {
                statusDiv.innerText = "Hasil Audit: " + err.message;
            }
        });
    </script>
</body>
</html>
