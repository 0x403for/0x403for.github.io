<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Security Audit Tool</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f4f9; }
        .card { border: 1px solid #ccc; padding: 25px; border-radius: 12px; background: white; max-width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .audit-info { background: #e9ecef; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; border-left: 4px solid #007bff; }
        .btn-audit { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Analisis Keamanan Antarmuka</h3>
        <div class="audit-info">
            <p><strong>Tujuan:</strong> Menguji transparansi UI dompet saat menerima permintaan koneksi.</p>
            <p>Kode ini <strong>TIDAK</strong> akan memicu penandatanganan data atau izin transfer aset. Ini murni untuk audit apakah UI dompet memberikan peringatan yang jelas kepada pengguna tentang asal domain.</p>
        </div>
        <button id="auditBtn" class="btn-audit">Mulai Audit Koneksi</button>
        <p id="log" style="font-size: 12px; margin-top: 15px; color: #555;"></p>
    </div>

    <script>
        document.getElementById('auditBtn').addEventListener('click', async () => {
            const log = document.getElementById('log');
            if (!window.ethereum) return log.innerText = "Error: Tidak ada penyedia dompet Web3 terdeteksi.";
            
            try {
                // Hanya meminta akses koneksi akun (koneksi standar)
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                log.innerText = "Audit Berhasil: Dompet terhubung dengan akun " + accounts[0] + ". Periksa apakah UI dompet menampilkan nama domain ini dengan jelas.";
            } catch (err) {
                log.innerText = "Audit Dihentikan: " + err.message;
            }
        });
    </script>
</body>
</html>
