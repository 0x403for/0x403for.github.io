<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credential Test</title>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #ffffff;">
  <p>Website attacker manggil navigator.credentials.get() dengan mediation: 'silent' (tanpa popup).</p>
  <p>Kalau password yang ke-save langsung muncul, berarti BUG.</p>

  <button onclick="steal()" style="font-size: 20px; padding: 15px 30px;">Coba Ambil Password</button>
  <br><br>
  <pre id="o" style="background: #f0f0f0; padding: 15px; white-space: pre-wrap; font-size: 16px;">Belum dites. Pencet tombol di atas.</pre>

  <script>
    async function steal(){
      var o = document.getElementById('o');
      o.innerText = "Mencoba navigator.credentials.get() mediation silent...\n";
      try{
        const cred = await navigator.credentials.get({
          password: true,
          mediation: 'silent'
        });
        if(!cred){
          o.innerText += "\nHasil: null\nAMAN - Firefox nge-block silent access, gak ngasih password tanpa popup.";
        } else {
          o.innerText += "\nBUG! DAPET CREDENTIAL TANPA POPUP!\n";
          o.innerText += "ID: " + cred.id + "\n";
          o.innerText += "Password: " + cred.password + "\n";
          o.innerText += "Type: " + cred.type + "\n";
          o.innerText += "\nScreenshot ini, ini bukti Credential Leak.";
        }
      }catch(e){
        o.innerText += "\nError (AMAN - diblokir): " + e;
      }
    }
  </script>
</body>
</html>
