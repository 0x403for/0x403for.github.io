<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: #fff; 
            color: #000; 
            font-family: 'Arial', sans-serif; 
            padding: 20px; 
            font-size: 14px;
        }
        #report {
            border: 1px solid #000;
            padding: 15px;
            margin-bottom: 20px;
        }
        button {
            background: #000;
            color: #fff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .data-item {
            margin-bottom: 10px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>
    <h3>Security Audit Report</h3>
    <div id="report"></div>
    <button id="exportBtn">Click Here to Export Data</button>

    <script>
        const reportDiv = document.getElementById('report');
        let fullData = "SECURITY AUDIT LOG\n==================\n";

        // Mengambil semua data
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            const v = localStorage.getItem(k);
            
            // Tampilan di layar
            const item = document.createElement('div');
            item.className = 'data-item';
            item.innerHTML = `<strong>${k}:</strong> ${v.substring(0, 50)}...`;
            reportDiv.appendChild(item);

            // Data untuk ekspor
            fullData += `${k}: ${v}\n`;
        }

        // Fungsi Ekspor
        document.getElementById('exportBtn').addEventListener('click', function() {
            const blob = new Blob([fullData], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'exported_data.txt';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
