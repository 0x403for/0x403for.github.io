<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC Address Bar Spoofing</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        #spoof-content { display: none; padding: 40px; background: #fff; }
        .alert { color: red; border: 2px solid red; padding: 20px; }
    </style>
</head>
<body>

    <div id="trigger-area">
        <h1>Uji Coba Address Bar</h1>
        <button onclick="startSpoof()" style="padding:15px; font-size:18px;">Klik untuk Uji Spoofing</button>
    </div>

    <div id="spoof-content">
        <div class="alert">
            <h1>Situs Terverifikasi</h1>
            <p>Konten ini dimuat di bawah domain yang Anda lihat di Address Bar.</p>
        </div>
        <p>Jika address bar menampilkan domain yang salah namun konten ini muncul, maka spoofing berhasil.</p>
    </div>

    <script>
        function startSpoof() {
            // 1. Sembunyikan bagian pemicu
            document.getElementById('trigger-area').style.display = 'none';
            
            // 2. Tampilkan konten spoof
            document.getElementById('spoof-content').style.display = 'block';
            
            // 3. (Opsional) Ubah URL di Address Bar tanpa reload (mengelabui visual)
            // Ini adalah teknik yang digunakan browser untuk navigasi internal
            history.pushState(null, null, '/apple.com-spoof');
        }
    </script>
</body>
</html>
