<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>1inch Wallet Security Auditor</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 12px; background: #334155; color: #38bdf8; border: 1px solid #38bdf8; border-radius: 6px; cursor: pointer; font-size: 12px; }
        button:hover { background: #1e293b; }
        #log { margin-top: 20px; background: #000; padding: 15px; border: 1px solid #334155; font-family: monospace; font-size: 11px; white-space: pre-wrap; overflow-x: auto; color: #a3e635; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Security Auditor Panel</h2>
        <div class="grid">
            <button onclick="audit('spoofing')">Test UI Spoofing</button>
            <button onclick="audit('chain_inject')">Test Chain Injection</button>
            <button onclick="audit('insecure_sign')">Test Insecure Sign</button>
            <button onclick="audit('malformed_tx')">Test Malformed TX</button>
        </div>
        <pre id="log">Status: Menunggu aksi...</pre>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const log = (msg) => { console.log(msg); logEl.innerText = msg; };

        async function audit(type) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const from = accounts[0];
                let response;

                switch(type) {
                    case 'spoofing':
                        log("Menguji UI Spoofing: Mengirim pesan panjang...");
                        response = await window.ethereum.request({ 
                            method: 'personal_sign', 
                            params: ["0x" + "ATTACK_".repeat(50), from] 
                        });
                        break;
                    case 'chain_inject':
                        log("Menguji Chain Injection...");
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{ chainId: '0xBAD', chainName: 'Malicious Chain', rpcUrls: ['https://evil.rpc'] }]
                        });
                        response = "Chain added (Check wallet response)";
                        break;
                    case 'insecure_sign':
                        log("Menguji Legacy Sign...");
                        response = await window.ethereum.request({ method: 'eth_sign', params: [from, "0xdeadbeef"] });
                        break;
                    case 'malformed_tx':
                        log("Menguji Malformed TX...");
                        response = await window.ethereum.request({ 
                            method: 'eth_sendTransaction', 
                            params: [{ from, to: from, data: '0xINVALID' }] 
                        });
                        break;
                }
                log("Response: " + JSON.stringify(response, null, 2));
            } catch (err) {
                log("Error Detected (Code: " + err.code + ")\n" + err.message);
            }
        }
    </script>
</body>
</html>
