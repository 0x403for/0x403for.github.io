<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Advanced Security Auditor V3</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 15px; background: #991b1b; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        #log { margin-top: 20px; background: #000; padding: 10px; color: #38bdf8; font-size: 12px; height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h3>[!] Advanced Security Auditor V3</h3>
        <div class="grid">
            <button onclick="audit('spoof_mismatch')">1. Test Data Parsing Mismatch</button>
            
            <button onclick="audit('legacy_warning')">2. Test Security Warning (eth_sign)</button>
            
            <button onclick="audit('long_chain')">3. Test Long Chain ID Injection</button>
        </div>
        <pre id="log">Status: Menunggu pengujian...</pre>
    </div>

    <script>
        const log = (msg) => document.getElementById('log').innerText = msg;
        
        async function audit(type) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const from = accounts[0];
                
                if(type === 'spoof_mismatch') {
                    log("Menguji Data Mismatch...\nKirim TypedData yang formatnya menyerupai 'Approve' tapi isinya pesan berbeda.");
                    const msg = {
                        types: { EIP712Domain: [], Action: [{ name: "message", type: "string" }] },
                        primaryType: "Action",
                        domain: {},
                        message: { message: "BELI TOKEN A (Padahal ini transaksi Approve Token B)" }
                    };
                    await window.ethereum.request({ method: 'eth_signTypedData_v4', params: [from, JSON.stringify(msg)] });
                } 
                else if(type === 'legacy_warning') {
                    log("Menguji Peringatan Keamanan (eth_sign)...\nPerhatikan apakah dompet memberi peringatan merah.");
                    await window.ethereum.request({ method: 'eth_sign', params: [from, "0xdeadbeef"] });
                }
                else if(type === 'long_chain') {
                    log("Menguji Long Chain ID Injection...\nMeminta switch ke ChainID 999999999999999");
                    await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x3B9ACA00', chainName: 'Invalid Chain' }] });
                }
            } catch (err) { log("Error Log:\n" + err.message); }
        }
    </script>
</body>
</html>
