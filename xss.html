<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Advanced DApp Auditor V8</title>
    <style>
        body { font-family: monospace; background: #000; color: #ff00ff; padding: 20px; }
        .box { border: 2px solid #ff00ff; padding: 15px; max-width: 500px; margin: auto; }
        button { background: #330033; color: #ff00ff; border: 1px solid #ff00ff; padding: 10px; width: 100%; margin-top: 5px; cursor: pointer; }
        #log { color: #fff; font-size: 10px; margin-top: 10px; border-top: 1px solid #333; padding-top: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>[!] DAPP BROWSER AUDITOR</h3>
        <button onclick="stressBridge()">[1] Stress Test Bridge (Race Condition)</button>
        <button onclick="malformedTx()">[2] Malformed Parsing Test (Ambiguous Data)</button>
        <button onclick="checkStorage()">[3] XSS/Storage Isolation Test</button>
        <div id="log">Status: Ready.</div>
    </div>

    <script>
        const log = (m) => document.getElementById('log').innerText += "\n> " + m;

        // 1. Race Condition: Mengirim 10 permintaan transaksi dalam 100ms
        async function stressBridge() {
            log("Stress testing bridge...");
            const account = (await window.ethereum.request({method:'eth_requestAccounts'}))[0];
            for(let i=0; i<10; i++) {
                window.ethereum.request({ 
                    method: 'eth_sendTransaction', 
                    params: [{ from: account, to: account, value: '0x0', data: '0x' + i }] 
                }).catch(e => log("Req " + i + " rejected: " + e.code));
            }
        }

        // 2. Malformed Parsing: Mengirim data yang secara teknis valid tapi menyesatkan
        async function malformedTx() {
            log("Sending ambiguous contract interaction...");
            const account = (await window.ethereum.request({method:'eth_requestAccounts'}))[0];
            // Menggunakan selector yang membingungkan atau data overflow
            const maliciousData = "0x" + "a".repeat(128); 
            window.ethereum.request({ 
                method: 'eth_sendTransaction', 
                params: [{ from: account, to: "0xCcCCccccCCCCcCCCCCCcCcCccCcCCCcCcccccccC", data: maliciousData }] 
            });
        }

        // 3. XSS/Storage Test: Mencoba membaca localStorage
        async function checkStorage() {
            log("Checking LocalStorage Access...");
            try {
                localStorage.setItem('secret_key', 'ATTACK_SUCCESS');
                log("LocalStorage Test: " + localStorage.getItem('secret_key'));
                log("Periksa apakah situs lain bisa membaca ini.");
            } catch(e) { log("Access Denied: " + e.message); }
        }
    </script>
</body>
</html>
