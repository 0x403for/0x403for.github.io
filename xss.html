<!DOCTYPE html>
<html>
<body style="background:black;color:white;padding:20px;font-family:monospace">
<h3>EIP-6963 Detection - 0x403for</h3>
<button onclick="listen()" style="padding:10px">START LISTEN EIP-6963</button>
<div id="log" style="margin-top:15px;color:cyan"></div>
<script>
let logEl = document.getElementById('log');
function log(t){ logEl.innerHTML += t + "<br>"; }

function listen(){
  log("Listening for eip6963:announceProvider...");

  window.addEventListener("eip6963:announceProvider", (event) => {
    log("FOUND Provider: " + JSON.stringify(event.detail.info));
    log("Name: " + event.detail.info.name);
    log("RDNS: " + event.detail.info.rdns);
  });

  // Minta semua wallet yang ada announce diri
  log("Dispatching eip6963:requestProvider");
  window.dispatchEvent(new Event("eip6963:requestProvider"));
}

log("Ready. UA: BloFinWallet/" + navigator.userAgent.match(/BloFinWallet\/([0-9.]+)/)?.[1]);
log("window.ethereum exists: " +!!window.ethereum);
log("window.blofin exists: " +!!window.blofin);
</script>
</body>
</html>
