<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Race Condition Auditor</title>
    <style>
        body { font-family: monospace; background: #000; color: #00ff00; padding: 20px; }
        .box { border: 2px solid #00ff00; padding: 15px; max-width: 500px; margin: auto; }
        button { background: #002200; color: #00ff00; border: 1px solid #00ff00; padding: 15px; width: 100%; cursor: pointer; }
        #log { margin-top: 10px; font-size: 11px; color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <h3>[!] RACE CONDITION AUDITOR</h3>
        <p>Menguji tumpang tindih antara Transaksi dan Tanda Tangan.</p>
        <button onclick="triggerRaceCondition()">JALANKAN UJI RACE CONDITION</button>
        <div id="log">Status: Menunggu aksi...</div>
    </div>

    <script>
        const log = (m) => document.getElementById('log').innerText += "\n> " + m;

        async function triggerRaceCondition() {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                
                log("1. Mengirim Transaksi (Pending)...");
                // Transaksi ke diri sendiri
                window.ethereum.request({ 
                    method: 'eth_sendTransaction', 
                    params: [{ from: accounts[0], to: accounts[0], value: '0x0' }] 
                }).then(() => log("Transaksi Selesai."));

                // Delay sangat singkat (50ms) untuk mensimulasikan tabrakan UI
                setTimeout(async () => {
                    log("2. Memicu SignTypedData (EIP-712)...");
                    const msg = JSON.stringify({
                        types: { EIP712Domain: [], Test: [{ name: 'val', type: 'string' }] },
                        primaryType: 'Test', domain: {}, message: { val: 'RaceConditionTest' }
                    });
                    
                    window.ethereum.request({ 
                        method: 'eth_signTypedData_v4', 
                        params: [accounts[0], msg] 
                    }).then(() => log("Tanda Tangan Selesai."));
                }, 50);

            } catch (err) { log("Error: " + err.message); }
        }
    </script>
</body>
</html>
