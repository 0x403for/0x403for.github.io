<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Security Auditor: Unauthenticated Signature Test</title>
    <style>
        body { font-family: monospace; background: #000; color: #fff; padding: 20px; }
        .box { border: 1px solid #ff00ff; padding: 20px; max-width: 500px; margin: auto; }
        button { background: #300; color: #f00; border: 1px solid #f00; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; }
        #log { margin-top: 15px; color: #0f0; font-size: 12px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>[!] TEST: UNAUTHENTICATED SIGNATURE</h3>
        <p>Tombol ini memicu <code>eth_signTypedData_v4</code>. Amati apakah dompet meminta Passcode/Biometric.</p>
        
        <button onclick="testUnauthenticatedSignature()">JALANKAN UJI TANDA TANGAN</button>
        
        <div id="log">Status: Menunggu aksi...</div>
    </div>

    <script>
        const log = (m) => document.getElementById('log').innerText = m;

        async function testUnauthenticatedSignature() {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const account = accounts[0];
                
                log("Memulai proses tanda tangan EIP-712...");

                // Payload EIP-712 yang memicu otorisasi
                const msgParams = JSON.stringify({
                    domain: {
                        name: "Security Audit Test",
                        version: "1",
                        chainId: 1, // Mainnet (gunakan 11155111 untuk Sepolia)
                    },
                    types: {
                        EIP712Domain: [{ name: "name", type: "string" }, { name: "version", type: "string" }, { name: "chainId", type: "uint256" }],
                        TestMessage: [{ name: "data", type: "string" }]
                    },
                    primaryType: "TestMessage",
                    message: { data: "UJI KEAMANAN TANPA OTORISASI" }
                });

                const signature = await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [account, msgParams],
                });

                log("Tanda tangan berhasil dibuat: " + signature.substring(0, 20) + "...");
            } catch (err) {
                log("Error: " + err.message);
            }
        }
    </script>
</body>
</html>
