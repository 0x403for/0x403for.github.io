<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Legacy Security Test</title>
    <style>
        body { background: #000; color: #f00; padding: 20px; font-family: monospace; }
        button { background: #500; border: 1px solid #f00; color: #fff; padding: 20px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h3>[!] LEGACY SIGNATURE TEST</h3>
    <p>Gunakan metode <code>eth_sign</code> untuk melihat apakah dompet memproses tanpa otorisasi tambahan.</p>
    <button onclick="runInsecureTest()">UJI METODE LEGACY (eth_sign)</button>
    <pre id="log" style="color: #fff;"></pre>

    <script>
        const log = (m) => document.getElementById('log').innerText = m;

        async function runInsecureTest() {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const account = accounts[0];
                
                log("Memulai eth_sign (Legacy)...");
                // eth_sign adalah metode yang seringkali tidak memiliki perlindungan EIP-712
                const signature = await window.ethereum.request({
                    method: 'eth_sign',
                    params: [account, "0x4c6f67696e20746f205365637572697479"], // "Login to Security"
                });
                
                log("Berhasil Tanda Tangan: " + signature.substring(0, 30) + "...");
            } catch (err) {
                log("Hasil: " + err.message);
            }
        }
    </script>
</body>
</html>
