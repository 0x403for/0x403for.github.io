<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Advanced Security Auditor V7</title>
    <style>
        body { font-family: monospace; background: #000; color: #fff; padding: 20px; }
        .box { border: 2px solid #00ffff; padding: 15px; max-width: 500px; margin: auto; background: #111; }
        button { background: #004444; color: #00ffff; border: 1px solid #00ffff; padding: 15px; width: 100%; cursor: pointer; margin-top: 10px; font-weight: bold; }
        #log { margin-top: 15px; font-size: 11px; color: #aaa; }
    </style>
</head>
<body>
    <div class="box">
        <h3>[!] CONTEXT SEPARATION AUDIT</h3>
        <p>Uji apakah dompet memiliki kebijakan otorisasi yang berbeda antara transaksi (on-chain) dan tanda tangan (off-chain).</p>
        
        <button onclick="testTransaction()">1. Test On-Chain Transaction</button>
        <button onclick="testSignature()">2. Test Off-Chain Signature</button>
        
        <div id="log">Status: Menunggu aksi...</div>
    </div>

    <script>
        const log = (m) => document.getElementById('log').innerText = m;

        // Uji apakah transaksi on-chain meminta otorisasi lebih ketat
        async function testTransaction() {
            log("Mengirim transaksi trivial...");
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                await window.ethereum.request({ 
                    method: 'eth_sendTransaction', 
                    params: [{ from: accounts[0], to: accounts[0], value: '0x0' }] 
                });
                log("Transaksi on-chain berhasil.");
            } catch (err) { log("Error: " + err.message); }
        }

        // Uji apakah tanda tangan off-chain (sering jadi celah) meminta otorisasi
        async function testSignature() {
            log("Mengirim permintaan tanda tangan...");
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const signature = await window.ethereum.request({ 
                    method: 'personal_sign', 
                    params: ["Security Audit: Off-chain Signature Test", accounts[0]] 
                });
                log("Tanda tangan berhasil: " + signature.substring(0, 20) + "...");
            } catch (err) { log("Error: " + err.message); }
        }
    </script>
</body>
</html>
