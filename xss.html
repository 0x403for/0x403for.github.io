<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Real-World Security Auditor (ERC-20)</title>
    <style>
        body { font-family: monospace; background: #000; color: #fff; padding: 20px; }
        .box { border: 1px solid #f00; padding: 15px; max-width: 500px; margin: auto; }
        input { width: 100%; background: #222; color: #0f0; border: 1px solid #444; padding: 5px; margin: 5px 0; }
        button { background: #500; color: #f00; border: 1px solid #f00; padding: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h3>[!] REAL SCENARIO: ERC-20 APPROVE AUDIT</h3>
        <input type="text" id="tokenAddress" placeholder="Token Contract Address (Sepolia)">
        <input type="text" id="spenderAddress" placeholder="Spender Address (Attacker)">
        <input type="text" id="amount" placeholder="Amount (e.g. 1000000000000000000)">
        
        <button onclick="testTransactionIntegrity()">1. Test Transaction Integrity (Approve)</button>
        <button onclick="testPermit()">2. Test Permit (Bypass Auth)</button>
        
        <pre id="log" style="color: #0f0; font-size: 10px;">Status: Awaiting...</pre>
    </div>

    <script>
        const log = (m) => document.getElementById('log').innerText = m;

        async function testTransactionIntegrity() {
            const token = document.getElementById('tokenAddress').value;
            const spender = document.getElementById('spenderAddress').value.replace('0x', '');
            const amount = BigInt(document.getElementById('amount').value).toString(16).padStart(64, '0');
            
            // Generate Data: approve(address, uint256)
            const data = "0x095ea7b3" + spender.padStart(64, '0') + amount;
            
            log("Sending Data: " + data + "\nCheck if Wallet UI displays correct Spender & Amount!");
            await window.ethereum.request({ 
                method: 'eth_sendTransaction', 
                params: [{ from: (await window.ethereum.request({method:'eth_requestAccounts'}))[0], to: token, data }] 
            });
        }

        async function testPermit() {
            // EIP-712 Permit (Bypass signature flow)
            log("Testing Permit (EIP-712)... Check for biometrics/passcode request.");
            const msg = {
                domain: { name: "TestToken", version: "1", chainId: 11155111, verifyingContract: "0x..." },
                types: { Permit: [{ name: "owner", type: "address" }, { name: "spender", type: "address" }, { name: "value", type: "uint256" }, { name: "nonce", type: "uint256" }, { name: "deadline", type: "uint256" }] },
                primaryType: "Permit",
                message: { owner: "...", spender: "...", value: 0, nonce: 0, deadline: 0 }
            };
            await window.ethereum.request({ method: 'eth_signTypedData_v4', params: [(await window.ethereum.request({method:'eth_requestAccounts'}))[0], JSON.stringify(msg)] });
        }
    </script>
</body>
</html>
