<!DOCTYPE html>
<html>
<body style="background:black;color:white;padding:20px;font-family:monospace">
<h3>wallet_addEthereumChain Test - 0x403for</h3>
<button onclick="testAdd()" style="padding:12px">TEST ADD CHAIN</button>
<div id="log" style="margin-top:15px;color:cyan"></div>
<script>
function log(t){ document.getElementById('log').innerHTML += t + "<br>"; }

async function testAdd(){
  log("Calling wallet_addEthereumChain...");
  try{
    const result = await window.ethereum.request({
      method: 'wallet_addEthereumChain',
      params: [{
        chainId: '0x12345',
        chainName: 'Test Chain 0x403for',
        nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
        rpcUrls: ['https://example.com'],
        blockExplorerUrls: ['https://example.com']
      }]
    });
    log("Result: " + JSON.stringify(result));
    log("Cek di Setting BloFin - apakah chain Test Chain 0x403for ke-add?");
  } catch(e){
    log("Error / Rejected: " + e.message);
    log("Ini SECURE - BloFin nolak RPC example.com");
  }
}
log("Ready. ethereum exists: " + !!window.ethereum);
</script>
</body>
</html>
