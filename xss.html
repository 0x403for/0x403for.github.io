<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Security Auditor: Allowance Test</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #fff; padding: 20px; }
        .box { border: 2px solid #ffaa00; padding: 20px; max-width: 500px; margin: auto; background: #000; }
        button { background: #b37700; color: #fff; border: none; padding: 15px; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; }
        #log { margin-top: 15px; font-size: 12px; color: #ffaa00; }
    </style>
</head>
<body>
    <div class="box">
        <h3>[!] UJI ALLOWANCE RISIKO TINGGI</h3>
        <p>Tombol ini memicu <code>approve</code> dengan jumlah <b>tak terbatas (Unlimited)</b>.</p>
        <button onclick="testUnlimitedAllowance()">JALANKAN UJI ALLOWANCE</button>
        <div id="log">Status: Menunggu aksi...</div>
    </div>

    <script>
        const log = (m) => document.getElementById('log').innerText = m;

        async function testUnlimitedAllowance() {
            try {
                // Alamat WETH di Sepolia
                const tokenAddress = "0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14";
                const spenderAddress = "0xCcCCccccCCCCcCCCCCCcCcCccCcCCCcCcccccccC";
                
                // Data hex untuk approve(spender, maxUint256)
                const data = "0x095ea7b3" + 
                             spenderAddress.replace('0x', '').padStart(64, '0') + 
                             "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
                
                log("Mengirim permintaan Approve Unlimited...");
                
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                await window.ethereum.request({ 
                    method: 'eth_sendTransaction', 
                    params: [{ from: accounts[0], to: tokenAddress, data: data }] 
                });
                
                log("Transaksi dikirim. Perhatikan apakah dompet memberi peringatan risiko!");
            } catch (err) {
                log("Error: " + err.message);
            }
        }
    </script>
</body>
</html>
