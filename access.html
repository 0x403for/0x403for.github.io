<!DOCTYPE html>
<html>
<body>
    <h3>Keamanan Research: Demo Path Traversal via API</h3>
    <input type="text" id="userInput" placeholder="Masukkan nama file/path...">
    <button id="saveBtn">Uji Keamanan</button>

    <script>
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const fileName = document.getElementById('userInput').value;
            
            // Logika rentan: Aplikasi langsung menggunakan input user sebagai suggestedName
            // Ini adalah tempat peneliti bug bounty mencari celah
            const options = {
                suggestedName: fileName, 
                types: [{
                    description: 'Test File',
                    accept: {'text/plain': ['.txt']}
                }],
            };

            try {
                const handle = await window.showSaveFilePicker(options);
                console.log("File handle berhasil dibuat untuk:", handle.name);
            } catch (err) {
                console.error("Browser memblokir input berbahaya:", err);
            }
        });
    </script>
</body>
</html>
