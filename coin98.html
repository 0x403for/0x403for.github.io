<!DOCTYPE html>
<html>
<head>
    <title>Security Test: Wallet API Interactor</title>
</head>
<body>
    <h1>API Interaction Test</h1>
    <button id="checkApi">Deteksi Wallet API</button>
    <button id="triggerTx">Coba Panggil Fungsi Transaksi</button>
    <pre id="log" style="background: #eee; padding: 10px;"></pre>

    <script>
        const log = (msg) => document.getElementById('log').innerText += msg + '\n';

        // 1. Deteksi apakah ada objek yang disuntikkan oleh dompet
        document.getElementById('checkApi').addEventListener('click', () => {
            const detected = [];
            // Mencoba mendeteksi beberapa objek umum yang disuntikkan dompet
            if (window.ethereum) detected.push('window.ethereum');
            if (window.argent) detected.push('window.argent'); // Contoh jika dompet menyuntikkan objek sendiri
            
            log("API Terdeteksi: " + (detected.length > 0 ? detected.join(', ') : "Tidak ditemukan API umum."));
        });

        // 2. Coba berinteraksi dengan API yang terdeteksi
        document.getElementById('triggerTx').addEventListener('click', async () => {
            if (window.ethereum) {
                try {
                    log("Mencoba meminta akses akun...");
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    log("Akun ditemukan: " + accounts[0]);
                    
                    log("Mencoba mengirim transaksi (Simulasi)...");
                    await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: accounts[0],
                            to: '0x0000000000000000000000000000000000000000',
                            value: '0x0',
                        }],
                    });
                } catch (e) {
                    log("Error: " + e.message);
                }
            } else {
                log("API tidak ditemukan, tidak bisa memicu transaksi.");
            }
        });
    </script>
</body>
</html>
