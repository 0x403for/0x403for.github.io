<!DOCTYPE html>
<html>
<head>
    <title>Safe API Tester</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: monospace; padding: 15px; }
        .log { background: #1a1a1a; color: #00ff00; height: 300px; overflow-y: scroll; padding: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <h3>Safe API Tester</h3>
    <button id="runSingle">Tes Satu Metode (Aman)</button>
    <select id="methodSelect">
        <option value="eth_accounts">eth_accounts</option>
        <option value="eth_sign">eth_sign</option>
        <option value="eth_sendTransaction">eth_sendTransaction</option>
        <option value="wallet_addEthereumChain">wallet_addEthereumChain</option>
    </select>
    <div class="log" id="logger">Klik tombol untuk mulai...</div>

    <script>
        const log = (msg) => document.getElementById('logger').innerText += "\n> " + msg;

        document.getElementById('runSingle').onclick = async () => {
            const method = document.getElementById('methodSelect').value;
            log("Menguji: " + method);
            
            try {
                // Memberikan delay 1 detik agar tidak memicu sistem keamanan
                await new Promise(r => setTimeout(r, 1000));
                
                const res = await window.ethereum.request({ method: method });
                log("Berhasil: " + JSON.stringify(res));
            } catch (e) {
                // Menampilkan error dengan jelas tanpa crash aplikasi
                log("Ditolak/Error: " + e.message);
            }
        };
    </script>
</body>
</html>
