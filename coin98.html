<!DOCTYPE html>
<html>
<head>
    <title>Method Fuzzer for Wallet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .log { background: #000; color: #fff; height: 200px; overflow-y: scroll; font-size: 11px; padding: 5px; }
    </style>
</head>
<body>
    <h3>Method Fuzzer: Testing API Boundaries</h3>
    <button id="fuzzBtn">Mulai Fuzzing API</button>
    <div class="log" id="logger">Menunggu aksi...</div>

    <script>
        const log = (msg) => document.getElementById('logger').innerText += "\n" + msg;

        // Daftar metode yang umum di API dompet untuk diuji
        const methodsToTest = [
            'eth_accounts',
            'eth_requestAccounts',
            'eth_sign',
            'personal_sign',
            'eth_sendTransaction',
            'wallet_addEthereumChain',
            'wallet_switchEthereumChain'
        ];

        document.getElementById('fuzzBtn').onclick = async () => {
            if (!window.ethereum) { log("API tidak ditemukan!"); return; }

            for (const method of methodsToTest) {
                log("Testing: " + method);
                try {
                    // Mencoba memanggil metode tanpa data/parameter (fuzzing kasar)
                    const res = await window.ethereum.request({ method: method });
                    log("HASIL " + method + ": " + JSON.stringify(res));
                } catch (e) {
                    log("RESPON " + method + ": [DITOLAK] " + e.message);
                }
            }
        };
    </script>
</body>
</html>
