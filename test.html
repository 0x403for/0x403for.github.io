<canvas id="fingerprintCanvas" width="200" height="50"></canvas>
<p id="fingerprintID"></p>

<script>
    const canvas = document.getElementById('fingerprintCanvas');
    const ctx = canvas.getContext('2d');
    
    // Menggambar teks dengan gaya khusus
    ctx.textBaseline = "top";
    ctx.font = "14px 'Arial'";
    ctx.fillStyle = "#f60";
    ctx.fillRect(125, 1, 62, 20);
    ctx.fillStyle = "#069";
    ctx.fillText("Hello, world!", 2, 15);
    
    // Mengambil data piksel sebagai string
    const data = canvas.toDataURL();
    document.getElementById('fingerprintID').innerText = 
        "Hash Fingerprint Anda: " + btoa(data).substring(0, 32);
</script>
