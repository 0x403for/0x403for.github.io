<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Final Audit | Memory</title>
    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --primary: #fcd535; }
        body { margin: 0; background: var(--bg); color: #707a8a; font-family: sans-serif; display: grid; place-items: center; height: 100vh; overflow: hidden; }
        .audit-card { background: var(--card); border: 1px solid #363d47; padding: 25px; border-radius: 12px; width: 280px; text-align: center; }
        .btn-stress { background: #ed4b9e; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div class="audit-card">
    <h3 style="color:#fff; margin:0 0 10px 0">Memory Stress</h3>
    <p style="font-size:12px">Testing stability under high DOM & Memory pressure.</p>
    <button class="btn-stress" onclick="stressAudit()">Run Stress Test</button>
    <div id="status" style="font-size:10px; margin-top:15px;">Status: Standby</div>
</div>

<script>
    let junk = [];
    function stressAudit() {
        const out = document.getElementById('status');
        out.innerText = "Inflating memory...";

        for (let i = 0; i < 1000000; i++) {
            junk.push(Math.random().toString(36));
        }


        for (let j = 0; j < 5000; j++) {
            let d = document.createElement('div');
            d.style.display = 'none';
            document.body.appendChild(d);
        }

        let count = 0;
        let t = setInterval(() => {
            history.pushState(null, "", "#stress_test_" + count++);
            if (count > 500) {
                clearInterval(t);
                out.innerText = "Audit Complete. RAM pressure applied.";
                alert("Check if wallet UI is still responsive.");
            }
        }, 1);
    }
</script>

</body>
</html>
