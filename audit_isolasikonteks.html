<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Validasi Manajemen Antrean Web3</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.5; }
        .box { border: 1px solid #ccc; padding: 15px; margin-top: 15px; background: #f9f9f9; border-radius: 6px; }
        .log-area { background: #1e1e1e; color: #00ff00; padding: 15px; font-family: monospace; white-space: pre-wrap; border-radius: 4px; max-height: 250px; overflow-y: auto; }
        button { padding: 10px 15px; font-size: 1em; cursor: pointer; margin-right: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Analisis Manajemen Antrean Dialog UI</h2>
    <p>Halaman ini mengirimkan beberapa permintaan interaksi berurutan untuk memverifikasi mekanisme pembatasan simultan pada dompet.</p>

    <button onclick="hubungkanDompet()">1. Hubungkan Dompet Dulu</button>
    <button onclick="kirimPermintaanBerurutan()">2. Jalankan Uji Antrean (3x Request)</button>

    <div class="box">
        <h4>Status Log Aktivitas:</h4>
        <div id="logKonsol" class="log-area">Menunggu interaksi pengguna...</div>
    </div>

    <script>
        const logKonsol = document.getElementById('logKonsol');
        let akunAktif = null;

        function cetakLog(teks) {
            logKonsol.textContent += `\n${teks}`;
            logKonsol.scrollTop = logKonsol.scrollHeight;
        }

        // Memastikan dompet terhubung untuk mendapatkan alamat sebelum meminta signature
        async function hubungkanDompet() {
            if (typeof window.ethereum === 'undefined') {
                logKonsol.textContent = "[!] Provider Web3 tidak terdeteksi. Buka halaman ini di dApp browser.";
                return;
            }
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                akunAktif = accounts[0];
                logKonsol.textContent = `[*] Terhubung ke akun: ${akunAktif}`;
            } catch (err) {
                logKonsol.textContent = `[!] Gagal terhubung: ${err.message}`;
            }
        }

        // Simulasi pengiriman 3 permintaan berturut-turut untuk melihat penanganan antrean
        async function kirimPermintaanBerurutan() {
            if (!akunAktif) {
                alert("Silakan klik tombol 'Hubungkan Dompet' terlebih dahulu.");
                return;
            }

            cetakLog("\n--- Memulai Pengujian Antrean Prosedural ---");
            const pesanDasar = "Verifikasi Antrean Pesan ID: ";

            // Menjalankan 3 panggilan asinkron secara bersamaan (simultan)
            for (let i = 1; i <= 3; i++) {
                cetakLog(`[>] Mengirimkan Permintaan #${i} ke runtime dompet...`);
                
                window.ethereum.request({
                    method: 'personal_sign',
                    params: [`${pesanDasar}${i}`, akunAktif]
                })
                .then((result) => {
                    cetakLog(`[+] Permintaan #${i} DISETUJUI oleh pengguna.`);
                })
                .catch((err) => {
                    // Celah keamanan TIDAK ditemukan jika permintaan berikutnya otomatis ditolak dengan error (misal: RPC Busy atau User Rejected)
                    cetakLog(`[-] Permintaan #${i} SELESAI/DITOLAK dengan respons: ${err.message} (Code: ${err.code})`);
                });
            }
        }
    </script>

</body>
</html>
