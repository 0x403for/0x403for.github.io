<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Validasi Objek Provider Web3</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; line-height: 1.6; }
        .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .status-badge { inline-size: fit-content; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
        .info { background: #e3f2fd; color: #0d47a1; }
        .log-box { background: #212121; color: #eeff41; padding: 15px; border-radius: 6px; font-family: monospace; white-space: pre-wrap; overflow-x: auto; }
    </style>
</head>
<body>

    <h3>Instrumen Analisis Desain Properti Web3</h3>
    <p>Halaman ini mengevaluasi konfigurasi mutabilitas objek <code>window.ethereum</code> untuk keperluan dokumentasi teknis defensif.</p>

    <div class="card">
        <div id="badge" class="status-badge info">Memeriksa eksistensi objek...</div>
        <p id="details">Menunggu eksekusi skrip...</p>
    </div>

    <button onclick="periksaKonfigurasiObjek()" style="padding: 10px 15px; font-size: 1em; cursor: pointer;">Mulai Analisis Properti</button>

    <h4>Hasil Log Konsol Internal:</h4>
    <div id="consoleLog" class="log-box">Log kosong. Klik tombol di atas untuk memulai.</div>

    <script>
        function periksaKonfigurasiObjek() {
            const logBox = document.getElementById('consoleLog');
            const badge = document.getElementById('badge');
            const details = document.getElementById('details');
            let report = "";

            // 1. Memeriksa ketersediaan objek di lingkup global window
            if (typeof window.ethereum === 'undefined') {
                badge.textContent = "Provider Tidak Terdeteksi";
                badge.style.background = "#ffebee";
                badge.style.color = "#c62828";
                logBox.textContent = "Objek window.ethereum tidak ditemukan pada konteks halaman ini.";
                return;
            }

            report += "[*] Mengevaluasi objek window.ethereum...\n";

            // 2. Memeriksa apakah objek telah dibekukan (frozen)
            const isFrozen = Object.isFrozen(window.ethereum);
            report += `[-] Status Object.isFrozen: ${isFrozen}\n`;

            // 3. Memeriksa atribut deskriptor properti pada objek window
            const descriptor = Object.getOwnPropertyDescriptor(window, 'ethereum');
            
            if (descriptor) {
                report += `[-] Deskriptor Properti 'ethereum' pada objek 'window':\n`;
                report += `    - Writable (Dapat ditulis ulang): ${descriptor.writable}\n`;
                report += `    - Configurable (Dapat dikonfigurasi ulang): ${descriptor.configurable}\n`;
                report += `    - Enumerable: ${descriptor.enumerable}\n`;
            } else {
                report += "[!] Gagal mengambil deskriptor properti langsung dari objek window (kemungkinan disuntikkan via prototipe tingkat lanjut).\n";
            }

            // 4. Menyimpulkan tingkat ketahanan arsitektur berdasarkan standar defensif
            if (isFrozen === true || (descriptor && descriptor.writable === false)) {
                badge.textContent = "Konfigurasi Defensif Aktif";
                badge.style.background = "#e8f5e9";
                badge.style.color = "#2e7d32";
                details.innerHTML = "Objek diimplementasikan sebagai <strong>Immutable/Read-Only</strong>. Modifikasi fungsi secara langsung di batasi oleh aturan pembatasan *strict* JavaScript.";
            } else {
                badge.textContent = "Konfigurasi Standar / Terbuka";
                badge.style.background = "#fff3e0";
                badge.style.color = "#ef6c00";
                details.innerHTML = "Objek berstatus <strong>Mutable</strong>. Fungsi-fungsi di dalamnya menggunakan konfigurasi standar dan dapat menerima penambahan atau perubahan properti secara dinamis dalam konteks runtime saat ini.";
            }

            logBox.textContent = report;
        }
    </script>

</body>
</html>
