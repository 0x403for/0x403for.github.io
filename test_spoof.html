<!DOCTYPE html>
<html>
<head>
    <title>URL Normalization Tester</title>
</head>
<body>
    <h2>URL Fixup Security Tester</h2>
    <input type="text" id="urlInput" placeholder="Masukkan URL (misal: www.google.com)" style="width: 300px;">
    <button onclick="testNavigation()">Test Navigation</button>
    
    <p>Browser akan mencoba menavigasi ke:</p>
    <div id="result" style="font-weight: bold; color: blue;"></div>

    <script>
        function testNavigation() {
            var url = document.getElementById('urlInput').value;
            // Ini mensimulasikan bagaimana browser mencoba melakukan fixup
            // Browser akan secara otomatis melakukan sanitasi pada link ini
            window.location.href = url;
        }
    </script>
</body>
</html>
